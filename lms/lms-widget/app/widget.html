      (qz ? '<span class="pill ' + (qz.passed ? 'ok' : 'mid') + '">' +
            (qz.passed ? ic('check') + '合格' : ic('cross') + '不合格') + '　' +
            qz.score + '／' + qz.total + '問</span>' : '') +
      (p.videoDone ? '' : '<span style="font-size:11.5px;color:var(--ink-3)">動画を' +
        Math.round(co.passRate*100) + '%以上視聴すると受けられます</span>') + '</div>';
  }
  if(p.done){
    var sv = getSurvey(u.name, co.id);
    h += '<div class="bar" style="border-top:1px solid var(--rule);padding-top:12px">' +
      '<span class="pill ok">' + ic('medal') + 'このコースは修了しました</span>' +
      '<button class="btn" id="goCert">' + ic('file') + '修了証を表示</button>' +
      '<button class="btn sub" id="goSv">' + ic('quiz') +
        (sv ? 'アンケートを見直す' : 'アンケートに答える') + '</button>' +
      '</div>';
  }
  h += '</div></div>';

  h += '<div class="chaps"><div class="hd">' + ic('book') + '章の一覧' +
       '<span class="n">' + co.chapters.length + '章</span></div>';
  co.chapters.forEach(function(c, i){
    var cp = chapProgress(u.name, c);
    var done = cp.rate >= co.passRate;
    h += '<button class="chap' + (done ? ' done' : '') + '" data-chap="' + i + '"' +
         (i === chapIdx ? ' aria-current="true"' : '') + '>' +
      '<span class="no">' + (done ? icf('check') : (i+1)) + '</span>' +
      '<span class="bd">' +
        '<span class="t">' + esc(c.title) + '</span>' +
        '<span class="s"><span class="mono">' + hhmm(c.dur) + '</span>' +
          (done ? '<span class="ck">' + ic('check') + '視聴済み</span>'
                : '<span class="mono">' + pct(cp.rate) + '</span>') +
          (c.videoId ? '' : '<span style="color:var(--kaki)">未設定</span>') +
        '</span>' +
        '<span class="mini"><i style="width:' + Math.round(cp.rate*100) + '%"></i></span>' +
      '</span></button>';
  });
  h += '</div></div></div>';
  document.getElementById('main').innerHTML = h;

  document.querySelector('[data-back]').onclick = function(){ route('courses'); };
  var gq = document.getElementById('goQuiz');
  if(gq && !gq.disabled) gq.onclick = function(){ route('quiz', co.id); };
  var bmBtn = document.getElementById('goBm');
  if(bmBtn) bmBtn.onclick = function(){ seekToBookmark(bm); };
  document.getElementById('autoNext').onchange = function(){
    LS.set('autoNext', !!this.checked);
    toast(this.checked ? '終わったら自動で次の章へ進みます' : '自動で進まないようにしました');
  };
  var gc = document.getElementById('goCert');
  if(gc) gc.onclick = function(){ route('cert', co.id); };
  var gsv = document.getElementById('goSv');
  if(gsv) gsv.onclick = function(){ route('survey', co.id); };
  var pv = document.getElementById('prevCh'), nx = document.getElementById('nextCh');
  if(pv && !pv.disabled) pv.onclick = function(){ stopPlayer(); route('learn', co.id, chapIdx - 1); };
  if(nx && !nx.disabled) nx.onclick = function(){ stopPlayer(); route('learn', co.id, chapIdx + 1); };
  eachIn('[data-chap]', function(b){
    b.onclick = function(){ stopPlayer(); route('learn', co.id, +b.getAttribute('data-chap')); };
  });

  var rec = getRec(u.name, ch.id);
  P.tr = rec ? trackerUnpack(rec) : createTracker(ch.dur);
  drawSeen();
  if(ch.videoId) mountPlayer(ch.videoId);
}
/* 視聴済み区間の帯を描く */
function drawSeen(cursorSec){
  var bar = document.getElementById('seenBar');
  if(!bar || !P.tr) return;
  var rg = watchedRanges(P.tr), dur = P.tr.dur, html = '';
  rg.forEach(function(r){
    html += '<i style="left:' + (r[0]/dur*100) + '%;width:' + ((r[1]-r[0])/dur*100) + '%"></i>';
  });
  if(cursorSec != null){
    html += '<span class="cursor" style="left:' + Math.min(99.7, cursorSec/dur*100) + '%"></span>';
  }
  bar.innerHTML = html;
  var el = document.getElementById('seenPct');
  if(el) el.textContent = pct(watchedRate(P.tr));
}

/* YouTube IFrame API を読み込んでプレーヤーを作る */
function mountPlayer(videoId){
  function make(){
    /* 読み込みが遅いあいだに画面を離れていたら、作らない
       （作ると、破棄したはずのプレーヤーが後から生まれて記録を汚す） */
    if(!document.getElementById('ytp')) return;
    P.player = new YT.Player('ytp', {
    /* 社員の Google アカウントに視聴履歴を残さない方のホストを使う */
    host:'https://www.youtube-nocookie.com',
      videoId: videoId,
      playerVars:{ rel:0, modestbranding:1, playsinline:1 },
      events:{
        onReady: function(e){
          var d = e.target.getDuration();
          if(d && Math.abs(d - P.tr.dur) > 2){
            /* 実際の長さが登録値と違う場合は、実際の長さに合わせ直す */
            var old = trackerPack(P.tr);
            /* fast を渡さないと倍速の証跡が毎回消える */
            P.tr = trackerUnpack({ dur:d, ranges:old.ranges, fast:old.fast });
            drawSeen();
          }
        },
        onStateChange: function(e){
          if(e.data === YT.PlayerState.PLAYING){ startTick(); return; }
          stopTick(); trackerBreak(P.tr); saveNow();
          /* 最後まで再生したら、設定に応じて次の章へ進む */
          if(e.data === YT.PlayerState.ENDED) onChapterEnd();
        },
        /* 倍速にされたら等速に戻す。戻せなかった場合も
           trackerTick 側で塗らないので、進捗は上がらない。 */
        onPlaybackRateChange: function(e){
          if(e.data > 1.01){
            try{ P.player.setPlaybackRate(1); }catch(err){}
            toast('倍速では視聴済みになりません（等速に戻しました）');
          }
        }
      }
    });
  }
  if(window.YT && window.YT.Player){ make(); return; }
  window.onYouTubeIframeAPIReady = make;
  if(!document.getElementById('ytapi')){
    var s = document.createElement('script');
    s.id = 'ytapi'; s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  }
}
function startTick(){
  stopTick();
  P.timer = setInterval(function(){
    if(!P.player || !P.player.getCurrentTime) return;
    var t = P.player.getCurrentTime();
    var rate = P.player.getPlaybackRate ? P.player.getPlaybackRate() : 1;
    trackerTick(P.tr, t, rate);
    drawSeen(t);
    updateCourseBar();
    /* 60秒おきに保存。止めた時・章を終えた時・画面を離れる時は別途すぐ保存するので、
       これを短くしても得られるものは少なく、200名同時だと書き込みが4倍になる。 */
    if(Date.now() - P.saveT > 60000) saveNow();
  }, 500);
}
function stopTick(){
  if(P.timer){ clearInterval(P.timer); P.timer = null; }
  if(P.nextT){ clearTimeout(P.nextT); P.nextT = 0; }   /* 画面を離れたら自動送りも止める */
}
function stopPlayer(){
  stopTick(); saveNow();
  if(P.player && P.player.destroy){ try{ P.player.destroy(); }catch(e){} }
  /* 状態を残すと、次に開いた人の記録に前の人の視聴が混ざる */
  P.player = null; P.tr = null; P.chap = null; P.course = null; P.owner = ''; P.term = null;
}
function saveNow(){
  if(!P.tr || !P.chap || !P.owner) return;
  var pk = trackerPack(P.tr);
  /* しおり＝最後に再生していた位置。次に開いたとき「続きから」に使う */
  if(P.player && P.player.getCurrentTime){
    try{ pk.pos = P.player.getCurrentTime(); }catch(e){}
  }
  /* 年度は「開いたとき」のものを使う。保存のたびに引き直すと、
     年度の変わり目に開いたままの画面が、去年の視聴を丸ごと新年度に複製してしまう。 */
  putRec(P.owner, P.chap.id, pk, P.term);   /* 「今の受講者」ではなく「この記録の持ち主」に書く */
  P.saveT = Date.now();
}
function updateCourseBar(){
  var u = me(), p = courseProgress(u.name, P.course);
  var b = document.getElementById('allBar'), n = document.getElementById('allPct');
  if(b) b.style.width = Math.round(p.rate*100) + '%';
  if(n) n.textContent = pct(p.rate);
  var q = document.getElementById('goQuiz');
  if(q && q.disabled && p.videoDone){
    q.disabled = false; q.className = 'btn';
    q.onclick = function(){ route('quiz', P.course.id); };
  }
}

/* 章を最後まで見たときの動き */
function onChapterEnd(){
  if(!P.course || !P.chap) return;
  var co = P.course, who = P.owner;
  var idx = co.chapters.indexOf(P.chap);
  var next = co.chapters[idx + 1];
  var auto = LS.get('autoNext', true);
  if(auto && next){
    toast('次の章へ進みます：' + next.title);
    clearTimeout(P.nextT);
    P.nextT = setTimeout(function(){
      P.nextT = 0; stopPlayer(); route('learn', co.id, idx + 1);
    }, 1200);
    return;
  }
  var p = courseProgress(who, co);
  if(!next && p.videoDone && co.quiz && co.quiz.length && !(p.quiz && p.quiz.passed)){
    toast('すべての章を視聴しました。確認テストに進めます');
    updateCourseBar();
  }
}
/* しおりの位置から再生する */
function seekToBookmark(sec){
  if(!P.player || !P.player.seekTo) return;
  try{
    P.player.seekTo(sec, true);
    trackerBreak(P.tr);        /* 飛んだ分を塗らないよう、連続性を切る */
    P.player.playVideo();
    toast(mmss(sec) + ' から再生します');
  }catch(e){}
}
function mmss(sec){
  sec = Math.max(0, Math.floor(sec || 0));
  var m = Math.floor(sec / 60), ss = sec % 60;
  return m + ':' + (ss < 10 ? '0' : '') + ss;
}

/* ══════════════════════════════════════════════════════════════
   キーボードの操作
     スペース＝再生／一時停止、←→＝10秒送り戻し、N＝次の章、P＝前の章
     入力欄にカーソルがあるときは何もしない。
   ══════════════════════════════════════════════════════════════ */
document.addEventListener('keydown', function(e){
  var t = e.target || {};
  var tag = (t.tagName || '').toUpperCase();
  if(tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || t.isContentEditable) return;
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(!P.player || !P.course || !document.getElementById('ytp')) return;

  var idx = P.course.chapters.indexOf(P.chap);
  var cur = 0;
  try{ cur = P.player.getCurrentTime(); }catch(err){}

  if(e.key === ' ' || e.key === 'Spacebar'){
    e.preventDefault();
    try{
      var st = P.player.getPlayerState();
      if(st === 1) P.player.pauseVideo(); else P.player.playVideo();
    }catch(err){}
  }else if(e.key === 'ArrowRight'){
    e.preventDefault(); trackerBreak(P.tr);
    try{ P.player.seekTo(cur + 10, true); }catch(err){}
  }else if(e.key === 'ArrowLeft'){
    e.preventDefault(); trackerBreak(P.tr);
    try{ P.player.seekTo(Math.max(0, cur - 10), true); }catch(err){}
  }else if(e.key === 'n' || e.key === 'N'){
    if(idx + 1 < P.course.chapters.length){ stopPlayer(); route('learn', P.course.id, idx + 1); }
  }else if(e.key === 'p' || e.key === 'P'){
    if(idx > 0){ stopPlayer(); route('learn', P.course.id, idx - 1); }
  }
});

/* ══════════════════════════════════════════════════════════════
   画面：確認テスト
   ══════════════════════════════════════════════════════════════ */
function viewQuiz(courseId){
  var u = me(), co = courses().filter(function(c){ return c.id === courseId; })[0];
  if(!co || !co.quiz || !co.quiz.length){ route('courses'); return; }
  if(!openable(co)) return;

  var gate = quizGate(u.name, co);
  var passRate = quizPassRate(co);
  var need = Math.ceil(co.quiz.length * passRate);
  var prev = getQuiz(u.name, co.id);

  /* 受験できないとき（回数切れ・待ち時間中）は、理由だけを出して止める */
  if(!gate.ok){
    var hb = '<div class="wrap quiz">';
    hb += '<button class="back" data-back>' + ic('back') + 'コースへ戻る</button>';
    hb += '<div class="ph"><div><h2>確認テスト</h2><div class="sub">' + esc(co.title) + '</div></div></div>';
    hb += '<div class="card pad"><div class="note"><b>いまは受験できません</b>　' + esc(gate.why) + '</div>';
    if(prev){
      hb += '<div class="cap" style="margin-top:12px">前回：' + prev.score + ' / ' + prev.total +
            '問　' + (prev.passed ? '合格' : '不合格') + '　' + esc(ymd(prev.at)) + '</div>';
    }
    hb += '<div class="bar" style="margin-top:14px">' +
          '<button class="btn" data-back>' + ic('back') + '動画を見直す</button></div></div></div>';
    document.getElementById('main').innerHTML = hb;
    eachIn('[data-back]', function(b){
      b.onclick = function(){ route('learn', co.id); };
    });
    drawNav('quiz');
    return;
  }

  /* 出題順と選択肢順を、この人・この受験回数ぶんだけ並べ替える */
  var QS = buildQuiz(u.name, co);

  var h = '<div class="wrap quiz">';
  h += '<button class="back" data-back>' + ic('back') + 'コースへ戻る</button>';
  h += '<div class="ph"><div><h2>確認テスト</h2>' +
       '<div class="sub">' + esc(co.title) + '　全' + co.quiz.length + '問　合格ライン ' +
       need + '問（' + Math.round(passRate*100) + '%）' +
       (gate.max ? '　受験できる回数 ' + gate.max + '回中 ' + (gate.tries + 1) + '回目' : '') +
       '</div></div></div>';
  if(prev && !prev.passed){
    h += '<div class="note" style="margin-bottom:16px"><b>前回は不合格でした</b>　' +
         prev.score + ' / ' + prev.total + '問。出題の順番は毎回変わります。' +
         '動画を見直してから受けてください。</div>';
  }
  h += '<div id="qArea">';
  QS.forEach(function(q, i){
    h += '<div class="q" data-q="' + i + '">' +
      '<div class="qt"><span class="n">' + (i+1) + '</span><span>' + esc(q.q) + '</span></div>';
    q.c.forEach(function(c, j){
      h += '<label class="opt" data-opt="' + i + '-' + j + '">' +
        '<input type="radio" name="q' + i + '" value="' + j + '" id="q' + i + '_' + j + '">' +
        '<span>' + esc(c) + '</span></label>';
    });
    h += '</div>';
  });
  h += '</div><div class="bar"><button class="btn" id="submitQ">' + ic('check') + '採点する</button>' +
       '<button class="btn sub" data-back>あとで受ける</button></div></div>';
  document.getElementById('main').innerHTML = h;

  eachIn('[data-back]', function(b){
    b.onclick = function(){ route('learn', co.id); };
  });
  document.getElementById('submitQ').onclick = function(){
    var score = 0, unanswered = 0, wrongNo = [];
    QS.forEach(function(q, i){
      if(!document.querySelector('input[name="q' + i + '"]:checked')) unanswered++;
    });
    if(unanswered){ toast(unanswered + '問が未回答です'); return; }

    /* 先に採点する。正解を見せるかどうかは、合否が決まってから決める */
    var picks = QS.map(function(q, i){
      var picked = +document.querySelector('input[name="q' + i + '"]:checked').value;
      if(picked === q.a) score++; else wrongNo.push(i + 1);
      return picked;
    });
    var passed = (score / QS.length) >= passRate;
    /* 既定は「合格したときだけ正解を見せる」。
       不合格でも毎回すべての正解を出すと、順番をメモして共有されてしまう。 */
    var reveal = (co.showAnswers === 'always') ? true
               : (co.showAnswers === 'never')  ? false
               : passed;
    if(reveal){
      QS.forEach(function(q, i){
        var right = document.querySelector('[data-opt="' + i + '-' + q.a + '"]');
        if(right) right.classList.add('correct');
        if(picks[i] !== q.a){
          var w = document.querySelector('[data-opt="' + i + '-' + picks[i] + '"]');
          if(w) w.classList.add('wrong');
        }
      });
    }else{
      /* 正解は出さず、「どの問題を間違えたか」だけを示す */
      wrongNo.forEach(function(n){
        var box = document.querySelector('[data-q="' + (n-1) + '"]');
        if(box) box.classList.add('missed');
      });
    }

    /* 受験履歴。何回目で受かったかを残す（監査で聞かれる） */
    var tries = quizTries(u.name, co.id) + 1;
    var hist  = ((prev && prev.history) || []).slice(-19);
    hist.push({ n:tries, score:score, total:QS.length, passed:passed,
                at:new Date().toISOString() });
    putQuiz(u.name, co.id, { score:score, total:QS.length, passed:passed,
                             tries:tries, history:hist,
                             at:new Date().toISOString() });

    var r = '<div class="result ' + (passed ? 'pass' : 'fail') + '">' +
      '<span class="big">' + ic(passed ? 'medal' : 'alert') + (passed ? '合格' : '不合格') + '</span>' +
      '<span class="sm">' + QS.length + '問中 ' + score + '問正解（合格ライン ' + need + '問）</span>' +
      '<span class="sm">' + (passed
        ? 'このコースは修了しました。受講記録に残ります。'
        : (reveal ? 'もう一度動画を確認して、再受験してください。'
                  : '間違えた問題：' + wrongNo.join('・') + '問目。' +
                    'もう一度動画を確認してから受けてください。')) + '</span>';
    if(!passed && (Number(co.maxTries) || 0)){
      r += '<span class="sm">受験できる回数：' + tries + ' / ' + co.maxTries + '回</span>';
    }
    r += '</div>';
    document.getElementById('qArea').insertAdjacentHTML('beforebegin', r);

    var again = quizGate(u.name, co);
    document.getElementById('submitQ').outerHTML =
      '<button class="btn" id="afterQ">' +
        (passed ? '修了証を表示' : (again.ok ? 'もう一度受ける' : '動画へ戻る')) + '</button>' +
      (passed ? '<button class="btn sub" id="afterSv">アンケートに答える</button>' : '');
    document.getElementById('afterQ').onclick = function(){
      passed ? route('cert', co.id) : (again.ok ? route('quiz', co.id) : route('learn', co.id));
    };
    var asv = document.getElementById('afterSv');
    if(asv) asv.onclick = function(){ route('survey', co.id); };
    drawNav('quiz');
    window.scrollTo({ top:0, behavior:'smooth' });
  };
}

/* ══════════════════════════════════════════════════════════════
   画面：修了証
     ブラウザの印刷機能でPDFにできる（印刷 → 送信先「PDFに保存」）。
   ══════════════════════════════════════════════════════════════ */
function certNo(name, co){
  /* 氏名・コース・年度から決まる番号。同じ年度なら毎回同じ、年度が違えば別の番号 */
  var src = name + '|' + co.id + '|' + termFor(co), n = 0;
  for(var i = 0; i < src.length; i++) n = (n * 131 + src.charCodeAt(i)) % 99999989;
  return 'C' + String(n).padStart(8, '0');
}
function viewCert(courseId, who){
  var name = who || me().name;
  var co = courses().filter(function(c){ return c.id === courseId; })[0];
  if(!co){ route('home'); return; }
  if(!who && !openable(co)) return;
  var p = courseProgress(name, co);
  if(!p.done){
    toast('このコースはまだ修了していません');
    route('learn', courseId);
    return;
  }
  var cfg = config();
  var pr = (allPeople().filter(function(x){ return x.name === name; })[0]) || {};
  /* 修了日＝最後に記録が動いた日 */
  var last = '';
  co.chapters.forEach(function(ch){
    var r = records()[recKey(name, ch.id)];
    if(r && r.updated && r.updated > last) last = r.updated;
  });
  if(p.quiz && p.quiz.at && p.quiz.at > last) last = p.quiz.at;

  var h = '<div class="wrap" style="max-width:860px">';
  h += '<div class="bar no-print" style="margin-bottom:14px">' +
       '<button class="back" data-back>' + ic('back') + '戻る</button><span class="sp"></span>' +
       '<button class="btn" id="prt">' + ic('file') + '印刷する / PDFで保存</button></div>';
  h += '<div class="cert" id="cert">';
  h +=   '<div class="cert-in">';
  h +=     '<div class="cert-logo">' + logoHTML(30) + '</div>';
  h +=     '<div class="cert-t">修 了 証</div>';
  h +=     '<div class="cert-sub">CERTIFICATE OF COMPLETION</div>';
  h +=     '<div class="cert-nm">' + esc(name) + '<span>殿</span></div>';
  h +=     '<p class="cert-b">あなたは下記の研修課程を修了されたことをここに証します。</p>';
  h +=     '<div class="cert-co">' + esc(co.title) + '</div>';
  h +=     '<table class="cert-tb"><tbody>';
  h +=       '<tr><th>所　属</th><td>' + esc(pr.dept || '—') +
               (pr.group ? '　/　' + esc(pr.group) : '') + '</td></tr>';
  h +=       '<tr><th>視聴時間</th><td>' + hhmm(p.sec) + '　（全' + co.chapters.length + '章・視聴率 ' +
               pct(p.rate) + '）</td></tr>';
  if(p.quiz){
    h +=     '<tr><th>確認テスト</th><td>' + p.quiz.score + ' / ' + p.quiz.total + '問　' +
               (p.quiz.passed ? '合格' : '不合格') + '</td></tr>';

/* ══════════════════════════════════════════════════════════════
   管理側で共通に使う集計
   ══════════════════════════════════════════════════════════════ */
var ADM = { course:'all', q:'', dept:'', group:'', only:'all', page:1, per:20,
            sort:'', desc:false };
var SEL = {};      /* 選択中の受講者 */

function adminMatrix(){
  var cs = courses(), recs = records();
  /* 部門管理者は、決められた職種の人だけ。研修管理者以上は全社。
     ここを通さない集計画面を作らないこと（全画面がこの関数を通っている） */
  var ppl = allPeople().filter(function(p){ return inScope(p.name); });
  return ppl.map(function(pn){
    var row = { name:pn.name, dept:pn.dept, group:pn.group, emp:pn.emp, cells:[],
                reqDone:0, reqTotal:0, done:0, assigned:0, last:'', sec:0, fast:false };
    cs.forEach(function(co){
      /* 配信されていないコースは、その人の集計に入れない（母数に含めない） */
      var on = isAssigned(pn, co);
      var p = courseProgress(pn.name, co);
      row.cells.push({ co:co, p:p, on:on });
      if(!on) return;
      row.assigned++;
      row.sec += p.sec;
      if(p.done) row.done++;
      if(co.required){ row.reqTotal++; if(p.done) row.reqDone++; }
      co.chapters.forEach(function(ch){
        var r = recs[recKey(pn.name, ch.id)];
        if(!r) return;
        if(r.fast) row.fast = true;
        if(r.updated && r.updated > row.last) row.last = r.updated;
      });
    });
    /* 必須が1つも配信されていない人は「未修了」にしない（対象外として扱う） */
    row.allReq = row.reqTotal === 0 ? true : (row.reqDone === row.reqTotal);
    row.noTarget = row.assigned === 0;   /* 1コースも配信されていない */
    /* コース完了率は「配信されたコース」を母数にする */
    row.rate = row.assigned ? row.done / row.assigned : 0;
    return row;
  });
}
/* しぼりこみ＋並べ替え。管理系の画面で共通に使う */
function admFilter(all){
  var rows = all.slice();
  var kw = ADM.q.trim();
  if(kw) rows = rows.filter(function(r){
    return r.name.indexOf(kw) >= 0 || (r.dept && r.dept.indexOf(kw) >= 0) ||
           (r.group && r.group.indexOf(kw) >= 0) || (r.emp && String(r.emp).indexOf(kw) >= 0);
  });
  if(ADM.dept)  rows = rows.filter(function(r){ return r.dept === ADM.dept; });
  if(ADM.group) rows = rows.filter(function(r){ return r.group === ADM.group; });
  if(ADM.only === 'pend') rows = rows.filter(function(r){ return !r.allReq; });
  if(ADM.only === 'none') rows = rows.filter(function(r){ return r.sec === 0; });
  /* 並び替え。指定がなければ「未修了を先に、そのあと名前順」 */
  var k = ADM.sort, d = ADM.desc ? -1 : 1;
  var val = function(r){
    if(k === 'name')  return r.name;
    if(k === 'dept')  return r.dept || '';
    if(k === 'group') return r.group || '';
    if(k === 'rate')  return r.rate;
    if(k === 'sec')   return r.sec;
    if(k === 'req')   return r.reqTotal ? r.reqDone / r.reqTotal : 0;
    if(k === 'last')  return r.last || '';
    return null;
  };
  rows.sort(function(a, b){
    if(k){
      var va = val(a), vb = val(b);
      if(va < vb) return -1 * d;
      if(va > vb) return  1 * d;
      return a.name < b.name ? -1 : 1;
    }
    if(a.allReq !== b.allReq) return a.allReq ? 1 : -1;
    return a.name < b.name ? -1 : (a.name > b.name ? 1 : 0);
  });
  return rows;
}
/* 並び替えできる見出しを作る */
function th(key, label, cls){
  var on = ADM.sort === key;
  return '<th' + (cls ? ' class="' + cls + '"' : '') + '>' +
    '<button class="sortb' + (on ? ' on' : '') + '" data-sort="' + key + '">' + label +
    '<span class="ar">' + (on ? (ADM.desc ? '▼' : '▲') : '⇅') + '</span></button></th>';
}
function bindSort(redraw){
  eachIn('[data-sort]', function(b){
    b.onclick = function(){
      var k = b.getAttribute('data-sort');
      if(ADM.sort === k) ADM.desc = !ADM.desc;
      else { ADM.sort = k; ADM.desc = false; }
      ADM.page = 1;
      redraw();
    };
  });
}
function admOptions(all){
  var ds = [], gs = [];
  all.forEach(function(r){
    if(r.dept && ds.indexOf(r.dept) < 0) ds.push(r.dept);
    if(r.group && gs.indexOf(r.group) < 0) gs.push(r.group);

  return { depts:ds, groups:gs };
}

/* コースごとの「完了 / 学習中」の帯グラフ */
function courseBars(rows){
  var cs = courses();
  var h = '<div class="legend">' +
    '<span><i style="background:var(--ok)"></i>完了</span>' +
    '<span><i style="background:var(--warn)"></i>学習中</span>' +
    '<span><i style="background:var(--sunken)"></i>未着手</span></div><div class="bars">';
  cs.forEach(function(co, ci){
    var d = 0, m = 0, tgt = 0;
    rows.forEach(function(r){
      var c = r.cells[ci];
      if(!c.on) return;                 /* 配信外は母数から外す */
      tgt++;
      if(c.p.done) d++; else if(c.p.sec > 0) m++;
    });
    var n = tgt || 1;
    h += '<div class="brow">' +
      '<span class="nm" title="' + esc(co.title) + '">' + esc(co.title) +
        (co.required ? ' <span class="pill req" style="font-size:9.5px">必須</span>' : '') + '</span>' +
      '<span class="tr">' +
        '<i class="d" style="width:' + (d/n*100) + '%"></i>' +
        '<i class="m" style="width:' + (m/n*100) + '%"></i></span>' +
      '<span class="rt">完了 ' + d + ' / ' + tgt + '（' +
        Math.round(d/n*100) + '%）</span></div>';
  });
  return h + '</div>';
}

/* 視聴記録を新しい順に並べた活動履歴 */
function activityLog(limit){
  var recs = records(), cs = courses(), ppl = {}, out = [];
  allPeople().forEach(function(p){ ppl[p.name] = p; });
  var chOf = {};
  cs.forEach(function(co){
    co.chapters.forEach(function(ch){ chOf[ch.id] = { co:co, ch:ch }; });
  });
  Object.keys(recs).forEach(function(k){
    var r = recs[k];
    var name = k.split('|')[0];
    var pr0 = k.slice(name.length + 1).split('|');
    var lgTerm = /^\d{4}$/.test(pr0[pr0.length - 1]) ? pr0[pr0.length - 1] : '';
    var chId = (lgTerm ? pr0.slice(0, -1) : pr0).join('|');
    if(lgTerm && lgTerm !== actTerm()) return;      /* 見ている年度ぶんだけ */
    var f = chOf[chId];
    if(!f) return;
    var tr = trackerUnpack(r);
    out.push({ name:name, dept:(ppl[name] || {}).dept || '',
               course:f.co.title, chap:f.ch.title,
               rate:watchedRate(tr), sec:watchedSeconds(tr), updated:r.updated || '' });
  });
  out.sort(function(a, b){ return String(b.updated) < String(a.updated) ? -1 : 1; });
  return limit ? out.slice(0, limit) : out;
}

/* ══════════════════════════════════════════════════════════════
   画面：グループ
   ══════════════════════════════════════════════════════════════ */
function viewAGroups(){
  var all = adminMatrix(), cs = courses();
  /* グループ別・職種別の2つの表を出す */
  function agg(keyOf, label){
    var map = {};
    all.forEach(function(r){
      var k = keyOf(r) || '（未設定）';
      if(!map[k]) map[k] = { n:0, done:0, learn:0, none:0, sec:0, reqDone:0, reqTotal:0 };
      var m = map[k];
      m.n++;
      if(r.noTarget){ m.off = (m.off || 0) + 1; return; }
      m.sec += r.sec;
      m.reqDone += r.reqDone;
      m.reqTotal += r.reqTotal;
      if(r.allReq) m.done++; else if(r.sec > 0) m.learn++; else m.none++;
    });
    var keys = Object.keys(map).sort();
    var h = '<div class="cat">' + ic('users') + label +
            '<span class="num">' + keys.length + '件</span></div>';
    h += '<div class="tbl-wrap" style="margin-bottom:16px"><table><thead><tr>' +
         '<th class="stick">' + label + '</th><th class="n">人数</th>' +
         '<th class="c">必須すべて修了</th><th class="c">学習中</th><th class="c">未着手</th>' +
         '<th class="c" style="min-width:150px">必須研修の達成率</th><th class="n">視聴時間</th>' +
         '</tr></thead><tbody>';
    keys.forEach(function(k){
      var m = map[k];
      var rt = m.reqTotal ? m.reqDone / m.reqTotal : 0;
      h += '<tr><td class="stick"><b>' + esc(k) + '</b></td>';
      h += '<td class="n">' + m.n + '</td>';
      h += '<td class="c"><span class="pill ok">' + m.done + '</span></td>';
      h += '<td class="c"><span class="pill mid">' + m.learn + '</span></td>';
      h += '<td class="c"><span class="pill ' + (m.none ? 'bad' : 'no') + '">' + m.none + '</span></td>';
      h += '<td class="c"><div class="pline"><span class="pb' + (rt >= 1 ? ' done' : '') +
           '"><i style="width:' + Math.round(rt*100) + '%"></i></span>' +
           '<span class="n">' + Math.round(rt*100) + '%</span></div></td>';
      h += '<td class="n">' + hhmm(m.sec) + '</td></tr>';
    });
    return h + '</tbody></table></div>';
  }

  var h = '<div class="wrap">';
  h += '<div class="ph"><div><h2>グループ</h2>' +
       '<div class="sub">グループ・職種ごとの達成状況です。</div>' +
       '</div><div class="sp"></div>' +
       '<button class="btn sub" data-go2="ajobs">' + ic('slider') + '職種を編集</button>' +
       '<button class="btn sub" data-go2="asettings">' + ic('gear') + 'グループを編集</button></div>';
  h += agg(function(r){ return r.group; }, 'グループ');
  h += agg(function(r){ return r.dept; },  '職種');
  h += '</div>';
  document.getElementById('main').innerHTML = h;
  bindOpen();
}

function viewACourses(){
  var cs = courses(), all = adminMatrix();
  var h = '<div class="wrap">';
  h += '<div class="ph"><div><h2>コース一覧</h2>' +
       '<div class="sub">コースごとに「誰に出すか（配信先）」を決めます。' +
       '行のいちばん右の<b>「配信先を変える」</b>から設定してください。</div>' +

       '<button class="btn" id="acNew">' + ic('plus') + 'コースを追加</button>' +
       '</div>';

       '<th class="stick">コース</th><th>区分</th><th class="c">必須</th>' +
       '<th>配信先<small>誰に出すか</small></th><th class="n">対象</th>' +
       '<th class="n">章数</th><th class="n">合計時間</th><th class="c">動画URL</th>' +
       '<th class="n">テスト</th><th class="c">期限</th>' +
       '<th class="c" style="min-width:150px">完了率</th><th></th></tr></thead><tbody>';
  cs.forEach(function(co, ci){
    var dur = 0, noVid = 0;
    co.chapters.forEach(function(ch){ dur += ch.dur; if(!ch.videoId) noVid++; });
    var tgt = all.filter(function(r){ return r.cells[ci].on; });
    var d = tgt.filter(function(r){ return r.cells[ci].p.done; }).length;
    var n = tgt.length || 1;
    var dl = daysLeft(co);
    h += '<tr' + (co.hidden ? ' class="off-row"' : '') + '><td class="stick">' +
         '<b>' + esc(co.title) + '</b>' +
         (co.hidden ? ' <span class="pill no">停止中</span>' : '') +
         '<div style="font-size:10.5px;color:var(--ink-3)">' +
         esc(String(co.desc || '').slice(0, 34)) + '…</div></td>';
    h += '<td>' + esc(co.cat) + '</td>';
    h += '<td class="c">' + (co.required ? '<span class="pill req">必須</span>'
                                         : '<span class="pill no">任意</span>') + '</td>';
    h += '<td style="max-width:230px;font-size:12px">' +
         '<button class="lnk asg-lnk" data-assign="' + esc(co.id) + '">' +
         ic('users') + esc(assignLabel(co)) + '</button></td>';
    h += '<td class="n">' + tgt.length + '名</td>';
    h += '<td class="n">' + co.chapters.length + '</td>';
    h += '<td class="n">' + hhmm(dur) + '</td>';
    h += '<td class="c">' + (noVid ? '<span class="pill bad">未設定 ' + noVid + '件</span>'
                                   : '<span class="pill ok">設定済み</span>') + '</td>';
    h += '<td class="n">' + ((co.quiz && co.quiz.length) ? co.quiz.length + '問' : '—') + '</td>';
    h += '<td class="c">' + (co.deadline
           ? '<span class="pill ' + (dl < 0 ? 'bad' : (dl <= 30 ? 'mid' : 'no')) + '">' +
             esc(co.deadline) + '</span>' : '—') + '</td>';
    h += '<td class="c"><div class="pline"><span class="pb' + (d === tgt.length && d ? ' done' : '') +
         '"><i style="width:' + (d/n*100) + '%"></i></span>' +
         '<span class="n">' + Math.round(d/n*100) + '%</span></div>' +
         '<div style="font-size:10px;color:var(--ink-3)">' + d + ' / ' + tgt.length + '名</div></td>';
    h += '<td class="n"><div class="bar" style="justify-content:flex-end">' +
         '<button class="btn sm" data-assign="' + esc(co.id) + '">' + ic('users') +
         '配信先を変える</button>' +
         '<button class="btn sub sm" data-edit="' + esc(co.id) + '">' + ic('slider') +
         '編集</button>' +
         '<button class="btn sub sm" data-cid="' + esc(co.id) + '">明細</button>' +
         '<button class="btn sub sm" data-dup="' + esc(co.id) + '">複製</button>' +
         '<button class="btn sub sm" data-cdelc="' + esc(co.id) + '">削除</button></div></td></tr>';
  });
  h += '</tbody></table></div></div>';
  document.getElementById('main').innerHTML = h;
  bindOpen();
  eachIn('[data-cid]', function(b){
    b.onclick = function(){ ADM.course = b.getAttribute('data-cid'); ADM.page = 1; route('acourse'); };
  });
  eachIn('[data-assign]', function(b){
    b.onclick = function(){ route('aassign', b.getAttribute('data-assign')); };
  });
  eachIn('[data-edit]', function(b){
    b.onclick = function(){ ceClear(); route('acedit', b.getAttribute('data-edit')); };
  });
  /* 新しいコースを作る */
  var nb = document.getElementById('acNew');
  if(nb) nb.onclick = function(){
    var id = newCourseId();
    var co = { id:id, cat:'その他', title:'新しいコース', required:false, passRate:0.8,
               deadline:'', cycle:'yearly',
               assign:{ rules:[{ mode:'none', targets:[] }] },
               desc:'', chapters:[{ id:id + 'v1', title:'第1章　', videoId:'', dur:600 }],
               quiz:[] };
    var cs2 = JSON.parse(JSON.stringify(courses()));
    cs2.push(co);
    setCourses(cs2);
    ceClear();
    toast('コースを作りました。中身を入れてください');
    route('acedit', id);
  };
  /* 複製（同じ研修の別バージョンを作るときに） */
  eachIn('[data-dup]', function(b){
    b.onclick = function(){
      var src = courses().filter(function(c){ return c.id === b.getAttribute('data-dup'); })[0];
      if(!src) return;
      var id = newCourseId();
      var co = JSON.parse(JSON.stringify(src));
      co.id = id;
      co.title = src.title + '（コピー）';
      co.hidden = true;                 /* うっかり配信しないよう、停止して作る */
      co.assign = { rules:[{ mode:'none', targets:[] }] };
      /* 章は新しいIDで作り直す。同じIDを使うと記録が混ざる */
      var used = {};
      courses().forEach(function(c){
        (c.chapters || []).forEach(function(ch){ used[ch.id] = 1; });
      });
      co.chapters = (src.chapters || []).map(function(ch, i){
        var nid = id + 'v' + (i + 1);
        while(used[nid]) nid = id + 'v' + (i + 1) + '_' + Math.floor(Math.random() * 999);
        used[nid] = 1;
        return { id:nid, title:ch.title, videoId:ch.videoId, dur:ch.dur };
      });
      var cs2 = JSON.parse(JSON.stringify(courses()));
      cs2.push(co);
      setCourses(cs2);
      ceClear();
      toast('複製しました（停止中で作っています）');
      route('acedit', id);
    };
  });
  /* 削除。受講記録がある場合は止める */
  eachIn('[data-cdelc]', function(b){
    b.onclick = function(){
      var id = b.getAttribute('data-cdelc');
      var co = courses().filter(function(c){ return c.id === id; })[0];
      if(!co) return;
      if(courseHasRecords(co)){
        toast('「' + co.title + '」には受講した記録があります。削除できません。' +
              '編集画面の「いったん停止する」をお使いください');
        return;
      }
      if(!window.confirm('「' + co.title + '」を削除しますか？\nこの操作は取り消せません。')) return;
      setCourses(courses().filter(function(c){ return c.id !== id; }));
      ceClear();
      toast('削除しました');
      viewACourses();
    };
  });
}

  var rows = admFilter(all).filter(function(r){ return !r.noTarget; });
  var totalSec = rows.reduce(function(a, r){ return a + r.sec; }, 0);
  var doneN = rows.filter(function(r){ return r.allReq; }).length;
  var noneN = rows.filter(function(r){ return r.sec === 0; }).length;
  var avgRate = rows.length
    ? rows.reduce(function(a, r){ return a + r.rate; }, 0) / rows.length : 0;

  var h = '<div class="wrap">';
  h += '<div class="ph"><div><h2>全体活動状況</h2>' +
       '<div class="sub">しぼりこんだ範囲で集計しています。</div></div></div>';
  h += toolsHTML(all, { course:false });
  h += '<div class="kpis">';
  h += '<div class="kpi"><span class="k">' + ic('users') + '対象人数</span>' +
       '<span class="v">' + rows.length + '<small>名</small></span></div>';
  h += '<div class="kpi t-ok"><span class="k">' + ic('medal') + '必須すべて修了</span>' +
       '<span class="v">' + doneN + '<small>名</small></span></div>';
  h += '<div class="kpi t-no"><span class="k">' + ic('cross') + '未着手</span>' +
       '<span class="v">' + noneN + '<small>名</small></span></div>';
  h += '<div class="kpi t-mid"><span class="k">' + ic('chart') + '平均コース完了率</span>' +
       '<span class="v">' + Math.round(avgRate*100) + '<small>%</small></span></div>';
  h += '</div>';
  h += '<div class="cat">' + ic('chart') + 'コースごとの受講状況</div>';
  h += '<div class="card pad" style="margin-bottom:16px">' + courseBars(rows) + '</div>';

  /* 職種ごとの視聴時間 */
  var byDept = {};
  rows.forEach(function(r){
    var k = r.dept || '（未設定）';
    if(!byDept[k]) byDept[k] = { sec:0, n:0 };
    byDept[k].sec += r.sec; byDept[k].n++;
  });
  var ks = Object.keys(byDept).sort(), max = 1;
  ks.forEach(function(k){ if(byDept[k].sec > max) max = byDept[k].sec; });
  h += '<div class="cat">' + ic('clock') + '職種ごとの視聴時間</div>';
  h += '<div class="card pad"><div class="bars">';
  ks.forEach(function(k){
    h += '<div class="brow"><span class="nm" title="' + esc(k) + '">' + esc(k) + '</span>' +
         '<span class="tr"><i class="d" style="width:' +
           Math.max(2, Math.round(byDept[k].sec/max*100)) + '%"></i></span>' +
         '<span class="rt">' + hhmm(byDept[k].sec) + '（' + byDept[k].n + '名）</span></div>';
  });
  h += '</div></div></div>';
  document.getElementById('main').innerHTML = h;
  bindTools(viewAOverall);
}

/* ══════════════════════════════════════════════════════════════
   画面：学習進捗管理 → コース（章ごとの明細）
   ══════════════════════════════════════════════════════════════ */
function viewACourse(){
  var cs = courses(), all = adminMatrix();
  if(ADM.course === 'all') ADM.course = cs[0].id;
  var co = cs.filter(function(c){ return c.id === ADM.course; })[0] || cs[0];
  /* そのコースが配信されている人だけを並べる */
  var rows = admFilter(all).filter(function(r){ return isAssigned(r, co); });
  var per = ADM.per, total = rows.length;
  var pages = Math.max(1, Math.ceil(total / per));
  if(ADM.page > pages) ADM.page = pages;
  var from = (ADM.page - 1) * per;
  var page = rows.slice(from, from + per);

  var h = '<div class="wrap">';
  h += '<div class="ph"><div><h2>コース別の受講状況</h2>' +
       '<div class="sub">' + esc(co.title) + '　全' + co.chapters.length + '章</div></div></div>';
  h += toolsHTML(all, { course:true });
  h += pagerHTML(total, pages, from, per, selCount(), true);
  if(overdue(co)){
    h += '<div class="note" style="margin-bottom:12px"><b>受講期限を過ぎています</b>　' +
         esc(co.deadline) + ' が期限です。未修了の方への案内をご検討ください。</div>';
  }
  if(!total){
    h += '<div class="card"><div class="empty">' + ic('users') + '該当する受講者はいません。</div></div>';
  }else{
    h += '<div class="tbl-wrap"><table><thead><tr>';
    h += '<th class="ck"><label class="ckbox"><input type="checkbox" id="selAll" aria-label="すべて選択"></label></th>';
    h += '<th class="stick">ユーザー名</th><th>職種</th><th>グループ</th>';
    co.chapters.forEach(function(ch){
      h += '<th class="c">' + esc(ch.title) + '<small>' + hhmm(ch.dur) + '</small></th>';
    });
    if(co.quiz && co.quiz.length) h += '<th class="c">確認テスト</th>';
    h += '<th class="c">コース進捗</th><th class="c">受講状況</th></tr></thead><tbody>';
    page.forEach(function(r){
      var p = courseProgress(r.name, co);
      var on = !!SEL[r.name];
      h += '<tr' + (on ? ' class="sel"' : '') + '>';
      h += '<td class="ck"><label class="ckbox"><input type="checkbox" aria-label="' + esc(r.name) + 'を選ぶ" data-sel="' + esc(r.name) + '"' +
           (on ? ' checked' : '') + '></td>';
      h += '<td class="stick"><div class="who-cell" title="' + esc(r.name) + '">' + ava(r.name, 'sm') +
           '<div class="who-t"><b><button data-person="' + esc(r.name) + '">' + esc(r.name) +
           '</button></b><span>' + (r.emp ? esc(r.emp) : '—') + '</span></div></div></td>';
      h += '<td class="nw">' + esc(r.dept || '—') + '</td>' +
             '<td class="nw">' + esc(r.group || '—') + '</td>';
      co.chapters.forEach(function(ch){
        var cp = chapProgress(r.name, ch);
        var rec = records()[recKey(r.name, ch.id)];
        h += '<td class="c"><div class="st ' +
             (cp.rate >= co.passRate ? 'done' : (cp.rate > 0 ? 'mid' : 'zero')) + '">' +
             '<span class="lb mono" style="font-size:11.5px">' + pct(cp.rate) + '</span>' +
             '<span class="sm">' + Math.round(cp.sec/60) + '分 / ' + Math.round(ch.dur/60) + '分</span>' +
             (rec && rec.fast ? '<span class="sm" style="color:var(--kaki)">倍速あり</span>' : '') +
             '</div></td>';
      });
      if(co.quiz && co.quiz.length){

        h += '<td class="c">' + (qz
          ? '<div class="st ' + (qz.passed ? 'done' : 'no') + '">' +

            '<span class="lb">' + (qz.passed ? '合格' : '不合格') + '</span>' +
            '<span class="sm">' + qz.score + '/' + qz.total + '</span></div>'
          : '<span class="pill no">未受験</span>') + '</td>';

/* ══════════════════════════════════════════════════════════════
   画面：学習進捗管理 → テスト
   ══════════════════════════════════════════════════════════════ */
function viewAQuiz(){
  var cs = courses(), all = adminMatrix();
  var rows = admFilter(all);
  var withQuiz = cs.filter(function(c){ return c.quiz && c.quiz.length; });

  var pass = 0, fail = 0, non = 0;
  rows.forEach(function(r){
    withQuiz.forEach(function(co){
      if(!isAssigned(r, co)) return;      /* 配信外は数えない */
      var qz = getQuiz(r.name, co.id);
      if(!qz) non++; else if(qz.passed) pass++; else fail++;
    });
  });

  var h = '<div class="wrap">';
  h += '<div class="ph"><div><h2>テスト結果</h2>' +
       '<div class="sub">確認テストのあるコース（' + withQuiz.length + 'コース）の結果です。' +
       '再受験した場合は最後の結果が残ります。</div></div></div>';
  h += toolsHTML(all, { course:false });
  h += '<div class="kpis">';
  h += '<div class="kpi t-ok"><span class="k">' + ic('check') + '合格</span>' +
       '<span class="v">' + pass + '<small>件</small></span></div>';
  h += '<div class="kpi t-mid"><span class="k">' + ic('cross') + '不合格</span>' +
       '<span class="v">' + fail + '<small>件</small></span></div>';
  h += '<div class="kpi t-no"><span class="k">' + ic('quiz') + '未受験</span>' +
       '<span class="v">' + non + '<small>件</small></span></div>';
  h += '<div class="kpi"><span class="k">' + ic('chart') + '合格率</span>' +
       '<span class="v">' + (pass + fail ? Math.round(pass/(pass+fail)*100) : 0) +
       '<small>%</small></span></div>';
  h += '</div>';

  if(!rows.length){
    h += '<div class="card"><div class="empty">' + ic('quiz') + '該当する受講者はいません。</div></div>';
  }else{
    h += '<div class="tbl-wrap"><table><thead><tr><th class="stick">ユーザー名</th>' +
         '<th>職種</th><th>グループ</th>';
    withQuiz.forEach(function(co){
      h += '<th class="c">' + esc(co.title) + '<small>全' + co.quiz.length + '問・' +
           Math.round(quizPassRate(co)*100) + '%で合格</small></th>';
    });
    h += '<th class="c">合格数</th></tr></thead><tbody>';
    rows.slice(0, ADM.per).forEach(function(r){
      var okN = 0;
      h += '<tr><td class="stick"><div class="who-cell" title="' + esc(r.name) + '">' + ava(r.name, 'sm') +
           '<div class="who-t"><b><button data-person="' + esc(r.name) + '">' + esc(r.name) +
           '</button></b><span>' + (r.emp ? esc(r.emp) : '—') + '</span></div></div></td>';
      h += '<td class="nw">' + esc(r.dept || '—') + '</td>' +
             '<td class="nw">' + esc(r.group || '—') + '</td>';
      var qTot = 0;
      withQuiz.forEach(function(co){
        if(!isAssigned(r, co)){
          h += '<td class="c"><span class="pill no">対象外</span></td>';
          return;
        }
        qTot++;
        var qz = getQuiz(r.name, co.id);
        if(qz && qz.passed) okN++;
        h += '<td class="c">' + (qz
          ? '<div class="st ' + (qz.passed ? 'done' : 'no') + '">' +
            '<span class="dot">' + icf(qz.passed ? 'check' : 'cross') + '</span>' +
            '<span class="lb">' + (qz.passed ? '合格' : '不合格') + '</span>' +
            '<span class="sm">' + qz.score + '/' + qz.total + '　' + ymd(qz.at) + '</span></div>'
          : '<div class="st zero"><span class="dot">' + icf('cross') + '</span>' +
            '<span class="lb">未受験</span></div>') + '</td>';
      });
      h += '<td class="c"><span class="pill ' + (qTot && okN === qTot ? 'ok' : 'mid') + '">' +
           okN + ' / ' + qTot + '</span></td></tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '</div>';
  document.getElementById('main').innerHTML = h;
  bindTools(viewAQuiz);
  eachIn('[data-person]', function(b){
    b.onclick = function(){ route('audetail', b.getAttribute('data-person')); };
  });
}

/* ══════════════════════════════════════════════════════════════
   画面：コースの編集（管理）
     コース・章・確認テストを、ここで作って直す。

     ★ 章のIDは受講記録のキーそのもの。
       ・いちど使ったIDは、消しても二度と使い回さない
       ・章やコースを「消す」ときは、記録ごと消さずに停止（hidden）にする
       これを守らないと、過去の修了記録が迷子になる。
   ══════════════════════════════════════════════════════════════ */
var CE = { id:'', draft:null, tab:'base' };

/* 編集中の下書きを用意する（保存するまで本体には触らない） */
function ceLoad(courseId){
  if(CE.id === courseId && CE.draft) return CE.draft;
  var co = courses().filter(function(c){ return c.id === courseId; })[0];
  if(!co) return null;
  CE.id = courseId;
  CE.draft = JSON.parse(JSON.stringify(co));
  CE.draft.chapters = CE.draft.chapters || [];
  CE.draft.quiz = CE.draft.quiz || [];
  return CE.draft;
}
function ceClear(){ CE.id = ''; CE.draft = null; CE.tab = 'base'; }

/* 下書きを本体へ書き戻す */
function ceSave(){
  var d = CE.draft;
  if(!d) return false;
  if(!String(d.title || '').trim()){ toast('コース名を入れてください'); return false; }
  if(!d.chapters.length){ toast('章を1つ以上つくってください'); return false; }
  for(var i = 0; i < d.chapters.length; i++){
    if(!String(d.chapters[i].title || '').trim()){
      toast((i+1) + '番目の章に名前がありません'); return false;
    }
    if(!(Number(d.chapters[i].dur) > 0)){
      toast('「' + d.chapters[i].title + '」の長さを入れてください'); return false;
    }
  }
  for(var j = 0; j < d.quiz.length; j++){
    var q = d.quiz[j];
    if(!String(q.q || '').trim()){ toast('第' + (j+1) + '問の問題文がありません'); return false; }
    if(q.c.filter(function(x){ return String(x || '').trim(); }).length < 2){
      toast('第' + (j+1) + '問の選択肢を2つ以上入れてください'); return false;
    }
    if(!String(q.c[q.a] || '').trim()){
      toast('第' + (j+1) + '問の正解が空欄です'); return false;
    }
  }
  var cs = JSON.parse(JSON.stringify(courses()));
  var hit = false;
  cs.forEach(function(c, i){ if(c.id === d.id){ cs[i] = d; hit = true; } });
  if(!hit) cs.push(d);
  setCourses(cs);
  return true;
}

/* ══════════════════════════════════════════════════════════════
   画面：コースの配信設定（管理）
     誰にこのコースを出すかを決める。
       全員に配信 ／ 指定して配信（グループ・職種・個人のOR）／ 配信しない
     どの出しかたでも「この人には出さない」除外を重ねられる。

   選んだ内容は ASG（下書き）に持つ。
   以前は画面のチェックボックスだけを見ていたので、
   個人を絞り込むと「表示されていない人のチェック」が消えて、
   保存した瞬間に既存の配信先が丸ごと消える事故が起きていた。
   ══════════════════════════════════════════════════════════════ */
var ASG = { q:'', cid:'', mode:'all', tg:{}, ex:{} };

/* コースの保存済み設定を下書きに読み込む（画面をはじめて開いたときだけ） */
function asgLoad(co){
  if(ASG.cid === co.id) return;
  var a = assignOf(co);
  ASG.cid = co.id; ASG.q = ''; ASG.tg = {}; ASG.ex = {};
  ASG.mode = 'pick';
  a.rules.forEach(function(r){
    var t = r.targets || [];
    if(r.mode === 'all')  ASG.mode = 'all';
    if(r.mode === 'none' && !t.length) ASG.mode = 'none';
    if(r.mode === 'group' || r.mode === 'dept' || r.mode === 'person'){
      t.forEach(function(x){ ASG.tg[r.mode + '|' + x] = true; });
    }
    if(r.mode === 'ex_group' || r.mode === 'ex_dept' || r.mode === 'ex_person'){
      t.forEach(function(x){ ASG.ex[r.mode.slice(3) + '|' + x] = true; });
    }
  });
  if(ASG.mode === 'pick' && !Object.keys(ASG.tg).length) ASG.mode = 'none';
}
/* 下書き → 保存する形（rules） */
function asgRules(){
  var rules = [], by = { group:[], dept:[], person:[] }, ex = { group:[], dept:[], person:[] };
  Object.keys(ASG.tg).forEach(function(k){
    if(!ASG.tg[k]) return;
    var p = k.split('|'); if(by[p[0]]) by[p[0]].push(p.slice(1).join('|'));
  });
  Object.keys(ASG.ex).forEach(function(k){
    if(!ASG.ex[k]) return;
    var p = k.split('|'); if(ex[p[0]]) ex[p[0]].push(p.slice(1).join('|'));
  });
  if(ASG.mode === 'none') return [{ mode:'none', targets:[] }];
  if(ASG.mode === 'all'){
    rules.push({ mode:'all', targets:[] });
  }else{
    ['group','dept','person'].forEach(function(k){
      if(by[k].length) rules.push({ mode:k, targets:by[k] });
    });
    if(!rules.length) return [{ mode:'none', targets:[] }];
  }
  ['group','dept','person'].forEach(function(k){
    if(ex[k].length) rules.push({ mode:'ex_' + k, targets:ex[k] });
  });
  return rules;
}

function viewAAssign(courseId){
  var cs = courses();
  var co = cs.filter(function(c){ return c.id === courseId; })[0];
  if(!co){ route('acourses'); return; }
  asgLoad(co);

  var all = allPeople();
  var o = admOptions(adminMatrix());
  /* 選択肢は「名簿にある区分」と「設定で決めた区分」の両方から作る */
  var gs = groups().slice(), ds = depts().slice();
  o.groups.forEach(function(g){ if(gs.indexOf(g) < 0) gs.push(g); });
  o.depts.forEach(function(d){ if(ds.indexOf(d) < 0) ds.push(d); });
  /* 設定から消えた区分でも、いま配信先に入っているものは残して見せる（無音で消さない） */
  Object.keys(ASG.tg).concat(Object.keys(ASG.ex)).forEach(function(k){
    var p = k.split('|'), v = p.slice(1).join('|');
    if(p[0] === 'group' && gs.indexOf(v) < 0) gs.push(v);
    if(p[0] === 'dept'  && ds.indexOf(v) < 0) ds.push(v);
  });

  /* いま選ばれている条件で何人になるか */
  function countNow(){
    var fake = { assign:{ rules:asgRules() } };
    return all.filter(function(pp){ return isAssigned(pp, fake); }).length;
  }

  var kw = ASG.q.trim();
  var shown = kw ? all.filter(function(pp){
    return pp.name.indexOf(kw) >= 0 || (pp.dept || '').indexOf(kw) >= 0 ||
           (pp.group || '').indexOf(kw) >= 0 || String(pp.emp || '').indexOf(kw) >= 0;
  }) : all;
  var exNames = Object.keys(ASG.ex).filter(function(k){ return ASG.ex[k] && k.indexOf('person|') === 0; })
                  .map(function(k){ return k.slice(7); });
  var pickN = Object.keys(ASG.tg).filter(function(k){ return ASG.tg[k]; }).length;

  var h = '<div class="wrap" style="max-width:900px">';
  h += '<button class="back" data-back>' + ic('back') + 'コース一覧へ戻る</button>';
  h += '<div class="ph"><div><h2>配信設定</h2>' +
       '<div class="sub">' + esc(co.title) + '　このコースを誰に出すかを決めます。' +
       '配信していない人には、コース一覧にも表示されません。</div></div></div>';

  h += '<div class="note calm" style="margin-bottom:16px"><b>保存されている配信先</b>　' +
       esc(assignLabel(co)) + '　（対象 ' + assignedPeople(co).length + ' 名）</div>';

  h += '<div class="card pad" style="margin-bottom:16px">';
  h += '<div class="field" style="margin-bottom:16px"><label>配信のしかた</label>' +
       '<div class="seg" id="asgMode">' +
       [['all','全員に配信'],['pick','指定して配信'],['none','配信しない']].map(function(x){
         return '<button data-m="' + x[0] + '" aria-pressed="' +
                (ASG.mode === x[0]) + '">' + x[1] + '</button>';
       }).join('') + '</div>' +
       '<div class="cap" style="margin-top:7px">' +
       '「指定して配信」は、グループ・職種・個人のどれかに当てはまる人に届きます（重ねて選べます）' +
       '</div></div>';

  /* ── 指定して配信 ── */
  h += '<div id="asgPick"' + (ASG.mode === 'pick' ? '' : ' hidden') + '>';
  h += '<div class="asg-box"><div class="field"><label>グループ</label>' +
       '<div class="chips">' + gs.map(function(g){
         var n = all.filter(function(pp){ return (pp.group || '') === g; }).length;
         return '<label class="chip"><input type="checkbox" data-tg="group|' + esc(g) + '"' +
                (ASG.tg['group|' + g] ? ' checked' : '') + '><span>' + esc(g) +
                '<i>' + n + '名</i></span></label>';
       }).join('') + '</div></div></div>';
  h += '<div class="asg-box"><div class="field"><label>職種</label>' +
       '<div class="chips">' + ds.map(function(d){
         var n = all.filter(function(pp){ return (pp.dept || '') === d; }).length;
         return '<label class="chip"><input type="checkbox" data-tg="dept|' + esc(d) + '"' +
                (ASG.tg['dept|' + d] ? ' checked' : '') + '><span>' + esc(d) +
                '<i>' + n + '名</i></span></label>';
       }).join('') + '</div></div></div>';
  h += '<div class="asg-box"><div class="field">' +
       '<label>個人（' + all.length + '名から選ぶ　' +
       '<span class="note-s">いま <b id="asgPicked">' +
       Object.keys(ASG.tg).filter(function(k){ return ASG.tg[k] && k.indexOf('person|') === 0; }).length +
       '</b> 名を個人指定中</span>）</label>' +
       '<div class="bar" style="margin-bottom:9px">' +
         '<input class="inp" id="asgQ" placeholder="名前・職種で絞り込む" value="' + esc(ASG.q) +
         '" style="max-width:260px">' +
         '<button class="btn sub sm" id="asgAll">表示中をすべて選ぶ</button>' +
         '<button class="btn sub sm" id="asgNone">表示中の選択を外す</button>' +
       '</div>';
  if(!shown.length){
    h += '<div class="empty" style="padding:24px">該当する受講者がいません。</div>';
  }else{
    h += '<div class="plist">';
    shown.forEach(function(pp){
      h += '<label class="prow"><input type="checkbox" data-tg="person|' + esc(pp.name) + '"' +
           (ASG.tg['person|' + pp.name] ? ' checked' : '') + '>' +
           ava(pp.name, 'sm') +
           '<span class="who-t"><b>' + esc(pp.name) + '</b><span>' + esc(pp.dept || '—') +
           (pp.group ? '・' + esc(pp.group) : '') + '</span></span></label>';
    });
    h += '</div>';
  }
  h += '</div></div></div>';

  /* ── この人には出さない（除外） ── */
  h += '<div id="asgEx"' + (ASG.mode === 'none' ? ' hidden' : '') +
       ' style="margin-top:6px;border-top:1px solid var(--rule);padding-top:16px">';
  h += '<div class="field"><label>この人には出さない（除外）' +
       '<span class="note-s">配信の指定より優先されます</span></label>';
  h += '<div class="bar" style="margin-bottom:9px">' +
       '<input class="inp" id="asgExQ" placeholder="名前で探して追加" list="asgExList" ' +
       'style="max-width:260px"><datalist id="asgExList">' +
       all.map(function(pp){ return '<option value="' + esc(pp.name) + '">'; }).join('') +
       '</datalist>' +
       '<button class="btn sub sm" id="asgExAdd">' + ic('plus') + '除外に追加</button></div>';
  if(!exNames.length){
    h += '<div class="cap">除外している人はいません。</div>';
  }else{
    h += '<div class="chips">' + exNames.map(function(n){
      return '<span class="chip-x">' + esc(n) +

    }).join('') + '</div>';
  }
  h += '</div></div>';
  h += '</div>';

  h += '<div class="bar" style="margin-top:16px;border-top:1px solid var(--rule);padding-top:16px">' +
       '<button class="btn" id="asgSave">' + ic('check') + 'この内容で配信する</button>' +

       '<span class="sp"></span>' +
       '<span class="cnt">この内容だと <b id="asgN2">' + countNow() + '</b> 名に届きます</span></div>';
  h += '</div>';
  document.getElementById('main').innerHTML = h;

  function refreshCount(){
    var n = countNow();
    var e2 = document.getElementById('asgN2'); if(e2) e2.textContent = n;

  function redraw(focusId){

      if(nx){ nx.focus(); if(nx.setSelectionRange) nx.setSelectionRange(nx.value.length, nx.value.length); }
    }
  }

  /* 配信のしかた */
  Array.prototype.forEach.call(document.querySelectorAll('#asgMode button'), function(b){
    b.onclick = function(){
      ASG.mode = b.getAttribute('data-m');
      redraw();
    };
  });
  /* チェックは下書きに書く（画面を描き直しても消えない） */
  eachIn('[data-tg]', function(b){
    b.onchange = function(){
      ASG.tg[b.getAttribute('data-tg')] = b.checked;
      if(!b.checked) delete ASG.tg[b.getAttribute('data-tg')];
      refreshCount();
    };
  });
  var q = document.getElementById('asgQ');
  if(q) q.oninput = function(){
    ASG.q = this.value;
    clearTimeout(q._t);
    q._t = setTimeout(function(){ redraw('asgQ'); }, 250);
  };
  var sa = document.getElementById('asgAll');
  if(sa) sa.onclick = function(){
    Array.prototype.forEach.call(document.querySelectorAll('.plist [data-tg]'), function(b){
      b.checked = true; ASG.tg[b.getAttribute('data-tg')] = true;
    });
    refreshCount();
  };
  var sn = document.getElementById('asgNone');
  if(sn) sn.onclick = function(){
    Array.prototype.forEach.call(document.querySelectorAll('.plist [data-tg]'), function(b){
      b.checked = false; delete ASG.tg[b.getAttribute('data-tg')];
    });
    refreshCount();
  };
  /* 除外 */
  var exq = document.getElementById('asgExQ'), exa = document.getElementById('asgExAdd');
  function addEx(){
    var v = normName(exq.value);
    if(!v){ toast('名前を入れてください'); return; }
    if(!all.some(function(pp){ return pp.name === v; })){
      toast('「' + v + '」は名簿にありません'); return;
    }
    ASG.ex['person|' + v] = true;
    exq.value = '';
    redraw();
  }
  if(exa) exa.onclick = addEx;
  if(exq) exq.onkeydown = function(e){ if(e.key === 'Enter'){ e.preventDefault(); addEx(); } };
  eachIn('[data-exdel]', function(b){
    b.onclick = function(){ delete ASG.ex['person|' + b.getAttribute('data-exdel')]; redraw(); };
  });

  eachIn('[data-back]', function(b){
    b.onclick = function(){ ASG.cid = ''; route('acourses'); };
  });
  document.getElementById('asgSave').onclick = function(){
    var rules = asgRules();
    var cs2 = JSON.parse(JSON.stringify(courses()));
    cs2.forEach(function(c){ if(c.id === co.id) c.assign = { rules:rules }; });
    setCourses(cs2);
    var n = assignedPeople(cs2.filter(function(c){ return c.id === co.id; })[0]).length;
    toast('配信しました（対象 ' + n + '名）');
    ASG.cid = '';
    route('acourses');
  };
}

       '<select class="inp" id="nwG"><option value="">全員</option>' +
       o.groups.map(function(g){ return '<option>' + esc(g) + '</option>'; }).join('') +
       o.depts.map(function(d){ return '<option>' + esc(d) + '</option>'; }).join('') +
       '</select></div>';
  h += '<div class="bar" style="align-items:flex-end"><button class="btn" id="nwGo">' +
       ic('mail') + '配信する</button></div></div>';
  h += '</div>';

  h += '<div class="cat">' + ic('history') + '配信済みのお知らせ' +
       '<span class="num">' + list.length + '件</span></div>';

    h += '<div class="card"><div class="empty">' + ic('mail') + 'まだお知らせはありません。</div></div>';

         '<th>本文</th><th>配信先</th><th class="n">配信日時</th><th></th></tr></thead><tbody>';

/* 入力欄から読み取って、確かめる。だめなら why を返す */
function personRead(pre, exceptName){
  var g = function(id){ var e = document.getElementById(pre + id); return e ? e.value : ''; };
  var n = normName(g('n'));
  var m = String(g('m')).trim();
  var d = g('d');
  if(!n) return { why:'氏名を入れてください', focus:pre + 'n' };
  if(badName(n)) return { why:'氏名に使えない文字（｜・改行）が入っています', focus:pre + 'n' };
  if(!d) return { why:'職種を選んでください', focus:pre + 'd' };
  if(m && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m)){
    return { why:'メールアドレスの形が正しくありません', focus:pre + 'm' };
  }
  if(m){
    var dup = personByEmail(m);
    if(dup && normName(dup.name) !== normName(exceptName || '') && normName(dup.name) !== n){
      return { why:'そのメールアドレスは「' + dup.name + '」さんに登録されています',
               focus:pre + 'm' };
    }
  }
  var r = document.getElementById(pre + 'r');
  var mg = String(g('mg') || '').trim();
  if(mg && mg === n) return { why:'自分自身を上長にはできません', focus:pre + 'mg' };
  var lv = String(g('l') || '').trim();
  var act = document.getElementById(pre + 'a');
  return { name:n, email:m, dept:d, role:r ? r.value : '',
           title:String(g('t') || '').trim(), manager:mg,
           emp:String(g('e') || '').trim(), kana:String(g('k') || '').trim(),
           joined:String(g('j') || '').trim(), leave:(lv === '' ? '' : Number(lv)),
           group:String(g('g') || ''), active:act ? !!act.checked : true };
}
/* 読み取った内容を、名簿に入れる形にする */
function personFields(v){
  return { email:v.email, dept:v.dept, role:v.role || undefined,
           title:v.title, manager:v.manager, emp:v.emp, kana:v.kana,
           joined:v.joined, leave:v.leave, group:v.group, active:v.active };
}

function viewAImport(){

  var names = Object.keys(ps).sort(function(a, b){
    return String(ps[a].dept || '').localeCompare(String(ps[b].dept || ''), 'ja') ||
           a.localeCompare(b, 'ja');
  });
  var kw = ROS.q.trim();
  var shown = kw ? names.filter(function(n){
    var p = ps[n];
    return n.indexOf(kw) >= 0 || String(p.dept || '').indexOf(kw) >= 0 ||
           String(p.email || '').toLowerCase().indexOf(kw.toLowerCase()) >= 0;
  }) : names;

  var h = '<div class="wrap" style="max-width:900px">';
  h += staffHead('aimport');
  h += '<div class="cap" style="margin:-8px 0 14px">1人ずつ足すことも、Excelから貼り付けてまとめて入れることもできます。' +
       '登録済みの方は、下の一覧から直せます。</div>';

  h += '<div class="cat">' + ic('user') + '1人ずつ登録する</div>';
  h += '<div class="card pad" style="margin-bottom:22px;display:grid;gap:13px">';
  h += personForm('p1', null);
  h += '<div class="bar"><button class="btn" id="p1Go">' + ic('plus') + 'この内容で登録する</button>' +
       '<span class="cap">メールアドレスを入れておくと、その方はログインするだけで' +
       '受講を始められます</span></div>';
  h += '</div>';

  h += '<div class="cat">' + ic('users') + '登録されている方' +
       '<span class="num">' + names.length + '名</span></div>';
  if(!names.length){
    h += '<div class="card" style="margin-bottom:22px"><div class="empty">' + ic('users') +
         'まだどなたも登録されていません。</div></div>';
  }else{
    h += '<div class="bar" style="margin-bottom:12px">' +
         '<input class="inp" id="rosQ" placeholder="氏名・職種・メールアドレスで絞り込む" value="' +
         esc(ROS.q) + '" style="max-width:300px">' +
         '<span class="sp"></span>' +
         '<span class="cnt">' + shown.length + ' / ' + names.length + '名</span></div>';
    h += '<div class="tbl-wrap" style="margin-bottom:22px"><table><thead><tr>' +
         '<th class="stick">氏名</th><th>職種</th><th>メールアドレス</th>' +
         '<th class="c">権限</th><th class="c" style="min-width:132px"></th>' +
         '</tr></thead><tbody>';
    shown.forEach(function(n){
      var p = ps[n];
      if(ROS.edit === n){
        h += '<tr><td colspan="5" style="padding:0">' +
             '<div class="card pad" style="margin:0;display:grid;gap:13px;border:none">' +
             '<b>' + esc(n) + ' さんの登録内容</b>' +
             personForm('pe', p) +
             '<div class="note" style="margin:0"><b>氏名を直すと、その方の受講記録も一緒に付け替えます。</b>' +
             '別の方の氏名にはできません。</div>' +
             '<div class="bar"><button class="btn" id="peGo">' + ic('check') + '保存する</button>' +
             '<button class="btn sub" id="peNo">やめる</button>' +
             '<span class="sp"></span>' +
             '<button class="btn sub" id="peDel">' + ic('cross') + '名簿から削除</button></div>' +
             '</div></td></tr>';
        return;
      }
      h += '<tr><td class="stick"><div class="who-cell" title="' + esc(n) + '">' +
           ava(n, 'sm') + '<div class="who-t"><b>' + esc(n) + '</b></div></div></td>';
      h += '<td class="nw">' + esc(p.dept || '—') + '</td>';
      h += '<td class="mono" style="font-size:11.5px">' +
           (p.email ? esc(p.email)
                    : '<span class="pill bad">未登録</span>') + '</td>';
      h += '<td class="c">' + roleBadge(roleOf(p)) + '</td>';
      h += '<td class="c"><button class="btn sub sm" data-ed="' + esc(n) + '">' +
           ic('slider') + '編集</button></td></tr>';
    });
    h += '</tbody></table></div>';
  }

  /* ── まとめて ── */
  h += '<div class="cat">' + ic('users') + 'まとめて登録する（Excelから貼り付け）</div>';
  h += '<div class="note calm" style="margin-bottom:16px"><b>貼り付ける形</b>　' +
       '<span class="mono">氏名 [タブ] 職種 [タブ] メールアドレス</span><br>' +
       'すでに登録されている人は、内容が上書きされます。' +
       '一覧に無い職種は、そのまま新しい職種として足されます。<br>' +
       '<b>メールアドレス</b>が無い方は、ポータルからログインできません。<br>' +
       '<b>同姓同名の方</b>は、氏名を「佐藤 花子（1234）」のように区別してください。' +
       '同じ氏名は1人として扱われ、受講記録が混ざります。</div>';
  h += '<div class="card pad" style="display:grid;gap:12px">';
  h += '<div class="field"><label for="imT">名簿</label>' +
       '<textarea class="inp mono" id="imT" rows="8" style="resize:vertical;font-size:12px" ' +

       '\n佐藤 花子\t看護職\tsato@example.co.jp"></textarea></div>';
  h += '<div class="bar"><button class="btn sub" id="imChk">内容を確認する</button>' +

  };
  function p1Save(){
    var v = personRead('p1');
    if(v.why){ var f = document.getElementById(v.focus); if(f) f.focus();
               toast(v.why); return; }
    var already = !!people()[v.name];
    var o1 = personFields(v); o1.name = v.name;
    registerPerson(o1);
    LOADED.all = false;
    toast(v.name + ' さんを' + (already ? '上書きしました' : '登録しました') +
          (v.email ? '' : '（メールアドレスが無いのでログインできません）'));
    ROS.edit = '';
    viewAImport();
  }

  /* 絞り込み */
  var q = document.getElementById('rosQ');

    }, 250);
  };

  eachIn('[data-ed]', function(b){

  });
