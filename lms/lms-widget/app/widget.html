  if(peNo) peNo.onclick = function(){ ROS.edit = ''; viewAImport(); };

  var peGo = document.getElementById('peGo');
  if(peGo) peGo.onclick = function(){
    var was = ROS.edit;
    var v = personRead('pe', was);
    if(v.why){ var f = document.getElementById(v.focus); if(f) f.focus();
               toast(v.why); return; }
    /* 先に中身を直してから、最後に氏名を付け替える */
    var o2 = personFields(v); o2.name = was;
    registerPerson(o2);
    if(v.name !== normName(was)){
      var r = renamePerson(was, v.name);
      if(!r.ok){ toast(r.why); return; }
      toast(was + ' さんを「' + v.name + '」さんに直しました' +
            (r.moved ? '（受講記録 ' + r.moved + ' 件も付け替えました）' : ''));
    }else{
      toast(v.name + ' さんの登録内容を直しました');
    }
    LOADED.all = false;
    ROS.edit = '';
    viewAImport();
  };

  var peDel = document.getElementById('peDel');
  if(peDel) peDel.onclick = function(){
    var n = ROS.edit;
    if(!window.confirm('「' + n + '」さんを名簿から削除しますか？\n\n' +
      '・その方はログインできなくなります\n' +
      '・これまでの受講記録は残ります（集計には出ます）\n' +
      '・受講状況の一覧からは消えません（記録があるため）')) return;
    if(removePerson(n)) toast(n + ' さんを名簿から削除しました');
    LOADED.all = false;
    ROS.edit = '';
    viewAImport();
  };

  /* まとめて登録 */
  var parsed = [];
  function parse(){
    var txt = document.getElementById('imT').value;
    parsed = [];
    txt.split('\n').forEach(function(line){
      var t = line.trim();
      if(!t) return;
      /* Excelから貼るとタブ区切りになる。
         職種名に半角カンマが入っていると列がずれるので、カンマでは割らない。 */
      var c = t.split(/\t/).map(function(x){ return x.trim(); });
      if(!c[0]) return;
      parsed.push({ name:normName(c[0]), dept:c[1] || '', email:c[2] || '' });
    });
    return parsed;
  }
  document.getElementById('imChk').onclick = function(){
    var rows = parse();
    var box = document.getElementById('imPre');
    if(!rows.length){
      box.innerHTML = '<div class="note"><b>読み取れる行がありません</b>　貼り付けた内容をご確認ください。</div>';
      document.getElementById('imGo').disabled = true;
      return;
    }
    var known = people();
    var neu = rows.filter(function(r){ return !known[r.name]; }).length;
    var seen = {}, dup = [];
    rows.forEach(function(r){
      if(seen[r.name] && dup.indexOf(r.name) < 0) dup.push(r.name);
      seen[r.name] = true;
    });
    var bad = rows.filter(function(r){ return badName(r.name); });
    var hh = '<div class="note calm"><b>' + rows.length + '人ぶん読み取りました</b>　' +
             '新規 ' + neu + '人 / 上書き ' + (rows.length - neu) + '人</div>';
    if(dup.length){
      hh += '<div class="note"><b>同じ氏名が' + dup.length + '件あります</b>　' +
            esc(dup.slice(0, 5).join('、')) + (dup.length > 5 ? ' ほか' : '') +
            '。このままだと1人として登録され、受講記録が混ざります。' +
            '「佐藤 花子（1234）」のように区別してください。</div>';
    }
    var noMail = rows.filter(function(r){ return !String(r.email || '').trim(); });
    if(noMail.length){
      hh += '<div class="note"><b>' + noMail.length + '名にメールアドレスがありません</b>　' +
            'この方々はポータルからログインできません。' +
            '3列目にメールアドレスを入れてから登録してください。</div>';
    }
    if(bad.length){
      hh += '<div class="note"><b>使えない文字が入っています</b>　' +
            esc(bad.slice(0, 3).map(function(r){ return r.name; }).join('、')) +
            '。氏名に ｜ や改行は使えません。</div>';
    }
    /* 一覧に無い職種は、あとで足すことになる */
    var known2 = jobs(), neuJob = [];
    rows.forEach(function(r){
      if(r.dept && known2.indexOf(r.dept) < 0 && neuJob.indexOf(r.dept) < 0) neuJob.push(r.dept);
    });
    if(neuJob.length){
      hh += '<div class="note calm"><b>新しい職種が' + neuJob.length + '件あります</b>　' +
            esc(neuJob.join('、')) + '　登録すると、職種の一覧にも足されます。</div>';
    }
    hh += '<div class="tbl-wrap"><table><thead><tr><th>氏名</th><th>職種</th>' +
          '<th>メールアドレス</th><th class="c">権限</th><th class="c">区分</th>' +
          '</tr></thead><tbody>';
    rows.slice(0, 30).forEach(function(r){
      hh += '<tr><td><b>' + esc(r.name) + '</b></td><td class="nw">' + esc(r.dept || '—') +
            '</td><td class="mono" style="font-size:11.5px">' + esc(r.email || '—') +
            '</td><td class="c">' + roleBadge(
              (known[r.name] && known[r.name].role) || 'learner') +
            '</td><td class="c">' +
            (known[r.name] ? '<span class="pill mid">上書き</span>'
                           : '<span class="pill ok">新規</span>') + '</td></tr>';
    });
    hh += '</tbody></table></div>';
    if(rows.length > 30) hh += '<div class="cap" style="margin-top:8px">（先頭30人だけ表示しています）</div>';
    box.innerHTML = hh;
    document.getElementById('imGo').disabled = false;
  };
  bindStaffHead();
  document.getElementById('imGo').onclick = function(){
    if(!parsed.length){ toast('先に内容を確認してください'); return; }
    var ng = parsed.filter(function(r){ return badName(r.name); });
    if(ng.length){
      toast('氏名に使えない文字（｜・改行）が入っている行があります。直してからもう一度どうぞ');
      return;
    }
    /* 名簿に出てきた職種のうち、一覧に無いものを足しておく。
       足さないと、あとで1人ずつ直すときに選べなくなる。 */
    var list = jobs().slice(), add = 0;
    parsed.forEach(function(r){
      if(r.dept && list.indexOf(r.dept) < 0){ list.push(r.dept); add++; }
    });
    if(add) setJobs(list);
    parsed.forEach(function(r){ registerPerson(r); });
    toast(parsed.length + '人を登録しました' + (add ? '（職種も' + add + '件足しました）' : ''));
    LOADED.all = false;
    route('ausers');
  };
  bindOpen();
}

/* ══════════════════════════════════════════════════════════════
   画面：職種の管理
   ══════════════════════════════════════════════════════════════ */
var JOB_NEW = '';
function viewAJobs(){
  var list = jobs().slice();
  var h = '<div class="wrap" style="max-width:720px">';
  h += staffHead('ajobs');
  h += '<div class="cap" style="margin:-8px 0 14px">職員を登録するときに選ぶ職種の一覧です。' +
       'ここで足したり、名前を直したり、消したりできます。' +
       '社内申請の「部署」もこれです。</div>';

  h += '<div class="card pad" style="margin-bottom:18px">';
  h += '<div class="bar"><input class="inp" id="jbNew" placeholder="例）介護職" value="' +
       esc(JOB_NEW) + '" style="max-width:280px">' +
       '<button class="btn" id="jbAdd">' + ic('plus') + '職種を足す</button></div>';
  h += '</div>';

  if(!list.length){
    h += '<div class="card"><div class="empty">' + ic('slider') +
         'まだ職種がありません。上の欄から足してください。</div></div>';
  }else{
    h += '<div class="tbl-wrap"><table><thead><tr>' +
         '<th class="stick">職種</th><th class="n">登録されている方</th>' +
         '<th class="c" style="min-width:186px"></th></tr></thead><tbody>';
    list.forEach(function(d, i){
      var n = jobCount(d);
      h += '<tr><td class="stick"><input class="inp" data-jb="' + i + '" value="' +
           esc(d) + '" style="max-width:260px"></td>';
      h += '<td class="n">' + n + '</td>';
      h += '<td class="c"><button class="btn sub sm" data-jbup="' + i + '"' +
           (i === 0 ? ' disabled' : '') + ' aria-label="上へ">↑</button> ' +
           '<button class="btn sub sm" data-jbdn="' + i + '"' +
           (i === list.length - 1 ? ' disabled' : '') + ' aria-label="下へ">↓</button> ' +
           '<button class="btn sub sm" data-jbdel="' + i + '">削除</button></td></tr>';
    });
    h += '</tbody></table></div>';
    h += '<div class="bar" style="margin-top:14px">' +
         '<button class="btn" id="jbSave">' + ic('check') + '名前の変更を保存する</button>' +
         '<span class="cap">名前を直すと、その職種の方と、配信先の指定も一緒に付け替えます</span>' +
         '</div>';
  }
  h += '</div>';
  document.getElementById('main').innerHTML = h;

  bindStaffHead();
  var ni = document.getElementById('jbNew');
  function add(){
    var v = String(ni.value || '').trim();
    if(!v){ ni.focus(); return; }
    if(jobs().indexOf(v) >= 0){ toast('その職種はもうあります'); ni.focus(); return; }
    setJobs(jobs().concat([v]));
    JOB_NEW = '';
    toast('「' + v + '」を足しました');
    viewAJobs();
  }
  document.getElementById('jbAdd').onclick = add;
  ni.addEventListener('keydown', function(e){ if(e.key === 'Enter') add(); });
  ni.oninput = function(){ JOB_NEW = this.value; };

  eachIn('[data-jbup]', function(b){ b.onclick = function(){
    var i = Number(b.getAttribute('data-jbup')), l = jobs().slice();
    var t = l[i-1]; l[i-1] = l[i]; l[i] = t; setJobs(l); viewAJobs();
  }; });
  eachIn('[data-jbdn]', function(b){ b.onclick = function(){
    var i = Number(b.getAttribute('data-jbdn')), l = jobs().slice();
    var t = l[i+1]; l[i+1] = l[i]; l[i] = t; setJobs(l); viewAJobs();
  }; });
  eachIn('[data-jbdel]', function(b){ b.onclick = function(){
    var i = Number(b.getAttribute('data-jbdel')), l = jobs().slice(), d = l[i];
    var n = jobCount(d);
    if(n){
      if(!window.confirm('「' + d + '」には ' + n + '名が登録されています。\n\n' +
        '一覧から消しても、その方々の職種はそのまま残ります。\n' +
        'ただし、新しく登録するときには選べなくなります。\n\n本当に消しますか？')) return;
    }else if(!window.confirm('「' + d + '」を消しますか？')){ return; }
    l.splice(i, 1);
    setJobs(l);
    toast('「' + d + '」を消しました');
    viewAJobs();
  }; });

  var sv = document.getElementById('jbSave');
  if(sv) sv.onclick = function(){
    var l = jobs().slice(), changed = 0, ng = '';
    l.forEach(function(d, i){
      var e = byAttr('data-jb', String(i));
      if(!e) return;
      var v = String(e.value || '').trim();
      if(!v || v === d) return;
      if(!renameJob(d, v)) ng = v;
      else changed++;
    });
    if(ng) toast('「' + ng + '」は、すでにある職種と同じ名前です');
    else if(changed) toast(changed + '件の名前を直しました');
    else toast('変更はありませんでした');
    viewAJobs();
  };
  bindOpen();
}

/* ══════════════════════════════════════════════════════════════
   画面：権限の割り当て（管理）
     誰がどこまで見られるかを決める。システム管理者だけが開ける。

     ※ここで決めるのは「画面の出し分け」です。
       本当にデータを渡さないようにするには、Zoho Creator 側で
       ページの閲覧権限とレポートの権限を設定してください。
   ══════════════════════════════════════════════════════════════ */
var ROLE_Q = '';
function viewARoles(){
  var ppl = allPeople().slice().sort(function(a, b){
    return (b.role === 'admin') - (a.role === 'admin') ||
           String(a.dept).localeCompare(String(b.dept), 'ja') ||
           String(a.name).localeCompare(String(b.name), 'ja');
  });
  var ds = depts().slice();
  ppl.forEach(function(p){ if(p.dept && ds.indexOf(p.dept) < 0) ds.push(p.dept); });

  var kw = ROLE_Q.trim();
  var shown = kw ? ppl.filter(function(p){
    return p.name.indexOf(kw) >= 0 || String(p.dept).indexOf(kw) >= 0;
  }) : ppl;

  var h = '<div class="wrap">';
  h += staffHead('aroles');
  h += '<div class="cap" style="margin:-8px 0 14px">誰がどこまで見られるかを決めます。' +
       '「職員」のタブで一人ずつ直すこともできます。</div>';

  /* 権限の説明 */
  h += '<div class="card pad" style="margin-bottom:16px"><div class="rolelist">';
  ROLES.forEach(function(r){
    h += '<div class="rolerow">' + roleBadge(r.id) +
         '<span>' + esc(r.desc) + '</span>' +
         '<b class="mono">' + ppl.filter(function(p){
           return roleOf(p) === r.id; }).length + '名</b></div>';
  });
  h += '</div></div>';

  h += noMailNote(true);
  h += '<div class="note" style="margin-bottom:16px"><b>ここで決めるのは画面の出し分けです</b>　' +
       '本当にデータを渡さないようにするには、Zoho Creator 側でページの閲覧権限と' +
       'レポートの権限を設定する必要があります。詳しくは導入手順書をご覧ください。</div>';

  h += '<div class="bar" style="margin-bottom:12px">' +
       '<input class="inp" id="roQ" placeholder="名前・職種で絞り込む" value="' +
       esc(ROLE_Q) + '" style="max-width:280px">' +
       '<span class="sp"></span>' +
       '<span class="cnt">' + shown.length + ' / ' + ppl.length + '名</span>' +
       '<button class="btn" id="roSave">' + ic('check') + '権限を保存する</button></div>';

  if(!shown.length){
    h += '<div class="card"><div class="empty">' + ic('users') +
         '該当する方がいません。</div></div>';
  }else{
    h += '<div class="tbl-wrap"><table><thead><tr>' +
         '<th class="stick">氏名</th><th>職種</th>' +
         '<th style="min-width:170px">権限</th>' +
         '<th>見られる範囲</th>' +
         '</tr></thead><tbody>';
    shown.forEach(function(p){
      var r = roleOf(p);
      h += '<tr><td class="stick"><div class="who-cell" title="' + esc(p.name) + '">' +
           ava(p.name, 'sm') + '<div class="who-t"><b>' + esc(p.name) + '</b>' +
           '<span>' + esc(p.email || 'メールアドレス未登録') + '</span></div></div></td>';
      h += '<td class="nw">' + esc(p.dept || '—') + '</td>';
      h += '<td><select class="inp" data-role="' + esc(p.name) + '">' +
             ROLES.map(function(x){
               return '<option value="' + x.id + '"' + (r === x.id ? ' selected' : '') +
                      '>' + esc(x.label) + '</option>';
             }).join('') + '</select></td>';
      h += '<td><span class="cap" data-scope-all="' + esc(p.name) + '">' +
             (r === 'admin' ? '全員ぶん' : '自分の分だけ') + '</span></td>';
      h += '</tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '</div>';
  document.getElementById('main').innerHTML = h;

  bindStaffHead();
  var q = document.getElementById('roQ');
  q.oninput = function(){
    ROLE_Q = this.value;
    clearTimeout(q._t);
    q._t = setTimeout(function(){
      viewARoles();
      var nx = document.getElementById('roQ');
      if(nx){ nx.focus(); nx.setSelectionRange(nx.value.length, nx.value.length); }
    }, 250);
  };
  /* 権限を変えたら、範囲の表示もその場で合わせる */
  eachIn('[data-role]', function(sel){
    sel.onchange = function(){
      var lab = byAttr('data-scope-all', sel.getAttribute('data-role'));
      if(lab) lab.textContent = (sel.value === 'admin') ? '全員ぶん' : '自分の分だけ';
    };
  });
  document.getElementById('roSave').onclick = function(){
    var n = 0;
    eachIn('[data-role]', function(sel){
      var nm = sel.getAttribute('data-role');
      var p = people()[nm] || {};
      if(roleOf(p) === sel.value) return;
      registerPerson({ name:nm, role:sel.value, scope:'' });
      n++;
    });
    refreshRole();
    toast(n ? (n + '名の権限を保存しました') : '変更はありませんでした');
    LOADED.all = false;
    viewARoles();
  };
}

/* ══════════════════════════════════════════════════════════════
   画面：アンケート結果（管理）
   ══════════════════════════════════════════════════════════════ */
function viewASurvey(){
  var cs = courses(), all = adminMatrix();
  var keep = {};
  admFilter(all).forEach(function(r){ keep[r.name] = true; });

  var rows = [];
  Object.keys(surveys()).forEach(function(k){
    var nm = k.split('|')[0];
    var sq = k.slice(nm.length + 1).split('|');
    var sTm = /^\d{4}$/.test(sq[sq.length - 1]) ? sq[sq.length - 1] : '';
    var cid = (sTm ? sq.slice(0, -1) : sq).join('|');
    if(!keep[nm]) return;
    if(sTm && sTm !== actTerm()) return;
    var co = cs.filter(function(c){ return c.id === cid; })[0];
    if(!co) return;
    var pr = (allPeople().filter(function(x){ return x.name === nm; })[0]) || {};
    if(!isAssigned(pr, co)) return;        /* 配信を外したコースの回答は集計に入れない */
    var sv = surveys()[k];
    rows.push({ name:nm, dept:pr.dept || '', co:co, sv:sv });
  });
  rows.sort(function(a, b){ return String(b.sv.at) < String(a.sv.at) ? -1 : 1; });

  var n = rows.length;
  var avg = n ? rows.reduce(function(a, r){ return a + (r.sv.score || 0); }, 0) / n : 0;
  var useful = rows.filter(function(r){ return /役立つ/.test(r.sv.useful || '') &&
                                               !/あまり/.test(r.sv.useful || ''); }).length;
  var comments = rows.filter(function(r){ return (r.sv.comment || '').length; });

  var h = '<div class="wrap">';
  h += '<div class="ph"><div><h2>アンケート結果</h2>' +
       '<div class="sub">受講後アンケートの集計です。研修の見直しにお使いください。</div></div></div>';
  h += toolsHTML(all, { course:false });
  h += '<div class="kpis">';
  h += '<div class="kpi"><span class="k">' + ic('quiz') + '回答数</span>' +
       '<span class="v">' + n + '<small>件</small></span></div>';
  h += '<div class="kpi t-ok"><span class="k">' + ic('medal') + '分かりやすさ（5点満点）</span>' +
       '<span class="v">' + (n ? avg.toFixed(1) : '—') + '</span></div>';
  h += '<div class="kpi t-mid"><span class="k">' + ic('check') + '役立つ</span>' +
       '<span class="v">' + (n ? Math.round(useful/n*100) : 0) + '<small>%</small></span></div>';
  h += '<div class="kpi t-no"><span class="k">' + ic('mail') + '自由記述</span>' +
       '<span class="v">' + comments.length + '<small>件</small></span></div>';
  h += '</div>';

  /* コースごとの平均 */
  h += '<div class="cat">' + ic('chart') + 'コースごとの評価</div>';
  h += '<div class="card pad" style="margin-bottom:16px"><div class="bars">';
  cs.forEach(function(co){
    var rs = rows.filter(function(r){ return r.co.id === co.id; });
    var a = rs.length ? rs.reduce(function(x, r){ return x + (r.sv.score || 0); }, 0) / rs.length : 0;
    if(!rs.length && assignedPeople(co).length === 0) return;   /* 誰にも配信していないコースは出さない */
    h += '<div class="brow"><span class="nm" title="' + esc(co.title) + '">' + esc(co.title) + '</span>' +
         '<span class="tr"><i class="d" style="width:' + (a/5*100) + '%"></i></span>' +
         '<span class="rt">' + (rs.length ? a.toFixed(1) + '　(' + rs.length + '件)' : '回答なし') +
         '</span></div>';
  });
  h += '</div></div>';

  h += '<div class="cat">' + ic('mail') + '回答の一覧</div>';
  if(!n){
    h += '<div class="card"><div class="empty">' + ic('quiz') + 'まだ回答がありません。</div></div>';
  }else{
    h += '<div class="tbl-wrap"><table><thead><tr><th class="stick">ユーザー名</th>' +
         '<th>コース</th><th class="c">分かりやすさ</th><th class="c">役立つか</th>' +
         '<th>ご意見・ご要望</th><th class="n">回答日</th></tr></thead><tbody>';
    rows.slice(0, ADM.per).forEach(function(r){
      h += '<tr><td class="stick"><div class="who-cell" title="' + esc(r.name) + '">' + ava(r.name, 'sm') +
           '<div class="who-t"><b>' + esc(r.name) + '</b><span>' + esc(r.dept || '—') +
           '</span></div></div></td>';
      h += '<td class="nw">' + esc(r.co.title) + '</td>';
      h += '<td class="c"><span class="stars">' + stars(r.sv.score) + '</span></td>';
      h += '<td class="c">' + (r.sv.useful ? esc(r.sv.useful) : '—') + '</td>';
      h += '<td style="max-width:360px">' + (r.sv.comment ? esc(r.sv.comment) :
             '<span style="color:var(--ink-3)">—</span>') + '</td>';
      h += '<td class="n">' + ymd(r.sv.at) + '</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '</div>';
  document.getElementById('main').innerHTML = h;
  bindTools(viewASurvey);
}
function stars(n){
  n = Number(n) || 0;
  var out = '';
  for(var i = 1; i <= 5; i++) out += (i <= n ? '★' : '☆');
  return out + ' <span class="mono">' + n + '</span>';
}

  /* ── 見た目の保存 ──
       Creator の複数行テキスト欄は約64KBまで。データURIはもとの画像の約1.37倍になるので、
       そのまま入れると保存に失敗する。ここで自動的に縮小・圧縮してから保存する。 */
  function shrinkImage(file, maxW, budget, keepPng, done){
    var fr = new FileReader();
    fr.onerror = function(){ toast('画像を読み込めませんでした'); };
    fr.onload = function(){
      var img = new Image();
      img.onerror = function(){ toast('画像の形式を読み取れませんでした'); };
      img.onload = function(){
        var w = img.width, h = img.height;
        var scale = Math.min(1, maxW / w);
        var cv = document.createElement('canvas');
        var out = '';
        /* 収まるまで、大きさと画質を少しずつ落としていく */
        for(var step = 0; step < 8; step++){
          cv.width  = Math.max(16, Math.round(w * scale));
          cv.height = Math.max(16, Math.round(h * scale));
          var cx = cv.getContext('2d');
          if(!keepPng){ cx.fillStyle = '#ffffff'; cx.fillRect(0, 0, cv.width, cv.height); }
          cx.drawImage(img, 0, 0, cv.width, cv.height);
          if(keepPng){
            out = cv.toDataURL('image/png');
            if(out.length <= budget) break;
            scale *= 0.8;
          }else{
            var q = 0.82;
            for(var i = 0; i < 6; i++){
              out = cv.toDataURL('image/jpeg', q);
              if(out.length <= budget) break;
              q -= 0.12;
            }
            if(out.length <= budget) break;
            scale *= 0.8;
          }
        }
        done(out, cv.width, cv.height, out.length <= budget);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  }
  function readImage(input, key, maxW, budget, keepPng){
    var f = input.files && input.files[0];
    if(!f) return;

      if(!ok){
        toast('この画像は小さくしても収まりませんでした。' +
              'zipの app/ に bg.jpg として入れる方法をお使いください');
        return;
      }
      var c = config();
      c[key] = uri;
      setConfig(c);
      toast('登録しました（' + w + '×' + h + '・' + Math.round(uri.length/1024) + 'KB）');
      viewASettings();
    });
  }

/* ══════════════════════════════════════════════════════════════
   CSV出力
     Excelで開いたときに文字化けしないよう BOM を付ける。
     受講者を選んでいる場合は、その人たちだけを書き出す。
   ══════════════════════════════════════════════════════════════ */
function csvCell(v){
  var s = String(v == null ? '' : v);
  /* Excel は = + - @ タブ で始まるセルを数式として実行する。
     氏名や社員番号は受講者が自由に打てるので、先頭に ' を足して無効にする。 */
  if(/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function exportCsv(){
  var cs = courses(), recs = records();
  /* 画面のしぼりこみをそのまま反映する（全社員が出てしまうのを防ぐ）。
     受講者を選んでいる場合は、その中からさらに絞る。 */
  var ppl = admFilter(adminMatrix());
  var names = Object.keys(SEL);
  if(names.length) ppl = ppl.filter(function(p){ return SEL[p.name]; });

  var head = ['受講者','職種','グループ','社員番号','コース','必須','期限','チャプター',
              '動画の長さ(分)','視聴した分数','視聴率(%)','コース進捗(%)',
              'テスト得点','テスト満点','テスト判定','コース判定','倍速の検知','最終視聴日時'];
  var lines = [head.map(csvCell).join(',')];

  ppl.forEach(function(pn){
    cs.forEach(function(co){
      if(!isAssigned(pn, co)) return;      /* 配信されていないコースは書き出さない */
      var p  = courseProgress(pn.name, co);
      var qz = p.quiz;
      co.chapters.forEach(function(ch){
        var cp = chapProgress(pn.name, ch);
        var r  = recs[recKey(pn.name, ch.id)];
        lines.push([
          pn.name, pn.dept, pn.group || '', pn.emp || '', co.title,
          co.required ? '必須' : '任意', co.deadline || '', ch.title,
          Math.round(ch.dur/60), Math.round(cp.sec/60),
          Math.round(cp.rate*100), Math.round(p.rate*100),
          qz ? qz.score : '', qz ? qz.total : '',
          qz ? (qz.passed ? '合格' : '不合格') : '未受験',
          p.done ? '修了' : '未修了',
          r && r.fast ? 'あり' : '',
          r && r.updated ? r.updated.replace('T',' ').slice(0,16) : ''
        ].map(csvCell).join(','));
      });
    });
  });

  var csv = '﻿' + lines.join('\r\n');
  var blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  var a = document.createElement('a');
  var d = new Date(), z = function(n){ return (n<10?'0':'') + n; };
  a.href = URL.createObjectURL(blob);
  a.download = '受講状況_' + d.getFullYear() + z(d.getMonth()+1) + z(d.getDate()) + '.csv';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 0);
  toast('CSVを書き出しました（' + (lines.length - 1) + '行' +
        (names.length ? '・選択した' + names.length + '名' : '') + '）');
}

/* ══════════════════════════════════════════════════════════════
   管理画面の出しかた
     ・受講者には「管理」への切り替えを見せない
     ・URLに ?admin=1 が付いているか、暗証番号を入れた端末だけ表示する
     ※これは目隠しです。本当の権限管理は Creator 側で行ってください
       （管理者用のページを別に作り、そのページの閲覧権限を絞る）
   ══════════════════════════════════════════════════════════════ */
/* 暗証番号を通ったかどうかは、この画面を開いているあいだだけ覚える。
   端末に残すと、次にその端末を使った受講者まで管理者あつかいになり、
   受講者の画面から管理側へ入れてしまっていた。
   （以前の版が残した覚え書きは、ここで消す） */
var ADMIN = false;
try{ localStorage.removeItem('lms_admin'); }catch(e){}

/* 暗証番号は、そのままではなく変換した値を保存する。
   ※これは「肩越しに覗かれない」程度のもので、暗号としては弱いです。
     本当の守りは Creator 側のページ権限で行ってください。 */
function passHash(v){
  var s = 'lms|' + String(v || '').trim(), h1 = 5381, h2 = 52711;
  for(var i = 0; i < s.length; i++){
    var c = s.charCodeAt(i);
    h1 = ((h1 * 33) ^ c) >>> 0;
    h2 = ((h2 * 31) + c) >>> 0;
  }
  return h1.toString(36) + '.' + h2.toString(36) + '.' + s.length;
}
function adminPassSet(){ return !!config().adminHash; }
function checkAdminPass(v){
  return !!config().adminHash && passHash(v) === config().adminHash;
}
function setAdminPass(v){
  var c = config();
  c.adminHash = passHash(v);
  setConfig(c);
}
/* 管理側を開く。
   boot=true は「名簿がまだ無いので、名簿から権限を決められない」場合だけ。
   ふだんは名簿の権限をそのまま使う（部門管理者は部門管理者のまま）。 */

/* いまログインしている人が管理側を開けるか。
   Zoho にログインできている時点で本人確認は済んでいるので、
   名簿でその権限が付いていれば、暗証番号はいらない。 */
function myAdminRank(){
  if(!LOGIN_EMAIL) return 0;
  var p = personByEmail(LOGIN_EMAIL);
  return p ? roleInfo(roleOf(p)).rank : 0;

/* 名簿に管理できる人が一人もいない状態。
   ふつうは「まだ誰も登録していない＝これから作る人（このアプリの持ち主）」。
   受講者だけを先に取り込んでしまった場合も、ここで詰まらないようにする。 */
function noAdminYet(){
  if(config().adminClaimed) return false;   /* もう誰かが名乗り出ている */
  var ps = people() || {}, none = true;
  Object.keys(ps).forEach(function(n){
    if(roleInfo(roleOf(ps[n])).rank >= 2) none = false;
  });
  return none;
}

  aquiz:    ['管理ダッシュボード|adash', '学習進捗管理', 'テスト'],
  asurvey:  ['管理ダッシュボード|adash', '学習進捗管理', 'アンケート'],
  anews:    ['管理ダッシュボード|adash', 'お知らせ配信'],
  hub:      ['アプリを選ぶ'],
  feed:     ['アプリを選ぶ|hub', '船井コネクト', '掲示板'],
  thanks:   ['アプリを選ぶ|hub', '船井コネクト', 'サンクスカード'],
  members:  ['アプリを選ぶ|hub', '船井コネクト', 'メンバー'],
  profile:  ['マイダッシュボード|home', 'マイページ', 'プロフィール'],
  aimport:  ['アプリを選ぶ|hub', '職員登録', '職員'],
  ajobs:    ['アプリを選ぶ|hub', '職員登録', '職種'],
  aroles:   ['アプリを選ぶ|hub', '職員登録', '権限'],
  acedit:   ['管理ダッシュボード|adash', 'コース管理|acourses', 'コースの編集'],
  aassign:  ['管理ダッシュボード|adash', 'コース管理|acourses', '配信設定'],
  asettings:['管理ダッシュボード|adash', '設定']
};
function crumbFor(view, arg){
  var spec = CRUMB[view];
  if(spec){
    return spec.map(function(s){
      var p = s.split('|');
      return p[1] ? { t:p[0], go:p[1] } : { t:p[0] };
    });
  }
  if(view === 'learn' || view === 'quiz' || view === 'cert' || view === 'survey'){
    var co = courses().filter(function(c){ return c.id === arg; })[0];
    var base = [{ t:'マイダッシュボード', go:'home' }, { t:'研修コース', go:'courses' }];
    if(view === 'learn'){
      base.push({ t:co ? co.title : '受講' });
    }else{
      base.push({ t:co ? co.title : '受講', go:'learn', id:arg });
      base.push({ t:view === 'quiz' ? '確認テスト' : (view === 'cert' ? '修了証' : 'アンケート') });
    }
    return base;
  }
  if(view === 'audetail'){
    return [{ t:'管理ダッシュボード', go:'adash' }, { t:'ユーザー管理' },
            { t:'ユーザー', go:'ausers' }, { t:String(arg || '') }];
  }
  if(String(view).indexOf('s_') === 0){
    return [{ t:'アプリを選ぶ', go:'hub' }, { t:'社内申請' }, { t:shinseiLabel(view) }];
  }
  return [{ t:'ホーム' }];
}

var USER_VIEWS = {
  feed:viewFeed, thanks:viewThanks, members:viewMembers, profile:viewProfile,
  home:viewHome, courses:viewCourses, history:viewHistory, mytime:viewMyTime,
  certs:viewCerts, mynews:viewMyNews
};

var VIEW_NOW = '';
function route(view, a, b){
  stopPlayer();                     /* 画面を離れる前に必ず保存する */
  /* アプリを選び直すときは、入口（ログイン画面）に戻る */
  if(view === 'hub'){
    feedWatch(false);
    if(typeof App !== 'undefined' && App.setActive) App.setActive(false);
    document.getElementById('shinsei').hidden = true;
    document.getElementById('main').hidden = false;
    viewGate();
    return;
  }
  clearTimeout(P.nextT); P.nextT = 0;
  SEL = {};                         /* 選択は画面をまたいで持ち越さない */
  if(!me()){ viewGate(); return; }
  /* 受講者の画面は必ず今年度を見る（過去の年度に記録を書かないため） */
  if(!ADMIN_VIEWS[view]) VIEW_TERM = '';

  /* 管理側の画面へ行くときは、自動で「管理」に切り替える */
  if(ADMIN_VIEWS[view] && canAdmin()) MODE = 'admin';
  if(USER_VIEWS[view]) MODE = 'user';
  /* 権限で開けない画面は、開かせない
     ※これは画面の出し分け。本当にデータを渡さない設定は Creator 側で行うこと */
  /* いま開いているアプリの画面だけ。別のアプリの画面は、そのアプリの入口からしか入れない */
  if(viewApps(view).indexOf(APP_NOW) < 0){ view = appHome(); a = undefined; b = undefined; }
  if(ADMIN_VIEWS[view] && !canOpen(view)){
    if(MY_ROLE !== 'learner') toast('この画面を開く権限がありません');
    view = (canAdmin() && APP_NOW === 'lms') ? 'adash' : appHome();
    MODE = (canAdmin() && APP_NOW === 'lms') ? 'admin' : 'user';
  }
  var inS = String(view).indexOf('s_') === 0;
  if(inS && !canOpen(view)){
    toast('この画面はシステム管理者だけが開けます');
    view = 's_mine';
  }
  if(inS) MODE = 'user';
  /* 社内申請の入れ物と、それ以外の入れ物を切り替える */
  document.getElementById('shinsei').hidden = !inS;
  document.getElementById('main').hidden = inS;
  if(!inS && typeof App !== 'undefined' && App.setActive) App.setActive(false);

  VIEW_NOW = view;
  /* 掲示板を開いているあいだだけ、新着を見に行く */
  feedWatch(view === 'feed' || view === 'thanks');

  document.getElementById('app').classList.add('on');
  drawNav(view);
  crumb(crumbFor(view, a));

  try{
    if(ADMIN_VIEWS[view])       openAdminView(view, a);
    else if(view === 'learn')   viewLearn(a, b);
    else if(view === 'quiz')    viewQuiz(a);
    else if(view === 'cert')    viewCert(a, b);
    else if(view === 'survey')  viewSurvey(a);
    else if(inS)                viewShinsei(view.slice(2));
    else if(USER_VIEWS[view])   USER_VIEWS[view]();
    else                        viewHome();
  }catch(e){
    /* 途中で落ちると、画面は出ているのにボタンが効かない「無反応」になる。
       それより、何が起きたかを見せるほうがよい */
    console.error('画面の描画に失敗しました', view, e);
    showCrash(view, e);
  }

  window.scrollTo(0, 0);
}

/* 画面のエラーを見せる。研修担当がそのまま開発に伝えられる形にする */
function showCrash(view, e){
  var msg = (e && e.message) ? e.message : String(e);
  var st  = (e && e.stack) ? String(e.stack).split('\n').slice(0, 4).join('\n') : '';
  var m = document.getElementById('main');
  if(!m) return;
  m.hidden = false;
  m.innerHTML = '<div class="wrap"><div class="card pad" style="display:grid;gap:12px">' +
    '<b>' + ic('alert') + '画面を表示できませんでした</b>' +
    '<span class="cap">画面：' + esc(view) + '</span>' +
    '<pre class="mono" style="white-space:pre-wrap;font-size:11.5px;background:var(--surface-2);padding:10px;border-radius:8px">' +
    esc(msg + (st ? '\n' + st : '')) + '</pre>' +
    '<div class="bar"><button class="btn sub" id="crBack">' + ic('back') + '最初の画面へ</button>' +
    '<button class="btn sub" id="crCopy">この内容をコピー</button></div></div></div>';
  var b1 = document.getElementById('crBack'); if(b1) b1.onclick = function(){ route(appHome()); };
  var b2 = document.getElementById('crCopy'); if(b2) b2.onclick = function(){ copyText(view + '\n' + msg + '\n' + st); };
}
/* 拾えなかったエラーも、黙らずに知らせる（何も起きないより、失敗が分かるほうがよい） */
window.addEventListener('error', function(ev){
  var m = (ev && ev.message) ? ev.message : '不明なエラー';
  if(/ResizeObserver|Script error\.?$/.test(m)) return;   /* 害のないもの */
  try{ toast('画面でエラーが起きました：' + m.slice(0, 120)); }catch(e){}
});
window.addEventListener('unhandledrejection', function(ev){
  var r = ev && ev.reason;
  var m = (r && (r.message || (typeof errText === 'function' && errText(r)))) || String(r || '不明なエラー');
  console.error('処理が失敗しました', r);
  try{ toast('処理が失敗しました：' + String(m).slice(0, 120)); }catch(e){}
});

/* ══════════════════════════════════════════════════════════════
   起動
   ══════════════════════════════════════════════════════════════ */
document.getElementById('icoBell').onclick = function(){
  if(APP_NOW !== 'lms'){ route(appHome()); return; }
  if(MODE === 'admin') route('aoverall'); else route('home');
};
document.getElementById('icoOut').onclick = leaveDevice;
document.getElementById('icoMail').onclick = function(){
  if(APP_NOW !== 'lms'){ route(appHome()); return; }
  if(MODE === 'admin') route('anews'); else route('mynews');
};
document.getElementById('burger').onclick = openSide;
document.getElementById('scrim').onclick = closeSide;
/* 上の帯の名前を押したら受講者を切り替える */
document.getElementById('topMe').onclick = function(){ stopPlayer(); viewGate(); };

/* 名前を入れた直後。別の端末で受講した分があれば引き継ぐ */
function afterLogin(name, go){
  go = go || 'home';
  if(!ON_CREATOR){ route(go); return; }
  LOADED.person = '';
  showLoading('読み込んでいます…');
  initParams()
    .then(function(){ return loadPerson(name); })
    .then(function(){ route(go); })
    .catch(function(e){
      if(!isNoRows(e)){
        console.warn('受講記録の読み込みに失敗しました', e);
        toast(isBusy(e)
          ? 'いま込み合っています。少し時間をおいてから画面を開き直してください。'
          : '過去の記録を読めませんでした：' + errText(e));
      }
      route(go);
    });
}

/* ログインしているメールアドレスから、名簿の本人を確定する。
   ・名簿に結びついていれば、そのまま入る（氏名の入力は不要）
   ・結びついていなければ、入口で名簿から氏名を選んでもらう
   メールアドレスが取れないとき（ファイルを直接開いた等）は、これまでどおり氏名で入る。 */
function bindLogin(){
  refreshRole();
  if(!LOGIN_EMAIL) return;
  var p = personByEmail(LOGIN_EMAIL);
  if(!p){
    /* まだ結びついていない。入口で選んでもらう */
    try{ localStorage.removeItem(LS.key('me')); }catch(e){}
    return;
  }
  /* 名簿が正。端末に残っている古い職種で上書きしない */
  LS.set('me', { name:p.name, dept:p.dept || '', group:p.group || '',
                 emp:p.emp || '', email:LOGIN_EMAIL });
  refreshRole();
}
function boot(){
  applyTheme();
  refreshRole();       /* 手元に残っている名簿から、いまの人の権限を決める */
  if(!ON_CREATOR){
    migrateTerms();      /* この端末の記録だけ。コース定義は手元のものを使う */
    restorePend();
    /* ファイルを直接開いた場合。ブラウザ内の保存だけで動く */
    viewGate();
    return;
  }
  showLoading('Zoho Creator に接続しています…');
  syncBadge('接続中…', 'wait');
  initParams()
    .then(function(p){
      /* ポータルにログインしている人のメールアドレス。これが本人の決め手 */
      LOGIN_EMAIL = String((p && (p.loginUser || p.loginuser)) || '').trim();
      return loadCourses();
    })
    .then(migrateTerms)   /* コース定義を読んでから移行する（once を年度つきにしない） */
    .then(loadNews)
    .then(loadFeed)
    .then(loadRoster)
    .then(bindLogin)      /* メールアドレスから名簿を引いて、本人を確定する */
    .then(function(){ return me() ? loadPerson(me().name) : null; })
    .then(function(){
      applyTheme();
      /* サーバーの記録を読み終わってから未送信を送る。
         先に送ると、他の端末で見たぶんを手元の記録で上書きしてしまう。 */
      restorePend();
      syncBadge('保存済み');
      viewGate();
    })
    .catch(function(e){
      console.error('接続に失敗しました', e);
      syncBadge('未接続', 'err');
      restorePend();
      toast(isBusy(e)
        ? 'いま込み合っています。この端末に一時保存して続けます。'
        : 'Creatorに接続できませんでした。この端末に一時保存して続けます：' + errText(e));
      if(me()) route('home'); else viewGate();
    });
}
boot();
