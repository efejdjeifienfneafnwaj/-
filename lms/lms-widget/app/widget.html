/* ══════════════════════════════════════════════════════════════
   Creator との同期
   ══════════════════════════════════════════════════════════════ */
function syncBadge(text, state){
  var el = document.getElementById('syncBadge');
  if(!el) return;
  el.textContent = text || '';
  /* state は 'wait'（送信待ち）／'err'（失敗）／未指定（正常） */
  el.className = 'sync' + (state ? ' ' + state : '');
}
/* 検索条件（criteria）の中で二重引用符とバックスラッシュは使えないので落とす */
function crit(v){ return String(v == null ? '' : v).replace(/["\\]/g, ' '); }
/* Creator が返すエラーコード。置き場所がまちまちなので1か所で吸収する */
function errCode(e){
  return Number(e && (e.code || e.status ||
    (e.responseJSON && e.responseJSON.code) || (e.data && e.data.code))) || 0;
}
/* 「1件も無い」は失敗ではない。Creator はこれをいくつものコードで返してくる。
     3100 … データが無い
     9220 … このレポートにはまだ1件もありません
     9280 … 条件に合う行がありません（criteria つきで探したとき）
   しかも置き場所が 本体・responseJSON・responseText・description とまちまちなので、
   コードでも文面でも拾えるようにしておく。 */
var NO_ROW_CODES = [3100, 9220, 9280];
function isNoRows(e){
  if(!e) return false;
  if(NO_ROW_CODES.indexOf(errCode(e)) >= 0) return true;
  var t = '';
  try{
    t = (typeof e === 'string') ? e
      : (e.responseText || e.description || e.message || JSON.stringify(e) || '');
  }catch(x){ t = ''; }
  t = String(t);
  if(new RegExp('"?code"?\\s*:\\s*"?(' + NO_ROW_CODES.join('|') + ')"?').test(t)) return true;
  /* 「No records exist in this report.」「No records found matching the given criteria.」など */
  return /no\s+records?\s+(exist|found|available)/i.test(t) ||
         /レコードが見つかりません|該当するレコードがありません/.test(t);
}
function errText(e){
  if(!e) return '原因不明';
  if(typeof e === 'string') return e;
  if(e.message) return e.message;
  if(e.responseText) return String(e.responseText).slice(0, 120);
  /* 循環参照のあるエラーだと JSON.stringify が投げる（エラー処理の中でエラーになる） */
  try{ return JSON.stringify(e).slice(0, 160); }
  catch(err){ return String(e); }
}

/* ── Creator への呼び出しを、同時に何本まで投げるか ──
   Zoho Creator には「同時に開始できる API 呼び出し数」の上限がある
   （超えると code 2955 が返る）。管理画面はコースの数だけ読みに行くので、
   Promise.all で一斉に投げると、コースが数本あるだけで上限に当たる。
   ここで並べて、決めた本数ずつ順に流す。 */
var API_PARALLEL = 2;
function runLimited(makers, limit){
  limit = limit || API_PARALLEL;
  var i = 0, out = new Array(makers.length), running = 0;
  return new Promise(function(resolve, reject){
    var failed = false;
    function next(){
      if(failed) return;
      if(i >= makers.length && running === 0){ resolve(out); return; }
      while(running < limit && i < makers.length){
        (function(k){
          running++; i++;
          Promise.resolve().then(makers[k]).then(function(v){
            out[k] = v; running--; next();
          }, function(e){
            failed = true; reject(e);
          });
        })(i);
      }
    }
    next();
  });
}
/* 混んでいるときは、少し待ってからやり直す */
function isBusy(e){
  if(!e) return false;
  var c = errCode(e);
  if(c === 2955 || c === 429) return true;
  var t = '';
  try{ t = (typeof e === 'string') ? e
         : (e.responseText || e.description || e.message || JSON.stringify(e) || ''); }
  catch(x){ t = ''; }
  return /"?code"?\s*:\s*"?(2955|429)"?/.test(String(t)) ||
         /simultaneous|too many requests|rate limit/i.test(String(t));
}
function withRetry(make, tries){
  tries = (tries === undefined) ? 4 : tries;
  return Promise.resolve().then(make).catch(function(e){
    if(tries <= 0 || !isBusy(e)) throw e;
    /* 200名が同時に再送して雪崩を起こさないよう、待ち時間をばらけさせる */
    var wait = (5 - tries) * 700 + Math.random() * 600;
    return new Promise(function(r){ setTimeout(r, wait); })
      .then(function(){ return withRetry(make, tries - 1); });
  });
}
/* getInitParams は起動時に1回だけ。毎回呼ぶと呼び出し数を無駄に使う */
var _initParams = null;
function initParams(){
  if(_initParams) return _initParams;
  _initParams = ZOHO.CREATOR.UTIL.getInitParams().catch(function(e){
    _initParams = null; throw e;
  });
  return _initParams;
}

/* レポートから読む。1回の上限（1000件）に当たったかどうかも返す */
var FETCH_MAX = 1000;   /* 1回に取りに行く件数。実際の上限は環境で確かめること */
function rawFetch(report, criteria){
  var q = { report_name:report, max_records:FETCH_MAX, field_config:'all' };
  if(criteria) q.criteria = criteria;
  return withRetry(function(){ return ZOHO.CREATOR.DATA.getRecords(q); }).then(function(res){
    var rows = (res && res.data) || [];
    /* 「1000」を決め打ちにすると、実際の上限が200だったときに
       切り詰めに気づけないまま、間違った集計を表示してしまう */
    if(rows.length >= q.max_records) LOADED.truncated = true;
    return rows;
  });
}
/* ── 画面に出すための読み取り ──
   1件も無い／読めなかった、のどちらでも空で返して画面は描く。
   Creator は「1件も無い」を 3100・9220・9280 …と何通りもの言い方で返してくるので、
   コードを1つずつ足していく作りにしない。読めなかったことは印（LOADED.partial）で残す。 */
function fetchRows(report, criteria){
  return rawFetch(report, criteria).catch(function(e){
    if(isNoRows(e)) return [];
    console.error('取得に失敗しました: ' + report, e);
    LOADED.partial = true;
    LOADED.lastErr = errText(e);
    return [];
  });
}
/* ── 二重登録を防ぐための検索 ──
   こちらは厳しく。読めなかったのに「まだ無い」と誤解すると、
   既にあるレコードの隣に新規を作ってしまい、記録が恒久的に2つに分かれる。 */
function fetchRowsStrict(report, criteria){
  return rawFetch(report, criteria).catch(function(e){
    if(isNoRows(e)) return [];
    console.error('検索に失敗しました: ' + report, e);
    throw e;
  });
}

/* ── 追加または更新（upsert） ──
   RID にレコード番号が無ければ、まず検索条件で探す。
   探さずに追加すると、別の端末から受講した分と二重になる。 */
/* ── Creator の SDK は版によってメソッド名が違う ──
   ・ID を指定した更新は updateRecordById（新しい版）／updateRecord（古い版）
   ・追加の戻り値も {data:{ID}} だったり {result:[{data:{ID}}]} だったり
   どれが使えるかは実際に見るしかないので、あるものを選ぶ。 */
function dataApi(){ return (typeof ZOHO !== 'undefined' && ZOHO.CREATOR && ZOHO.CREATOR.DATA) || {}; }
function apiMethods(){
  var d = dataApi(), out = [];
  for(var k in d){ if(typeof d[k] === 'function') out.push(k); }
  return out.sort();
}
function pickMethod(names){
  var d = dataApi();
  for(var i = 0; i < names.length; i++){
    if(typeof d[names[i]] === 'function') return names[i];
  }
  return '';
}
var UPDATE_BY_ID = '';     /* 実際に使えたメソッド名を覚えておく */
function callUpdateById(reportName, id, payload){
  var d = dataApi();
  var names = UPDATE_BY_ID ? [UPDATE_BY_ID] : ['updateRecordById', 'updateRecord', 'updateRecords'];
  var tried = [];
  function step(i){
    if(i >= names.length){
      return Promise.reject({ message:'レコードを更新するメソッドが見つかりません（試した名前：' +
        tried.join('、') + ' ／ 使えるもの：' + apiMethods().join('、') + '）' });
    }
    var nm = names[i];
    if(typeof d[nm] !== 'function'){ tried.push(nm + '（無し）'); return step(i + 1); }
    return Promise.resolve()
      .then(function(){
        return d[nm]({ report_name:reportName, id:String(id), payload:{ data:payload } });
      })
      .then(function(res){ UPDATE_BY_ID = nm; return res; })
      .catch(function(e){
        /* 「そのメソッドは無い／引数が違う」なら次の名前を試す。
           通信エラーや権限エラーなら、そのまま上へ返す */
        if(UPDATE_BY_ID) throw e;
        var t = errText(e);
        if(/is not a function|undefined|invalid|argument|parameter|required/i.test(t)){
          tried.push(nm + '（' + String(t).slice(0, 40) + '）');
          return step(i + 1);
        }
        throw e;
      });
  }
  return step(0);
}
/* 追加の戻り値から、作られたレコード番号を取り出す */
function newIdOf(res){
  if(!res) return '';
  var cand = [res.data, res.result, res];
  for(var i = 0; i < cand.length; i++){
    var c = cand[i];
    if(!c) continue;
    if(c.ID) return String(c.ID);
    if(c[0]){
      if(c[0].ID) return String(c[0].ID);
      if(c[0].data && c[0].data.ID) return String(c[0].data.ID);
    }
    if(c.data && c.data.ID) return String(c.data.ID);
  }
  return '';
}
function upsert(kind, keyField, keyValue, payload){
  var formName   = FORM[kind];
  var reportName = FORM[kind + 'R'];
  var box = (kind === 'course') ? null : RID[RID_BOX[kind]];
  var ridKey = keyValue;
  payload.updated_at = new Date().toISOString();

  function doUpdate(id){
    return withRetry(function(){ return callUpdateById(reportName, id, payload); });
  }
  function doAdd(){
    return withRetry(function(){
      return ZOHO.CREATOR.DATA.addRecords({
        form_name:formName, payload:{ data:payload }
      });
    }).then(function(res){
      var id = newIdOf(res);
      if(id){
        if(kind === 'course') RID.courses = String(id);
        else box[ridKey] = String(id);
      }
      return res;
    });
  }

  var known = (kind === 'course') ? RID.courses : box[ridKey];
  if(known) return doUpdate(known);

  /* 番号が分からない → 既にあるか確かめてから。
     年度つきのキーで見つからないときは、年度を入れる前の古いキーでも探す
     （古い記録を二重に作らないため）。 */
  function look(kv){
    var criteria = keyField ? '(' + keyField + ' == "' + crit(kv) + '")' : null;
    return fetchRowsStrict(reportName, criteria);
  }
  function useHit(hit){
    if(kind === 'course') RID.courses = String(hit.ID);
    else box[ridKey] = String(hit.ID);
    return doUpdate(hit.ID);
  }
  var legacy = String(keyValue).replace(/\|\d{4}$/, '');
  return look(keyValue).then(function(rows){
    if(rows[0] && rows[0].ID) return useHit(rows[0]);
    if(legacy === keyValue) return doAdd();
    return look(legacy).then(function(r2){
      if(r2[0] && r2[0].ID) return useHit(r2[0]);
      return doAdd();
    });
  });
}

/* ── 送信待ちの行列。まとめてから順番に送る ── */
var SYNC = { pend:{}, timer:null, busy:false, err:0,
             lastErr:'', lastAt:'', lastKind:'', lastKey:'' };
/* 送信待ちの控え。タブを閉じると行列が消えて、最後の視聴が届かなくなるのを防ぐ */
function savePend(){
  if(!LS.set('pend', Object.keys(SYNC.pend))){
    syncBadge('端末の空きが足りません', 'err');
  }
}
function restorePend(){
  (LS.get('pend', []) || []).forEach(function(k){ SYNC.pend[k] = true; });
  if(Object.keys(SYNC.pend).length){
    syncBadge('未送信を送っています…', 'wait');
    setTimeout(flushSync, 800);
  }
}

function queueSync(kind, key){
  if(!ON_CREATOR) return;
  SYNC.pend[kind + '\u0000' + key] = true;
  savePend();        /* タブを閉じても送信待ちが消えないように控えておく */
  syncBadge('保存待ち…', 'wait');
  clearTimeout(SYNC.timer);
  SYNC.timer = setTimeout(flushSync, 1500);
}

function payloadFor(kind, key){
  if(kind === 'course'){
    return { course_json:JSON.stringify(courses()),
             config_json:JSON.stringify(config()) };
  }
  if(kind === 'survey'){
    var sv = MEM.surveys[key];
    if(!sv) return null;
    var nm4 = key.split('|')[0];
    var sr = key.slice(nm4.length + 1).split('|');
    var cid4 = (/^\d{4}$/.test(sr[sr.length - 1]) ? sr.slice(0, -1) : sr).join('|');
    var co4 = courses().filter(function(c){ return c.id === cid4; })[0];
    var pr4 = MEM.people[nm4] || {};
    var sp = key.split('|');

    return { survey_key:key, person_name:nm4, dept:pr4.dept || '', term:sTerm,
             course_id:cid4, course_name:co4 ? co4.title : cid4,
             score:sv.score, useful:sv.useful || '', free_comment:sv.comment || '',
             taken_at:sv.at || '' };
  }
  if(kind === 'news'){
    var nw = MEM.news[key];
    if(!nw) return null;
    return { news_key:key, title:nw.title || '', body:nw.body || '',
             target:nw.group || '', posted_by:nw.by || '', posted_at:nw.at || '',
             deleted:nw.deleted ? 'あり' : '' };
  }
  if(kind === 'post'){
    var po = MEM.posts[key];
    if(!po) return null;
    return { post_key:key, kind:po.kind || 'post',
             author_name:po.by || '', author_email:po.byMail || '',
             to_name:po.to || '', title:po.title || '', body:po.body || '',
             target:po.target || '', posted_at:po.at || '',
             deleted:po.deleted ? 'あり' : '' };
  }
  if(kind === 'react'){
    var rc = MEM.reacts[key];
    if(!rc) return null;
    return { react_key:key, post_key:rc.post || '', kind:rc.kind || 'like',
             person_name:rc.by || '', body:rc.body || '',
             at:rc.at || '', deleted:rc.deleted ? 'あり' : '' };
  }
  if(kind === 'person'){
    var p = MEM.people[key];
    if(!p) return null;
    var pp = { person_key:key, person_name:p.name, email:p.email || '',
               dept:p.dept || '', grp:p.group || '', emp_no:p.emp || '',
               title:p.title || '', role:p.role || '', scope:p.scope || '',
               first_at:p.first || '' };
    /* 社内申請の項目は、入っているときだけ送る */
    var xm = { kana:'kana', manager:'manager_name', joined:'join_date', leave:'leave_balance',
               deputy:'deputy_name', deputyFrom:'deputy_from', deputyTo:'deputy_to',
               photo:'photo', bio:'profile' };
    Object.keys(xm).forEach(function(k){
      if(p[k] !== undefined && p[k] !== null && p[k] !== '') pp[xm[k]] = p[k];
    });
    if(p.active === true)  pp.is_active = 'true';
    if(p.active === false) pp.is_active = 'false';
    return pp;
  }
  if(kind === 'daily'){
    var sec = MEM.daily[key];
    if(sec == null) return null;
    var nm3 = key.split('|')[0], day = key.slice(nm3.length + 1);
    var pr3 = MEM.people[nm3] || {};
    return { day_key:key, person_name:nm3, dept:pr3.dept || '',
             grp:pr3.group || '', study_day:day, watched_sec:sec };
  }
  if(kind === 'record'){
    var rec = MEM.records[key];
    if(!rec) return null;
    var name = key.split('|')[0];
    var rest = key.slice(name.length + 1).split('|');
    var chapId = (/^\d{4}$/.test(rest[rest.length - 1]) ? rest.slice(0, -1) : rest).join('|');
    var found = null;
    courses().forEach(function(co){
      co.chapters.forEach(function(ch){ if(ch.id === chapId) found = { co:co, ch:ch }; });
    });
    if(!found) return null;
    var tr = trackerUnpack(rec), sec = watchedSeconds(tr);
    var pr = MEM.people[name] || {};
    var kp = key.split('|');
    var recTerm = (kp.length >= 3 && /^\d{4}$/.test(kp[kp.length - 1])) ? kp[kp.length - 1] : '';
    return { rec_key:key, person_name:name, dept:pr.dept || '', term:recTerm,
             course_id:found.co.id, course_name:found.co.title,
             chapter_id:chapId, chapter_name:found.ch.title,
             duration_sec:tr.dur, watched_sec:sec,
             watched_pct:Math.round(watchedRate(tr) * 100),
             ranges_json:JSON.stringify(watchedRanges(tr)),
             last_pos:rec.pos || 0,
             fast:rec.fast ? 'あり' : '' };
  }
  if(kind === 'quiz'){
    var qz = MEM.quizzes[key];
    if(!qz) return null;
    var nm = key.split('|')[0];
    var qr = key.slice(nm.length + 1).split('|');
    var cid = (/^\d{4}$/.test(qr[qr.length - 1]) ? qr.slice(0, -1) : qr).join('|');
    var co2 = courses().filter(function(c){ return c.id === cid; })[0];
    var pr2 = MEM.people[nm] || {};
    var qp = key.split('|');
    var qTerm = (qp.length >= 3 && /^\d{4}$/.test(qp[qp.length - 1])) ? qp[qp.length - 1] : '';
    return { quiz_key:key, person_name:nm, dept:pr2.dept || '', term:qTerm,
             course_id:cid, course_name:co2 ? co2.title : cid,
             score:qz.score, q_total:qz.total,
             tries:Number(qz.tries) || 1,
             history_json:JSON.stringify(qz.history || []),
             passed:qz.passed ? '合格' : '不合格', taken_at:qz.at || '' };
  }
  return null;
}
var KEY_FIELD = { course:null, person:'person_key', record:'rec_key',
                  quiz:'quiz_key', daily:'day_key',
                  survey:'survey_key', news:'news_key',
                  post:'post_key', react:'react_key' };

function flushSync(){
  if(!ON_CREATOR || SYNC.busy) return;
  var keys = Object.keys(SYNC.pend);
  if(!keys.length){ syncBadge(SYNC.err ? '未保存あり' : '保存済み', SYNC.err ? 'err' : ''); return; }
  SYNC.busy = true;
  syncBadge('保存中…', 'wait');

  var k = keys[0];
  /* 行列から消すのは「送信が成功してから」。
     先に消すと、送信中にタブが閉じられたぶんが控えからも消えて永久に届かない。 */
  var parts = k.split('\u0000'), kind = parts[0], key = parts[1];
  var payload = payloadFor(kind, key);

  var done = function(){
    SYNC.busy = false;
    if(Object.keys(SYNC.pend).length) flushSync();
    else syncBadge(SYNC.err ? '未保存あり（再試行します）' : '保存済み', SYNC.err ? 'err' : '');
  };
  if(!payload){
    /* 中身が消えている＝章IDが変わった・氏名に区切り文字が入った等。
       黙って捨てると「保存済み」と出たまま記録が失われるので、必ず知らせる。 */
    console.error('送信できない待ち行列を取り除きました', kind, key);
    delete SYNC.pend[k]; savePend();
    toast('保存できなかった記録が1件あります（' + kind + '）。研修担当にご連絡ください。');
    done(); return;
  }

  initParams()
    .then(function(){ return upsert(kind, KEY_FIELD[kind], key, payload); })
    .then(function(){
      SYNC.err = 0;
      delete SYNC.pend[k];     /* 届いたことを確かめてから行列を消す */
      savePend();
      done();
    })
    .catch(function(e){
      SYNC.err++;
      SYNC.lastErr = errText(e);
      SYNC.lastAt = new Date().toISOString();
      SYNC.lastKind = kind; SYNC.lastKey = key;
      console.error('保存に失敗しました', kind, key, e);
      savePend();              /* 行列にはそのまま残っている */
      var cd = errCode(e);
      /* 何度やっても直らない種類のものは、叩き続けない */
      if(cd === 4000){
        toast('本日のAPIの上限に達しました。記録はこの端末に残しています。' +
              '管理者にご連絡ください。');
        SYNC.busy = false; syncBadge('未保存あり（明日再送します）', 'err');
        return;
      }
      if(cd === 2945 || cd === 401){
        toast('ログインの有効期限が切れました。画面を再読み込みしてください。');
        SYNC.busy = false; syncBadge('未保存あり（再読み込みしてください）', 'err');
        return;
      }
      if(isBusy(e)){
        /* 込み合っているだけ。黙って待って再送する（受講者に不安を与えない） */
        SYNC.busy = false;
        syncBadge('保存待ち', 'wait');
        setTimeout(flushSync, 4000 + Math.random() * 4000);
        return;
      }
      if(SYNC.err === 1 || SYNC.err % 10 === 0){
        toast('うまく保存できませんでした。受講した記録はこの端末に残っています。' +
              '電波のよい場所で画面を開いたままにしていただくと、自動で保存されます。');
      }
      SYNC.busy = false;
      syncBadge('未保存あり（再試行します）', 'err');
      /* 200台が同時に再送して雪崩を起こさないよう、待ち時間をばらけさせる */
      var wait = Math.min(60000, 5000 * SYNC.err) * (0.7 + Math.random() * 0.6);
      setTimeout(flushSync, wait);
    });
}
/* 画面を閉じる前に「保存してから」送信待ちを吐き出す。
   順番が逆だと、最後の視聴ぶんが行列に積まれただけで送られない。 */
function flushAll(send){
  try{ if(typeof saveNow === 'function') saveNow(); }catch(e){}
  /* 間引いていた日次の学習時間も、ここで必ず送る */
  try{ var u = me(); if(u && u.name) queueSync('daily', dailyKey(u.name)); }catch(e){}
  clearTimeout(SYNC.timer);
  if(send !== false) flushSync();
}
/* ページを閉じる途中の通信はブラウザに打ち切られるので、
   ここでは「この端末への保存」だけを確実に行う。送信は次に開いたときに再開する。 */
window.addEventListener('beforeunload', function(){ flushAll(false); });
/* タブを閉じる直前に beforeunload が走らない端末があるので、こちらでも保存する */
document.addEventListener('visibilitychange', function(){
  if(!document.hidden) return;
  /* 裏に回したら再生を止める。席を離れたまま進み続けるのを防ぐ */
  if(P.player && P.player.pauseVideo){
    try{ P.player.pauseVideo(); }catch(e){}
    stopTick(); trackerBreak(P.tr);
  }
  flushAll();
});

/* ══════════════════════════════════════════════════════════════
   Creator からの読み込み
   ══════════════════════════════════════════════════════════════ */
/* 年度を持たないキー（この仕組みを入れる前の記録）を、年度つきに直す。
   年度は「記録された日付」から割り出す。日付も無ければ今年度として扱う。 */
function withTerm(key, chapOrCourseId, stamp, cycleCo){
  var parts = key.split('|');
  if(/^\d{4}$/.test(parts[parts.length - 1])) return key;   /* すでに年度つき */
  if(cycleCo && cycleCo.cycle === 'once') return key;        /* 一度きりのコースは年度なし */
  /* 日付が分からない行を今年度に寄せると、何年も前の記録が
     「今年度の法定研修は修了ずみ」に化ける。分からないものは年度なしのまま残す。 */
  var d = stamp ? new Date(stamp) : null;
  if(!d || isNaN(d.getTime())) return key;
  return key + '|' + termOfDate(d);
}
function rowsToRecords(rows){
  rows.forEach(function(r){
    var key = r.rec_key || ((r.person_name || '') + '|' + (r.chapter_id || '') +
                           (r.term ? '|' + r.term : ''));
    key = withTerm(key, r.chapter_id, r.updated_at || r.Added_Time,
                   chapCourse(r.chapter_id));
    var ranges = [];
    try{ ranges = JSON.parse(r.ranges_json || '[]') || []; }catch(e){ ranges = []; }
    var srvUpd = r.updated_at || r.Added_Time || '';
    var cur = MEM.records[key];
    var dur = Number(r.duration_sec) || 1;
    if(cur){
      /* 手元にも記録がある場合は、見た区間を「足し合わせる」。
         どちらかを捨てると、送信前に閉じた分の視聴が消える。 */
      var merged = createTracker(Math.max(dur, cur.dur || 1));
      [cur.ranges || [], ranges].forEach(function(rg){
        rg.forEach(function(x){
          for(var i = x[0]; i < x[1] && i < merged.dur; i++) merged.seen[i] = 1;
        });
      });
      var mp = trackerPack(merged);
      MEM.records[key] = {
        dur: merged.dur, ranges: mp.ranges,
        fast: cur.fast || String(r.fast || '') !== '',
        pos: Math.max(Number(cur.pos) || 0, Number(r.last_pos) || 0),
        updated: (String(cur.updated || '') > String(srvUpd)) ? cur.updated : srvUpd
      };
    }else{
      MEM.records[key] = {
        dur: dur, ranges: ranges,
        fast: String(r.fast || '') !== '',
        pos: Number(r.last_pos) || 0,
        updated: srvUpd
      };
    }
    if(r.ID) RID.records[key] = String(r.ID);
  });
  cacheFlush('records');
}
function rowsToQuizzes(rows){
  rows.forEach(function(r){
    var key = r.quiz_key || ((r.person_name || '') + '|' + (r.course_id || '') +
                            (r.term ? '|' + r.term : ''));
    key = withTerm(key, r.course_id, r.taken_at || r.updated_at,
                   courses().filter(function(c){ return c.id === r.course_id; })[0]);
    MEM.quizzes[key] = {
      /* Creator 側の列名は q_total（total は予約語を避けて改名した）。
         ここを total のまま読んでいたので、読み戻すと満点が0になり
         「3/0問」「Infinity%」と出ていた。 */
      score: Number(r.score) || 0, total: Number(r.q_total || r.total) || 0,
      passed: String(r.passed || '') === '合格', at: r.taken_at || r.updated_at || '',
      tries: Number(r.tries) || 1, history: jsonOr(r.history_json)
    };
    if(r.ID) RID.quizzes[key] = String(r.ID);
  });
  cacheFlush('quizzes');
}
function rowsToPeople(rows){
  rows.forEach(function(r){
    /* Creator の表で直した氏名も、ここで空白をそろえる。
       そろえないと「佐藤 花子」と「佐藤　花子」が別人として増える。 */
    var n = normName(r.person_key || r.person_name);
    if(!n) return;
    var row = { name:normName(r.person_name || n),
                email:String(r.email || '').trim(),
                dept:r.dept || '',
                group:r.grp || '', emp:r.emp_no || '',
                title:r.title || '', role:r.role || '', scope:r.scope || '',
                first:r.first_at || '' };
    /* 社内申請の項目（Creator に無い環境では undefined のまま） */
    if(r.kana) row.kana = r.kana;
    if(r.manager_name) row.manager = r.manager_name;
    if(r.join_date) row.joined = r.join_date;
    if(r.leave_balance !== undefined && r.leave_balance !== '' && r.leave_balance !== null) row.leave = Number(r.leave_balance);
    if(r.deputy_name) row.deputy = r.deputy_name;
    if(r.deputy_from) row.deputyFrom = r.deputy_from;
    if(r.deputy_to) row.deputyTo = r.deputy_to;
    if(r.photo) row.photo = safeImageURI(r.photo);
    if(r.profile) row.bio = r.profile;

function loadPerson(name){
  /* 管理画面（loadAll）は日次の学習時間を読まないので、
     「全件読んだ」フラグだけで日次まで読んだことにしてはいけない。
     0から積み直した値でCreatorの行を上書きし、その日の実績が消える。 */
  var needMain = !(LOADED.person === name || LOADED.all);
  var needDaily = (LOADED.daily !== name);
  if(!needMain && !needDaily) return Promise.resolve();
  var c = '(person_name == "' + crit(name) + '")';
  var jobs = [];
  if(needMain){
    jobs.push(function(){ return fetchRows(FORM.recordR, c).then(rowsToRecords); });
    jobs.push(function(){ return fetchRows(FORM.quizR,   c).then(rowsToQuizzes); });
    jobs.push(function(){ return fetchRows(FORM.surveyR, c).then(rowsToSurveys); });
  }
  if(needDaily) jobs.push(function(){ return fetchRows(FORM.dailyR, c).then(rowsToDaily); });
  return runLimited(jobs).then(function(){
    if(needMain) LOADED.person = name;
    if(needDaily) LOADED.daily = name;
  });
}

/* 全員ぶんを読む（管理画面）。
   1回の取得上限に当たらないよう、コースごとに分けて読む。 */
function loadAll(){
  if(LOADED.all) return Promise.resolve();
  LOADED.truncated = false;
  LOADED.partial = false;
  /* 日次の学習時間（Lms_Daily）は人数×日数ぶんあり、1回の上限に当たりやすい。
     管理画面の「視聴時間」は視聴記録から計算できるので、ここでは読まない。 */
  /* 一斉に投げると同時呼び出しの上限（2955）に当たるので、makers を作って順に流す。
     テスト結果とアンケートは1人1コースにつき1行なので、コースで分けずにまとめて読む。 */
  var jobs = [
    function(){ return fetchRows(FORM.personR).then(rowsToPeople); },
    function(){ return fetchRows(FORM.newsR).then(rowsToNews); },
    function(){ return fetchRows(FORM.quizR).then(rowsToQuizzes); },
    function(){ return fetchRows(FORM.surveyR).then(rowsToSurveys); }
  ];
  /* 視聴記録だけは 人数×章数 ぶんあって多いので、コースごとに分けて読む */
  courses().forEach(function(co){
    jobs.push(function(){
      return fetchRows(FORM.recordR, '(course_id == "' + crit(co.id) + '")')
               .then(rowsToRecords);
    });
  });
  return runLimited(jobs).then(function(){ LOADED.all = true; });
}

/* ══════════════════════════════════════════════════════════════
   進捗の計算
   ══════════════════════════════════════════════════════════════ */
/* 動画を差し替えて尺が変わると、登録値(ch.dur)と実際の長さがずれる。
   記録がある章は記録側の長さを正として使う（そうしないと永久に修了できなくなる）。 */
/* 動画の長さ。読めない値のときは進捗を出さない（1秒で100%になるのを防ぐ） */
function safeDur(v){
  var n = Number(v);
  return (isFinite(n) && n >= 1) ? Math.round(n) : 0;
}
function chapProgress(name, ch){
  var rec = getRec(name, ch.id);
  var dur = (rec && rec.dur) || ch.dur || 1;
  if(!rec) return { sec:0, rate:0, dur:dur };
  var tr = trackerUnpack(rec);
  return { sec:watchedSeconds(tr), rate:watchedRate(tr), dur:tr.dur };
}
function courseProgress(name, co){
  var total = 0, seen = 0;
  co.chapters.forEach(function(ch){
    var cp = chapProgress(name, ch);
    total += cp.dur;
    seen  += Math.min(cp.sec, cp.dur);
  });
  var rate = total ? seen / total : 0;
  var qz = getQuiz(name, co.id);
  /* passRate が 0 や未設定だと「1秒も見ていないのに修了」になる。下限を置く */
  var need = (Number(co.passRate) > 0) ? Math.min(1, Number(co.passRate)) : 0.8;
  var videoDone = total > 0 && rate >= need;
  var quizDone  = !co.quiz || !co.quiz.length || (qz && qz.passed);
  return { sec:seen, total:total, rate:rate, videoDone:videoDone,
           quiz:qz, done:videoDone && quizDone };
}

function hhmm(sec){
  var h = Math.floor(sec/3600), m = Math.round((sec%3600)/60);
  if(m === 60){ h++; m = 0; }
  return h > 0 ? (h + '時間' + m + '分') : (m + '分');
}
/* 「00分」「48分」「54時間55分」のように桁をそろえて出す */
function hm2(sec){
  var h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60);
  var mm = (m < 10 ? '0' : '') + m;
  return h > 0 ? (h + '時間' + mm + '分') : (mm + '分');
}
function pct(r){ return Math.round(r*100) + '%'; }

function eachIn(sel, fn){
  var root = document.getElementById('main') || document;
  Array.prototype.forEach.call(root.querySelectorAll(sel), fn);
}
function byAttr(n, v){
  try{ return document.querySelector('[' + n + '="' +
    String(v == null ? '' : v).replace(/["\\]/g, '\\$&') + '"]'); }
  catch(e){ return null; }
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('on'); }, 3000);
}
function initial(name){

}
var AVA_COLORS = ['#14589f','#15699f','#1c7a3c','#98461f','#524080','#2e5d73','#7a3d4d','#7d5600'];
function avaColor(name){
  var n = 0, s = String(name || '');
  for(var i = 0; i < s.length; i++) n = (n * 31 + s.charCodeAt(i)) % 9973;
  return AVA_COLORS[n % AVA_COLORS.length];
}

function ymd(iso){
  if(!iso) return '—';
  var d = new Date(iso);
  if(isNaN(d.getTime())) return '—';
  var z = function(n){ return (n<10?'0':'') + n; };
  return d.getFullYear() + '/' + z(d.getMonth()+1) + '/' + z(d.getDate());
}
/* 文字を写す。クリップボードが使えない環境でも、選択できる形にして返す */
function copyText(txt){
  txt = String(txt || '');
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ toast('コピーしました'); },
        function(){ copyFallback(txt); });
      return;
    }
  }catch(e){}
  copyFallback(txt);
}
function copyFallback(txt){
  try{
    var ta = document.createElement('textarea');
    ta.value = txt;
    ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    var ok = document.execCommand('copy');
    ta.remove();
    toast(ok ? 'コピーしました' : 'コピーできませんでした。文字を選んで写してください');
  }catch(e){
    toast('コピーできませんでした。文字を選んで写してください');
  }
}
function ymdhm(iso){
  if(!iso) return '—';
  var d = new Date(iso);
  if(isNaN(d.getTime())) return '—';
  var z = function(n){ return (n<10?'0':'') + n; };
  return d.getFullYear() + '/' + z(d.getMonth()+1) + '/' + z(d.getDate()) +
         ' ' + z(d.getHours()) + ':' + z(d.getMinutes());
}
function overdue(co){
  if(!co || !co.deadline) return false;
  return new Date(co.deadline + 'T23:59:59') < new Date();
}
function daysLeft(co){
  if(!co || !co.deadline) return null;
  /* Math.ceil は -0 を返すことがあり、-0 < 0 は false。
     overdue() と食い違って「期限切れなのに、あと0日」と出てしまう。 */
  return Math.floor((new Date(co.deadline + 'T23:59:59') - new Date()) / 86400000);
}
/* 期限の表示（当日・超過を言い分ける） */
function dueLabel(dl){
  if(dl === null) return '';
  if(dl < 0) return '（超過）';
  if(dl === 0) return '（本日まで）';
  return '（あと' + dl + '日）';
}

/* 状態は4段階。表・カード・一覧で表記をそろえるため1か所で決める */
function stateOf(co, p){
  if(p.done)      return { k:'done', label:'完了',       icon:'check' };
  if(p.videoDone) return { k:'mid',  label:'テスト待ち', icon:'quiz'  };
  if(p.rate > 0)  return { k:'mid',  label:'学習中',     icon:'eye'   };
  return                 { k:'no',   label:'未着手',     icon:'cross' };
}
function stCell(co, p, extra){
  var s = stateOf(co, p);
  return '<div class="st ' + s.k + '"><span class="dot">' + icf(s.icon) + '</span>' +
         '<span class="lb">' + s.label + '</span>' +
         (extra ? '<span class="sm">' + extra + '</span>' : '') + '</div>';
}
function stPill(co, p){
  var s = stateOf(co, p);
  var cls = s.k === 'done' ? 'ok' : (s.k === 'mid' ? 'mid' : 'no');
  return '<span class="pill ' + cls + '">' + ic(s.icon) + s.label + '</span>';
}

   名簿の1人ずつに「役職」と「権限」と「見られる範囲」を持たせる。
     役職   … 部長・課長など。表示用。登録のときに権限の初期値を決めるのに使う

/* 権限は2つだけ。3つのアプリ（社内申請・e-ラーニング・コネクト）で共通。
   ・システム管理者 … 管理画面に入れる
   ・一般           … 入れない
   細かい段を作ると、誰がどこまで見られるのかを説明できなくなるので作らない。 */
var ROLES = [
  { id:'learner', rank:1, label:'一般',
    desc:'自分の受講状況と修了証、掲示板の閲覧と投稿' },
  { id:'admin',   rank:4, label:'システム管理者',
    desc:'すべての管理画面（名簿・職種・コース・配信・集計・設定）' }
];
function roleInfo(id){
  for(var i = 0; i < ROLES.length; i++) if(ROLES[i].id === id) return ROLES[i];
  return ROLES[0];
}
function roleFromTitle(){ return 'learner'; }
/* その人の権限。名簿に無ければ一般。
   古い名簿に部門管理者・研修管理者が残っていたら、管理者として扱う
   （どちらも管理画面に入れる側だったため） */
function roleOf(p){
  if(!p) return 'learner';
  if(p.role === 'dept' || p.role === 'trainer') return 'admin';
  if(p.role && roleInfo(p.role).id === p.role) return p.role;
  return 'learner';
}
/* 見られる範囲。いまは「管理者は全部／一般は自分だけ」の2つだけ */
function scopeOf(){ return []; }

/* メールアドレスが入っていない人は、ポータルからログインできない。

function drawNav(view){
  /* メニューは1つ。受講者向けの項目に続けて、その人の権限で開ける
     管理向けの項目を並べる。切り替えボタンは置かない。
     社内申請の中では、社内申請の項目だけを並べる。 */
  var inS = APP_NOW === 'shinsei';
  var list = (inS ? NAV_SHINSEI : (APP_NOW === 'connect' ? NAV_CONNECT :
              (APP_NOW === 'staff' ? NAV_STAFF : NAV_USER))).slice();
  var adm = canAdmin() ? navFor(inS ? NAV_SHINSEI_ADMIN : (APP_NOW === 'connect' ? NAV_CONNECT_ADMIN :
            (APP_NOW === 'staff' ? [] : NAV_ADMIN))) : [];
  if(adm.length){
    list.push({ head:'管理' });
    list = list.concat(adm);
  }
  var pendS = (inS && typeof App !== 'undefined' && App.pendingCount) ? App.pendingCount() : 0;
  var cur = NAV_OF[view] || '';
  var u = me() || { name:'', dept:'' };

  /* 受講者側は、未修了の必須研修の数をバッジで出す */
  var pend = 0;
  if(u.name){
    myCourses().forEach(function(co){
      if(co.required && !courseProgress(u.name, co).done) pend++;
    });
  }

  var h = '';
  list.forEach(function(n, i){
    if(n.head){
      h += '<div class="nav-h">' + esc(n.head) + '</div>';
      return;
    }
    if(n.sub){
      /* 中の項目が選ばれていれば開いておく */
      var inside = n.sub.some(function(s){ return s.go === cur; });
      var open = inside || NAV_OPEN[n.label];
      h += '<button class="nav-i" data-open="' + esc(n.label) + '" aria-expanded="' + !!open + '">' +
           ic(n.icon) + '<span>' + esc(n.label) + '</span><span class="caret">▼</span></button>';
      h += '<div class="nav-sub' + (open ? ' on' : '') + '">';
      n.sub.forEach(function(s){
        h += '<button class="nav-s" data-go="' + s.go + '"' +
             (s.go === cur ? ' aria-current="page"' : '') + '>' + esc(s.label) + '</button>';
      });
      h += '</div>';
    }else{
      h += '<button class="nav-i" data-go="' + n.go + '"' +
           (n.go === cur ? ' aria-current="page"' : '') + '>' +
           ic(n.icon) + '<span>' + esc(n.label) + '</span>' +
           (n.go === 'courses' && pend
             ? '<span class="pill req" style="margin-left:auto">' + pend + '</span>' : '') +
           (n.badge === 'shinsei' && pendS
             ? '<span class="pill req" style="margin-left:auto">' + pendS + '</span>' : '') +
           '</button>';
    }
  });
  /* 管理画面と受講者画面の行き来は出さない。
     管理者は設定する側なので、受講者の画面に入る必要がない。
     管理画面に入るのは、入口の「管理者の方はこちら」＋暗証番号だけ。 */
  /* 共用の端末で「次の人に代わる」「使い終わる」がどこにも無かったので、ここに置く */
  /* メールアドレスで入る運用では「交代」は起きないので出さない。
     名簿がまだ無く、氏名で入っているときだけ、入口に戻る道を残す。 */
  if(!LOGIN_EMAIL){
    h += '<div class="nav-sep"></div>';
    h += '<button class="nav-i" data-act="swap">' + ic('users') +
         '<span>別の人に交代する</span></button>';
    h += '<button class="nav-i" data-act="out">' + ic('logout') +
         '<span>終了する（この端末から消す）</span></button>';
  }
  document.getElementById('side').innerHTML = h;
  Array.prototype.forEach.call(document.querySelectorAll('#side [data-act]'), function(b){
    b.onclick = function(){
      closeSide();
      var act = b.getAttribute('data-act');
      if(act === 'swap'){ stopPlayer(); viewGate(); return; }
      leaveDevice();
    };
  });

  Array.prototype.forEach.call(document.querySelectorAll('#side [data-go]'), function(b){
    b.onclick = function(){ closeSide(); route(b.getAttribute('data-go')); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('#side [data-open]'), function(b){
    b.onclick = function(){
      var k = b.getAttribute('data-open');
      NAV_OPEN[k] = !(b.getAttribute('aria-expanded') === 'true');
      drawNav(view);
    };
  });

  /* 上の帯 */
  var av = document.getElementById('topAva');
  var myPhoto = safeImageURI(((people() || {})[normName(u.name)] || {}).photo);
  if(myPhoto){
    av.innerHTML = '<img src="' + esc(myPhoto) + '" alt="">';
    av.style.background = 'transparent';
  }else{
    av.textContent = initial(u.name);
    av.style.background = avaColor(u.name);
  }
  document.getElementById('topName').textContent = u.name || '';
  /* メールアドレスで入っているときは、端末に残るのは自分のぶんだけなので出さない */
  document.getElementById('icoOut').hidden = !!LOGIN_EMAIL;
  document.getElementById('topMe').setAttribute('aria-label',
    LOGIN_EMAIL ? ('ログイン中：' + (u.name || '')) : '受講者を切り替える');
  var cfg = config();
  document.getElementById('topLogo').innerHTML =
    (safeImageURI(cfg.logo) ? '<img class="logo-img" src="' + esc(safeImageURI(cfg.logo)) + '" alt="" style="height:24px">'
              : '<span class="mk">研</span>') +
    '<span class="nm">' + esc(appLabel()) + '</span>' +
    '<small>' + ((MODE === 'admin') ? '　管理機能' : '　' + esc(cfg.portalName)) + '</small>';
  document.getElementById('icoBell').hidden = APP_NOW !== 'lms';
  /* 職員登録の入口では「管理機能」ではなくポータル名を出す */
  document.getElementById('icoMail').hidden = APP_NOW !== 'lms';
  var unread = u.name ? newsUnread(u) : 0;
  document.getElementById('mailDot').hidden = !unread;
  document.getElementById('bellDot').hidden = !pend;
  var bn = document.getElementById('bellNum');
  if(bn){ bn.textContent = unread ? unread : ''; bn.hidden = !unread; }
}

/* 配色の反映（設定の「明るい／暗い／端末に合わせる」） */
function applyTheme(){
  var t = config().theme;
  var r = document.documentElement;
  if(t === 'light' || t === 'dark') r.setAttribute('data-theme', t);
  else r.removeAttribute('data-theme');
  var sh = document.getElementById('shinsei');
  if(sh) sh.setAttribute('data-theme', themeNow());
}
/* いま実際に効いている配色（端末に合わせる、のときは端末の設定を見る） */
function themeNow(){
  var t = document.documentElement.getAttribute('data-theme');
  if(t === 'light' || t === 'dark') return t;
  try{
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }catch(e){ return 'light'; }
}

function crumb(items){
  var h = '';
  items.forEach(function(it, i){
    if(i) h += '<span class="sep">/</span>';
    if(it.go) h += '<button data-cr="' + esc(it.go) + '" data-crid="' + esc(it.id||'') + '">' +
                   esc(it.t) + '</button>';
    else      h += '<b>' + esc(it.t) + '</b>';
  });
  document.getElementById('crumb').innerHTML = h;
  Array.prototype.forEach.call(document.querySelectorAll('[data-cr]'), function(b){
    b.onclick = function(){
      var id = b.getAttribute('data-crid');
      route(b.getAttribute('data-cr'), id || undefined);
    };
  });
}

/* 入口。
   名簿はシステム管理者が先に作る。受講者はそこに載っている人だけが入れる。

     ① ポータルのメールアドレスが名簿にある   → お名前を確かめて「はじめる」
     ② それ以外                                → 入れない。研修担当に連絡してもらう
     ③ Creator に繋がっていない（動作確認用）  → その場で名前を入れて試せる

   名簿にお名前だけ登録されていて、メールアドレスが空の行では入れません。
   誰でもその名前を名乗れてしまうためです（管理者が必ずメールアドレスを入れること）。
*/
function viewGate(){
  document.getElementById('app').classList.remove('on');
  var prev = me() || {}, cfg = config();

  var ps = people() || {};
  var roster = Object.keys(ps).sort();
  var mine = String(LOGIN_EMAIL || '').trim().toLowerCase();
  /* 自分のメールアドレスで登録されている人（いれば1人） */
  var meRow = LOGIN_EMAIL ? personByEmail(LOGIN_EMAIL) : null;
  /* メールアドレスがまだ入っていない名簿の行（この方々はログインできない） */
  var noMail = roster.filter(function(n){ return !String(ps[n].email || '').trim(); });
  var demo = !ON_CREATOR;

  /* 入れるのは「ポータルのメールアドレスが名簿と一致した人」だけ */
  var mode = meRow ? 'known' : (demo ? 'demo' : 'none');

  var br = function(t){ return esc(String(t || '')).replace(/\n/g, '<br>'); };
  var h = '<div class="gate">';
  h +=   '<div class="hero">' + heroHTML() + '</div><span class="hero-veil"></span>';
  /* 上：ロゴと一言 */
  h +=   '<header class="gate-top">';
  h +=     '<div class="gate-brand">' + logoHTML(30) + '<small>' + esc(cfg.brandSub || cfg.orgName) + '</small></div>';
  h +=     '<div class="gate-tag">' + esc(cfg.tagline || '') +
             (cfg.taglineSub ? '<small>' + esc(cfg.taglineSub) + '</small>' : '') + '</div>';
  h +=   '</header>';
  /* 中：左の言葉・丸いすりガラス・右の飾り文字 */
  var sideParts = String(cfg.sideCopy || '').split(/\n\s*\n/);
  h +=   '<div class="gate-mid">';
  h +=     '<div class="gate-copy"><h2>' + br(sideParts[0] || '') + '</h2>' +
             (sideParts[1] ? '<hr><p>' + br(sideParts[1]) + '</p>' : '') + '</div>';
  h +=     '<div class="gate-col">';
  h +=       '<div class="gate-card' + (mode === 'known' ? '' : ' tall') + '">';
  h +=         '<div class="card-head"><div class="brand">' + logoHTML(30) + '</div>' +
               '<h1 class="wordmark">' + esc(cfg.portalName || 'Portal') + '</h1>' +
               '<div class="wordsub">' + esc(cfg.portalSub || '') + '</div>' +
               (cfg.catchCopy ? '<div class="gate-catch">' + br(cfg.catchCopy) + '</div>' : '') +
               (cfg.catchSub ? '<div class="gate-catch-sub">' + br(cfg.catchSub) + '</div>' : '') +
               '<div class="gate-kw">LEARN　·　GROW　·　MAKE AN IMPACT</div>' +
               '</div>';

  if(mode === 'known'){
    /* ① 名簿にある。お名前を出して、本人に確かめてもらう */
    h +=   '<div class="gate-me">' + ava(meRow.name, 'sm') + '<b>' + esc(meRow.name) + '</b>' +
             '<span class="cap">' + esc([meRow.dept || '', meRow.title || ''].filter(Boolean).join('　·　')) + '</span>' +
             (LOGIN_EMAIL ? '<span class="mail">' + esc(LOGIN_EMAIL) + '</span>' : '') +
           '</div>';
    /* 見た目の確認用に .ro-lg の印は残す（名前を確かめて入る、という意味） */
    h +=   '<span class="ro-lg" hidden></span>';
    h +=   '<p class="cardnote">下のアプリを押すと、そのアプリに入ります。お名前が違う場合は、研修担当にご連絡ください</p>';
  }else if(mode === 'none'){
    /* ② 名簿に無い。勝手に登録させない */
    if(LOGIN_EMAIL) h += '<div class="who-me">' + ic('mail') + '<span>' + esc(LOGIN_EMAIL) + '</span></div>';
    h +=   '<div class="note" style="margin-bottom:4px;text-align:left">' +
             '<b>' + (roster.length ? 'まだ登録されていません' : '名簿がまだ登録されていません') +
             '</b><br>' +
             (roster.length
               ? 'このメールアドレスは受講者名簿に登録されていません。'
               : '受講者名簿がまだ作られていません。') +
             '研修担当にご連絡ください。' +
             (noMail.length
               ? '<br><span class="cap">（メールアドレスが未登録の方が ' + noMail.length +
                 ' 名います）</span>'
               : '') +
           '</div>';
  }else{
    /* ④ 動作確認用（ファイルを直接開いたとき） */
    h +=   '<div class="note" style="margin-bottom:14px;font-size:12.5px">' +
             '<b>動作確認用の入口です</b>　' +
             'Zoho Creator に繋がっていないため、お名前を入れて試せます。' +
             '本番では、システム管理者が登録した名簿の方だけが入れます。</div>';
    h +=   '<div class="field"><label for="gName">お名前</label>' +
             '<input id="gName" placeholder="例）山田 太郎" autocomplete="name" value="' +
             esc(prev.name || '') + '"></div>';
    h +=   '<div class="two">';
    h +=     '<div class="field"><label for="gDept">職種</label><select id="gDept">' +
               '<option value="">選択してください</option>' +
               depts().map(function(d){
                 return '<option' + (prev.dept === d ? ' selected' : '') + '>' + esc(d) + '</option>';
               }).join('') + '</select></div>';
    h +=     '<div class="field"><label for="gGrp">グループ</label><select id="gGrp">' +
               '<option value="">選択してください</option>' +
               groups().map(function(d){
                 return '<option' + (prev.group === d ? ' selected' : '') + '>' + esc(d) + '</option>';
               }).join('') + '</select></div>';
    h +=   '</div>';
    h +=   '<p class="cardnote">お名前を入れて、下のアプリを押してください</p>';
  }

  /* Zoho にログインできている時点で本人確認は済んでいる。
     名簿で権限が付いている人は、そのままアプリに入って管理の項目が出るので、
     ここに入口は要らない。
     必要なのは
       ・まだ管理できる人が一人もいない（最初の1人を決める）
       ・Creator に繋がっていない動作確認用（暗証番号）
     の2つだけ。 */
  var admShow = demo || noAdminYet();
  if(admShow){
    h +=   '<div class="gate-adm"><button id="gAdm">' + ic('gear') +
             (demo ? '管理画面をひらく' : 'はじめに管理者を登録する') +
           '</button></div>';
  }
  h +=       '</div>';   /* gate-card */
  h +=     '</div>';     /* gate-col */
  h +=     '<div class="gate-script">' + br(cfg.scriptCopy) + '</div>';
  h +=   '</div>';       /* gate-mid */
  /* 下：3つのアプリ。押した瞬間にそのアプリへ入る */
  /* 職員登録の入口は、名簿でシステム管理者の人と、動作確認（暗証番号あり）のときだけ */
  var gateAdmin = demo || (meRow && roleOf(meRow) === 'admin');
  h +=   (mode === 'none') ? '' : appPickHTML(gateAdmin);
  h +=   '<footer class="gate-foot">' + esc(cfg.portalName) + '　·　' + esc(cfg.orgName) +
         '<small>© ' + new Date().getFullYear() + ' ' + esc(cfg.orgName) + '</small></footer>';
  h +=   '<div class="gate-help">';
  h +=     '<button class="hbtn" id="gHelp">' + ic('book') + '使い方</button>';
  h +=   '</div>';
  h += '</div>';
  document.getElementById('gate').innerHTML = h;

  document.getElementById('gHelp').onclick = gateHelp;
  var gAdmBtn = document.getElementById('gAdm');
  if(gAdmBtn) gAdmBtn.onclick = function(){
    APP_NOW = 'lms';          /* 管理画面は e-ラーニング側にある */
    document.getElementById('gate').innerHTML = '';
    if(meRow){
      LS.set('me', { name:meRow.name, dept:meRow.dept || '', group:meRow.group || '',
                     emp:meRow.emp || '', email:LOGIN_EMAIL });
    }else if(!me()){
      /* 名簿がまだ無いとき（最初の1人）。このあと名前を登録してもらう */
      LS.set('me', { name:'管理者', dept:'', group:'', emp:'',
                     email:LOGIN_EMAIL || '' });
    }
    askAdmin();
  };

  var inp = document.getElementById('gName');

  function showWho(){
    var box = document.getElementById('gWho');
    if(!box || !inp) return;
    var p = ps[normName(inp.value)];
    box.textContent = p
      ? [p.dept || '職種未設定', p.group || 'グループ未設定',
         p.emp ? '社員番号 ' + p.emp : ''].filter(Boolean).join('　·　')
      : 'お名前を選ぶと表示されます';
  }
  if(inp){ inp.onchange = showWho; showWho(); }

  function go(appId){
    var o;
    var app = APPS.filter(function(a){ return a.id === appId; })[0] || APPS[1];
    if(app.admin && !demo && !(meRow && roleOf(meRow) === 'admin')){
      toast('職員登録はシステム管理者だけが開けます'); return;
    }
    APP_NOW = app.id;
    if(mode === 'known'){
      o = { name:meRow.name, dept:meRow.dept || '', group:meRow.group || '',
            emp:meRow.emp || '', email:LOGIN_EMAIL };
    }else{
      var n = normName(inp.value);
      if(!n){
        inp.focus();
        toast('お名前が入っていません。受講記録を残すために、お名前を入れてください');
        return;
      }
      if(badName(n)){
        inp.focus();
        toast('お名前に使えない文字（｜・改行）が入っています。入れ直してください');
        return;
      }
      {
        var dv = document.getElementById('gDept').value;
        var gv = document.getElementById('gGrp').value;
        if(!dv){ document.getElementById('gDept').focus(); toast('職種を選んでください'); return; }
        if(!gv){ document.getElementById('gGrp').focus(); toast('グループを選んでください'); return; }
        o = { name:n, dept:dv, group:gv, emp:'', email:LOGIN_EMAIL || '' };
      }
    }
    setMe(o);
    document.getElementById('gate').innerHTML = '';
    MODE = 'user';
    afterLogin(o.name, app.go);
  }
  /* アプリのカードを押した瞬間に入る */
  Array.prototype.forEach.call(document.querySelectorAll('#gate [data-app]'), function(b){
    b.onclick = function(){ go(b.getAttribute('data-app')); };
  });
  if(inp){
    inp.addEventListener('keydown', function(e){ if(e.key === 'Enter') go('lms'); });
    inp.focus();
  }else{
    var first = document.querySelector('#gate [data-app]:not([disabled])');
    if(first) first.focus();
  }
}
/* 入口に並べる3つのアプリ */
function appPickHTML(isAdmin){
  var h = '<div class="gate-apps">';
  APPS.forEach(function(a){
    if(a.admin && !isAdmin) return;
    var ready = !!a.go;
    h += '<button class="gate-app c-' + a.id + (ready ? '' : ' off') + '" data-app="' + a.id + '"' +
         (ready ? '' : ' disabled') + '>' +
         '<span class="hub-i">' + ic(a.icon) + '</span>' +
         '<span><b>' + esc(appLabel(a.id)) + '</b>' +
         '<span class="hub-s">' + esc(a.sub) + (ready ? '' : '　（準備中）') + '</span></span>' +
         '<span class="arrow">→</span>' +
         '</button>';
  });
  h += '</div>';
  return h;
}

/* ══════════════════════════════════════════════════════════════
   画面：マイダッシュボード（受講者）
   ══════════════════════════════════════════════════════════════ */
var MYTIME_TAB = 'all';   /* 'all' = 総時間 ／ 'goal' = 必須コースのみ */

function viewHome(){
  var u = me(), cs = myCourses();   /* 自分に配信されたコースだけ */
  var reqCs = cs.filter(function(co){ return co.required; });
  var reqDone = 0, allSec = 0, goalSec = 0, pend = [], inProg = [];
  cs.forEach(function(co){
    var p = courseProgress(u.name, co);
    allSec += p.sec;
    if(co.required){
      goalSec += p.sec;
      if(p.done) reqDone++; else pend.push({ co:co, p:p });
    }
    if(!p.done && p.sec > 0) inProg.push({ co:co, p:p });
  });
  pend.sort(function(a, b){
    var da = daysLeft(a.co), db = daysLeft(b.co);
    if(da === null) return 1;
    if(db === null) return -1;
    return da - db;
  });
  /* 必須コースのうち、いちばん近い期限 */
  var nearest = '';
  reqCs.forEach(function(co){
    if(co.deadline && (!nearest || co.deadline < nearest)) nearest = co.deadline;
  });

  var h = '<div class="wrap">';
  h += '<div class="ph"><div><h2>マイダッシュボード</h2>' +
       '<div class="sub">' + esc(u.name) + ' さん　' + esc(u.dept || '') +
       (u.group ? '　/　' + esc(u.group) : '') + '</div></div></div>';

  /* 名簿に管理できる人が一人もいない状態。誰かが名乗り出ないと設定が始められない */
  if(LOGIN_EMAIL && noAdminYet()){
    h += '<div class="note"><b>このアプリには、まだ管理者が登録されていません</b><br>' +
         '研修担当の方は、ご自身を管理者として登録してください。' +
         '（研修担当以外の方は、そのままで大丈夫です）' +
         '<div class="bar" style="margin-top:9px">' +
         '<button class="btn sm" id="hmAdm">' + ic('gear') +
         '自分を管理者として登録する</button></div></div>';
  }

  /* ── 上段のタイル ── */
  h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));' +
       'gap:14px;margin-bottom:20px">';

  /* マイ目標コース */
  h += '<div class="tile"><div class="th">' + ic('target') + 'マイ目標コース' +
       '<span class="sp"></span><button class="btn sub sm" data-go2="courses">開く</button></div>' +
       '<div class="big">' + reqDone + ' <small>/ ' + reqCs.length + '</small></div>' +
       '<div class="cap">' + (nearest ? '完了期限　' + esc(nearest) : '期限の指定なし') + '</div>' +
       '<div class="pline" style="margin-top:11px"><span class="pb' +
         (reqDone === reqCs.length ? ' done' : '') + '"><i style="width:' +
         (reqCs.length ? Math.round(reqDone/reqCs.length*100) : 0) + '%"></i></span>' +
         '<span class="n">' + (reqCs.length ? Math.round(reqDone/reqCs.length*100) : 0) + '%</span></div>' +
       '</div>';

  /* マイ学習時間 */
  var showSec = (MYTIME_TAB === 'goal') ? goalSec : allSec;
  h += '<div class="tile"><div class="th">' + ic('clock') + 'マイ学習時間</div>' +
       '<div class="tabs" id="mtTabs">' +
         '<button data-mt="all"  aria-pressed="' + (MYTIME_TAB==='all')  + '">総時間</button>' +
         '<button data-mt="goal" aria-pressed="' + (MYTIME_TAB==='goal') + '">マイ目標コース</button>' +
       '</div>' +
       '<div class="rows">' +
         '<div class="r"><span>今日</span><b>' + hm2(daySec(u.name)) + '</b></div>' +
         '<div class="r"><span>今月</span><b>' + hm2(monthSec(u.name)) + '</b></div>' +
         '<div class="r"><span>' + (MYTIME_TAB==='goal' ? 'マイ目標コース' : '総時間') +
           '</span><b>' + hm2(showSec) + '</b></div>' +
       '</div></div>';

  /* お知らせ：配信されたものを先に、なければ期限の案内を出す */
  var nw = newsFor(u, 3).filter(function(n){ return !n.deleted; });
  h += '<div class="tile"><div class="th">' + ic('mail') + 'お知らせ' +
       '<span class="sp"></span><button class="btn sub sm" data-go2="mynews">すべて見る</button></div>';
  if(nw.length){
    h += '<div class="rows">';
    nw.forEach(function(n){
      h += '<div class="r"><span>' + esc(String(n.title).slice(0, 22)) + '</span>' +
           '<b style="font-family:inherit;font-size:11px;color:var(--ink-3)">' +
           ymd(n.at) + '</b></div>';
    });
    h += '</div>';
  }else if(!pend.length){
    h += '<div style="font-size:12.5px;color:var(--ink-2);padding:6px 0">' +
         '必須研修はすべて修了しています。おつかれさまでした。</div>';
  }else{
    h += '<div class="rows">';
    pend.slice(0, 3).forEach(function(x){
      var dl = daysLeft(x.co);
      h += '<div class="r"><span>' + esc(x.co.title) + '</span><b style="font-family:inherit">' +
           (dl === null ? '未修了' : (dl < 0 ? '<span style="color:var(--bad)">期限超過</span>'
                                            : dueLabel(dl).replace(/[（）]/g, ''))) + '</b></div>';
    });
    h += '</div>';
    if(pend.length > 3){
      h += '<div class="cap" style="margin-top:8px">ほか ' + (pend.length - 3) + '件</div>';
    }
  }
  h += '</div>';
  h += '</div>';

  /* ── 受講が必要な研修 ── */
  h += '<div class="cat">' + ic('alert') + '受講が必要な研修' +
       '<span class="num">' + pend.length + '件</span></div>';
  if(!pend.length){
    h += '<div class="card"><div class="empty">' + ic('check') +
         '必須研修はすべて修了しています。</div></div>';
  }else{
    h += '<div class="tbl-wrap"><table><thead><tr>' +
         '<th class="stick">コース</th><th>期限</th><th style="min-width:142px">視聴の進み</th>' +
         '<th class="c">確認テスト</th><th class="c">受講状況</th><th></th></tr></thead><tbody>';
    pend.forEach(function(x){
      var dl = daysLeft(x.co), late = dl !== null && dl < 0;
      h += '<tr><td class="stick"><b>' + esc(x.co.title) + '</b>' +
           '<div style="font-size:10.5px;color:var(--ink-3)">' + esc(x.co.cat) +
           '・全' + x.co.chapters.length + '章</div></td>';
      h += '<td>' + (x.co.deadline
             ? '<span class="pill ' + (late ? 'bad' : (dl <= 30 ? 'mid' : 'no')) + '">' +
               esc(x.co.deadline) + '　' + dueLabel(dl).replace(/[（）]/g, '') + '</span>'
             : '<span style="color:var(--ink-3)">—</span>') + '</td>';
      h += '<td><div class="pline"><span class="pb"><i style="width:' +
             Math.round(x.p.rate*100) + '%"></i></span><span class="n">' + pct(x.p.rate) +
             '</span></div></td>';
      h += '<td class="c">' + (x.p.quiz
             ? '<span class="pill ' + (x.p.quiz.passed ? 'ok' : 'mid') + '">' +
               (x.p.quiz.passed ? '合格' : '不合格') + '</span>'
             : '<span class="pill no">未受験</span>') + '</td>';
      h += '<td class="c">' + stCell(x.co, x.p) + '</td>';
      h += '<td class="n"><button class="btn sm" data-open="' + esc(x.co.id) + '">' +
             (x.p.sec > 0 ? '続きから' : '受講する') + '</button></td></tr>';
    });
    h += '</tbody></table></div>';
  }

  /* ── 受講中 ── */
  if(inProg.length){
    h += '<div class="cat">' + ic('eye') + '受講中のコース' +
         '<span class="num">' + inProg.length + '件</span></div><div class="grid">';
    inProg.forEach(function(x){ h += ccHTML(x.co, x.p); });
    h += '</div>';
  }
  h += '</div>';
  document.getElementById('main').innerHTML = h;
  bindOpen();
  Array.prototype.forEach.call(document.querySelectorAll('#mtTabs button'), function(b){
    b.onclick = function(){ MYTIME_TAB = b.getAttribute('data-mt'); viewHome(); };
  });
}

/* ══════════════════════════════════════════════════════════════
   画面：研修コース（受講者）
   ══════════════════════════════════════════════════════════════ */
function ccHTML(co, p){
  var vid = (co.chapters[0] || {}).videoId;
  var thumb = vid
    ? '<img src="https://i.ytimg.com/vi/' + esc(vid) + '/mqdefault.jpg" alt="" loading="lazy" ' +
      'onerror="this.style.display=\'none\'">'
    : '<span class="ph">' + ic('play') +
      (MODE === 'admin' ? '動画URL未設定' : '準備中') + '</span>';
  var badge = p.done ? '<span class="badge done">修了</span>'
            : (co.required ? '<span class="badge rq">必須</span>' : '<span class="badge">任意</span>');
  var h = '<button class="cc" data-open="' + esc(co.id) + '">';
  h += '<span class="thumb">' + thumb + badge + '<span class="play">' + ic('play') + '</span></span>';
  h += '<span class="in">';
  h +=   '<span class="ttl">' + esc(co.title) + '</span>';
  h +=   '<span class="desc">' + esc(co.desc) + '</span>';
  h +=   '<span class="meta">' +
           '<span>' + ic('book') + '全' + co.chapters.length + '章</span>' +
           '<span>' + ic('clock') + hhmm(p.total) + '</span>' +
         '</span>';
  h +=   '<span class="pline"><span class="pb' + (p.done ? ' done' : '') +
           '"><i style="width:' + Math.round(p.rate*100) + '%"></i></span>' +
           '<span class="n">' + pct(p.rate) + '</span></span>';
  h +=   '<span class="cc-foot">' + stPill(co, p) +
           (p.done ? '<button type="button" class="lnk" data-cert="' + esc(co.id) + '">' + ic('file') + '修了証</button>' : '') +
         '</span>';
  h += '</span></button>';
  return h;
}
function bindOpen(){
  eachIn('[data-cert]', function(b){
    b.onclick = function(e){ e.stopPropagation(); route('cert', b.getAttribute('data-cert')); };
  });
  eachIn('[data-open]', function(b){
    b.onclick = function(e){ e.stopPropagation(); route('learn', b.getAttribute('data-open')); };
  });
  eachIn('[data-go2]', function(b){
    b.onclick = function(){ route(b.getAttribute('data-go2')); };
  });
  var hmA = document.getElementById('hmAdm');
  if(hmA) hmA.onclick = firstAdminSetup;
}

function viewCourses(){
  var u = me(), cs = myCourses();
  var cats = [];
  cs.forEach(function(co){ if(cats.indexOf(co.cat) < 0) cats.push(co.cat); });
  var reqCs = cs.filter(function(c){ return c.required; });
  var reqDone = reqCs.filter(function(c){ return courseProgress(u.name, c).done; }).length;

  var h = '<div class="wrap">';
  h += '<div class="prog-h">' +
       '<span class="tag">研修プログラム<small>' + (new Date()).getFullYear() + '年度</small></span>' +
       '<span class="ti"><b>法定研修・社内研修プログラム</b>' +
         '<span>必須 ' + reqCs.length + 'コース中 ' + reqDone + 'コース修了　/　全' +
         cs.length + 'コース</span></span>' +
       '<span class="sp"></span>' +
       '</div>';
  cats.forEach(function(cat){
    var list = cs.filter(function(co){ return co.cat === cat; });
    h += '<div class="cat">' + ic(cat === '法定研修' ? 'alert' : 'book') + esc(cat) +
         '<span class="num">' + list.length + 'コース</span></div><div class="grid">';
    list.forEach(function(co){ h += ccHTML(co, courseProgress(u.name, co)); });
    h += '</div>';
  });
  h += '</div>';
  document.getElementById('main').innerHTML = h;
  bindOpen();
}

/* ══════════════════════════════════════════════════════════════
   画面：受講履歴・学習時間（受講者のマイページ）
   ══════════════════════════════════════════════════════════════ */
function viewHistory(){
  var u = me(), cs = myCourses(), recs = records();
  var rows = [];
  cs.forEach(function(co){
    co.chapters.forEach(function(ch){
      var r = recs[recKey(u.name, ch.id)];
      if(!r) return;
      var tr = trackerUnpack(r);
      rows.push({ co:co, ch:ch, sec:watchedSeconds(tr), rate:watchedRate(tr),
                  fast:r.fast, updated:r.updated });
    });
  });
  rows.sort(function(a, b){ return String(b.updated) < String(a.updated) ? -1 : 1; });

  var h = '<div class="wrap">';
  h += '<div class="ph"><div><h2>受講履歴</h2>' +
       '<div class="sub">視聴した章を、新しい順に並べています。</div></div></div>';
  if(!rows.length){
    h += '<div class="card"><div class="empty">' + ic('history') +
         'まだ受講記録がありません。</div></div></div>';
    document.getElementById('main').innerHTML = h;
    return;
  }
  h += '<div class="tbl-wrap"><table><thead><tr>' +
       '<th class="stick">コース / 章</th><th class="c">視聴率</th><th class="n">視聴時間</th>' +
       '<th class="n">動画の長さ</th><th class="c">倍速</th><th class="n">最終視聴</th><th></th>' +
       '</tr></thead><tbody>';

/* ══════════════════════════════════════════════════════════════
   船井コネクト（掲示板＋サンクスカード）

   ・投稿は押した瞬間に Creator に入る。自動保存のような仕組みは使わない。
   ・開いている画面は、一定の間隔で新着だけを見に行く（書きかけは消さない）。
   ・削除は行を消さず「削除あり」の印を付ける（あとから経緯をたどれるように）。
   ══════════════════════════════════════════════════════════════ */
var FEED = { tab:'all', draft:'', to:'', target:'', open:'', reply:{} };
var FEED_TIMER = 0;
var FEED_EVERY = 25000;        /* 開いている画面が新着を見に行く間隔 */

function nowISO(){ return new Date().toISOString(); }
function newKey(pre){
  return pre + '-' + Date.now().toString(36) + '-' +
         Math.floor(Math.random() * 1e6).toString(36);
}
/* 何分前 */
function ago(iso){
  var t = Date.parse(iso || '');
  if(isNaN(t)) return '';
  var m = Math.floor((Date.now() - t) / 60000);
  if(m < 1) return 'たった今';
  if(m < 60) return m + '分前';
  if(m < 24 * 60) return Math.floor(m / 60) + '時間前';
  var d = Math.floor(m / (24 * 60));
  if(d < 30) return d + '日前';
  return (iso || '').slice(0, 10);
}
/* 生きている投稿を、新しい順に */
function postList(kind){
  var out = [];
  Object.keys(MEM.posts).forEach(function(k){
    var p = MEM.posts[k];
    if(p.deleted) return;
    if(kind && p.kind !== kind) return;
    if(!feedVisible(p)) return;
    out.push(p);
  });
  out.sort(function(a, b){ return String(b.at || '') < String(a.at || '') ? -1 : 1; });
  return out;
}
/* 自分に宛てられた投稿か（宛先が空＝全員） */
function feedVisible(p){
  var t = String(p.target || '').trim();
  if(!t) return true;
  var u = me() || {};
  var mine = people()[normName(u.name)] || u;
  return t === (mine.dept || '');
}
function reactsOf(postId, kind){
  var out = [];
  Object.keys(MEM.reacts).forEach(function(k){
    var r = MEM.reacts[k];
    if(r.deleted || r.post !== postId) return;
    if(kind && r.kind !== kind) return;
    out.push(r);
  });
  out.sort(function(a, b){ return String(a.at || '') < String(b.at || '') ? -1 : 1; });
  return out;
}
function myLike(postId){
  var u = me() || {}, hit = null;
  reactsOf(postId, 'like').forEach(function(r){
    if(normName(r.by) === normName(u.name)) hit = r;
  });
  return hit;
}
/* 書き込みは、押した瞬間に1行入れて送る */
function putPost(o){
  var k = o.id || newKey('p');
  MEM.posts[k] = { id:k, kind:o.kind || 'post', by:o.by || '', byMail:o.byMail || '',
                   to:o.to || '', title:o.title || '', body:o.body || '',
                   target:o.target || '', at:o.at || nowISO(),
                   deleted:!!o.deleted };
  cacheFlush('posts');
  queueSync('post', k);
  return k;
}
function putReact(o){
  var k = o.id || newKey('r');
  MEM.reacts[k] = { id:k, post:o.post || '', kind:o.kind || 'like', by:o.by || '',
                    body:o.body || '', at:o.at || nowISO(), deleted:!!o.deleted };
  cacheFlush('reacts');
  queueSync('react', k);
  return k;
}
/* 消すときは行を残したまま印を付ける */
function dropPost(id){
  var p = MEM.posts[id];
  if(!p) return;
  p.deleted = true;
  cacheFlush('posts');
  queueSync('post', id);
}
function dropReact(id){
  var r = MEM.reacts[id];
  if(!r) return;
  r.deleted = true;
  cacheFlush('reacts');
  queueSync('react', id);
}

/* 開いている画面が新着を拾う。書きかけの欄は触らない */
function feedWatch(on){
  clearTimeout(FEED_TIMER);
  FEED_TIMER = 0;
  if(!on || !ON_CREATOR) return;
  FEED_TIMER = setTimeout(function(){
    var before = Object.keys(MEM.posts).length + Object.keys(MEM.reacts).length;
    loadFeed().then(function(){
      var after = Object.keys(MEM.posts).length + Object.keys(MEM.reacts).length;
      /* いま見ている画面がコネクトのままで、増えていたときだけ描き直す */
      if(after !== before && (VIEW_NOW === 'feed' || VIEW_NOW === 'thanks')){
        feedKeepDraft();
        route(VIEW_NOW);
      }
      feedWatch(true);
    }).catch(function(){ feedWatch(true); });
  }, FEED_EVERY);
}
/* 描き直す前に、書きかけを控えておく */
function feedKeepDraft(){
  var t = document.getElementById('fdBody');
  if(t) FEED.draft = t.value;
  var to = document.getElementById('fdTo');
  if(to) FEED.to = to.value;
  var tg = document.getElementById('fdTarget');
  if(tg) FEED.target = tg.value;
  Object.keys(FEED.reply).forEach(function(k){ delete FEED.reply[k]; });
  eachIn('[data-rc]', function(e){
    if(e.value) FEED.reply[e.getAttribute('data-rc')] = e.value;
  });
}

       '♥ <span>' + likes.length + '</span></button>';
  h += '<button class="fd-cmt" data-popen="' + esc(p.id) + '">' +
       '💬 <span>' + cmts.length + '</span></button>';
  if(likes.length){
    h += '<span class="fd-likers">' +

         (likes.length > 3 ? ' ほか' + (likes.length - 3) + '名' : '') + '</span>';

    h += '<div class="bar"><input class="inp" data-rc="' + esc(p.id) + '" ' +

         '<button class="btn sm" data-csend="' + esc(p.id) + '">送る</button></div>';
    h += '</div>';

  return h;
}

/* ── 画面：プロフィール（顔写真と自己紹介） ── */
var PHOTO_PX = 128;          /* 保存する写真の一辺。名簿に入れるので小さくする */
/* 選んだ画像を、正方形に切って小さくし、JPEG のデータURIにする */
function shrinkPhoto(file){
  return new Promise(function(resolve, reject){
    if(!file || !/^image\//.test(file.type)){ reject(new Error('画像ファイルを選んでください')); return; }
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      try{
        var s = Math.min(img.naturalWidth, img.naturalHeight);
        var sx = (img.naturalWidth - s) / 2, sy = (img.naturalHeight - s) / 2;
        var c = document.createElement('canvas');
        c.width = PHOTO_PX; c.height = PHOTO_PX;
        c.getContext('2d').drawImage(img, sx, sy, s, s, 0, 0, PHOTO_PX, PHOTO_PX);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', 0.82));
      }catch(e){ reject(e); }
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('画像を読み込めませんでした')); };
    img.src = url;
  });
}

function bindFeed(){

    };

      route(VIEW_NOW);
    };
  });
  eachIn('[data-csend]', function(b){
    b.onclick = function(){
      var id = b.getAttribute('data-csend');

/* ══════════════════════════════════════════════════════════════
   社内申請システムとの橋渡し

   社内申請の部品（js/shinsei/）は、社員と部署を SHINSEI_BRIDGE 経由で
   統合側の名簿と職種から読む。名簿を2つ持たないため。
   ログイン情報も統合側のものを渡す。
   ══════════════════════════════════════════════════════════════ */
var SHINSEI_MOUNTED = false;
var SHINSEI_TITLES = ['社長', '本部長', '部長', '課長', '主任', '一般'];
function shinseiEmployee(n){
  var p = people()[n] || {};
  return {
    ID:n, Emp_Key:n,
    Employee_ID:p.emp || '', Employee_Name:p.name || n, Employee_Kana:p.kana || '',
    Email:p.email || '', Department_name:p.dept || '', Department:p.dept || '',
    Title:p.title || '一般',
    Manager:p.manager || '', Manager_name:p.manager || '',
    Roles:[roleOf(p) === 'admin' ? 'システム管理者' : '一般'],
    Join_Date:p.joined || '', Paid_Leave_Balance:(p.leave === undefined ? '' : p.leave),
    Deputy:p.deputy || '', Deputy_From:p.deputyFrom || '', Deputy_To:p.deputyTo || '',
    Is_Active:(p.active !== false)
  };
}
/* 社内申請の社員の形 → 名簿の形 */
function shinseiToPerson(name, o){
  var out = { name:name };
  if(o.Employee_ID !== undefined) out.emp = o.Employee_ID || '';
  if(o.Employee_Kana !== undefined) out.kana = o.Employee_Kana || '';
  if(o.Email !== undefined) out.email = String(o.Email || '').trim();
  if(o.Department_name !== undefined) out.dept = o.Department_name || '';
  if(o.Title !== undefined) out.title = o.Title || '';
  if(o.Manager !== undefined) out.manager = String(o.Manager || o.Manager_name || '');
  if(o.Roles !== undefined){
    var rs = Array.isArray(o.Roles) ? o.Roles : String(o.Roles || '').split(/[,、・]/);
    out.role = rs.some(function(r){ return /管理者/.test(r); }) ? 'admin' : 'learner';
  }
  if(o.Join_Date !== undefined) out.joined = o.Join_Date || '';
  if(o.Paid_Leave_Balance !== undefined) out.leave = (o.Paid_Leave_Balance === '' || o.Paid_Leave_Balance === null) ? '' : Number(o.Paid_Leave_Balance);
  if(o.Deputy !== undefined) out.deputy = String(o.Deputy || '');
  if(o.Deputy_From !== undefined) out.deputyFrom = o.Deputy_From || '';
  if(o.Deputy_To !== undefined) out.deputyTo = o.Deputy_To || '';
  if(o.Is_Active !== undefined) out.active = !!o.Is_Active;
  return out;
}
var SHINSEI_BRIDGE = {
  initParams:function(){ return { loginUser:LOGIN_EMAIL || '', appLinkName:'', environment:'' }; },
  /* 社内申請の「設定・マスタ → 社員／部署」は、統合の職員登録に一本化する */
  openStaff:function(){
    toast('職員の登録・編集は、ログイン画面の「職員登録」から行います');
    route('hub');
  },
  list:function(entity){
    if(entity === 'Employees'){
      return Object.keys(people() || {}).sort().map(shinseiEmployee);
    }
    return jobs().map(function(d, i){
      return { ID:d, Dept_Key:d, Department_Code:'', Department_Name:d,
               Parent_Department:'', Dept_Head:'', Sort_Order:i };
    });
  },
  add:function(entity, obj){
    if(entity === 'Employees'){
      var n = normName(obj.Employee_Name);
      if(!n) throw new Error('氏名を入れてください');
      if(people()[n]) throw new Error('「' + n + '」はすでに名簿にいます');
      registerPerson(shinseiToPerson(n, obj));
      LOADED.all = false;
      var e = shinseiEmployee(n);
      Object.keys(e).forEach(function(k){ obj[k] = e[k]; });
      return obj;
    }
    var d = String(obj.Department_Name || '').trim();
    if(!d) throw new Error('部署名を入れてください');
    if(jobs().indexOf(d) < 0) setJobs(jobs().concat([d]));
    obj.ID = d; obj.Dept_Key = d;
    return obj;
  },
  update:function(entity, id, patch){
    if(entity === 'Employees'){
      var cur = normName(id);
      if(!people()[cur]) throw new Error('その方が名簿に見つかりません');
      var body = shinseiToPerson(cur, patch);
      delete body.name;
      body.name = cur;
      registerPerson(body);
      if(patch.Employee_Name && normName(patch.Employee_Name) !== cur){
        var r = renamePerson(cur, patch.Employee_Name);
        if(!r.ok) throw new Error(r.why);
      }
      LOADED.all = false;
      return patch;
    }
    if(patch.Department_Name && patch.Department_Name !== id){
      if(!renameJob(id, patch.Department_Name)) throw new Error('その部署名はすでにあります');
    }
    return patch;
  }
};

function parseVideoId(s){
  s = String(s || '').trim();
  if(!s) return '';
  var m = s.match(/(?:v=|\/embed\/|youtu\.be\/|\/shorts\/|\/live\/)([A-Za-z0-9_-]{11})/);
  if(m) return m[1];
  if(/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  return '';
}
