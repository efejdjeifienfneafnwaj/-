<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>研修ポータル</title>
<!-- Zoho Creator ウィジェットSDK。Creator上でのみ ZOHO が定義される。
     ファイルを直接開いた場合は読み込みに失敗するが、
     そのときはブラウザ内保存で動くようにしてあるのでエラーにはならない。 -->
<script src="https://js.zohostatic.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- 社内申請システム（shinsei/ から tools/申請を取り込む.py が作る。#shinsei の中だけに効く） -->
<link rel="stylesheet" href="css/shinsei.css">
<style>
/* ══════════════════════════════════════════════════════════════
   1. 色とサイズ
      上の帯は水色のグラデーション、左は白のメニュー、数字のタイルは濃紺。
      法人カラーに合わせるときは、この30行だけ触れば全体が変わる。
   ══════════════════════════════════════════════════════════════ */
:root{
  /* 船井総研の青を基準にした配色。ここだけ触れば全体の色が変わる */
  --brand-1:#1258b8; --brand-2:#1a72b5;          /* 上の帯・入口のグラデーション */
  --pri:#1258b8;     --pri-2:#0e4795;            /* 数字のタイル・主ボタン */
  --acc:#0e5aa6;     --acc-soft:#e7f1fd;         /* リンク・選択中 */
  --sky:#2f9ee2;     --sky-2:#6ec6f0;            /* 明るい青（入口の図など） */
  --ok:#1f8f46;      --ok-soft:#e6f5eb;
  --warn:#c8850f;    --warn-soft:#fdf3e0;
  --bad:#cf3434;     --bad-soft:#fceaea;
  --kaki:#a85226;    --kaki-soft:#fbeadf;
  /* 白い文字をのせる濃い方（丸・ふだ・ボタン） */
  --ok-dp:#17703a;   --warn-dp:#8a5a00; --bad-dp:#b02222; --kaki-dp:#8c3f16;
  /* 淡い色の上にのせる文字の色（ふだの中身・状態の文字） */
  --ok-ink:#146b36;  --warn-ink:#7d5200; --bad-ink:#a81d1d; --kaki-ink:#8c3f16;
  --acc-on:#ffffff;  /* --acc を背景にしたときの文字色 */

  --bg:#f2f6fb;      --surface:#ffffff; --surface-2:#f6f9fd; --sunken:#e6edf5;
  --ink:#1c2b38;     --ink-2:#4a5c6b;   --ink-3:#5c7181;
  --rule:#dfe7f0;    --rule-2:#c3d1de;
  --side:#ffffff;    --side-ink:#33465a; --side-rule:#e4ebf3;
  --sh:0 1px 2px rgba(18,60,120,.06), 0 3px 10px rgba(18,60,120,.06);
  --sh-2:0 2px 5px rgba(18,60,120,.09), 0 14px 32px rgba(18,60,120,.13);
  --side-w:238px; --top-h:56px; --r:9px; --r-sm:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --brand-1:#0d3d80; --brand-2:#1a6aa8;
    --pri:#2a73b8;     --pri-2:#4a95d6;
    --acc:#5fa8d8;     --acc-soft:#16283a;
    --sky:#4aa6e0;     --sky-2:#7cc9f2;
    --ok:#4bb56c;      --ok-soft:#12261a;
    --warn:#dca63c;    --warn-soft:#2a2113;
    --bad:#e06a6a;     --bad-soft:#2b1616;
    --kaki:#d8845a;    --kaki-soft:#2a1b14;
    --ok-dp:#1f7a41;   --warn-dp:#7a5a12; --bad-dp:#9c2f2f; --kaki-dp:#8a4526;
    --ok-ink:#4bb56c;  --warn-ink:#dca63c; --bad-ink:#e06a6a; --kaki-ink:#d8845a;
    --acc-on:#0b1a26;
    --bg:#0c1319;      --surface:#141e26; --surface-2:#1a252e; --sunken:#202d38;
    --ink:#e3eaf0;     --ink-2:#a6b6c2;   --ink-3:#8a9bab;
    --rule:#243139;    --rule-2:#324450;
    --side:#141e26;    --side-ink:#c3d0da; --side-rule:#243139;
    --sh:0 1px 2px rgba(0,0,0,.4), 0 3px 10px rgba(0,0,0,.3);
    --sh-2:0 2px 4px rgba(0,0,0,.45), 0 12px 28px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --brand-1:#0d3d80; --brand-2:#1a6aa8;
  --pri:#2a73b8;     --pri-2:#4a95d6;
  --acc:#5fa8d8;     --acc-soft:#16283a;
  --sky:#4aa6e0;     --sky-2:#7cc9f2;
  --ok:#4bb56c;      --ok-soft:#12261a;
  --warn:#dca63c;    --warn-soft:#2a2113;
  --bad:#e06a6a;     --bad-soft:#2b1616;
  --kaki:#d8845a;    --kaki-soft:#2a1b14;
  --ok-dp:#1f7a41;   --warn-dp:#7a5a12; --bad-dp:#9c2f2f; --kaki-dp:#8a4526;
  --ok-ink:#4bb56c;  --warn-ink:#dca63c; --bad-ink:#e06a6a; --kaki-ink:#d8845a;
  --acc-on:#0b1a26;
  --bg:#0c1319;      --surface:#141e26; --surface-2:#1a252e; --sunken:#202d38;
  --ink:#e3eaf0;     --ink-2:#a6b6c2;   --ink-3:#8a9bab;
  --rule:#243139;    --rule-2:#324450;
  --side:#141e26;    --side-ink:#c3d0da; --side-rule:#243139;
  --sh:0 1px 2px rgba(0,0,0,.4), 0 3px 10px rgba(0,0,0,.3);
  --sh-2:0 2px 4px rgba(0,0,0,.45), 0 12px 28px rgba(0,0,0,.45);
}

/* ══════════════════════════════════════════════════════════════
   2. 土台
   ══════════════════════════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:"Noto Sans JP",system-ui,sans-serif;background:var(--bg);color:var(--ink);
  font-size:14.5px;line-height:1.85;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
}
h1,h2,h3,h4{line-height:1.45;font-weight:700;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;background:none;border:none;}
a{color:var(--acc);}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;}
.ic{display:inline-flex;align-items:center;justify-content:center;flex:none;}
.ic svg{width:1em;height:1em;display:block;}

/* ══════════════════════════════════════════════════════════════
   3. 全体のわりつけ
   ══════════════════════════════════════════════════════════════ */
.app{display:none;}
.app.on{display:block;}

/* ───── 上の帯 ───── */
.top{
  height:var(--top-h);background:linear-gradient(100deg,var(--brand-1),var(--brand-2));
  display:flex;align-items:center;gap:14px;padding:0 16px;color:#fff;
  position:sticky;top:0;z-index:40;box-shadow:0 1px 4px rgba(0,0,0,.12);
}
.top .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;white-space:nowrap;}
.top .logo .mk{
  width:28px;height:28px;border-radius:50%;background:#fff;color:var(--brand-1);
  display:grid;place-items:center;font-size:14px;font-weight:700;flex:none;
}
.top .logo small{font-weight:400;font-size:12px;opacity:.88;margin-left:2px;}
.top .sp{flex:1;}
.top .ico{
  width:38px;height:38px;border-radius:var(--r-sm);color:#fff;font-size:18px;
  display:grid;place-items:center;opacity:.92;position:relative;
}
.top .ico:hover{background:rgba(255,255,255,.16);}
.top .ico .dot{
  position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:#ffd24a;
}
.top .ico .num{
  position:absolute;top:1px;right:0;min-width:15px;height:15px;border-radius:8px;
  background:#e4004f;color:#fff;font-size:9.5px;font-weight:700;line-height:15px;
  padding:0 4px;font-family:"IBM Plex Mono",monospace;
}
.top .ico .num:not([hidden]) ~ .dot{display:none;}
.top .me{
  display:flex;align-items:center;gap:9px;font-size:13.5px;white-space:nowrap;
  color:#fff;padding:4px 8px 4px 4px;border-radius:20px;min-height:38px;
}
.top .me:hover{background:rgba(255,255,255,.16);}
.top .me .ava{box-shadow:0 0 0 2px rgba(255,255,255,.5);}
.sync{
  font-size:11px;font-family:"IBM Plex Mono",monospace;color:rgba(255,255,255,.9);
  display:flex;align-items:center;gap:5px;white-space:nowrap;
}
.sync::before{content:"";width:6px;height:6px;border-radius:50%;background:#7ee29a;}
.sync.wait::before{background:#ffd24a;}
.sync.err{color:#ffd9d4;font-weight:700;}
.sync.err::before{background:#ff8f7d;}
.sync:empty{display:none;}
.burger{display:none;width:40px;height:40px;border-radius:var(--r-sm);color:#fff;font-size:19px;place-items:center;}

/* ───── 左のメニュー ───── */
.shell{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);align-items:start;}
.side{
  background:var(--side);border-right:1px solid var(--side-rule);
  position:sticky;top:var(--top-h);height:calc(100vh - var(--top-h));
  overflow-y:auto;padding:8px 0 24px;
}
.nav-i{
  display:flex;align-items:center;gap:11px;width:100%;padding:12px 16px;
  color:var(--side-ink);font-size:14px;font-weight:500;text-align:left;position:relative;
}
.nav-i .ic{font-size:18px;color:var(--acc);opacity:.95;}
.nav-i:hover{background:var(--surface-2);}
.nav-i .caret{margin-left:auto;font-size:10px;color:var(--ink-3);transition:transform .18s;}
.nav-i[aria-expanded="true"] .caret{transform:rotate(180deg);}
.nav-i[aria-current="page"]{background:var(--acc-soft);color:var(--acc);font-weight:700;}
.nav-i[aria-current="page"]::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc);
}
.nav-sub{display:none;padding:2px 0 6px;}
.nav-sub.on{display:block;}
.nav-s{
  display:flex;align-items:center;gap:8px;width:100%;padding:9px 14px 9px 43px;
  color:var(--ink-2);font-size:13.5px;text-align:left;position:relative;
}
.nav-s::before{content:"▸";color:var(--ink-3);font-size:10px;position:absolute;left:28px;}
.nav-s:hover{background:var(--surface-2);}
.nav-s[aria-current="page"]{background:var(--acc-soft);color:var(--acc);font-weight:700;}
.nav-s[aria-current="page"]::after{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc);
}
.nav-sep{height:1px;background:var(--side-rule);margin:8px 0;}

/* ───── アプリの入口（3つのカード） ───── */
.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:16px;}
.hub-c{
  display:grid;gap:7px;justify-items:start;text-align:left;
  padding:24px 22px;border:1px solid var(--rule);border-radius:var(--r-md);
  background:var(--surface);color:var(--ink-1);cursor:pointer;
  transition:border-color .16s, transform .16s, box-shadow .16s;
}
.hub-c:hover{border-color:var(--acc);transform:translateY(-2px);box-shadow:var(--sh-2);}
.hub-c.off{opacity:.55;cursor:default;}
.hub-c.off:hover{border-color:var(--rule);transform:none;box-shadow:none;}
.hub-c b{font-size:17px;}
.hub-i{
  width:46px;height:46px;border-radius:var(--r-sm);display:grid;place-items:center;
  background:var(--acc-soft);color:var(--acc);margin-bottom:4px;
}
.hub-i .ic{font-size:24px;}
.hub-s{font-size:12.5px;color:var(--ink-3);}
/* 入口（ログイン画面）に並べる3つのアプリ */

/* ───── 船井コネクト ───── */
.fd-card{
  background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-md);
  padding:15px 17px;margin-bottom:13px;
}
.fd-head{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.fd-who{display:grid;line-height:1.35;min-width:0;flex:1;}
.fd-who b{font-size:13.5px;}
.fd-who span{font-size:11.5px;color:var(--ink-3);}
.fd-to{
  display:flex;align-items:center;gap:7px;margin-bottom:8px;padding:8px 11px;
  background:var(--acc-soft);border-radius:var(--r-sm);font-size:13px;
}
.fd-ttl{font-weight:700;margin-bottom:5px;}
.fd-body{font-size:13.5px;line-height:1.75;word-break:break-word;}
.fd-ops{display:flex;align-items:center;gap:13px;margin-top:11px;
  padding-top:10px;border-top:1px solid var(--rule);}
.fd-like,.fd-cmt{font-size:13px;color:var(--ink-3);display:flex;align-items:center;gap:5px;
  min-height:34px;padding:0 4px;}
.fd-like:hover,.fd-cmt:hover{color:var(--acc);}
.fd-like.on{color:var(--acc);font-weight:700;}
.fd-likers{font-size:11.5px;color:var(--ink-3);margin-left:auto;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fd-cmts{margin-top:11px;padding-top:11px;border-top:1px solid var(--rule);display:grid;gap:10px;}
.fd-c{display:flex;gap:9px;align-items:flex-start;}
.fd-ct{flex:1;min-width:0;font-size:13px;line-height:1.6;}
.fd-ct b{margin-right:7px;}
.fd-new{border-color:var(--acc);}
.nav-h{
  padding:12px 16px 4px;font-size:11px;font-weight:700;letter-spacing:.06em;
  color:var(--ink-3);border-top:1px solid var(--side-rule);margin-top:8px;
}

/* ───── 本文 ───── */
.body{min-width:0;}
.crumb-bar{
  background:var(--surface);border-bottom:1px solid var(--rule);
  padding:12px 26px;display:flex;align-items:center;gap:8px;
  position:sticky;top:var(--top-h);z-index:25;
}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3);min-width:0;}
.crumb button{color:var(--acc);font-size:13px;}
.crumb button:hover{text-decoration:underline;}
.crumb .sep{opacity:.55;}
.crumb b{color:var(--ink);font-weight:700;}
.wrap{padding:26px 26px 72px;max-width:1440px;}

/* ══════════════════════════════════════════════════════════════
   4. 共通部品
   ══════════════════════════════════════════════════════════════ */
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
.ph h2{font-size:21px;letter-spacing:.01em;}
.ph .sub{font-size:13.5px;color:var(--ink-2);margin-top:5px;}
.ph .sp{flex:1;}
.ava{
  width:33px;height:33px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-size:13px;font-weight:700;color:#fff;background:var(--pri);line-height:1;overflow:hidden;
}
.ava.sm{width:29px;height:29px;font-size:12px;}
.ava.lg{width:42px;height:42px;font-size:16px;}
.btn{
  display:inline-flex;align-items:center;gap:7px;background:var(--pri);color:#fff;
  border-radius:var(--r-sm);padding:9px 18px;font-size:13.5px;font-weight:700;white-space:nowrap;
  transition:background .14s,box-shadow .14s;
}
.btn .ic{font-size:15px;}
.btn:hover{background:var(--pri-2);}
.btn.w{width:100%;justify-content:center;padding:11px;}
.btn.sub{background:var(--surface);color:var(--ink-2);border:1px solid var(--rule-2);}
.btn.sub:hover{background:var(--surface-2);color:var(--ink);}
.btn.ok{background:var(--ok-dp);} .btn.ok:hover{filter:brightness(1.12);}
.btn.sm{padding:6px 12px;font-size:12.5px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn.ghost{
  background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.34);
  font-weight:500;font-size:11px;padding:3px 10px;
}
.btn.ghost:hover{background:rgba(255,255,255,.28);}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);}
.pad{padding:20px 22px;}
.field{display:grid;gap:5px;}
.field label{font-size:13px;font-weight:700;color:var(--ink-2);}
.inp,.field input,.field select{
  background:var(--surface);border:1px solid var(--rule-2);border-radius:var(--r-sm);
  padding:10px 13px;font-size:14px;width:100%;
}
.inp:focus,.field input:focus,.field select:focus{
  outline:none;border-color:var(--acc);
  box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--acc);
}
/* キーボードで移動したときに、今どこにいるかが必ず分かるようにする */
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:3px;}
.top :focus-visible,.gate :focus-visible,.btn-start:focus-visible{outline-color:#ffd83d;}
.inp:focus-visible,.field input:focus-visible,.field select:focus-visible{outline:none;}
tbody tr:focus-visible td{background:var(--acc-soft);}
.note{background:var(--warn-soft);border-left:4px solid var(--warn);padding:14px 17px;border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:13.5px;}
.note.calm{background:var(--acc-soft);border-left-color:var(--acc);}
.note b{color:var(--warn-ink);} .note.calm b{color:var(--acc);}
.empty{text-align:center;padding:46px 20px;color:var(--ink-3);font-size:14px;}
.empty .ic{font-size:26px;opacity:.3;display:flex;justify-content:center;margin-bottom:9px;}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:11px;white-space:nowrap;}
.pill .ic{font-size:12px;}
.pill.ok{background:var(--ok-soft);color:var(--ok-ink);}
.pill.mid{background:var(--warn-soft);color:var(--warn-ink);}
.pill.no{background:var(--sunken);color:var(--ink-2);}
.pill.bad{background:var(--bad-soft);color:var(--bad-ink);}
.pill.req{background:var(--kaki-soft);color:var(--kaki-ink);}
.pb{height:8px;background:var(--sunken);border-radius:5px;overflow:hidden;}
.pb i{display:block;height:100%;background:var(--acc);border-radius:5px;transition:width .35s;}
.pb.done i{background:var(--ok);}
.pline{display:flex;align-items:center;gap:9px;}
.pline .pb{flex:1;min-width:36px;}
.pline .n{font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:600;color:var(--ink);min-width:40px;text-align:right;}
.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;}
.back{display:inline-flex;align-items:center;gap:5px;color:var(--acc);font-size:12.5px;margin-bottom:12px;}
.back:hover{text-decoration:underline;}

/* ══════════════════════════════════════════════════════════════
   5. 数字のタイル
   ══════════════════════════════════════════════════════════════ */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:13px;margin-bottom:18px;}
.kpi{
  background:var(--pri);color:#fff;border-radius:var(--r);padding:15px 18px 14px;
  display:grid;gap:2px;text-align:center;box-shadow:var(--sh);
}
.kpi .k{font-size:13px;opacity:.94;display:flex;align-items:center;gap:7px;justify-content:center;}
.kpi .k .ic{font-size:13px;opacity:.85;}
.kpi .v{font-family:"IBM Plex Mono",monospace;font-size:34px;font-weight:600;line-height:1.2;}
.kpi .v small{font-family:"Noto Sans JP";font-size:11.5px;font-weight:400;opacity:.85;margin-left:3px;}
.kpi .foot{margin-top:5px;display:flex;justify-content:center;}
.kpi.t-ok{background:var(--ok-dp);}
.kpi.t-mid{background:var(--warn-dp);}
.kpi.t-no{background:#4d6272;}
/* 白いタイル（受講者のマイページ用） */
.tile{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:15px 17px;box-shadow:var(--sh);}
.tile .th{display:flex;align-items:center;gap:8px;color:var(--acc);font-weight:700;font-size:14px;margin-bottom:12px;}
.tile .th .ic{font-size:15px;}
.tile .th .sp{flex:1;}
.tile .big{font-family:"IBM Plex Mono",monospace;font-size:32px;font-weight:600;text-align:center;line-height:1.25;}
.tile .big small{font-family:"Noto Sans JP";font-size:12px;font-weight:400;color:var(--ink-3);}
.tile .cap{text-align:center;font-size:11.5px;color:var(--ink-3);}
.tabs{display:flex;border:1px solid var(--rule-2);border-radius:var(--r-sm);overflow:hidden;margin-bottom:11px;}
.tabs button{flex:1;padding:6px 10px;font-size:12px;color:var(--ink-2);background:var(--surface);border-right:1px solid var(--rule);}
.tabs button:last-child{border-right:none;}
.tabs button[aria-pressed="true"]{background:var(--pri);color:#fff;font-weight:700;}
.rows{display:grid;gap:0;}
.rows .r{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--rule);font-size:13.5px;}
.rows .r:last-child{border-bottom:none;}
.rows .r span:first-child{color:var(--ink-2);}
.rows .r b{font-family:"IBM Plex Mono",monospace;font-weight:600;}

/* ══════════════════════════════════════════════════════════════
   6. しぼりこみ・操作の帯
   ══════════════════════════════════════════════════════════════ */
.tools{
  background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);
  padding:13px 15px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:13px;
}
.tools .inp{width:auto;min-width:150px;}
.tools #admQ{min-width:194px;}
.tools .sp{flex:1;}
.tools .cnt{font-size:13px;color:var(--ink-2);white-space:nowrap;}
.tools .cnt b{color:var(--ink);font-family:"IBM Plex Mono",monospace;}
.seg{display:flex;border:1px solid var(--rule-2);border-radius:var(--r-sm);overflow:hidden;}
.seg button{padding:8px 14px;font-size:13px;color:var(--ink-2);background:var(--surface);border-right:1px solid var(--rule);}
.seg button:last-child{border-right:none;}
.seg button[aria-pressed="true"]{background:var(--pri);color:#fff;font-weight:700;}
.seg button:hover:not([aria-pressed="true"]){background:var(--surface-2);}
/* 並び替えできる見出し */
.sortb{
  display:inline-flex;align-items:center;gap:4px;font:inherit;color:inherit;
  font-weight:700;padding:0;white-space:nowrap;
}
.sortb .ar{font-size:9px;opacity:.4;}
.sortb:hover{color:var(--acc);}
.sortb.on{color:var(--acc);} .sortb.on .ar{opacity:1;}
.pager{display:flex;align-items:center;gap:3px;}
.pager button{
  width:36px;height:36px;border:1px solid var(--rule-2);border-radius:var(--r-sm);
  color:var(--acc);display:grid;place-items:center;font-size:12px;background:var(--surface);
}
.pager button:hover:not(:disabled){background:var(--acc-soft);}
.pager button:disabled{opacity:.45;cursor:not-allowed;color:var(--ink-2);}

/* ══════════════════════════════════════════════════════════════
   7. 表
   ══════════════════════════════════════════════════════════════ */
.tbl-wrap{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);overflow:auto;box-shadow:var(--sh);}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px;}
th,td{padding:13px 15px;text-align:left;border-bottom:1px solid var(--rule);vertical-align:middle;}
thead th{
  font-size:12px;color:var(--ink-2);background:var(--surface-2);white-space:nowrap;font-weight:700;
  position:sticky;top:0;z-index:3;border-bottom:2px solid var(--rule-2);letter-spacing:.02em;
}
thead th .rq{display:block;font-weight:700;color:var(--kaki);font-size:11px;}
thead th small{display:block;font-weight:400;color:var(--ink-3);font-size:11px;}
tbody tr:hover td{background:var(--surface-2);}
tbody tr.sel td{background:var(--acc-soft);}
tbody tr:last-child td{border-bottom:none;}
td.n{font-family:"IBM Plex Mono",monospace;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
td.c,th.c{text-align:center;}
td.c .ckbox input{accent-color:var(--acc);width:19px;height:19px;cursor:pointer;}
/* 列が多いと職種やグループが1文字ずつ折り返されるので、折り返さない */
td.nw{white-space:nowrap;}
th.ck,td.ck{width:36px;padding-right:0;text-align:center;}
td.ck input,th.ck input{accent-color:var(--acc);width:19px;height:19px;cursor:pointer;}
/* チェックボックスを包む札。見た目は19pxのまま、指で押せる範囲だけ広げる */
.ckbox{display:inline-grid;place-items:center;width:38px;height:38px;cursor:pointer;vertical-align:middle;}
.ckbox:focus-within{outline:3px solid var(--acc);outline-offset:-2px;border-radius:var(--r-sm);}
.tbl-wrap th.stick,.tbl-wrap td.stick{
  position:sticky;left:0;background:var(--surface);z-index:2;border-right:1px solid var(--rule);
  min-width:158px;max-width:216px;
}
.tbl-wrap thead th.stick{z-index:4;background:var(--surface-2);}
tbody tr:hover td.stick{background:var(--surface-2);}
tbody tr.sel td.stick{background:var(--acc-soft);}
.who-cell{display:flex;align-items:center;gap:9px;min-width:0;}
.who-t{min-width:0;}
.who-t b{font-weight:700;font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.who-t span{font-size:11.5px;color:var(--ink-3);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.who-t b button{color:inherit;font:inherit;}
.who-t b button:hover{color:var(--acc);text-decoration:underline;}

/* 丸アイコン＋文字の状態表示 */
.st{display:grid;place-items:center;gap:2px;justify-items:center;}
.st .dot{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff;}
.st .lb{font-size:11px;font-weight:700;white-space:nowrap;}
.st.done .dot{background:var(--ok-dp);}  .st.done .lb{color:var(--ok-ink);}
.st.mid  .dot{background:var(--warn-dp);} .st.mid .lb{color:var(--warn-ink);}
.st.no   .dot{background:var(--bad-dp);}  .st.no  .lb{color:var(--bad-ink);}
.st.zero .dot{background:var(--sunken);color:var(--ink-2);} .st.zero .lb{color:var(--ink-2);}
.st .sm{font-size:10.5px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;}

/* ══════════════════════════════════════════════════════════════
   8. 入口
      背景は画面いっぱいに1枚。その中央に、ロゴ・タイトル・入力を縦に並べる。
   ══════════════════════════════════════════════════════════════ */
.gate{
  min-height:100vh;position:relative;overflow:hidden;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;align-content:start;gap:14px;
  padding:18px clamp(18px,5vw,64px) 22px;
  /* 明るいオフィスの写真が無いときの、淡い背景 */
  background:
    radial-gradient(ellipse 60% 50% at 18% 30%,rgba(120,180,240,.35),transparent 70%),
    radial-gradient(ellipse 50% 45% at 82% 65%,rgba(140,220,190,.28),transparent 70%),
    linear-gradient(180deg,#f2f6fb 0%,#e6eef7 100%);
  color:#1c2b38;
}
.gate-top{position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.gate-brand{display:grid;gap:3px;justify-items:start;}
.gate-brand small{font-size:11px;letter-spacing:.14em;color:#4a5c6b;}
.gate-tag{text-align:right;color:#26364a;font-size:15px;letter-spacing:.16em;font-weight:500;}
.gate-tag small{display:block;font-size:11px;letter-spacing:.14em;color:#7a8a99;margin-top:3px;}
.gate-mid{
  position:relative;display:grid;grid-template-columns:1fr minmax(320px,470px) 1fr;
  align-items:center;gap:24px;
}
.gate-copy h2{font-size:clamp(16px,1.4vw,19px);line-height:1.9;letter-spacing:.14em;font-weight:500;color:#26364a;margin:0 0 12px;}
.gate-copy hr{width:26px;border:0;border-top:1px solid #7a8a99;margin:0 0 12px;}
.gate-copy p{font-size:14px;letter-spacing:.06em;color:#3b4c5c;margin:0;line-height:1.9;}
.gate-script{
  font-family:"Segoe Script","Brush Script MT","Snell Roundhand","Apple Chancery",cursive;
  font-size:clamp(34px,4vw,56px);color:#2f7bd6;line-height:1.2;text-align:right;
  letter-spacing:.02em;opacity:.92;transform:rotate(-6deg);
}
.gate-col{position:relative;width:100%;text-align:center;display:grid;justify-items:center;}
.wordmark{
  font-size:clamp(40px,4.4vw,56px);font-weight:800;letter-spacing:-.02em;line-height:1.05;margin-top:4px;
  background:linear-gradient(90deg,#1e2b3b 0%,#1e2b3b 55%,#1f6fd0 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.wordmark .e{color:inherit;}
.wordsub{
  margin-top:10px;font-size:13px;letter-spacing:.34em;color:#2c3e50;text-indent:.34em;
  display:flex;align-items:center;justify-content:center;gap:12px;
}
.wordsub::before,.wordsub::after{content:"";display:block;width:44px;height:1px;background:#7a8a99;}
.gate-catch{margin-top:18px;font-size:clamp(17px,1.9vw,25px);letter-spacing:.1em;font-weight:600;color:#1e2b3b;line-height:1.6;}
.gate-catch-sub{margin-top:10px;font-size:13px;letter-spacing:.06em;color:#3b4c5c;line-height:1.9;}
.gate-kw{margin:14px 0 6px;font-size:10.5px;letter-spacing:.3em;color:#7a8a99;}
/* アプリは丸いアイコン。押した瞬間にそのアプリへ入る */
.gate-apps{
  position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(22px,4vw,64px);
  width:100%;margin:0 auto;
}
.gate-app{
  display:grid;justify-items:center;gap:8px;width:168px;padding:4px 4px;
  background:transparent;border:0;cursor:pointer;color:#1c2b38;text-align:center;
  transition:transform .16s;
}
.gate-app .hub-i{
  width:100px;height:100px;border-radius:50%;margin:0;
  background:rgba(255,255,255,.78);box-shadow:0 12px 30px rgba(20,50,90,.16), 0 0 0 1px rgba(255,255,255,.8) inset;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  transition:transform .16s, box-shadow .16s;position:relative;
}
.gate-app .hub-i .ic{font-size:40px;}
.gate-app:hover .hub-i{transform:translateY(-3px) scale(1.04);box-shadow:0 18px 40px rgba(20,50,90,.22);}
.gate-app:focus-visible{outline:none;}
.gate-app:focus-visible .hub-i{box-shadow:0 0 0 4px rgba(44,111,214,.45), 0 12px 30px rgba(20,50,90,.16);}
.gate-app.off{opacity:.55;cursor:default;}
.gate-app b{font-size:16px;display:block;line-height:1.3;}
.gate-app .hub-s{font-size:12px;color:#4a5c6b;line-height:1.5;}
.gate-app .arrow{display:none;}
.gate-app.c-shinsei .hub-i{color:#2c6fd6;background:rgba(224,236,252,.92);}
.gate-app.c-lms .hub-i{color:#2e9e5b;background:rgba(224,245,232,.92);}
.gate-app.c-connect .hub-i{color:#d08a1e;background:rgba(253,240,220,.92);}
.gate-app.c-staff .hub-i{color:#4b4f6b;background:rgba(236,236,244,.92);border:2px dashed rgba(75,79,107,.35);}
.gate-app.c-staff b{color:#4b4f6b;}
.gate-foot{position:relative;text-align:center;font-size:12px;color:#4a5c6b;letter-spacing:.06em;line-height:1.9;}
.gate-foot small{display:block;font-size:11px;color:#7a8a99;}
@media (max-width:1100px){
  .gate-mid{grid-template-columns:1fr;justify-items:center;}
  .gate-copy,.gate-script{display:none;}
  .gate-col{max-width:640px;}
}
.hero{position:absolute;inset:0;}
.hero-svg{width:100%;height:100%;display:block;}
.hero-img{position:absolute;inset:0;background-size:cover;background-position:center;}
/* zipの中に置いた背景画像（app/bg.jpg） */
.hero-file{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
/* 写真の上に白いかぶせを置いて、文字と入力欄を読みやすくする（明るい配色） */
.hero-veil{
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,.12) 50%,rgba(255,255,255,.40) 100%);
}
.gate-brand small{font-size:10.5px;letter-spacing:.16em;color:#4a5c6b;}

.gate-col{position:relative;width:min(452px,100%);text-align:center;}
.brand{display:inline-block;margin-bottom:6px;}
.logo-set{display:inline-flex;align-items:center;gap:11px;}
.logo-mk{display:block;}
.logo-wd{
  display:inline-flex;align-items:baseline;gap:7px;font-size:23px;letter-spacing:.01em;
  font-family:"Noto Sans JP",sans-serif;font-weight:400;color:#1c1c1c;position:relative;
  white-space:nowrap;padding-top:.12em;
}
.logo-wd b{font-weight:400;}
.logo-wd .ii{position:relative;display:inline-block;}
.logo-wd .dot{
  position:absolute;left:50%;transform:translateX(-50%);top:.04em;
  width:.20em;height:.20em;border-radius:50%;background:#e4004f;
}
.logo-img{display:block;max-width:100%;object-fit:contain;}


.gate-card,.hbox,.hbtn,.brand{
  /* 入口のカードは常に白い紙の上。暗い配色のときも明るい方の色に固定する */
  --surface:#ffffff;  --surface-2:#f6f9fd; --sunken:#e6edf5;
  --ink:#1c2b38;      --ink-2:#4a5c6b;     --ink-3:#5c7181;
  --rule:#dfe7f0;     --rule-2:#c3d1de;
  --pri:#1258b8;      --pri-2:#0e4795;
  --acc:#0e5aa6;      --acc-soft:#e7f1fd;  --acc-on:#ffffff;
  --ok-ink:#146b36;   --warn-ink:#7d5200;  --bad-ink:#a81d1d; --kaki-ink:#8c3f16;
  --kaki:#8c3f16;     --warn:#7d5200;      --bad:#a81d1d;      --ok:#17703a;
  /* 淡い背景も明るい方に固定する。片方だけだと、暗い背景に濃い文字が乗って読めなくなる */
  --ok-soft:#e6f5eb;  --warn-soft:#fdf3e0; --bad-soft:#fceaea; --kaki-soft:#fbeadf;
  --sunken:#e6edf5;
  color:var(--ink-2);
}
.gate-card{
  /* 中央の丸いすりガラス */
  width:min(570px,96vw);min-height:min(570px,96vw);border-radius:50%;
  background:rgba(255,255,255,.62);
  -webkit-backdrop-filter:blur(18px) saturate(1.1);backdrop-filter:blur(18px) saturate(1.1);
  box-shadow:0 0 0 1px rgba(255,255,255,.75) inset, 0 0 0 14px rgba(255,255,255,.18),
             0 0 0 15px rgba(140,190,240,.35), 0 30px 80px rgba(20,50,90,.16);
  padding:40px 64px 36px;text-align:center;display:grid;align-content:center;gap:0;
}
.gate-card .card-head{text-align:center;margin-bottom:6px;}
/* 中身が多いとき（動作確認用の入力欄など）は、丸ではなく角丸にする */
.gate-card.tall{border-radius:40px;min-height:0;}
.gate-card .field{margin-bottom:8px;text-align:left;}
.gate-card .who-me{justify-content:center;}
.gate-card .ro{background:rgba(255,255,255,.7);}
/* 丸の中は縦に長いので、ログイン情報は小さく1行に */
.gate-me{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:14px;
  font-size:13px;color:#1e2b3b;flex-wrap:wrap;}
.gate-me .mail{font-size:11.5px;color:#4a5c6b;}
.gate-card .field{margin-bottom:14px;}
/* ラベルの横に添える小さな説明。くっついて読めなくなるので、必ず間を空ける */
.note-s{font-weight:400;color:var(--ink-3);margin-left:6px;font-size:12px;}
.note-s::before{content:"（";}
.note-s::after{content:"）";}
.gate-card .two{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.btn-start{
  width:100%;margin-top:6px;padding:15px;border-radius:9px;border:none;
  background:linear-gradient(180deg,#ffa347,#f57c1e);color:#3a1c00;
  font-size:17px;font-weight:900;letter-spacing:.12em;
  box-shadow:0 6px 18px rgba(230,110,20,.42);transition:filter .14s,transform .06s;
}
.btn-start:hover{filter:brightness(1.06);}
.btn-start:active{transform:translateY(1px);}
.cardnote{margin-top:11px;font-size:11.5px;color:var(--ink-3);text-align:center;}
/* 入口：ログイン中のメールアドレス */
.who-me{
  display:flex;align-items:center;gap:8px;margin-bottom:16px;padding:10px 13px;
  background:var(--acc-soft);border:1px solid var(--rule);border-radius:var(--r-sm);
  font-size:12.5px;color:var(--ink-2);word-break:break-all;
}
.who-me .ic{color:var(--acc);flex:none;}
/* 入口：名簿から出す読み取り専用の欄 */
.ro{
  padding:10px 13px;border:1px solid var(--rule);border-radius:var(--r-sm);
  background:var(--surface-2);font-size:13px;color:var(--ink-2);min-height:40px;
  display:flex;align-items:center;gap:9px;
}
.ro-lg{font-size:16px;color:var(--ink);}
.ro-lg b{font-weight:700;}
/* 入口の下にある管理者の入口 */
.gate-adm{margin-top:16px;padding-top:14px;border-top:1px solid var(--rule);text-align:center;}
.gate-adm button{
  display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:7px 12px;
  font-size:12.5px;color:var(--ink-3);border-radius:var(--r-sm);
}
.gate-adm button:hover{color:var(--acc);background:var(--surface-2);}
.ver{margin-top:20px;font-size:11.5px;letter-spacing:.1em;color:#4a5c6b;}

/* 左下の小さなボタン */
.gate-help{position:absolute;left:22px;bottom:22px;display:grid;gap:10px;justify-items:start;}
.hbtn{
  display:inline-flex;align-items:center;gap:7px;background:#fff;color:var(--pri);
  border-radius:9px;padding:10px 16px;font-size:13px;font-weight:700;
  box-shadow:0 5px 18px rgba(4,26,60,.28);
}
.hbtn:hover{background:var(--acc-soft);}
.hbtn .ic{font-size:15px;}
.hbox{
  width:min(400px,86vw);background:#fff;border-radius:11px;padding:18px 20px;text-align:left;
  box-shadow:0 14px 40px rgba(4,26,60,.34);font-size:13px;line-height:1.85;color:var(--ink-2);
}
.hbox b{display:flex;align-items:center;gap:7px;color:var(--ink);font-size:14px;margin-bottom:9px;}
.hbox ol{margin:0 0 11px 1.2em;display:grid;gap:5px;}
.hbox p{font-size:12.5px;}
.hbox p b{display:inline;font-size:inherit;color:var(--kaki);}
.hbox .btn{margin-top:12px;}

@media (max-width:640px){
  .gate{padding:18px 16px 96px;gap:14px;}
  .gate-tag{display:none;}
  .wordmark{font-size:30px;}
  .wordsub{font-size:11.5px;letter-spacing:.24em;}
  /* 小さい画面では丸ではなく角丸のカードにする（丸だと余白で読めなくなる） */
  .gate-card{border-radius:28px;min-height:0;padding:26px 20px 22px;box-shadow:0 0 0 1px rgba(255,255,255,.75) inset,0 18px 50px rgba(20,50,90,.16);}
  .wordsub::before,.wordsub::after{width:26px;}
  .gate-apps{gap:14px 10px;}
  .gate-app{width:104px;gap:7px;}
  .gate-app .hub-i{width:72px;height:72px;}
  .gate-app .hub-i .ic{font-size:30px;}
  .gate-app b{font-size:13px;}
  .gate-app .hub-s{display:none;}
  .gate-card .two{grid-template-columns:1fr;}
  .gate-help{left:16px;right:16px;bottom:16px;}
  .hbox{width:100%;}
}

/* ══════════════════════════════════════════════════════════════
   9. コースのカード
   ══════════════════════════════════════════════════════════════ */
.prog-h{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--rule);
  border-radius:var(--r);padding:13px 16px;margin-bottom:16px;box-shadow:var(--sh);
}
.prog-h .tag{
  background:#f5c518;color:#3a2d00;border-radius:var(--r-sm);padding:11px 16px;
  font-weight:700;font-size:15px;text-align:center;line-height:1.35;flex:none;min-width:128px;
}
.prog-h .tag small{display:block;font-size:10.5px;font-weight:500;opacity:.8;}
.prog-h .ti{min-width:180px;flex:1 1 220px;}
.prog-h .ti b{font-size:15px;display:block;}
.prog-h .ti span{font-size:12px;color:var(--ink-3);}
.prog-h .sp{flex:1;}
.cat{display:flex;align-items:center;gap:11px;font-weight:700;font-size:14.5px;color:var(--ink);margin:26px 0 14px;}
.cat:first-of-type{margin-top:0;}
.cat::after{content:"";flex:1;height:1px;background:var(--rule);}
.cat .num{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);font-weight:500;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px;}
.cc{
  background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;
  text-align:left;display:flex;flex-direction:column;transition:box-shadow .16s,transform .16s;
}
.cc:hover{box-shadow:var(--sh-2);transform:translateY(-2px);}
.cc .thumb{aspect-ratio:16/9;background:#243542;position:relative;display:grid;place-items:center;overflow:hidden;}
.cc .thumb img{width:100%;height:100%;object-fit:cover;max-width:100%;display:block;}
.cc .thumb .ph{color:rgba(255,255,255,.45);font-size:10.5px;display:grid;place-items:center;gap:5px;}
.cc .thumb .ph .ic{font-size:22px;}
.cc .thumb .play{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(to top,rgba(8,20,30,.5),rgba(8,20,30,.04));opacity:0;transition:opacity .16s;}
.cc:hover .thumb .play{opacity:1;}
.cc .thumb .play .ic{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.95);color:var(--pri);font-size:15px;padding-left:3px;}
.cc .badge{position:absolute;top:7px;left:7px;background:rgba(8,20,30,.76);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;}
.cc .badge.done{background:var(--ok-dp);} .cc .badge.rq{background:var(--kaki-dp);}
.cc .in{padding:14px 16px 16px;display:grid;gap:9px;flex:1;align-content:start;}
.cc .ttl{font-weight:700;font-size:14.5px;line-height:1.55;overflow-wrap:anywhere;word-break:break-word;}
.cc .desc{font-size:12px;color:var(--ink-3);line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.cc .meta{font-size:11.5px;color:var(--ink-3);display:flex;gap:11px;flex-wrap:wrap;align-items:center;}
.cc .meta span{display:inline-flex;align-items:center;gap:3px;}
.cc-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.lnk{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--acc);
  font-weight:700;cursor:pointer;min-height:26px;padding:3px 2px;
}
.lnk:hover{text-decoration:underline;}
/* コース一覧の「配信先」を押せることが分かるように */
.asg-lnk{font-size:12px;color:var(--acc);text-align:left;white-space:normal;line-height:1.6;}
/* コースの編集 */
.ce-no{
  width:24px;height:24px;border-radius:5px;background:var(--pri);color:#fff;flex:none;
  display:grid;place-items:center;font-size:11.5px;font-family:"IBM Plex Mono",monospace;
}
.ce-row.off{opacity:.62;}
.ce-row.off .ce-no{background:var(--ink-3);}
tr.off-row td{opacity:.62;}
.asg-lnk .ic{flex:none;}

/* ══════════════════════════════════════════════════════════════
   10. 受講の画面
   ══════════════════════════════════════════════════════════════ */
.learn{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start;}
.pw{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);}
.player-box{aspect-ratio:16/9;background:#000;max-width:100%;}
.player-box iframe{width:100%;height:100%;border:0;display:block;}
.player-empty{aspect-ratio:16/9;background:#243542;color:rgba(255,255,255,.82);display:grid;place-items:center;align-content:center;gap:10px;text-align:center;padding:20px;}
.player-empty .ic{font-size:26px;opacity:.5;} .player-empty b{font-size:13.5px;color:#fff;}
.p-under{padding:14px 16px 16px;display:grid;gap:13px;}
.p-ttl{font-weight:700;font-size:17px;}
.p-ttl small{display:block;font-weight:400;font-size:12px;color:var(--ink-3);margin-top:3px;}
.seen-wrap{display:grid;gap:5px;}
.seen-lbl{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--ink-3);}
.seen-lbl .mono{font-size:13px;font-weight:600;color:var(--acc);}
.seen{position:relative;height:11px;background:var(--sunken);border-radius:4px;overflow:hidden;}
.seen i{position:absolute;top:0;height:100%;background:var(--acc);opacity:.92;}
.seen .cursor{position:absolute;top:-3px;width:2px;height:17px;background:var(--kaki);border-radius:1px;}
.hint{font-size:12px;color:var(--ink-2);line-height:1.8;}
.hint b{color:var(--kaki);}
.p-ops{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding-top:3px;}
.p-ops .sp{flex:1;}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);cursor:pointer;}
.chk input{accent-color:var(--acc);width:18px;height:18px;}
.keys{display:flex;gap:14px;flex-wrap:wrap;font-size:10.5px;color:var(--ink-3);}
.keys span{display:inline-flex;align-items:center;gap:4px;}
kbd{
  font-family:"IBM Plex Mono",monospace;font-size:10px;background:var(--sunken);
  border:1px solid var(--rule-2);border-bottom-width:2px;border-radius:3px;padding:1px 5px;color:var(--ink-2);
}
.chaps{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);}
.chaps .hd{padding:13px 16px;border-bottom:1px solid var(--rule);background:var(--surface-2);font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:8px;}
.chaps .hd .ic{font-size:14px;color:var(--acc);}
.chaps .hd .n{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);}
.chap{display:flex;gap:12px;width:100%;padding:13px 16px;text-align:left;border-bottom:1px solid var(--rule);position:relative;}
.chap:last-child{border-bottom:none;}
.chap:hover{background:var(--surface-2);}
.chap[aria-current="true"]{background:var(--acc-soft);}
.chap[aria-current="true"]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc);}
.chap .no{width:21px;height:21px;border-radius:50%;background:var(--sunken);color:var(--ink-2);font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;display:grid;place-items:center;flex:none;margin-top:1px;}
.chap.done .no{background:var(--ok-dp);color:#fff;}
.chap[aria-current="true"] .no{background:var(--acc);color:#fff;}
.chap .bd{min-width:0;flex:1;display:grid;gap:4px;}
.chap .t{font-size:13.5px;font-weight:500;line-height:1.6;}
.chap .s{font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:9px;}
.chap .s .ck{color:var(--ok);font-weight:700;display:inline-flex;align-items:center;gap:2px;}
.chap .mini{height:3px;background:var(--sunken);border-radius:2px;overflow:hidden;}
.chap .mini i{display:block;height:100%;background:var(--acc);}
.chap.done .mini i{background:var(--ok);}

/* ══════════════════════════════════════════════════════════════
   11. 確認テスト
   ══════════════════════════════════════════════════════════════ */
.quiz{max-width:660px;}
.q{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:17px 20px;margin-bottom:12px;box-shadow:var(--sh);}
.q .qt{font-weight:700;font-size:15px;margin-bottom:13px;display:flex;gap:11px;line-height:1.7;}
.q .qt .n{font-family:"IBM Plex Mono",monospace;color:#fff;background:var(--pri);width:22px;height:22px;border-radius:4px;display:grid;place-items:center;font-size:11px;flex:none;margin-top:2px;}
.opt{display:flex;gap:11px;padding:12px 15px;border:1px solid var(--rule);border-radius:var(--r-sm);margin-bottom:8px;cursor:pointer;align-items:flex-start;font-size:14px;}
.opt:hover{background:var(--surface-2);border-color:var(--rule-2);}
.opt input{margin-top:5px;flex:none;accent-color:var(--acc);}
.opt.correct{border-color:var(--ok);background:var(--ok-soft);}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);}
/* 不合格のときは正解を出さず、間違えた問題だけに印をつける */
.q.missed{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad) inset,var(--sh);}
.q.missed .qt .n{background:var(--bad-dp);}
.q.missed .qt::after{
  content:"間違い";margin-left:auto;font-size:11px;font-weight:700;color:var(--bad-ink);
  background:var(--bad-soft);border-radius:11px;padding:2px 10px;align-self:flex-start;white-space:nowrap;
}
.result{border-radius:var(--r);padding:22px 24px;margin-bottom:16px;display:grid;gap:5px;border:1px solid;}
.result.pass{background:var(--ok-soft);border-color:var(--ok);}
.result.fail{background:var(--warn-soft);border-color:var(--warn);}
.result .big{font-size:23px;font-weight:700;display:flex;align-items:center;gap:9px;}
.result.pass .big{color:var(--ok);} .result.fail .big{color:var(--warn);}
.result .sm{font-size:12px;color:var(--ink-2);}

/* ══════════════════════════════════════════════════════════════
   11b. 修了証・アンケート
   ══════════════════════════════════════════════════════════════ */
.cert{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:12px;box-shadow:var(--sh);}
.cert-in{
  border:2px solid var(--pri);border-radius:4px;padding:40px 44px 34px;text-align:center;
  position:relative;background:
    radial-gradient(circle at 12% 8%,rgba(20,88,159,.05),transparent 42%),
    radial-gradient(circle at 88% 92%,rgba(20,88,159,.05),transparent 42%);
}
.cert-in::after{
  content:"";position:absolute;inset:7px;border:1px solid var(--rule-2);border-radius:2px;pointer-events:none;
}
.cert-logo{margin-bottom:22px;display:flex;justify-content:center;}
.cert-t{font-size:30px;font-weight:700;letter-spacing:.34em;color:var(--pri);text-indent:.34em;}
.cert-sub{font-size:10.5px;letter-spacing:.24em;color:var(--ink-3);margin-top:5px;}
.cert-nm{font-size:25px;font-weight:700;margin:30px 0 4px;letter-spacing:.06em;}
.cert-nm span{font-size:14px;font-weight:400;color:var(--ink-2);margin-left:10px;}
.cert-b{font-size:13px;color:var(--ink-2);margin-bottom:22px;}
.cert-co{
  font-size:19px;font-weight:700;padding:13px 20px;margin:0 auto 24px;display:inline-block;
  border-top:1px solid var(--rule-2);border-bottom:1px solid var(--rule-2);
}
.cert-tb{width:100%;max-width:470px;margin:0 auto;font-size:12.5px;}
.cert-tb th{
  width:104px;text-align:left;color:var(--ink-2);font-weight:700;background:none;
  border-bottom:1px dotted var(--rule-2);padding:7px 0;position:static;
}
.cert-tb td{border-bottom:1px dotted var(--rule-2);padding:7px 0;}
.cert-f{margin-top:30px;}
.cert-org{font-size:15px;font-weight:700;letter-spacing:.08em;}
.cert-note{font-size:10px;color:var(--ink-3);margin-top:8px;}
.opts{display:grid;gap:7px;}
.opt-s{
  display:flex;gap:9px;align-items:center;padding:9px 12px;border:1px solid var(--rule);
  border-radius:var(--r-sm);cursor:pointer;font-size:13px;
}
.opt-s:hover{background:var(--surface-2);}
.opt-s.on{border-color:var(--acc);background:var(--acc-soft);font-weight:700;}
.opt-s input[type="radio"],.opt-s input[type="checkbox"]{
  /* .field input{width:100%} に巻き込まれて丸が横に伸びていたので、ここで戻す */
  accent-color:var(--acc);width:18px;height:18px;flex:none;
}
/* 選択肢の文字を直す欄。上の18pxに巻き込まれて1文字ぶんの幅しか無く、
   編集できないように見えていた */
.opt-s .opt-t{flex:1;min-width:0;width:auto;font-size:13px;font-weight:inherit;}
.two-c{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;}
/* 配信設定 */
.asg-box{margin-bottom:16px;}
.chips{display:flex;flex-wrap:wrap;gap:9px;}
.chip{cursor:pointer;}
.chip input{position:absolute;opacity:0;width:0;height:0;}
.chip span{
  display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:20px;
  border:1px solid var(--rule-2);background:var(--surface);font-size:13.5px;
  transition:background .13s,border-color .13s,color .13s;
}
.chip span i{font-style:normal;font-size:11.5px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;}
.chip input:checked + span{
  background:var(--acc);border-color:var(--acc);color:var(--acc-on);font-weight:700;
}
.chip input:checked + span i{color:var(--acc-on);opacity:.78;}
.chip input:focus-visible + span{outline:2px solid var(--acc);outline-offset:2px;}
.chip:hover span{border-color:var(--acc);}
/* 権限の一覧 */
/* 接続テストの結果 */
.diag{
  background:var(--sunken);border:1px solid var(--rule);border-radius:var(--r-sm);
  padding:13px 15px;font-family:"IBM Plex Mono",monospace;font-size:12px;line-height:1.85;
  white-space:pre-wrap;word-break:break-all;max-height:420px;overflow:auto;color:var(--ink);
}
.rolelist{display:grid;gap:10px;}
.rolerow{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink-2);}
.rolerow span{flex:1;min-width:0;}
.rolerow b{color:var(--ink);white-space:nowrap;}
.scope{display:flex;flex-wrap:wrap;gap:7px;}
/* display を指定した要素は hidden が効かなくなるので、明示的に消す */
.scope[hidden],.chips[hidden],.bar[hidden],.seg[hidden]{display:none;}
/* 社内申請の入れ物。中の見た目は css/shinsei.css */
#main[hidden],#shinsei[hidden],.top .ico[hidden]{display:none;}
#shinsei{background:var(--bg);color:var(--text);font-family:var(--font);
  font-size:13.5px;line-height:1.65;min-height:60vh;}
#shinsei .view{flex:none;overflow:visible;padding:22px 26px 60px;}
#shinsei #view:focus{outline:none;}
/* 顔写真 */
.ava img{width:100%;height:100%;object-fit:cover;display:block;}
.prof-photo{width:112px;height:112px;border-radius:50%;overflow:hidden;background:var(--surface-2);
  border:1px solid var(--rule);display:grid;place-items:center;font-size:36px;color:#fff;}
.prof-photo img{width:100%;height:100%;object-fit:cover;}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:13px;}
.mem{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-md);
  padding:16px 14px;display:grid;justify-items:center;text-align:center;gap:6px;}
.mem .ava{width:72px;height:72px;font-size:24px;}
.mem b{font-size:14.5px;}
.mem .mem-t{font-size:12px;color:var(--ink-3);}
.mem .mem-b{font-size:12.5px;line-height:1.6;color:var(--ink-2);word-break:break-word;}
@media (max-width:860px){ #shinsei .view{padding:16px 14px 80px;} }
.scope .chip span{padding:6px 11px;font-size:12px;}
@media (max-width:860px){ .rolerow{flex-wrap:wrap;} }
/* 除外している人の札（×で取り消せる） */
.chip-x{
  display:inline-flex;align-items:center;gap:4px;padding:7px 8px 7px 14px;border-radius:20px;
  background:var(--bad-soft);color:var(--bad-ink);border:1px solid var(--bad);
  font-size:13px;font-weight:700;
}
.chip-x button{
  width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  color:var(--bad-ink);font-size:15px;line-height:1;
}
.chip-x button:hover{background:var(--bad);color:#fff;}
.plist{
  max-height:330px;overflow-y:auto;border:1px solid var(--rule);border-radius:var(--r);
  background:var(--surface-2);
}
.prow{
  display:flex;align-items:center;gap:11px;padding:9px 14px;cursor:pointer;
  border-bottom:1px solid var(--rule);background:var(--surface);
}
.prow:last-child{border-bottom:none;}
.prow:hover{background:var(--acc-soft);}
.prow input{accent-color:var(--acc);width:16px;height:16px;flex:none;}
.prow .who-t{min-width:0;}
.two-g{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.up{display:flex;gap:16px;align-items:flex-start;border:1px solid var(--rule);border-radius:var(--r);padding:13px 15px;}
.up-pv{
  width:212px;flex:none;min-height:58px;display:grid;place-items:center;overflow:hidden;
  background:var(--surface-2);border:1px solid var(--rule);border-radius:var(--r-sm);padding:9px;
}
.up-pv .logo-set{font-size:.8em;}
.up-pv .logo-wd{color:var(--ink);}
.hero-pv{height:96px;overflow:hidden;padding:0;background:#04121d;}
.hero-pv .hero-svg,.hero-pv .hero-img{width:100%;height:96px;position:static;}
.up-b{min-width:0;}
.up-b b{display:block;font-size:13px;margin-bottom:3px;}
.up-b span{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.7;}
@media (max-width:860px){
  .two-g,.two-c{grid-template-columns:1fr;}
  .up{flex-direction:column;} .up-pv{width:100%;}
}
.stars{color:var(--warn);letter-spacing:.06em;font-size:13px;}
.stars .mono{color:var(--ink-2);font-size:11px;}
.cap{font-size:11.5px;color:var(--ink-3);}

@page{size:A4 portrait;margin:12mm;}
@media print{
  /* 暗い配色のまま印刷すると真っ黒になるので、印刷のときは必ず白い紙の配色に戻す */
  :root,:root[data-theme="dark"],:root:not([data-theme="light"]){
    --bg:#fff; --surface:#fff; --surface-2:#fff; --sunken:#eeeeee;
    --ink:#111111; --ink-2:#333333; --ink-3:#555555;
    --rule:#cccccc; --rule-2:#999999;
    --pri:#14589f; --pri-2:#14589f; --acc:#14589f;
  }
  html,body{background:#fff !important;color:#111 !important;height:auto;}
  .top,.side,.crumb-bar,.no-print,.toast,.scrim,.burger{display:none !important;}
  .shell{grid-template-columns:1fr;display:block;}
  .wrap{padding:0;max-width:none;}
  .cert{border:none;box-shadow:none;padding:0;background:#fff;}
  .cert-in{
    border-color:#14589f;max-width:100%;padding:24px 22px 18px;background:#fff;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
    page-break-inside:avoid;break-inside:avoid;
  }
  .cert-logo .logo-wd{color:#1c1c1c !important;}
  .cert-logo .logo-wd .dot{background:#e4004f !important;}
  .cert-t{color:#14589f !important;font-size:26px;}
  .cert-nm{font-size:22px;}
  .cert-tb{max-width:100%;}
  .pill,.st .dot,.kpi{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}

/* ══════════════════════════════════════════════════════════════
   12. 棒グラフ（全体活動状況）
   ══════════════════════════════════════════════════════════════ */
.bars{display:grid;gap:11px;}
.brow{display:grid;grid-template-columns:210px minmax(0,1fr) 124px;gap:14px;align-items:center;font-size:13.5px;}
.brow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;}
.brow .tr{height:24px;background:var(--sunken);border-radius:4px;overflow:hidden;display:flex;}
.brow .tr i{height:100%;display:block;}
.brow .tr i.d{background:var(--ok);}
.brow .tr i.m{background:var(--warn);}
.brow .rt{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink-2);text-align:right;white-space:nowrap;}
.legend{display:flex;gap:18px;font-size:12.5px;color:var(--ink-2);margin-bottom:15px;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.legend i{width:11px;height:11px;border-radius:2px;display:block;}

/* ══════════════════════════════════════════════════════════════
   13. その他
   ══════════════════════════════════════════════════════════════ */
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#243542;color:#fff;
  padding:10px 19px;border-radius:22px;font-size:12.5px;box-shadow:var(--sh-2);opacity:0;
  pointer-events:none;transition:opacity .22s;max-width:min(92vw,520px);z-index:200;text-align:center;
}
.toast.on{opacity:1;}
.spin{width:24px;height:24px;border:2.5px solid var(--sunken);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 12px;}
@keyframes sp{to{transform:rotate(360deg);}}
.scrim{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:35;opacity:0;pointer-events:none;transition:opacity .2s;}
.scrim.on{opacity:1;pointer-events:auto;}

/* ══════════════════════════════════════════════════════════════
   14. 画面幅への対応
   ══════════════════════════════════════════════════════════════ */
@media (max-width:1080px){
  .learn{grid-template-columns:1fr;}
  .chaps{order:-1;}
  .brow{grid-template-columns:140px minmax(0,1fr) 96px;}
}
@media (max-width:860px){
  .shell{grid-template-columns:1fr;}
  .side{
    position:fixed;left:0;top:var(--top-h);bottom:0;width:224px;z-index:36;
    transform:translateX(-100%);transition:transform .2s;height:auto;box-shadow:var(--sh-2);
  }
  /* 画面の外に隠れているメニューは Tab でたどれないようにする */
  .side{visibility:hidden;}
  .side.open{transform:none;visibility:visible;}
  .burger{display:grid;}
  .top{gap:9px;padding:0 10px;}
  .top .logo small,.top .logo .nm,.top .me #topName{display:none;}
  .wrap{padding:16px 14px 60px;}
  .crumb-bar{padding:9px 14px;}
  .kpis{grid-template-columns:1fr 1fr;gap:9px;}
  .hub{grid-template-columns:1fr;gap:12px;}
  .hub-c{padding:18px 16px;}
  .fd-card{padding:13px 14px;}
  .kpi{padding:10px 12px;} .kpi .v{font-size:24px;} .kpi .k{font-size:11px;}
  .ph h2{font-size:16.5px;}
  .brow{grid-template-columns:1fr;gap:4px;}
  .brow .rt{text-align:left;}
  /* 指で押せる大きさ（44px）を確保する */
  .burger{width:44px;height:44px;font-size:21px;}
  .top .ico{width:44px;height:44px;font-size:20px;}

<script>

function ic(name, cls){

/* ══════════════════════════════════════════════════════════════

function logoMarkSVG(h){

    '</linearGradient>' +
    '<linearGradient id="lgB" x1="0" y1="1" x2="1" y2="0">' +
      '<stop offset="0" stop-color="#1f7ad4"/><stop offset="1" stop-color="#16308a"/>' +
    '</linearGradient></defs>' +
    /* 左側の細い線（Aの左脚） */
    '<path d="M2 84 L52 6 L58 6 L10 84 Z" fill="#1565c0"/>' +
    '<path d="M14 84 L58 12 L62 16 L22 84 Z" fill="#1976d2"/>' +
    /* 上のリボン（Aの山から右へ波打つ） */
    '<path d="M46 26 C60 2 74 2 88 18 C98 29 106 32 116 26 L116 46 ' +
      'C104 54 92 50 80 37 C70 26 62 26 54 40 Z" fill="url(#lgA)"/>' +
    /* 下のリボン */

/* 文字の部分（Funai Soken ＋ 「i」の赤い点） */
function logoWordSVG(){
  /* 「i」の点だけ赤くする。
     点のない i（U+0131 ı）を使い、その上に赤い丸を置く。
     こうすると、もとの黒い点と二重にならない。 */
  return '<span class="logo-wd"><b>Funa<span class="ii">\u0131<i class="dot"></i></span></b>' +
         '<b>Soken</b></span>';
}
/* 画面で使うロゴ。cfg.logo があれば画像を優先する */
function logoHTML(height, withWord){

    return '<img class="logo-img" src="' + esc(safeImageURI(cfg.logo)) + '" alt="' + esc(cfg.orgName) +
           '" style="height:' + (height || 34) + 'px">';

         (withWord === false ? '' : logoWordSVG()) + '</span>';

/* ══════════════════════════════════════════════════════════════
   入口の背景の図
     設定で画像が登録されていればそれを使う。
     未登録のときは、この図（SVGで描いた学習のイメージ）を出す。
     外部の画像を読み込まないので、権利の心配なく使えます。
   ══════════════════════════════════════════════════════════════ */
function heroSVG(){
  /* 参考写真に寄せた図。外部の画像を読み込まないので権利の心配がありません。
     暗い紺地に、水色に光るHUD（円盤）と、まわりを回る学習アイコン。 */
  var CX = 640, CY = 300, C = '#5fe0ff';
  var h = '<svg class="hero-svg" viewBox="0 0 1000 600" ' +
          'preserveAspectRatio="xMidYMid slice" aria-hidden="true">';

  h += '<defs>' +
    '<linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0" stop-color="#071320"/>' +
      '<stop offset="55%" stop-color="#04101c"/>' +
      '<stop offset="1" stop-color="#020a12"/></linearGradient>' +
    '<radialGradient id="cGlow" cx="50%" cy="50%" r="50%">' +
      '<stop offset="0" stop-color="#2ec8ff" stop-opacity=".40"/>' +
      '<stop offset="55%" stop-color="#1e7fb8" stop-opacity=".12"/>' +
      '<stop offset="1" stop-color="#0a1a28" stop-opacity="0"/></radialGradient>' +
    '<filter id="blurL" x="-60%" y="-60%" width="220%" height="220%">' +
      '<feGaussianBlur stdDeviation="26"/></filter>' +
    '<filter id="glow" x="-60%" y="-60%" width="220%" height="220%">' +
      '<feGaussianBlur stdDeviation="3.4" result="b"/>' +
      '<feMerge><feMergeNode in="b"/><feMergeNode in="b"/>' +
      '<feMergeNode in="SourceGraphic"/></feMerge></filter>' +
    '<filter id="glowS" x="-60%" y="-60%" width="220%" height="220%">' +
      '<feGaussianBlur stdDeviation="1.6" result="b"/>' +
      '<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>' +
    '</defs>';

  h += '<rect width="1000" height="600" fill="url(#bgG)"/>';

  /* 左上のぼかした光（写真の奥にある照明） */
  h += '<g filter="url(#blurL)" opacity=".55">';
  [[70, 40, 120, 130], [230, 20, 130, 150], [400, 30, 110, 120], [140, 210, 90, 80]]
    .forEach(function(r){
      h += '<rect x="' + r[0] + '" y="' + r[1] + '" width="' + r[2] + '" height="' + r[3] +
           '" rx="26" fill="#2ba6d8" opacity=".5"/>';
    });
  h += '</g>';

  /* 中心のぼんやりした明かり */
  h += '<circle cx="' + CX + '" cy="' + CY + '" r="290" fill="url(#cGlow)"/>';

  /* ── HUD（同心円と目盛り） ── */
  h += '<g filter="url(#glow)" fill="none" stroke="' + C + '">';
  h += '<circle cx="' + CX + '" cy="' + CY + '" r="214" stroke-opacity=".16" stroke-width="1"/>';
  h += '<circle cx="' + CX + '" cy="' + CY + '" r="186" stroke-opacity=".30" stroke-width="1.1" ' +
       'stroke-dasharray="2 10"/>';
  h += '<circle cx="' + CX + '" cy="' + CY + '" r="150" stroke-opacity=".55" stroke-width="1.4"/>';
  h += '<circle cx="' + CX + '" cy="' + CY + '" r="118" stroke-opacity=".85" stroke-width="2"/>';
  h += '<circle cx="' + CX + '" cy="' + CY + '" r="96"  stroke-opacity=".34" stroke-width="1"/>';

  /* 外周の目盛り */
  var i, a, x1, y1, x2, y2;
  for(i = 0; i < 72; i++){
    a = i / 72 * Math.PI * 2;
    var len = (i % 6 === 0) ? 13 : 6;
    x1 = CX + Math.cos(a) * 150; y1 = CY + Math.sin(a) * 150;
    x2 = CX + Math.cos(a) * (150 + len); y2 = CY + Math.sin(a) * (150 + len);
    h += '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) +
         '" y2="' + y2.toFixed(1) + '" stroke-opacity="' + (i % 6 === 0 ? '.7' : '.34') +
         '" stroke-width="1.2"/>';
  }
  /* 太い弧（2か所） */
  h += '<path d="M ' + (CX - 134) + ' ' + (CY - 56) + ' A 145 145 0 0 1 ' +
       (CX - 56) + ' ' + (CY - 134) + '" stroke-width="5" stroke-opacity=".9" stroke-linecap="round"/>';
  h += '<path d="M ' + (CX + 134) + ' ' + (CY + 56) + ' A 145 145 0 0 1 ' +
       (CX + 56) + ' ' + (CY + 134) + '" stroke-width="5" stroke-opacity=".9" stroke-linecap="round"/>';
  h += '</g>';

  /* 内側の四角い枠と本 */
  h += '<g filter="url(#glow)" fill="none" stroke="' + C + '" stroke-linejoin="round">';
  h += '<path d="M ' + (CX-64) + ' ' + (CY-46) + ' h 40 M ' + (CX+24) + ' ' + (CY-46) + ' h 40 ' +
       'M ' + (CX+64) + ' ' + (CY-46) + ' v 30 M ' + (CX+64) + ' ' + (CY+16) + ' v 30 ' +
       'M ' + (CX+64) + ' ' + (CY+46) + ' h -40 M ' + (CX-24) + ' ' + (CY+46) + ' h -40 ' +
       'M ' + (CX-64) + ' ' + (CY+46) + ' v -30 M ' + (CX-64) + ' ' + (CY-16) + ' v -30" ' +
       'stroke-width="2.4" stroke-opacity=".95" stroke-linecap="round"/>';
  h += '</g>';
  h += '<g transform="translate(' + CX + ' ' + CY + ')" filter="url(#glow)" fill="none" ' +
       'stroke="#eafbff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">' +
       '<path d="M-30 -19 h23 a7 7 0 0 1 7 7 v31 a7 7 0 0 0-7-7 h-23 z"/>' +
       '<path d="M30 -19 h-23 a7 7 0 0 0-7 7 v31 a7 7 0 0 1 7-7 h23 z"/></g>';

  /* ── まわりのアイコン ── */
  var nodes = [
    { d:-118, ic:'gear'  }, { d:-58, ic:'chart' }, { d:2,   ic:'user' },
    { d:62,   ic:'quiz'  }, { d:122, ic:'play'  }, { d:182, ic:'target' }
  ];
  nodes.forEach(function(n){
    var rad = n.d * Math.PI / 180;
    var R = 252;
    var nx = CX + Math.cos(rad) * R, ny = CY + Math.sin(rad) * R * .82;
    /* 中心とつなぐ線＋途中の小さな点 */
    h += '<g filter="url(#glowS)">';
    h += '<line x1="' + CX + '" y1="' + CY + '" x2="' + nx.toFixed(1) + '" y2="' + ny.toFixed(1) +
         '" stroke="' + C + '" stroke-opacity=".34" stroke-width="1.1"/>';
    var mx = CX + (nx - CX) * .62, my = CY + (ny - CY) * .62;
    h += '<circle cx="' + mx.toFixed(1) + '" cy="' + my.toFixed(1) + '" r="2.6" fill="' + C +
         '" fill-opacity=".8"/>';
    h += '</g>';
    /* 丸い枠 */
    h += '<g filter="url(#glow)">';
    h += '<circle cx="' + nx.toFixed(1) + '" cy="' + ny.toFixed(1) + '" r="45" fill="#07202f" ' +
         'fill-opacity=".72" stroke="' + C + '" stroke-opacity=".9" stroke-width="2"/>';
    h += '<circle cx="' + nx.toFixed(1) + '" cy="' + ny.toFixed(1) + '" r="53" fill="none" ' +
         'stroke="' + C + '" stroke-opacity=".22" stroke-width="1" stroke-dasharray="4 7"/>';
    h += '<g transform="translate(' + (nx - 15).toFixed(1) + ' ' + (ny - 15).toFixed(1) +
         ') scale(1.25)" fill="none" stroke="#eafbff" stroke-width="1.7" ' +
         'stroke-linecap="round" stroke-linejoin="round">' + (SVG[n.ic] || '') + '</g>';
    h += '</g>';
  });

  /* こまかい粒 */
  for(i = 0; i < 70; i++){
    var px = (i * 173 % 1000), py = (i * 97 % 600), pr = (i % 3) * .5 + .7;
    h += '<circle cx="' + px + '" cy="' + py + '" r="' + pr + '" fill="' + C + '" opacity="' +
         (0.10 + (i % 6) * 0.05) + '"/>';
  }
  return h + '</svg>';
}
/* 背景の決まりかた（上から順に探す）
     ① 設定画面から登録された画像（Creatorに保存される。64KBの制限あり）
     ② zipの中の app/bg.jpg（大きさの制限なし・画質そのまま）★おすすめ
     ③ 組み込みの図（SVG）
   ②は、zipを開いて app/ に bg.jpg を置いて zip し直すだけで使えます。
   ファイルが無いときはブラウザのコンソールに404が出ますが、動作に支障はありません。 */
/* 設定に入っている画像が、本当に画像のデータURIかを確かめる。
   ここを素通ししていると、Creator のコース定義レコードを書ける人が
   style 属性を閉じて任意のタグを差し込めてしまう（全員の入口画面で実行される）。 */
function safeImageURI(v){
  var u = String(v == null ? '' : v).replace(/[\s\r\n]/g, '');
  return /^data:image\/(png|jpe?g|webp|gif);base64,[A-Za-z0-9+/]+={0,2}$/.test(u) ? u : '';
}
function heroHTML(){
  var cfg = config();
  var bg = safeImageURI(cfg.hero);
  if(bg){
    /* 値は上で「画像のデータURI」だけに絞ってある。さらに esc() で属性も守る */
    return '<div class="hero-img" style="background-image:url(&quot;' + esc(bg) + '&quot;)"></div>';
  }
  /* zip に app/bg.jpg（明るいオフィスの写真など）を置けば、それを背景にする。
     無ければ CSS の淡い背景のまま */
  return '<img class="hero-file" src="bg.jpg" alt="" onerror="this.remove();">';
}

function icf(name){
  return '<span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" ' +
    'stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">' +
    (SVG[name] || '') + '</svg></span>';
}
/* ══════════════════════════════════════════════════════════════
   視聴計測エンジン
   動画の長さを1秒刻みの配列で持ち、実際に再生された秒だけを塗る。
   早送りで飛ばした区間は塗られないので、スキップでは進捗が上がらない。
   ══════════════════════════════════════════════════════════════ */
var MAX_GAP = 2.5;   // これを超える移動はシーク（早送り/巻き戻し）とみなす

function createTracker(durationSec){
  var dur = Math.max(1, Math.ceil(durationSec || 1));
  return { dur:dur, seen:new Uint8Array(dur), last:null, fast:false };
}
/* t=再生位置（秒）／rate=再生速度（1.0が等速）。
   倍速のあいだは塗らない。倍速で見た分を等速と同じに数えると、
   「何分見たか」の証跡にならないため。 */
function trackerTick(tr, t, rate){
  if(t < 0) t = 0;
  var cur = Math.min(tr.dur - 1, Math.floor(t));
  if(typeof rate === 'number' && rate > 1.01){
    tr.fast = true; tr.last = t; return;     /* 連続性だけ更新して塗らない */
  }
  if(tr.last === null){
    tr.seen[cur] = 1;
  }else{
    var gap = t - tr.last;
    if(gap >= 0 && gap <= MAX_GAP){

}

  var prev = MEM.people[o.name];

/* 受講者名簿  people[名前] = {name, dept, emp, first}

function people(){ return MEM.people; }

var PERSON_EXTRA = ['kana', 'manager', 'joined', 'leave', 'deputy', 'deputyFrom', 'deputyTo',
                    'photo', 'bio'];
function registerPerson(o){
  var prev = MEM.people[normName(o.name)];
  var title = (o.title !== undefined) ? o.title : (prev && prev.title) || '';
  var row = {
    name:normName(o.name),
    email:o.email || (prev && prev.email) || '',
    dept:o.dept || (prev && prev.dept) || '',
    group:(o.group !== undefined) ? o.group : ((prev && prev.group) || ''),
    emp:(o.emp !== undefined) ? o.emp : ((prev && prev.emp) || ''),
    title:title,
    /* 権限が指定されていなければ、役職から初期値を決める。
       いちど決まったものは、権限設定の画面からしか変わらない */
    role:o.role || (prev && prev.role) || roleFromTitle(title),
    scope:(o.scope !== undefined) ? o.scope : ((prev && prev.scope) || ''),
    first:(prev && prev.first) || new Date().toISOString()
  };
  PERSON_EXTRA.forEach(function(k){
    var v = (o[k] !== undefined) ? o[k] : (prev ? prev[k] : undefined);
    if(v !== undefined && v !== null && v !== '') row[k] = v;
  });
  if(o.active !== undefined) row.active = !!o.active;

   記録のカギも一緒に付け替えて、Creator にも送り直す。 */
var NAME_BOX = { records:'record', quizzes:'quiz', surveys:'survey', daily:'daily' };
function renamePerson(oldName, newName){
  var o = normName(oldName), n = normName(newName);
  if(!o || !n || o === n) return { ok:false, why:'変更がありません' };
  if(MEM.people[n]) return { ok:false, why:'その氏名は、すでに別の方で登録されています' };
  var p = MEM.people[o];
  if(!p) return { ok:false, why:'その方が名簿に見つかりません' };

  delete MEM.people[o];
  p.name = n;
  MEM.people[n] = p;
  if(RID.people[o]){ RID.people[n] = RID.people[o]; delete RID.people[o]; }
  cacheFlush('people');
  queueSync('person', n);

  var moved = 0;
  Object.keys(NAME_BOX).forEach(function(box){
    var src = MEM[box], pairs = [];
    Object.keys(src).forEach(function(k){
      if(k.indexOf(o + '|') === 0) pairs.push([k, n + k.slice(o.length)]);
    });
    pairs.forEach(function(pr){
      src[pr[1]] = src[pr[0]];
      delete src[pr[0]];
      if(RID[box][pr[0]]){ RID[box][pr[1]] = RID[box][pr[0]]; delete RID[box][pr[0]]; }
      queueSync(NAME_BOX[box], pr[1]);
      moved++;
    });
    if(pairs.length) cacheFlush(box);
  });

  /* いまこの端末で使っている人の名前が変わったら、手元の控えも直す */
  var u = me();
  if(u && normName(u.name) === o){ u.name = n; LS.set('me', u); }
  refreshRole();

/* 受講記録  records[受講者名 + '|' + チャプターID] = {dur, ranges, fast, updated} */
function records(){ return MEM.records; }
/* 記録のキー。毎年受け直すコースは年度を付けて、年度ごとに別の記録にする */
function recKey(name, chapId, term){
  var t = (term !== undefined) ? term : termFor(chapCourse(chapId));
  return name + '|' + chapId + (t ? '|' + t : '');
}
function getRec(name, chapId){ return records()[recKey(name, chapId)] || null; }
function putRec(name, chapId, packed, term){
  name = normName(name);
  var key = recKey(name, chapId, term);
  var before = secOfRanges(MEM.records[key] && MEM.records[key].ranges);
  var after  = secOfRanges(packed.ranges);
  var prevPos = (MEM.records[key] || {}).pos || 0;
  MEM.records[key] = {
    dur:packed.dur, ranges:packed.ranges, fast:!!packed.fast,
    pos:(packed.pos != null ? Math.round(packed.pos) : prevPos),   /* しおり＝最後の再生位置 */
    updated:new Date().toISOString()
  };
  cacheFlush('records');
  queueSync('record', key);
  if(after > before) bumpDaily(name, after - before);
}
/* 区間の配列から合計秒数を出す（重なりは想定しない。trackerが重ならない形で作る） */
function secOfRanges(rg){
  var n = 0;
  (rg || []).forEach(function(r){ n += Math.max(0, r[1] - r[0]); });
  return n;
}

/* ── 日次の学習時間  daily[名前 + '|' + YYYY-MM-DD] = 秒 ──
   「今日は何分見たか」を出すために、増えた分だけを日付ごとに足していく。
   視聴記録から日別に割り出すことはできないので、別に持つ必要がある。 */
function dayStr(d){
  d = d || new Date();
  var z = function(n){ return (n<10?'0':'') + n; };
  return d.getFullYear() + '-' + z(d.getMonth()+1) + '-' + z(d.getDate());
}
function dailyKey(name, day){ return name + '|' + (day || dayStr()); }
var _dailySentAt = 0;
function bumpDaily(name, sec, force){
  var k = dailyKey(name);
  MEM.daily[k] = (MEM.daily[k] || 0) + Math.round(sec);
  cacheFlush('daily');
  /* 画面の表示は毎回更新するが、Creatorへの送信は5分に1回にしぼる。
     1人あたりの書き込みが大きく減り、200名同時でも詰まらない。 */
  if(force || Date.now() - _dailySentAt > 300000){
    _dailySentAt = Date.now();
    queueSync('daily', k);
  }
}
function daySec(name, day){ return MEM.daily[dailyKey(name, day)] || 0; }
/* 今月ぶんの合計（YYYY-MM で前方一致） */
function monthSec(name, ym){
  ym = ym || dayStr().slice(0, 7);
  var pre = name + '|' + ym, n = 0;
  Object.keys(MEM.daily).forEach(function(k){
    if(k.indexOf(pre) === 0) n += MEM.daily[k];
  });
  return n;
}
/* 学習した日の一覧（新しい順） */
function dailyList(name, limit){
  var pre = name + '|', out = [];
  Object.keys(MEM.daily).forEach(function(k){
    if(k.indexOf(pre) === 0) out.push({ day:k.slice(pre.length), sec:MEM.daily[k] });
  });
  out.sort(function(a, b){ return a.day < b.day ? 1 : -1; });
  return limit ? out.slice(0, limit) : out;
}

/* テスト結果  quizzes[受講者名 + '|' + コースID] = {score, total, passed, at} */
function quizzes(){ return MEM.quizzes; }

/* 受験回数。合格ラインを下げずに「何回目で受かったか」を残す */
/* Creator から来た JSON 文字列。壊れていても落ちないように空配列にする */
function jsonOr(str){
  try{ var v = JSON.parse(str || '[]'); return (v && v.length !== undefined) ? v : []; }
  catch(e){ return []; }
}
function quizTries(name, courseId){
  var q = getQuiz(name, courseId);
  return (q && Number(q.tries)) || (q ? 1 : 0);
}
/* テストの合格ライン。指定がなければ視聴の修了ラインを流用する（従来どおり） */
function quizPassRate(co){

function quizGate(name, co){

  var max = Number(co.maxTries) || 0;
  var tries = quizTries(name, co.id);

  if(max && tries >= max){
    return { ok:false, why:'受験できる回数（' + max + '回）を使い切りました。管理者にご連絡ください。' };
  }
  var cd = Number(co.coolDownH) || 0;
  if(cd && q && q.at){
    var wait = new Date(q.at).getTime() + cd * 3600000 - Date.now();
    if(wait > 0){
      var hh = Math.ceil(wait / 3600000);
      return { ok:false, why:'前回の受験から' + cd + '時間あけてください（あと約' + hh + '時間）。' +
                            'その間に動画をもう一度ご確認ください。' };
    }
  }
  return { ok:true, tries:tries, max:max };
}
/* 出題順・選択肢順の並べ替え。
   種を「氏名＋コース＋年度＋受験回数」から作るので、
   画面を描き直しても同じ順序になり、人ごと・受験ごとには変わる。 */
function seedRand(seed){
  var n = 0;
  for(var i = 0; i < seed.length; i++) n = (n * 31 + seed.charCodeAt(i)) % 2147483647;
  if(n <= 0) n += 2147483646;
  return function(){ n = (n * 16807) % 2147483647; return (n - 1) / 2147483646; };
}
function shuffled(arr, rnd){
  var a = arr.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(rnd() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
/* テストの出題を組み立てる。co.shuffle が false のときは登録した順のまま */
function buildQuiz(name, co){
  var qs = (co.quiz || []).map(function(q, i){
    return { q:q.q, a:q.a, c:q.c, src:i, order:q.c.map(function(_, j){ return j; }) };
  });
  if(co.shuffle === false) return qs;
  var rnd = seedRand(name + '|' + co.id + '|' + termFor(co) + '|' + quizTries(name, co.id));
  qs = shuffled(qs, rnd);
  qs.forEach(function(q){
    q.order = shuffled(q.order, rnd);
    q.c = q.order.map(function(j){ return co.quiz[q.src].c[j]; });
    q.a = q.order.indexOf(co.quiz[q.src].a);
  });
  return qs;
}
function quizKey(name, courseId, term){
  var co = courses().filter(function(c){ return c.id === courseId; })[0];
  var t = (term !== undefined) ? term : termFor(co);
  return name + '|' + courseId + (t ? '|' + t : '');
}
function getQuiz(name, courseId){ return quizzes()[quizKey(name, courseId)] || null; }

/* 受講後アンケート  surveys[名前 + '|' + コースID] = {score, useful, comment, at} */
function surveys(){ return MEM.surveys; }
function getSurvey(name, courseId){ return MEM.surveys[quizKey(name, courseId)] || null; }
function putSurvey(name, courseId, o){
  var k = quizKey(name, courseId);
  MEM.surveys[k] = o;
  cacheFlush('surveys');
  queueSync('survey', k);
}

/* お知らせ  news[ID] = {id, title, body, group, at, by} */
function newsAll(){ return MEM.news; }
/* 自分あてのお知らせだけを新しい順に返す */
function newsFor(person, limit){
  var out = [];
  Object.keys(MEM.news).forEach(function(k){
    var n = MEM.news[k];
    if(!n || n.deleted) return;      /* 件数で切る前に、削除済みをここで外す */
    if(n.group && person && n.group !== (person.group || '') && n.group !== (person.dept || '')) return;
    out.push(n);
  });
  out.sort(function(a, b){ return String(b.at) < String(a.at) ? -1 : 1; });
  return limit ? out.slice(0, limit) : out;
}
var _newsSeq = 0;
function putNews(o){
  /* 同じミリ秒に2件配信するとIDがぶつかるので、連番を足す */
  o.id = o.id || ('n' + Date.now() + '_' + (++_newsSeq));
  MEM.news[o.id] = o;
  cacheFlush('news');
  queueSync('news', o.id);
}
function delNews(id){
  var o = MEM.news[id];
  if(!o) return;
  o.deleted = true;            /* Creator側は消さず、消えた印だけ付ける */
  MEM.news[id] = o;
  cacheFlush('news');
  queueSync('news', id);
}
/* 未読のお知らせの数（読んだ印はこの端末に持つ） */
function newsUnread(person){
  var seen = LS.get('newsSeen', {});
  return newsFor(person).filter(function(n){ return !n.deleted && !seen[n.id]; }).length;
}
function markNewsSeen(person){
  var seen = LS.get('newsSeen', {});
  newsFor(person).forEach(function(n){ seen[n.id] = true; });
  LS.set('newsSeen', seen);
}

/* ══════════════════════════════════════════════════════════════
   年度（受講サイクル）
     法定研修は毎年受け直す。同じ人が同じコースを何度も受けるので、
     記録のキーに年度を入れて、年度ごとに別の記録として持つ。

     コースの cycle:
       'yearly' … 毎年受け直す（既定。法定研修はこれ）
       'once'   … 一度きり（入社時研修など）

     年度は4月はじまり（config().termStart で変えられる）。
     2026年4月〜2027年3月 → '2026年度'
   ══════════════════════════════════════════════════════════════ */
var VIEW_TERM = '';   /* 管理画面で過去の年度を見るときだけ入る。空なら「今年度」 */

function termStartMonth(){
  var m = Number(config().termStart);
  return (m >= 1 && m <= 12) ? m : 4;
}
/* 日付 → 年度の文字列 */
function termOfDate(d){
  d = d || new Date();
  var y = d.getFullYear(), m = d.getMonth() + 1;
  return String(m < termStartMonth() ? y - 1 : y);
}
function currentTerm(){ return termOfDate(new Date()); }
/* いま見ている年度 */
function actTerm(){ return VIEW_TERM || currentTerm(); }
/* 選べる年度の一覧（記録のある年度＋今年度） */
function termList(){
  var set = {};
  set[currentTerm()] = true;
  [MEM.records, MEM.quizzes, MEM.surveys].forEach(function(box){
    Object.keys(box).forEach(function(k){
      var p = k.split('|');
      if(p.length >= 3 && /^\d{4}$/.test(p[p.length - 1])) set[p[p.length - 1]] = true;
    });
  });
  return Object.keys(set).sort().reverse();
}
/* 章IDからコースを引く（キーに年度を入れるかの判定に使う） */
var _chapCo = null, _chapCoSrc = null;
function chapCourse(chapId){
  var cs = courses();
  if(_chapCo === null || _chapCoSrc !== cs){
    _chapCo = {}; _chapCoSrc = cs;
    cs.forEach(function(co){
      co.chapters.forEach(function(ch){ _chapCo[ch.id] = co; });
    });
  }
  return _chapCo[chapId] || null;
}
/* そのコースの記録に付ける年度。'once' のコースは年度を付けない */
function termFor(co){
  if(!co) return actTerm();          /* 分からないときは年度つきにしておく（安全側） */
  return (co.cycle === 'once') ? '' : actTerm();
}
/* 表示用 */
function termLabel(t){ return (t || currentTerm()) + '年度'; }

/* ══════════════════════════════════════════════════════════════
   配信（どのコースを誰に出すか）
     コースごとに assign を持つ。
       { mode:'all' }                          … 全員に配信
       { mode:'group', targets:['管理職',…] }   … グループ指定
       { mode:'dept',  targets:['本部',…] }     … 職種指定
       { mode:'person',targets:['山田 太郎',…] }… 個人指定
       { mode:'none' }                          … 配信停止（下書き）
     複数を組み合わせたい場合は rules に複数入れる（OR条件）。
   ══════════════════════════════════════════════════════════════ */
function assignOf(co){
  var a = co && co.assign;
  if(!a) return { rules:[{ mode:'all', targets:[] }] };
  /* 古い形（1つだけ）も読めるようにしておく */
  if(!a.rules) return { rules:[{ mode:a.mode || 'all', targets:a.targets || [] }] };
  return { rules:a.rules.length ? a.rules : [{ mode:'all', targets:[] }] };
}
/* その人にこのコースが配信されているか。
   「出す」ルールのどれかに当たれば配信、ただし「出さない」ルールに当たったら必ず除外。
   これで「全員、ただし派遣の○○さんは除く」が作れる。 */
function isAssigned(person, co){
  if(!person) return false;
  var rules = assignOf(co).rules;
  var i, r, t;
  /* 先に除外を見る。除外が勝つ */
  for(i = 0; i < rules.length; i++){
    r = rules[i]; t = r.targets || [];
    if(r.mode === 'ex_person' && t.indexOf(person.name  || '') >= 0) return false;
    if(r.mode === 'ex_group'  && t.indexOf(person.group || '') >= 0) return false;
    if(r.mode === 'ex_dept'   && t.indexOf(person.dept  || '') >= 0) return false;
  }
  for(i = 0; i < rules.length; i++){
    r = rules[i]; t = r.targets || [];
    if(r.mode === 'all')    return true;
    if(r.mode === 'none')   continue;
    if(r.mode === 'group'  && t.indexOf(person.group || '') >= 0) return true;
    if(r.mode === 'dept'   && t.indexOf(person.dept  || '') >= 0) return true;
    if(r.mode === 'person' && t.indexOf(person.name  || '') >= 0) return true;
  }
  return false;
}
/* 配信先の説明文（管理画面用） */
function assignLabel(co){
  var rules = assignOf(co).rules;
  var isAll = rules.some(function(r){ return r.mode === 'all'; });
  var parts = [], ex = [];
  var few = function(t){
    return t.length > 3 ? t.slice(0, 3).join('、') + ' ほか' + (t.length - 3) + '名' : t.join('、');
  };
  rules.forEach(function(r){
    var t = (r.targets || []);
    if(!t.length) return;
    if(r.mode === 'group')  parts.push('グループ：' + t.join('、'));
    if(r.mode === 'dept')   parts.push('職種：' + t.join('、'));
    if(r.mode === 'person') parts.push('個人：' + few(t));
    if(r.mode === 'ex_group')  ex.push('グループ：' + t.join('、'));
    if(r.mode === 'ex_dept')   ex.push('職種：' + t.join('、'));
    if(r.mode === 'ex_person') ex.push(few(t));
  });
  var base = isAll ? '全員' : (parts.length ? parts.join(' ／ ') : '配信なし');
  return ex.length ? base + '（除く ' + ex.join(' ／ ') + '）' : base;
}
/* 配信対象の人数（名簿から数える） */
function assignedPeople(co){
  return allPeople().filter(function(p){ return isAssigned(p, co); });
}
/* 停止中（hidden）は受講者に出さない。過去の記録は残したまま隠すための印。 */
function isLive(x){ return !(x && x.hidden); }
function liveChapters(co){ return ((co && co.chapters) || []).filter(isLive); }
/* いま受講している本人に配信されているコースだけを返す */
function myCourses(){
  var u = me();
  if(!u) return [];
  var ps = people()[u.name];
  var person = { name:u.name, dept:(ps && ps.dept) || u.dept, group:(ps && ps.group) || u.group };
  return courses().filter(function(co){
    return isLive(co) && isAssigned(person, co);
  });
}

/* コース定義（1レコードにJSONで持つ。書き換えるのは管理者だけなので競合しない） */
function courses(){ return MEM.courses || DEFAULT_COURSES; }
/* コースIDは記録のキーではないが、章IDは記録のキーそのもの。
   いちど使ったIDは、消しても二度と使い回さない（過去の記録が迷子になる）。 */
function newCourseId(){
  var used = {};
  courses().forEach(function(c){ used[c.id] = 1; });
  for(var i = 1; i < 10000; i++){ if(!used['c' + i]) return 'c' + i; }
  return 'c' + Date.now();
}
function newChapterId(co){
  var used = {};
  /* 保存ずみのコースだけでなく、いま編集中の下書きの章も見ること。
     ここを忘れると、続けて足した章に同じIDが付き、視聴記録が混ざる。 */
  courses().forEach(function(c){
    (c.chapters || []).forEach(function(ch){ used[ch.id] = 1; });
  });
  ((co && co.chapters) || []).forEach(function(ch){ used[ch.id] = 1; });
  for(var i = 1; i < 10000; i++){ if(!used[co.id + 'v' + i]) return co.id + 'v' + i; }
  return co.id + 'v' + Date.now();
}
/* その章に、誰かの視聴記録があるか（消してよいかの判断に使う） */
function chapHasRecords(chapId){
  var ks = Object.keys(records()), pre = '|' + chapId;
  for(var i = 0; i < ks.length; i++){
    var k = ks[i];
    if(k.indexOf(pre) > 0 && (k.indexOf(pre + '|') > 0 || k.slice(-pre.length) === pre)) return true;
  }
  return false;
}
function courseHasRecords(co){
  if(Object.keys(quizzes()).some(function(k){ return k.indexOf('|' + co.id) > 0; })) return true;
  return (co.chapters || []).some(function(ch){ return chapHasRecords(ch.id); });
}
function setCourses(c){
