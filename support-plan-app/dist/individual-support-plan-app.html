<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>個別支援計画 作成支援</title>


<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📋</text></svg>">
<style>
/* =========================================================================
 * style.css — 画面表示用
 * 支援の現場でタブレットからも使えるよう、文字と余白は大きめにとる。
 * ========================================================================= */

:root {
  --bg: #f4f6f5;
  --panel: #ffffff;
  --ink: #1f2a30;
  --ink-soft: #5b6b73;
  --line: #dfe5e3;
  --brand: #2f7d64;
  --brand-dark: #24614e;
  --brand-soft: #e8f2ee;
  --warn: #b45309;
  --warn-soft: #fef3c7;
  --danger: #b3261e;
  --ok: #2f7d64;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(31, 42, 48, .06), 0 4px 14px rgba(31, 42, 48, .05);
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.75;
}

h1, h2, h3 { margin: 0; line-height: 1.4; }
h1 { font-size: 1.5rem; }
h2 { font-size: 1.1rem; }
h3 { font-size: 1rem; }
p { margin: .4em 0; }

.muted { color: var(--ink-soft); }
.muted.small, .small { font-size: .875rem; }
.pad { padding: 1rem; }
.center { text-align: center; }

/* ---- 上部バー ----------------------------------------------------------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  padding: .6rem 1.25rem;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.brand {
  display: flex; align-items: center; gap: .7rem;
  background: none; border: 0; padding: .2rem; cursor: pointer;
  color: inherit; font: inherit; text-align: left;
}
.brand-mark {
  display: grid; place-items: center;
  width: 38px; height: 38px; border-radius: 9px;
  background: var(--brand); color: #fff; font-weight: 700; font-size: 1.15rem;
}
.brand-name { display: block; font-weight: 700; line-height: 1.3; }
.brand-sub { display: block; font-size: .78rem; color: var(--ink-soft); line-height: 1.3; }

.topnav { display: flex; gap: .4rem; }
.navlink {
  border: 1px solid transparent; background: none; cursor: pointer;
  padding: .45rem .9rem; border-radius: 999px;
  font: inherit; font-size: .92rem; color: var(--ink-soft);
}
.navlink:hover { background: var(--brand-soft); color: var(--brand-dark); }
.navlink.on { background: var(--brand); color: #fff; }

/* ---- 児童バーとタブ ------------------------------------------------------ */
.childbar {
  position: sticky; top: 55px; z-index: 15;
  background: var(--panel); border-bottom: 1px solid var(--line);
  padding: .55rem 1.25rem 0;
}
.childbar-id { display: flex; align-items: center; gap: 1rem; }
.back {
  border: 1px solid var(--line); background: #fff; cursor: pointer;
  border-radius: 8px; padding: .35rem .7rem; font: inherit; font-size: .875rem;
  color: var(--ink-soft); white-space: nowrap;
}
.back:hover { border-color: var(--brand); color: var(--brand-dark); }
.childbar-name { font-size: 1.15rem; font-weight: 700; line-height: 1.4; }
.childbar-meta { font-size: .84rem; color: var(--ink-soft); line-height: 1.4; }

.tabs { display: flex; gap: .15rem; margin-top: .5rem; overflow-x: auto; }
.tab {
  border: 0; background: none; cursor: pointer; white-space: nowrap;
  padding: .55rem .95rem; font: inherit; font-size: .93rem; color: var(--ink-soft);
  border-bottom: 3px solid transparent;
}
.tab:hover { color: var(--brand-dark); }
.tab.on { color: var(--brand-dark); font-weight: 700; border-bottom-color: var(--brand); }

/* ---- 本体 --------------------------------------------------------------- */
.main { max-width: 1180px; margin: 0 auto; padding: 1.25rem; }
.child-body { padding-top: .25rem; }

.page-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem;
}
.page-head p { margin: .25rem 0 0; font-size: .9rem; max-width: 62ch; }

.panel {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 1.1rem 1.25rem; margin-bottom: 1.1rem;
}
.panel-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: .75rem; flex-wrap: wrap; margin-bottom: .8rem;
}
.panel-actions {
  display: flex; justify-content: flex-end; gap: .6rem;
  margin-top: 1rem; padding-top: .9rem; border-top: 1px solid var(--line);
}
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1.1rem; align-items: start; }
@media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }

.empty {
  background: var(--panel); border: 1px dashed var(--line); border-radius: var(--radius);
  padding: 2.5rem 1.5rem; text-align: center;
}

/* ---- ボタン ------------------------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .35rem;
  border: 1px solid var(--line); background: #fff; color: var(--ink);
  border-radius: 8px; padding: .5rem 1rem; cursor: pointer;
  font: inherit; font-size: .92rem; white-space: nowrap;
}
.btn:hover { border-color: var(--brand); color: var(--brand-dark); background: var(--brand-soft); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
.btn.primary:hover { background: var(--brand-dark); border-color: var(--brand-dark); color: #fff; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.danger:hover { background: #8f1e17; border-color: #8f1e17; color: #fff; }
.btn.danger.ghost { background: #fff; color: var(--danger); border-color: #e8c9c7; }
.btn.danger.ghost:hover { background: #fdf2f1; color: var(--danger); border-color: var(--danger); }
.btn.ghost { background: #fff; color: var(--ink-soft); }
.btn.small { padding: .35rem .75rem; font-size: .86rem; }
.btn.tiny { padding: .2rem .55rem; font-size: .8rem; }
.btn.rec { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn input[type="file"] { display: none; }

.btn-row { display: flex; gap: .55rem; flex-wrap: wrap; }
.btn-row.end { justify-content: flex-end; margin-top: 1rem; }

/* ---- フォーム ----------------------------------------------------------- */
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .85rem 1.1rem; }
.form-grid.compact { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.form-grid .wide { grid-column: 1 / -1; }
@media (max-width: 760px) {
  .form-grid, .form-grid.compact { grid-template-columns: 1fr; }
}

.field { display: flex; flex-direction: column; gap: .3rem; min-width: 0; }
.field-label { font-size: .84rem; font-weight: 600; color: var(--ink-soft); }
.field-hint { font-size: .78rem; color: var(--ink-soft); }
.static-value {
  padding: .5rem .65rem; border: 1px solid transparent;
  background: var(--brand-soft); border-radius: 8px; font-weight: 600;
}

input[type="text"], input[type="date"], input[type="number"], select, textarea {
  width: 100%; padding: .5rem .65rem;
  border: 1px solid var(--line); border-radius: 8px;
  font: inherit; font-size: .95rem; color: var(--ink); background: #fff;
}
textarea { resize: vertical; line-height: 1.7; }
textarea.transcript { font-size: 1rem; line-height: 1.9; min-height: 24rem; }
input:focus, select:focus, textarea:focus {
  outline: 2px solid var(--brand); outline-offset: 1px; border-color: var(--brand);
}
input.search { max-width: 26rem; }

.search-row { display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; margin-bottom: .8rem; }

.check-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: .3rem .8rem;
}
.check { display: flex; align-items: center; gap: .45rem; font-size: .92rem; cursor: pointer; }
.check input { width: 1.05rem; height: 1.05rem; accent-color: var(--brand); }

/* ---- 児童カード --------------------------------------------------------- */
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: .9rem; }
.child-card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: .95rem 1.05rem; cursor: pointer;
}
.child-card:hover { border-color: var(--brand); box-shadow: 0 3px 16px rgba(47, 125, 100, .16); }
.child-card:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.child-card-name { font-size: 1.1rem; font-weight: 700; }
.child-card-kana { font-size: .78rem; color: var(--ink-soft); margin-bottom: .45rem; }
.child-card-meta { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; font-size: .87rem; }
.child-card-stats {
  display: flex; gap: .9rem; font-size: .8rem; color: var(--ink-soft);
  margin-top: .5rem; padding-top: .5rem; border-top: 1px solid var(--line);
}
.child-card-due { margin-top: .4rem; font-size: .8rem; color: var(--ink-soft); }
.child-card-due.overdue { color: var(--warn); font-weight: 600; }

.tag {
  display: inline-block; padding: .05rem .5rem; border-radius: 999px;
  background: var(--brand-soft); color: var(--brand-dark);
  font-size: .76rem; font-weight: 600; white-space: nowrap;
}
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.ok { background: #dcfce7; color: #15803d; }

/* ---- 定義リスト --------------------------------------------------------- */
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1.2rem; margin: 0; }
.kv-row { display: grid; grid-template-columns: 9.5rem 1fr; gap: .5rem; padding: .35rem 0; border-bottom: 1px solid var(--line); }
.kv-row.wide { grid-column: 1 / -1; }
.kv dt { font-size: .82rem; color: var(--ink-soft); }
.kv dd { margin: 0; font-size: .92rem; white-space: pre-wrap; }
@media (max-width: 760px) { .kv { grid-template-columns: 1fr; } }

/* ---- やることリスト ------------------------------------------------------ */
.todo { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
.todo li {
  display: flex; align-items: center; justify-content: space-between; gap: .8rem;
  padding: .65rem .8rem; border-radius: 8px; background: var(--brand-soft); font-size: .92rem;
}
.todo li.warn { background: var(--warn-soft); color: var(--warn); }

.shortcut-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
.shortcut {
  display: flex; flex-direction: column; gap: .15rem; text-align: left;
  border: 1px solid var(--line); background: #fff; border-radius: 8px;
  padding: .7rem .85rem; cursor: pointer; font: inherit;
}
.shortcut:hover { border-color: var(--brand); background: var(--brand-soft); }
.shortcut-title { font-weight: 600; font-size: .92rem; }
.shortcut-count { font-size: .8rem; color: var(--ink-soft); }

/* ---- 一覧(計画・記録) --------------------------------------------------- */
.record-list { display: grid; gap: .55rem; }
.record-item {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem;
  padding: .8rem .9rem; border: 1px solid var(--line); border-radius: 8px; background: #fff;
}
.record-item:hover { border-color: var(--brand); }
.record-main { min-width: 0; flex: 1; }
.record-title { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; font-weight: 700; }
.record-meta {
  display: flex; gap: .9rem; flex-wrap: wrap;
  font-size: .8rem; color: var(--ink-soft); margin-top: .1rem;
}
.record-body {
  margin: .4rem 0 0; font-size: .89rem; color: var(--ink-soft);
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.record-actions { display: flex; gap: .35rem; flex-wrap: wrap; justify-content: flex-end; }

/* ---- 計画フォーム ------------------------------------------------------- */
.goal-block { padding: .9rem 0; border-top: 1px solid var(--line); }
.goal-block:first-of-type { border-top: 0; }
.goal-head {
  border-left: 5px solid var(--brand); padding-left: .65rem;
  margin-bottom: .7rem; display: flex; align-items: baseline; gap: .7rem; flex-wrap: wrap;
}
.goal-desc { font-size: .78rem; font-weight: 400; color: var(--ink-soft); }

.session-block { padding: .9rem 0; border-top: 1px solid var(--line); }
.session-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: .6rem; }

/* ---- アセスメント ------------------------------------------------------- */
.assess-layout { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(320px, .95fr); gap: 1.1rem; align-items: start; }
@media (max-width: 1000px) { .assess-layout { grid-template-columns: 1fr; } }
.panel.sticky { position: sticky; top: 130px; }
@media (max-width: 1000px) { .panel.sticky { position: static; } }

.assess-sections { display: grid; gap: .5rem; }
.assess-section { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); overflow: hidden; }
.assess-head {
  display: flex; align-items: center; gap: .7rem; width: 100%;
  padding: .8rem 1rem; border: 0; background: #fff; cursor: pointer; font: inherit; text-align: left;
}
.assess-head:hover { background: var(--brand-soft); }
.assess-head.open { background: var(--brand-soft); border-bottom: 1px solid var(--line); }
.assess-head-name { font-weight: 700; flex: 1; }
.assess-head-count { font-size: .82rem; color: var(--ink-soft); }
.assess-head-months {
  font-size: .82rem; font-weight: 700; color: var(--brand-dark);
  background: #fff; border-radius: 999px; padding: .1rem .6rem; border: 1px solid var(--line);
}
.chev { font-size: .7rem; color: var(--ink-soft); }

.assess-body { padding: .5rem 1rem 1rem; }
.assess-body.hidden { display: none; }
.assess-desc { font-size: .83rem; color: var(--ink-soft); margin: .2rem 0 .7rem; }

.assess-row {
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  padding: .5rem .55rem; border-bottom: 1px solid var(--line); border-radius: 6px;
}
.assess-row:last-of-type { border-bottom: 0; }
.assess-row.focus { background: #fffbeb; }
.assess-item { display: flex; align-items: baseline; gap: .6rem; min-width: 0; }
.assess-month {
  flex: 0 0 auto; font-size: .74rem; color: var(--ink-soft);
  background: #f1f5f4; border-radius: 999px; padding: .05rem .5rem;
}
.assess-text { font-size: .93rem; }

.seg { display: flex; gap: .2rem; flex: 0 0 auto; }
.seg-btn {
  border: 1px solid var(--line); background: #fff; cursor: pointer;
  padding: .3rem .6rem; font: inherit; font-size: .82rem; color: var(--ink-soft);
  border-radius: 6px; white-space: nowrap;
}
.seg-btn:hover { border-color: var(--brand); }
.seg-btn.s2.on { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
.seg-btn.s1.on { background: #d97706; border-color: #d97706; color: #fff; font-weight: 600; }
.seg-btn.s0.on { background: #94a3b8; border-color: #94a3b8; color: #fff; font-weight: 600; }

.assess-bulk { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; margin-top: .8rem; font-size: .82rem; }

.domain-scores { list-style: none; margin: .8rem 0 0; padding: 0; display: grid; gap: .25rem; }
.domain-scores li { display: flex; align-items: center; gap: .5rem; font-size: .88rem; }
.ds-name { flex: 1; }
.ds-val { font-weight: 700; color: var(--brand-dark); }

.dot { display: inline-block; width: .65rem; height: .65rem; border-radius: 50%; flex: 0 0 auto; }

/* ---- グラフ ------------------------------------------------------------- */
.radar-wrap { display: flex; flex-direction: column; align-items: center; gap: .4rem; }
.radar { width: 100%; max-width: 330px; height: auto; }
.radar-label { font-size: 11px; fill: #475569; }
.legend { display: flex; gap: .9rem; flex-wrap: wrap; justify-content: center; font-size: .78rem; color: var(--ink-soft); }
.legend-item { display: flex; align-items: center; gap: .3rem; }
.legend-swatch { width: .8rem; height: .8rem; border-radius: 3px; display: inline-block; }
.legend-swatch.dashed { border: 1.5px dashed #64748b; background: none; }

.trend-layout { display: grid; grid-template-columns: minmax(280px, .8fr) minmax(0, 1.4fr); gap: 1.2rem; align-items: center; }
@media (max-width: 900px) { .trend-layout { grid-template-columns: 1fr; } }
.table-scroll { overflow-x: auto; }

.table { width: 100%; border-collapse: collapse; font-size: .88rem; }
.table th, .table td { border: 1px solid var(--line); padding: .45rem .6rem; text-align: left; vertical-align: middle; }
.table thead th { background: #f1f5f4; font-size: .8rem; white-space: nowrap; }
.table tbody th { font-weight: 600; white-space: nowrap; }
.trend td { text-align: center; white-space: nowrap; }
.trend-val { display: block; font-weight: 600; }
.trend-delta { display: block; font-size: .74rem; color: var(--ink-soft); }
.trend-delta.up { color: var(--ok); font-weight: 700; }
.trend-delta.down { color: var(--warn); }
.trend-chrono td, .trend-chrono th { background: #fafafa; color: var(--ink-soft); font-size: .82rem; }

.note { font-size: .8rem; color: var(--ink-soft); margin-top: .7rem; }
.note.warn { color: var(--warn); background: var(--warn-soft); padding: .5rem .7rem; border-radius: 6px; }

.notice { background: var(--brand-soft); border-radius: 8px; padding: .8rem 1rem; margin-top: .9rem; font-size: .88rem; }
.notice p { margin: .4em 0 0; }

.danger-zone { border-color: #e8c9c7; }

/* ---- ダイアログ --------------------------------------------------------- */
.modal-overlay {
  position: fixed; inset: 0; z-index: 50; background: rgba(31, 42, 48, .45);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 3rem 1rem; overflow-y: auto;
}
.modal-box {
  background: var(--panel); border-radius: 12px; width: min(880px, 100%);
  box-shadow: 0 20px 50px rgba(0, 0, 0, .25);
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 1rem 1.25rem; border-bottom: 1px solid var(--line);
}
.modal-close { border: 0; background: none; font-size: 1.5rem; line-height: 1; cursor: pointer; color: var(--ink-soft); }
.modal-body { padding: 1.25rem; }
.modal-foot {
  display: flex; justify-content: flex-end; gap: .55rem;
  padding: .9rem 1.25rem; border-top: 1px solid var(--line);
}
.modal-foot .danger.ghost { margin-right: auto; }

/* ---- トースト ----------------------------------------------------------- */
.toast {
  position: fixed; left: 50%; bottom: 1.5rem; transform: translate(-50%, 200%);
  z-index: 100; background: var(--ink); color: #fff;
  padding: .7rem 1.2rem; border-radius: 999px; font-size: .9rem;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .25); transition: transform .25s ease;
  max-width: min(90vw, 40rem); text-align: center;
}
.toast.show { transform: translate(-50%, 0); }
.toast.warn { background: var(--warn); }

/* 印刷用の領域は、画面上では隠しておく */
#print-root { display: none; }

</style>
<style media="print">
/* =========================================================================
 * print.css — 印刷(A4)用
 * 画面の内容は隠し、#print-root に組み立てた帳票だけを出す。
 * ========================================================================= */

@page { size: A4 landscape; margin: 10mm 10mm 12mm; }

body.printing #app,
body.printing .toast,
body.printing .modal-overlay { display: none !important; }

body.printing #print-root { display: block !important; }

body.printing {
  background: #fff;
  color: #000;
  font-family: "Hiragino Mincho ProN", "Yu Mincho", "MS PMincho", serif;
  font-size: 10pt;
  line-height: 1.6;
}

.sheet { page-break-after: always; }
.sheet:last-child { page-break-after: auto; }

/* ---- 見出し ------------------------------------------------------------- */
.sheet-title-row {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 1em; margin-bottom: 4mm;
}
.sheet-title {
  font-size: 16pt; font-weight: 700; letter-spacing: .35em;
  border-bottom: 2px solid #000; padding-bottom: 1mm; flex: 1;
}
.sheet-office { font-size: 9pt; white-space: nowrap; }

.sheet-meta { width: 100%; border-collapse: collapse; margin-bottom: 3mm; font-size: 9.5pt; }
.sheet-meta th, .sheet-meta td { border: 1px solid #000; padding: 1.2mm 2mm; text-align: left; }
.sheet-meta th { background: #f0f0f0; white-space: nowrap; width: 1%; font-weight: 600; }

/* ---- 本文ブロック ------------------------------------------------------- */
.sheet-block { margin-bottom: 2.5mm; break-inside: avoid; }
.sheet-block-label {
  font-weight: 700; font-size: 9.5pt;
  background: #f0f0f0; border: 1px solid #000; border-bottom: 0; padding: 1mm 2mm;
}
.sheet-block-body {
  border: 1px solid #000; padding: 1.8mm 2mm;
  min-height: 11mm; white-space: pre-wrap; font-size: 9.5pt;
}
.two-block { display: grid; grid-template-columns: 1fr 1fr; gap: 2.5mm; }
.two-block .sheet-block { margin-bottom: 0; }

/* ---- 表 ----------------------------------------------------------------- */
.sheet-table { width: 100%; border-collapse: collapse; font-size: 9pt; margin-bottom: 2.5mm; }
.sheet-table th, .sheet-table td {
  border: 1px solid #000; padding: 1.3mm 1.8mm;
  text-align: left; vertical-align: top;
}
.sheet-table thead th { background: #f0f0f0; text-align: center; font-weight: 700; }
.sheet-table th { background: #f6f6f6; font-weight: 600; white-space: nowrap; }
.sheet-table .center { text-align: center; }

<script>
/* ---- js/store.js ---- */
/* =========================================================================
 * store.js — データ保存層
 * すべてブラウザの localStorage に保存する。外部への送信は一切行わない。
 * ========================================================================= */
window.Store = (function () {
  'use strict';

  const KEY = 'sps.v1.db';

  const EMPTY = {
    version: 1,
    settings: { officeName: '', serviceType: '児童発達支援', manager: '', address: '', tel: '' },
    children: [],     // 児童
    plans: [],        // 個別支援計画
    splans: [],       // 専門的支援実施計画
    assessments: [],  // 発達アセスメント
    records: []       // 記録・文字起こし
  };

  let db = null;

  function uid(prefix) {
    return (prefix || 'id') + '-' + Date.now().toString(36) + '-' +
      Math.random().toString(36).slice(2, 8);
  }

  function load() {
    if (db) return db;
    try {
      const raw = localStorage.getItem(KEY);
      db = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(EMPTY));
    } catch (e) {
      console.error('保存データの読み込みに失敗しました', e);
      db = JSON.parse(JSON.stringify(EMPTY));
    }
    // 後方互換: 欠けているコレクションを補う
    Object.keys(EMPTY).forEach(function (k) {
      if (db[k] === undefined) db[k] = JSON.parse(JSON.stringify(EMPTY[k]));
    });
    return db;
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(load()));
      return true;
    } catch (e) {
      alert('保存できませんでした。ブラウザの保存容量が上限に達している可能性があります。\n' +
            '「データ管理」からバックアップを取り、不要な記録を整理してください。');
      console.error(e);
      return false;
    }
  }

  /* ---- 汎用コレクション操作 -------------------------------------------- */
  function list(coll) { return load()[coll]; }

  function get(coll, id) {
    return list(coll).filter(function (r) { return r.id === id; })[0] || null;
  }

  function byChild(coll, childId) {
    return list(coll).filter(function (r) { return r.childId === childId; });
  }

  function put(coll, obj) {
    const now = new Date().toISOString();
    const arr = list(coll);
    if (!obj.id) {
      obj.id = uid(coll.slice(0, 3));
      obj.createdAt = now;
      obj.updatedAt = now;
      arr.push(obj);
    } else {
      const i = arr.findIndex(function (r) { return r.id === obj.id; });
      obj.updatedAt = now;
      if (i >= 0) { obj.createdAt = arr[i].createdAt || now; arr[i] = obj; }
      else { obj.createdAt = now; arr.push(obj); }
    }
    save();
    return obj;
  }

  function remove(coll, id) {
    const arr = list(coll);
    const i = arr.findIndex(function (r) { return r.id === id; });
    if (i >= 0) { arr.splice(i, 1); save(); }
  }

  /* 児童を消すと、その児童に紐づく計画・アセスメント・記録もすべて消す */
  function removeChild(childId) {
    ['plans', 'splans', 'assessments', 'records'].forEach(function (coll) {
      const arr = list(coll);
      for (let i = arr.length - 1; i >= 0; i--) {
        if (arr[i].childId === childId) arr.splice(i, 1);
      }
    });
    remove('children', childId);
  }

  /* ---- 設定 ------------------------------------------------------------ */
  function settings(patch) {
    const d = load();
    if (patch) { Object.assign(d.settings, patch); save(); }
    return d.settings;
  }

  /* ---- バックアップ ---------------------------------------------------- */
  function exportJson() {
    return JSON.stringify(load(), null, 2);
  }

  function importJson(text, mode) {
    const incoming = JSON.parse(text);
    if (!incoming || !Array.isArray(incoming.children)) {
      throw new Error('このファイルはこのアプリのバックアップではないようです。');
    }
    if (mode === 'replace') {
      db = incoming;
      Object.keys(EMPTY).forEach(function (k) {
        if (db[k] === undefined) db[k] = JSON.parse(JSON.stringify(EMPTY[k]));
      });
    } else {
      // 追加: 既存と同じ id のものは取り込まない
      const d = load();
      ['children', 'plans', 'splans', 'assessments', 'records'].forEach(function (coll) {
        const have = {};
        d[coll].forEach(function (r) { have[r.id] = true; });
        (incoming[coll] || []).forEach(function (r) { if (!have[r.id]) d[coll].push(r); });
      });
    }
    save();
  }

  function clearAll() {
    db = JSON.parse(JSON.stringify(EMPTY));
    save();
  }

  /* 保存容量の目安(バイト) */
  function usedBytes() {
    try { return new Blob([localStorage.getItem(KEY) || '']).size; } catch (e) { return 0; }
  }

  return {
    uid: uid, load: load, save: save,
    list: list, get: get, byChild: byChild, put: put, remove: remove,
    removeChild: removeChild, settings: settings,
    exportJson: exportJson, importJson: importJson, clearAll: clearAll, usedBytes: usedBytes
  };
})();

</script>
<script>
/* ---- js/ui.js ---- */
/* =========================================================================
 * ui.js — 共通ユーティリティ(DOM生成・日付・トースト・確認ダイアログ)
 * ========================================================================= */
window.UI = (function () {
  'use strict';

  /* ---- DOM ------------------------------------------------------------- */
  function h(tag, attrs, children) {
    const el = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        const v = attrs[k];
        if (v === null || v === undefined || v === false) return;
        if (k === 'class') el.className = v;
        else if (k === 'html') el.innerHTML = v;
        else if (k === 'text') el.textContent = v;
        else if (k === 'dataset') Object.assign(el.dataset, v);
        else if (k.slice(0, 2) === 'on' && typeof v === 'function') {
          el.addEventListener(k.slice(2).toLowerCase(), v);
        } else if (k === 'value') el.value = v;
        else el.setAttribute(k, v === true ? '' : v);
      });
    }
    (Array.isArray(children) ? children : children != null ? [children] : [])
      .forEach(function (c) {
        if (c === null || c === undefined || c === false) return;
        el.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
      });
    return el;
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); return node; }

  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  /* ---- 日付・月齢 ------------------------------------------------------- */
  function today() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
           String(d.getDate()).padStart(2, '0');
  }

  /** 生年月日と基準日から満月齢を返す(基準日が未来でなければ0以上) */
  function ageInMonths(birth, at) {
    if (!birth) return null;
    const b = new Date(birth), t = new Date(at || today());
    if (isNaN(b) || isNaN(t)) return null;
    let m = (t.getFullYear() - b.getFullYear()) * 12 + (t.getMonth() - b.getMonth());
    if (t.getDate() < b.getDate()) m -= 1;
    return m < 0 ? null : m;
  }

  /** 月齢を「◯歳◯か月」に */
  function ageText(months) {
    if (months === null || months === undefined) return '—';
    const y = Math.floor(months / 12), m = Math.round(months % 12);
    return y + '歳' + m + 'か月';
  }

  function fmtDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  /** iso日付に月数を足す(次回モニタリング予定日の算出などに使う) */
  function addMonths(iso, n) {
    const d = new Date(iso || today());
    if (isNaN(d)) return '';
    const day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + n);
    // 月末調整(1/31 + 1か月 → 2/28 など)
    const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(day, last));
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
           String(d.getDate()).padStart(2, '0');
  }

  /* ---- 通知・確認 ------------------------------------------------------- */
  let toastTimer = null;
  function toast(msg, kind) {
    let box = $('#toast');
    if (!box) {
      box = h('div', { id: 'toast', class: 'toast' });
      document.body.appendChild(box);
    }
    box.textContent = msg;
    box.className = 'toast show' + (kind ? ' ' + kind : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { box.className = 'toast'; }, 2600);
  }

  function confirmDanger(message) { return window.confirm(message); }

  /* ---- フォーム部品 ----------------------------------------------------- */
  function field(label, control, hint) {
    return h('label', { class: 'field' }, [
      h('span', { class: 'field-label' }, label),
      control,
      hint ? h('span', { class: 'field-hint' }, hint) : null
    ]);
  }

  function input(name, value, opts) {
    return h('input', Object.assign({ type: 'text', name: name, value: value || '' }, opts || {}));
  }

  function textarea(name, value, rows, placeholder) {
    return h('textarea', { name: name, rows: rows || 3, placeholder: placeholder || '' }, value || '');
  }

  function select(name, options, value, opts) {
    const sel = h('select', Object.assign({ name: name }, opts || {}));
    options.forEach(function (o) {
      const val = typeof o === 'object' ? o.value : o;
      const lab = typeof o === 'object' ? o.label : o;
      sel.appendChild(h('option', { value: val, selected: String(val) === String(value) }, lab));
    });
    return sel;
  }

  /** フォーム要素から name→値 のオブジェクトを取り出す */
  function readForm(form) {
    const out = {};
    $$('input,select,textarea', form).forEach(function (el) {
      if (!el.name) return;
      if (el.type === 'checkbox') {
        if (out[el.name] === undefined) out[el.name] = [];
        if (el.checked) out[el.name].push(el.value);
      } else if (el.type === 'radio') {
        if (el.checked) out[el.name] = el.value;
      } else {
        out[el.name] = el.value;
      }
    });
    return out;
  }

  /* ---- ファイル --------------------------------------------------------- */
  function download(filename, text, mime) {
    const blob = new Blob([text], { type: (mime || 'application/json') + ';charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = h('a', { href: url, download: filename });
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 0);
  }

  return {
    h: h, esc: esc, clear: clear, $: $, $$: $$,
    today: today, ageInMonths: ageInMonths, ageText: ageText, fmtDate: fmtDate, addMonths: addMonths,
    toast: toast, confirmDanger: confirmDanger,
    field: field, input: input, textarea: textarea, select: select, readForm: readForm,
    download: download
  };
})();

</script>
<script>
/* ---- js/assess.js ---- */
/* =========================================================================
 * assess.js — 発達アセスメントの採点・比較・レーダーチャート
 *
 * 【算出の考え方】
 *  各項目には「おおむね達成される目安の月齢」がある。項目を月齢順に並べ、
 *  ひとつ前の項目からの月数の幅(span)を、その項目の達成度(できる=1.0 /
 *  芽生え=0.5 / これから=0)で按分して積み上げ、領域ごとの「発達の目安月齢」
 *  とする。標準化された検査ではないため、あくまで支援の見立てに使う参考値。
 * ========================================================================= */
window.Assess = (function () {
  'use strict';

  const h = UI.h;

  /* ---- 採点 ------------------------------------------------------------- */

  /** 1領域の発達目安月齢を求める */
  function domainMonths(domain, scores) {
    let prev = 0, total = 0;
    domain.items.forEach(function (it) {
      const span = it.month - prev;
      const s = Number(scores && scores[it.id]);
      const ratio = s === 2 ? 1 : s === 1 ? 0.5 : 0;
      total += span * ratio;
      prev = it.month;
    });
    return Math.round(total * 10) / 10;
  }

  /** 未評価の項目数 */
  function unratedCount(scores) {
    let n = 0;
    DATA.domains.forEach(function (d) {
      d.items.forEach(function (it) {
        const s = scores && scores[it.id];
        if (s === undefined || s === null || s === '') n++;
      });
    });
    return n;
  }

  /** アセスメント1件のサマリを作る */
  function summarize(assessment, child) {
    const scores = assessment.scores || {};
    const perDomain = DATA.domains.map(function (d) {
      return { id: d.id, name: d.name, color: d.color, months: domainMonths(d, scores) };
    });
    const avg = perDomain.reduce(function (a, x) { return a + x.months; }, 0) / perDomain.length;
    const chrono = child ? UI.ageInMonths(child.birthday, assessment.date) : null;
    return {
      perDomain: perDomain,
      averageMonths: Math.round(avg * 10) / 10,
      chronoMonths: chrono,
      // 発達指数の目安(生活月齢に対する比)。参考値であることを必ず併記する。
      ratio: (chrono && chrono > 0) ? Math.round((avg / chrono) * 100) : null,
      unrated: unratedCount(scores)
    };
  }

  /** その児童のアセスメントを実施日の古い順に返す */
  function history(childId) {
    return Store.byChild('assessments', childId).slice().sort(function (a, b) {
      return String(a.date).localeCompare(String(b.date));
    });
  }

  /** 直前のアセスメント(同一児童・実施日がより古いもののうち最新) */
  function previousOf(assessment) {
    const hist = history(assessment.childId).filter(function (a) {
      return a.id !== assessment.id && String(a.date) < String(assessment.date);
    });
    return hist.length ? hist[hist.length - 1] : null;
  }

  /* ---- 前回との差分 ------------------------------------------------------
   * gained  : 前回「これから/芽生え」→ 今回「できる」になった項目
   * emerging: 今回「芽生え」の項目(次に伸ばしたいところ)
   * ---------------------------------------------------------------------- */
  function diff(current, previous) {
    const cur = (current && current.scores) || {};
    const prv = (previous && previous.scores) || null;
    const gained = [], emerging = [], next = [];
    DATA.domains.forEach(function (d) {
      d.items.forEach(function (it) {
        const c = Number(cur[it.id]);
        const p = prv ? Number(prv[it.id]) : NaN;
        if (c === 2 && prv && (p === 0 || p === 1)) {
          gained.push({ domain: d, item: it, from: p });
        }
        if (c === 1) emerging.push({ domain: d, item: it });
      });
      // 各領域で「まだできていない項目のうち最も月齢の低いもの」= 次の一歩
      const notYet = d.items.filter(function (it) { return Number(cur[it.id]) !== 2; });
      if (notYet.length) next.push({ domain: d, item: notYet[0], score: Number(cur[notYet[0].id]) || 0 });
    });
    return { gained: gained, emerging: emerging, next: next };
  }

  /* ---- レーダーチャート(依存ライブラリなしの手書きSVG) ----------------- */
  function radar(series, opts) {
    opts = opts || {};
    const size = opts.size || 320;
    const cx = size / 2, cy = size / 2 + 6;
    const R = size * 0.34;
    const max = DATA.MAX_MONTH;
    const axes = DATA.domains;
    const n = axes.length;
    const NS = 'http://www.w3.org/2000/svg';

    function svgEl(tag, attrs) {
      const el = document.createElementNS(NS, tag);
      Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k, attrs[k]); });
      return el;
    }
    function point(i, v) {
      const ang = -Math.PI / 2 + (Math.PI * 2 * i) / n;
      const r = R * Math.max(0, Math.min(1, v / max));
      return [cx + r * Math.cos(ang), cy + r * Math.sin(ang)];
    }

    const svg = svgEl('svg', {
      viewBox: '0 0 ' + size + ' ' + (size + 12), class: 'radar',
      role: 'img', 'aria-label': '5領域の発達の目安をあらわすレーダーチャート'
    });

    // 目盛りの多角形(12か月ごと)
    for (let g = 1; g <= 6; g++) {
      const pts = [];
      for (let i = 0; i < n; i++) pts.push(point(i, (max / 6) * g).join(','));
      svg.appendChild(svgEl('polygon', {
        points: pts.join(' '), fill: 'none',
        stroke: g === 6 ? '#94a3b8' : '#e2e8f0', 'stroke-width': g === 6 ? 1.2 : 1
      }));
    }
    // 軸線とラベル
    axes.forEach(function (d, i) {
      const p = point(i, max);
      svg.appendChild(svgEl('line', { x1: cx, y1: cy, x2: p[0], y2: p[1], stroke: '#e2e8f0' }));
      const lp = point(i, max * 1.24);
      const t = svgEl('text', {
        x: lp[0], y: lp[1], 'text-anchor': 'middle', 'dominant-baseline': 'middle',
        class: 'radar-label'
      });
      d.name.split('・').forEach(function (part, k, arr) {
        const ts = svgEl('tspan', { x: lp[0], dy: k === 0 ? (arr.length > 1 ? -6 : 0) : 12 });
        ts.textContent = part + (k < arr.length - 1 ? '・' : '');
        t.appendChild(ts);
      });
      svg.appendChild(t);
    });

    // 生活月齢の基準線
    if (opts.chronoMonths) {
      const pts = [];
      for (let i = 0; i < n; i++) pts.push(point(i, opts.chronoMonths).join(','));
      svg.appendChild(svgEl('polygon', {
        points: pts.join(' '), fill: 'none', stroke: '#64748b',
        'stroke-width': 1.2, 'stroke-dasharray': '4 3'
      }));
    }

    // データ系列
    series.forEach(function (s) {
      const pts = s.values.map(function (v, i) { return point(i, v).join(','); });
      svg.appendChild(svgEl('polygon', {
        points: pts.join(' '), fill: s.color, 'fill-opacity': s.fillOpacity != null ? s.fillOpacity : 0.22,
        stroke: s.color, 'stroke-width': 2, 'stroke-dasharray': s.dashed ? '5 4' : ''
      }));
      if (!s.dashed) {
        s.values.forEach(function (v, i) {
          const p = point(i, v);
          svg.appendChild(svgEl('circle', { cx: p[0], cy: p[1], r: 3.5, fill: s.color }));
        });
      }
    });

    return svg;
  }

  /** チャートの凡例 */
  function legend(series, chronoMonths) {
    return h('div', { class: 'legend' },
      series.map(function (s) {
        return h('span', { class: 'legend-item' }, [
          h('span', { class: 'legend-swatch', style: 'background:' + s.color +
            (s.dashed ? ';opacity:.55' : '') }),
          s.name
        ]);
      }).concat(chronoMonths ? [
        h('span', { class: 'legend-item' }, [
          h('span', { class: 'legend-swatch dashed' }),
          '生活年齢の目安(' + UI.ageText(chronoMonths) + ')'
        ])
      ] : [])
    );
  }

  return {
    domainMonths: domainMonths,
    summarize: summarize,
    history: history,
    previousOf: previousOf,
    diff: diff,
    radar: radar,
    legend: legend,
    unratedCount: unratedCount
  };
})();

</script>
<script>
/* ---- js/print.js ---- */
/* =========================================================================
 * print.js — 印刷用のA4帳票を組み立てる
 *   別ウィンドウを開かず、画面上に印刷専用の領域を差し替えてから
 *   window.print() を呼ぶ(file:// でも確実に動くため)。
 * ========================================================================= */
window.Print = (function () {
  'use strict';
  const h = UI.h;

  function sheetRoot() {
    let el = UI.$('#print-root');
    if (!el) { el = h('div', { id: 'print-root' }); document.body.appendChild(el); }
    return UI.clear(el);
  }

  function run(nodes) {
    const root = sheetRoot();
    (Array.isArray(nodes) ? nodes : [nodes]).forEach(function (n) { root.appendChild(n); });
    document.body.classList.add('printing');
    // レイアウト確定を待ってから印刷ダイアログを出す
    setTimeout(function () {
      window.print();
      setTimeout(function () { document.body.classList.remove('printing'); }, 300);
    }, 60);
  }

  /* ---- 共通パーツ -------------------------------------------------------- */
  function officeLine() {
    const s = Store.settings();
    const parts = [s.officeName, s.serviceType].filter(Boolean);
    return parts.join('　/　');
  }

  function sheetHead(title, child, right) {
    return h('div', { class: 'sheet-head' }, [
      h('div', { class: 'sheet-title-row' }, [
        h('h1', { class: 'sheet-title' }, title),
        h('div', { class: 'sheet-office' }, officeLine())
      ]),
      h('table', { class: 'sheet-meta' }, h('tbody', {}, [
        h('tr', {}, [
          h('th', {}, '児童氏名'),
          h('td', {}, (child.name || '') + (child.kana ? '(' + child.kana + ')' : '')),
          h('th', {}, '生年月日'),
          h('td', {}, UI.fmtDate(child.birthday) + '　' +
            UI.ageText(UI.ageInMonths(child.birthday, right && right.baseDate)) ),
          h('th', {}, '受給者証番号'),
          h('td', {}, child.recipientNo || '')
        ]),
        h('tr', {}, [
          h('th', {}, '保護者氏名'),
          h('td', {}, (child.guardian || '') + (child.relation ? '(' + child.relation + ')' : '')),
          h('th', {}, '所属'),
          h('td', {}, child.belongTo || ''),
          h('th', {}, right && right.label ? right.label : 'サービス種別'),
          h('td', {}, right && right.value ? right.value : (child.serviceType || ''))
        ])
      ]))
    ]);
  }

  function block(label, value) {
    return h('div', { class: 'sheet-block' }, [
      h('div', { class: 'sheet-block-label' }, label),
      h('div', { class: 'sheet-block-body' }, multiline(value))
    ]);
  }

  function multiline(text) {
    const frag = document.createDocumentFragment();
    String(text == null || text === '' ? '　' : text).split('\n').forEach(function (line, i) {
      if (i) frag.appendChild(document.createElement('br'));
      frag.appendChild(document.createTextNode(line));
    });
    return frag;
  }

  function signatureBox(labelDateA, dateA, labelDateB, dateB, signer, explainer) {
    return h('table', { class: 'sheet-table sign' }, h('tbody', {}, [
      h('tr', {}, [
        h('th', {}, labelDateA), h('td', {}, UI.fmtDate(dateA) || '　年　月　日'),
        h('th', {}, '説明者'), h('td', {}, explainer || '')
      ]),
      h('tr', {}, [
        h('th', {}, labelDateB), h('td', {}, UI.fmtDate(dateB) || '　年　月　日'),
        h('th', {}, '保護者署名'), h('td', { class: 'sign-space' }, (signer || '') + '　　　　　　　　　　㊞')
      ])
    ]));
  }

  /* ---- 個別支援計画 ------------------------------------------------------ */
  function plan(child, p) {
    const sheet = h('section', { class: 'sheet' });
    sheet.appendChild(sheetHead('個別支援計画書', child, {
      label: '作成日', value: UI.fmtDate(p.createdDate), baseDate: p.createdDate
    }));

    sheet.appendChild(h('table', { class: 'sheet-table' }, h('tbody', {}, [
      h('tr', {}, [
        h('th', {}, '計画作成者'), h('td', {}, p.author || ''),
        h('th', {}, '回次'), h('td', {}, p.planNo || ''),
        h('th', {}, '前回作成日'), h('td', {}, UI.fmtDate(p.prevDate) || '')
      ]),
      h('tr', {}, [
        h('th', {}, '支援期間'),
        h('td', { colspan: '3' }, (UI.fmtDate(p.startDate) || '') + ' 〜 ' + (UI.fmtDate(p.endDate) || '')),
        h('th', {}, '次回モニタリング'), h('td', {}, UI.fmtDate(p.monitorDate) || '')
      ]),
      h('tr', {}, [
        h('th', {}, '利用予定'), h('td', { colspan: '5' }, p.frequency || '')
      ])
    ])));

    sheet.appendChild(block('本人の希望・意向', p.wishSelf));
    sheet.appendChild(block('ご家族の希望・意向', p.wishFamily));
    sheet.appendChild(block('アセスメントのまとめ(現在の状況・強み・課題)', p.assessmentSummary));
    sheet.appendChild(block('総合的な支援の方針', p.policy));
    sheet.appendChild(h('div', { class: 'two-block' }, [
      block('長期目標(おおむね1年)', p.longGoal),
      block('短期目標(おおむね6か月)', p.shortGoal)
    ]));

    /* 5領域の表 */
    const tbl = h('table', { class: 'sheet-table goals' });
    tbl.appendChild(h('thead', {}, h('tr', {}, [
      h('th', { style: 'width:13%' }, '領域'),
      h('th', { style: 'width:24%' }, '支援目標'),
      h('th', { style: 'width:31%' }, '具体的な支援内容・方法'),
      h('th', { style: 'width:11%' }, '達成時期'),
      h('th', { style: 'width:12%' }, '担当者'),
      h('th', { style: 'width:9%' }, '優先順位')
    ])));
    const tb = h('tbody', {});
    DATA.domains.forEach(function (d) {
      const g = (p.goals && p.goals[d.id]) || {};
      const empty = !g.goal && !g.support && !g.period && !g.staff && !g.note;
      if (empty) return;
      tb.appendChild(h('tr', {}, [
        h('th', { scope: 'row', class: 'domain-cell' }, d.name),
        h('td', {}, multiline(g.goal)),
        h('td', {}, [
          multiline(g.support),
          g.note ? h('div', { class: 'sub-note' }, ['留意事項: ', multiline(g.note)]) : null
        ]),
        h('td', { class: 'center' }, g.period || ''),
        h('td', { class: 'center' }, g.staff || ''),
        h('td', { class: 'center' }, g.priority || '')
      ]));
    });
    if (!tb.children.length) {
      tb.appendChild(h('tr', {}, h('td', { colspan: '6', class: 'center muted' }, '(記載なし)')));
    }
    tbl.appendChild(tb);
    sheet.appendChild(h('div', { class: 'sheet-block' }, [
      h('div', { class: 'sheet-block-label' }, '5領域ごとの支援目標'), tbl
    ]));

    sheet.appendChild(block('家族支援', p.familySupport));
    sheet.appendChild(block('移行支援', p.transitionSupport));
    sheet.appendChild(block('関係機関との連携', p.cooperation));
    sheet.appendChild(block('支援の提供にあたっての留意事項', p.careNote));

    sheet.appendChild(h('p', { class: 'sheet-consent' },
      '上記の個別支援計画について説明を受け、内容に同意します。'));
    sheet.appendChild(signatureBox('説明日', p.explainDate, '同意日', p.agreeDate, p.signer, p.explainer));
    sheet.appendChild(h('div', { class: 'sheet-foot' }, officeLine()));

    run(sheet);
  }

  /* ---- 専門的支援実施計画 ------------------------------------------------ */
  function splan(child, p) {
    const sheet = h('section', { class: 'sheet' });
    sheet.appendChild(sheetHead('専門的支援実施計画書', child, {
      label: '作成日', value: UI.fmtDate(p.createdDate), baseDate: p.createdDate
    }));

    const domNames = (p.domains || []).map(function (id) {
      const d = DATA.domainById(id); return d ? d.name : id;
    }).join('・');

    sheet.appendChild(h('table', { class: 'sheet-table' }, h('tbody', {}, [
      h('tr', {}, [
        h('th', {}, '担当専門職'), h('td', {}, p.staffName || ''),
        h('th', {}, '職種'), h('td', { colspan: '3' }, (p.professions || []).join('・'))
      ]),
      h('tr', {}, [
        h('th', {}, '資格・経験'), h('td', {}, p.qualification || ''),
        h('th', {}, '重点領域'), h('td', { colspan: '3' }, domNames)
      ]),
      h('tr', {}, [
        h('th', {}, '実施期間'),
        h('td', {}, (UI.fmtDate(p.startDate) || '') + ' 〜 ' + (UI.fmtDate(p.endDate) || '')),
        h('th', {}, '実施形態'), h('td', {}, p.form || ''),
        h('th', {}, '頻度・時間'),
        h('td', {}, (p.frequency || '') + (p.minutes ? ' / 1回' + p.minutes + '分' : ''))
      ]),
      h('tr', {}, [
        h('th', {}, '実施場所'), h('td', {}, p.place || ''),
        h('th', {}, '評価予定日'), h('td', { colspan: '3' }, UI.fmtDate(p.evalDate) || '')
      ])
    ])));

    sheet.appendChild(block('専門的支援を必要とする理由(アセスメント結果)', p.reason));
    sheet.appendChild(block('専門的支援の目標', p.goal));
    sheet.appendChild(block('支援内容・具体的な方法', p.content));
    sheet.appendChild(block('個別支援計画との関連', p.linkPlan));
    sheet.appendChild(block('他職員への引き継ぎ・日常場面への般化', p.share));
    sheet.appendChild(block('評価方法・評価の視点', p.evalMethod));

    sheet.appendChild(h('p', { class: 'sheet-consent' },
      '上記の専門的支援実施計画について説明を受け、内容に同意します。'));
    sheet.appendChild(signatureBox('説明日', p.explainDate, '同意日', p.agreeDate, p.signer, p.explainer));

    /* 実施記録は次ページ */
    const sessions = p.sessions || [];
    if (sessions.length) {
      const s2 = h('section', { class: 'sheet' });
      s2.appendChild(sheetHead('専門的支援 実施記録', child, {
        label: '計画作成日', value: UI.fmtDate(p.createdDate), baseDate: p.createdDate
      }));
      const t = h('table', { class: 'sheet-table sessions' });
      t.appendChild(h('thead', {}, h('tr', {}, [
        h('th', { style: 'width:10%' }, '実施日'),
        h('th', { style: 'width:10%' }, '実施者'),
        h('th', { style: 'width:6%' }, '分'),
        h('th', { style: 'width:28%' }, '実施した内容'),
        h('th', { style: 'width:28%' }, '本人の様子・反応'),
        h('th', { style: 'width:18%' }, '次回に向けて')
      ])));
      t.appendChild(h('tbody', {}, sessions.map(function (s) {
        return h('tr', {}, [
          h('td', { class: 'center' }, UI.fmtDate(s.date) || ''),
          h('td', { class: 'center' }, s.staff || ''),
          h('td', { class: 'center' }, s.minutes || ''),
          h('td', {}, multiline(s.content)),
          h('td', {}, multiline(s.response)),
          h('td', {}, multiline(s.next))
        ]);
      })));
      s2.appendChild(t);
      s2.appendChild(h('div', { class: 'sheet-foot' }, officeLine()));
      run([sheet, s2]);
    } else {
      sheet.appendChild(h('div', { class: 'sheet-foot' }, officeLine()));
      run(sheet);
    }
  }

  /* ---- 保護者用アセスメント記録 ------------------------------------------ */
  function assessmentReport(child, a) {
    const sum = Assess.summarize(a, child);
    const prev = Assess.previousOf(a);
    const d = Assess.diff(a, prev);

    const sheet = h('section', { class: 'sheet' });
    sheet.appendChild(sheetHead('発達アセスメント記録(保護者用)', child, {
      label: '実施日', value: UI.fmtDate(a.date), baseDate: a.date
    }));

    sheet.appendChild(h('p', { class: 'lead' },
      'このシートは、半年ごとのモニタリングにあわせて、事業所の職員がお子さんの様子を' +
      '5つの領域からふりかえったものです。' +
      (prev ? '前回(' + UI.fmtDate(prev.date) + ')からの変化もあわせてご覧ください。' : '')));

    /* グラフと数値 */
    const series = [];
    if (prev) {
      series.push({
        name: '前回(' + UI.fmtDate(prev.date) + ')', color: '#94a3b8', dashed: true, fillOpacity: 0.1,
        values: Assess.summarize(prev, child).perDomain.map(function (x) { return x.months; })
      });
    }
    series.push({
      name: '今回(' + UI.fmtDate(a.date) + ')', color: '#2f7d64',
      values: sum.perDomain.map(function (x) { return x.months; })
    });

    const tbl = h('table', { class: 'sheet-table report' });
    tbl.appendChild(h('thead', {}, h('tr', {}, [
      h('th', {}, '領域'), h('th', {}, 'みかた'),
      h('th', { style: 'width:16%' }, '今回のめやす'),
      prev ? h('th', { style: 'width:14%' }, '前回からの変化') : null
    ])));
    tbl.appendChild(h('tbody', {}, sum.perDomain.map(function (x, i) {
      const dm = DATA.domains[i];
      let deltaCell = null;
      if (prev) {
        const pm = Assess.domainMonths(dm, prev.scores || {});
        const delta = Math.round((x.months - pm) * 10) / 10;
        deltaCell = h('td', { class: 'center ' + (delta > 0 ? 'up' : delta < 0 ? 'down' : '') },
          (delta > 0 ? '+' : '') + delta + 'か月');
      }
      return h('tr', {}, [
        h('th', { scope: 'row' }, [h('span', { class: 'dot', style: 'background:' + dm.color }), dm.name]),
        h('td', { class: 'small' }, dm.desc),
        h('td', { class: 'center' }, UI.ageText(x.months)),
        deltaCell
      ]);
    })));

    sheet.appendChild(h('div', { class: 'report-top' }, [
      h('div', { class: 'report-chart' }, [
        Assess.radar(series, { chronoMonths: sum.chronoMonths, size: 300 }),
        Assess.legend(series, sum.chronoMonths)
      ]),
      h('div', { class: 'report-table' }, tbl)
    ]));

    /* できるようになったこと */
    if (prev) {
      sheet.appendChild(h('div', { class: 'sheet-block' }, [
        h('div', { class: 'sheet-block-label' }, 'この半年でできるようになったこと'),
        d.gained.length
          ? h('ul', { class: 'report-list' }, d.gained.map(function (g) {
              return h('li', {}, [h('span', { class: 'chip', style: 'background:' + g.domain.color }, g.domain.name), g.item.text]);
            }))
          : h('p', { class: 'muted' }, '今回のチェックでは、新しく「できる」に変わった項目はありませんでした。日々の様子で気づかれた変化があれば、ぜひお聞かせください。')
      ]));
    }

    /* 芽生えていること */
    sheet.appendChild(h('div', { class: 'sheet-block' }, [
      h('div', { class: 'sheet-block-label' }, 'いま芽生えているところ(もう少しでできそうなこと)'),
      d.emerging.length
        ? h('ul', { class: 'report-list' }, d.emerging.slice(0, 12).map(function (g) {
            return h('li', {}, [h('span', { class: 'chip', style: 'background:' + g.domain.color }, g.domain.name), g.item.text]);
          }))
        : h('p', { class: 'muted' }, '　')
    ]));

    sheet.appendChild(block('事業所からのコメント', a.comment));
    sheet.appendChild(block('ご家庭でできる関わりの提案', a.homeAdvice));

    sheet.appendChild(h('p', { class: 'note' },
      '※ 「めやす」の月齢は、日々の様子のチェック結果から算出した目安であり、医学的な診断や' +
      '標準化された発達検査の結果ではありません。お子さんの育ちを一緒に見ていくための資料としてお使いください。' +
      '気になることがありましたら、遠慮なく担当職員にお声がけください。'));

    sheet.appendChild(h('table', { class: 'sheet-table sign' }, h('tbody', {}, h('tr', {}, [
      h('th', {}, '記入者'), h('td', {}, a.assessor || ''),
      h('th', {}, '実施場面'), h('td', {}, a.setting || ''),
      h('th', {}, '事業所'), h('td', {}, officeLine())
    ]))));

    run(sheet);
  }

  /* ---- 記録 -------------------------------------------------------------- */
  function record(child, r) {
    const sheet = h('section', { class: 'sheet' });
    sheet.appendChild(sheetHead('支援記録', child, {
      label: '記録日', value: UI.fmtDate(r.date), baseDate: r.date
    }));
    sheet.appendChild(h('table', { class: 'sheet-table' }, h('tbody', {}, h('tr', {}, [
      h('th', {}, '表題'), h('td', {}, r.title || ''),
      h('th', {}, '種別'), h('td', {}, r.kind || ''),
      h('th', {}, '出席者・話者'), h('td', {}, r.attendees || '')
    ]))));
    sheet.appendChild(block('内容', r.body));
    if (r.summary) sheet.appendChild(block('要点', r.summary));
    sheet.appendChild(h('div', { class: 'sheet-foot' }, officeLine()));
    run(sheet);
  }

  return { plan: plan, splan: splan, assessmentReport: assessmentReport, record: record };
})();

</script>

/* ---- js/xlsx.js ---- */
/* =========================================================================
 * xlsx.js — 厚生労働省「個別支援計画参考様式」への差し込み出力
 *
 *   xlsx は「XMLファイルを集めた zip」なので、
 *     1. 埋め込んだ原本の部品(xlsx-template.js)を取り出す
 *     2. シートと図形の XML だけを書き換える
 *     3. zip に詰め直す(無圧縮=stored。Excel はこれを問題なく開ける)
 *   という手順で、外部ライブラリなしに書き出す。
 *   罫線・列幅・印刷設定は原本の部品をそのまま使うので崩れない。
 * ========================================================================= */
window.Xlsx = (function () {
  'use strict';

  /* ---- base64 / バイト列 ------------------------------------------------ */
  function b64ToBytes(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function bytesToText(bytes) { return new TextDecoder('utf-8').decode(bytes); }
  function textToBytes(text) { return new TextEncoder().encode(text); }

  /* ---- CRC32(zip に必要) ----------------------------------------------- */
  let CRC_TABLE = null;
  function crcTable() {
    if (CRC_TABLE) return CRC_TABLE;
    CRC_TABLE = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      CRC_TABLE[n] = c >>> 0;
    }
    return CRC_TABLE;
  }
  function crc32(bytes) {
    const t = crcTable();
    let c = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) c = t[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  /* ---- zip(無圧縮)を組み立てる ---------------------------------------- */
  function zip(files) {
    // files: [{ name, bytes }]
    const chunks = [];
    const central = [];
    let offset = 0;

    // 更新日時は固定(1980-01-01)。ファイルごとに変える必要がない。
    const dosTime = 0, dosDate = 33;

    files.forEach(function (f) {
      const nameBytes = textToBytes(f.name);
      const crc = crc32(f.bytes);
      const size = f.bytes.length;

      const local = new Uint8Array(30 + nameBytes.length);
      const lv = new DataView(local.buffer);
      lv.setUint32(0, 0x04034B50, true);   // ローカルヘッダ署名
      lv.setUint16(4, 20, true);           // 展開に必要なバージョン
      lv.setUint16(6, 0x0800, true);       // UTF-8 フラグ
      lv.setUint16(8, 0, true);            // 圧縮方式 0 = 無圧縮
      lv.setUint16(10, dosTime, true);
      lv.setUint16(12, dosDate, true);
      lv.setUint32(14, crc, true);
      lv.setUint32(18, size, true);
      lv.setUint32(22, size, true);
      lv.setUint16(26, nameBytes.length, true);
      lv.setUint16(28, 0, true);
      local.set(nameBytes, 30);

      chunks.push(local, f.bytes);

      const cen = new Uint8Array(46 + nameBytes.length);
      const cv = new DataView(cen.buffer);
      cv.setUint32(0, 0x02014B50, true);   // 中央ディレクトリ署名
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, dosTime, true);
      cv.setUint16(14, dosDate, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, size, true);
      cv.setUint32(24, size, true);
      cv.setUint16(28, nameBytes.length, true);
      cv.setUint32(42, offset, true);      // ローカルヘッダの位置
      cen.set(nameBytes, 46);
      central.push(cen);

      offset += local.length + size;
    });

    const centralStart = offset;
    let centralSize = 0;
    central.forEach(function (c) { chunks.push(c); centralSize += c.length; });

    const end = new Uint8Array(22);
    const ev = new DataView(end.buffer);
    ev.setUint32(0, 0x06054B50, true);
    ev.setUint16(8, files.length, true);
    ev.setUint16(10, files.length, true);
    ev.setUint32(12, centralSize, true);
    ev.setUint32(16, centralStart, true);
    chunks.push(end);

    let total = 0;
    chunks.forEach(function (c) { total += c.length; });
    const out = new Uint8Array(total);
    let pos = 0;
    chunks.forEach(function (c) { out.set(c, pos); pos += c.length; });
    return out;
  }

  /* ---- XML の小道具 ------------------------------------------------------ */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/\r\n?/g, '\n');
  }

  /**
   * 1つのセルに文字列を入れる。
   * mode に 'top' / 'center' を渡すと、原本の書式を「文字を折り返す書式」に
   * 読み替える(原本の書式には折り返し指定がなく、長い支援内容が1行に潰れるため)。
   */
  function setCell(rowXml, ref, text, mode) {
    const re = new RegExp('<c r="' + ref + '"([^>]*?)(/>|>[\\s\\S]*?</c>)');
    if (!re.test(rowXml)) return rowXml;
    return rowXml.replace(re, function (m, attrs) {
      let keep = attrs.replace(/\s+t="[^"]*"/g, '');
      if (mode && text) keep = restyle(keep, mode);
      if (text === null || text === undefined || text === '') {
        return '<c r="' + ref + '"' + keep + '/>';
      }
      return '<c r="' + ref + '"' + keep + ' t="inlineStr"><is><t xml:space="preserve">' +
        esc(text) + '</t></is></c>';
    });
  }

  /** 書式番号を、折り返しありの書式番号に差し替える */
  function restyle(attrs, mode) {
    const map = (window.XLSX_TEMPLATE.wrapStyles || {})[mode] || {};
    const m = attrs.match(/\bs="(\d+)"/);
    const cur = m ? m[1] : '0';
    if (map[cur] === undefined) return attrs;
    return m ? attrs.replace(/\bs="\d+"/, 's="' + map[cur] + '"')
             : attrs + ' s="' + map[cur] + '"';
  }

  /** 行のXMLを、別の行番号に付け替える */
  function moveRow(rowXml, to) {
    return rowXml
      .replace(/(<row[^>]*\sr=")(\d+)(")/, '$1' + to + '$3')
      .replace(/(<c r="[A-Z]+)(\d+)(")/g, function (m, a, n, c) { return a + to + c; });
  }

  function rowNum(rowXml) {
    const m = rowXml.match(/<row[^>]*\sr="(\d+)"/);
    return m ? Number(m[1]) : -1;
  }

  function splitRows(sheetXml) {
    const m = sheetXml.match(/<sheetData>([\s\S]*)<\/sheetData>/);
    if (!m) return null;
    const rows = m[1].match(/<row\b[^>]*\/>|<row\b[^>]*>[\s\S]*?<\/row>/g) || [];
    return { head: sheetXml.slice(0, m.index + '<sheetData>'.length),
             rows: rows,
             tail: sheetXml.slice(m.index + m[0].length - '</sheetData>'.length) };
  }


  /* ---- 行の高さ ----------------------------------------------------------
   * 原本の行は高さが固定されているため、長い支援内容を入れると下が隠れる。
   * 列幅から折り返し行数を見積もって、必要なぶんだけ行を高くする。
   * ---------------------------------------------------------------------- */

  /** 全角を2、半角を1として数え、幅 width に何行で収まるかを返す */
  function wrapLines(text, width) {
    if (!text) return 1;
    const w = Math.max(4, width);
    let lines = 0;
    String(text).split('\n').forEach(function (seg) {
      let units = 0;
      for (let i = 0; i < seg.length; i++) units += seg.charCodeAt(i) > 0x7f ? 2 : 1;
      lines += Math.max(1, Math.ceil(units / w));
    });
    return lines;
  }

  const LINE_H = 15.5, PAD_H = 7;

  /** 複数セルぶんの見積もりから、行の高さを決める */
  function neededHeight(cells, minHeight) {
    let lines = 1;
    cells.forEach(function (c) { lines = Math.max(lines, wrapLines(c[0], c[1])); });
    return Math.max(minHeight, lines * LINE_H + PAD_H);
  }

  function setRowHeight(rowXml, height) {
    const h = String(Math.round(height * 100) / 100);
    return rowXml.replace(/<row([^>]*?)(\/?)>/, function (m, attrs, slash) {
      let a = attrs.replace(/\s+ht="[^"]*"/g, '').replace(/\s+customHeight="[^"]*"/g, '');
      return '<row' + a + ' ht="' + h + '" customHeight="1"' + slash + '>';
    });
  }

  /* 原本の列幅(文字数)。結合セルはその合計を使う。 */
  const W = { B: 10.9, C: 20.1, D: 34.6, E: 16.5, F: 7.2, G: 12.9, H: 24.1, I: 6.1 };
  const W_D_E = W.D + W.E;                                   // 支援内容 D:E
  const W_D_I = W.D + W.E + W.F + W.G + W.H + W.I;           // 意向・方針 D:I
  const W_D_G = W.D + W.E + W.F + W.G;                       // 長期/短期目標 D:G
  const W_H_I = W.H + W.I;                                   // 提供時間 H:I

  /* ---- 別紙1-1(計画書本体)への差し込み --------------------------------- */
  /* 原本の表は 15〜18 行の4行。5領域ぶん書くときは行を足し、
     19行目以降(注記・同意欄)と結合セル・図形の位置をまとめてずらす。 */
  function fillSheet1(xml, child, plan, goals) {
    const parts = splitRows(xml);
    if (!parts) throw new Error('様式のシートを読み取れませんでした');

    const GOAL_FIRST = 15, GOAL_LAST = 18;
    const n = Math.max(1, goals.length);
    const delta = n - (GOAL_LAST - GOAL_FIRST + 1);

    const byNum = {};
    parts.rows.forEach(function (r) { byNum[rowNum(r)] = r; });
    const midTpl = byNum[GOAL_FIRST];   // 途中の行
    const lastTpl = byNum[GOAL_LAST];   // 最終行(下辺が太線)

    const out = [];
    parts.rows.forEach(function (row) {
      const r = rowNum(row);

      if (r < GOAL_FIRST) {
        let x = row;
        if (r === 5) {
          const v = joinWishes(plan);
          x = setRowHeight(setCell(x, 'D5', v, 'top'), neededHeight([[v, W_D_I]], 76.5));
        }
        if (r === 7) {
          x = setRowHeight(setCell(x, 'D7', plan.policy, 'top'),
                           neededHeight([[plan.policy, W_D_I]], 37.5));
        }
        if (r === 9) {
          const v = withPeriod(plan.longGoal, plan.startDate, plan.endDate);
          x = setRowHeight(setCell(x, 'D9', v, 'top'), neededHeight([[v, W_D_G]], 38.25));
        }
        if (r === 10) {
          const v = withPeriod(plan.shortGoal, plan.startDate, plan.endDate);
          x = setCell(x, 'D10', v, 'top');
          x = setCell(x, 'H10', plan.frequency, 'top');
          x = setRowHeight(x, neededHeight([[v, W_D_G], [plan.frequency, W_H_I]], 37.5));
        }
        out.push(x);
        return;
      }

      if (r >= GOAL_FIRST && r <= GOAL_LAST) {
        if (r !== GOAL_FIRST) return; // 目標行はまとめて作り直すので読み飛ばす
        goals.forEach(function (g, i) {
          const target = GOAL_FIRST + i;
          let x = moveRow(i === n - 1 ? lastTpl : midTpl, target);
          x = setCell(x, 'B' + target, g.domainName, 'center');
          x = setCell(x, 'C' + target, g.goal, 'top');
          x = setCell(x, 'D' + target, g.support, 'top');
          x = setCell(x, 'E' + target, '');
          x = setCell(x, 'F' + target, g.period, 'center');
          x = setCell(x, 'G' + target, g.staff, 'center');
          x = setCell(x, 'H' + target, g.note, 'top');
          x = setCell(x, 'I' + target, g.priority, 'center');
          x = setRowHeight(x, neededHeight([
            [g.goal, W.C], [g.support, W_D_E], [g.note, W.H], [g.domainName, W.B]
          ], 37.5));
          out.push(x);
        });
        return;
      }

      // 19行目以降(注記・同意欄)
      let x = moveRow(row, r + delta);
      const nr = r + delta;
      if (r === 23) {
        x = setCell(x, 'B' + nr, '児童発達支援管理責任者氏名：' + (plan.author || ''));
        x = setCell(x, 'E' + nr, jpDate(plan.explainDate) || '　　　　年　　月　　日');
        x = setCell(x, 'F' + nr, '（保護者署名）' + (plan.signer ? '　' + plan.signer : ''));
      }
      out.push(x);
    });

    /* 結合セルの付け替え */
    let tail = parts.tail;
    const merges = [];
    const mm = tail.match(/<mergeCells[^>]*>([\s\S]*?)<\/mergeCells>/);
    if (mm) {
      (mm[1].match(/<mergeCell ref="[^"]+"\/>/g) || []).forEach(function (mc) {
        const ref = mc.match(/ref="([^"]+)"/)[1];
        // 目標行の 支援内容 は D:E をまたぐ(見出し D14:E14 と同じ形にそろえる)
        if (/^D14:E14$/.test(ref)) { merges.push(ref); return; }
        merges.push(ref.replace(/([A-Z]+)(\d+)/g, function (s, col, num) {
          const v = Number(num);
          return col + (v > GOAL_LAST ? v + delta : v);
        }));
      });
    }
    for (let i = 0; i < n; i++) merges.push('D' + (GOAL_FIRST + i) + ':E' + (GOAL_FIRST + i));

    const mergeXml = '<mergeCells count="' + merges.length + '">' +
      merges.map(function (r) { return '<mergeCell ref="' + r + '"/>'; }).join('') + '</mergeCells>';
    tail = mm ? tail.replace(/<mergeCells[^>]*>[\s\S]*?<\/mergeCells>/, mergeXml)
              : tail.replace('</sheetData>', '</sheetData>' + mergeXml);

    return { xml: parts.head + out.join('') + tail, delta: delta };
  }

  function joinWishes(plan) {
    const a = [];
    if (plan.wishSelf) a.push('【本人】' + plan.wishSelf);
    if (plan.wishFamily) a.push('【ご家族】' + plan.wishFamily);
    return a.join('\n');
  }

  function withPeriod(text, start, end) {
    if (!text) return '';
    if (!start && !end) return text;
    return text + '\n（期間：' + (jpDate(start) || '') + '〜' + (jpDate(end) || '') + '）';
  }

  function jpDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  /* ---- 別紙1-2(別表)への差し込み --------------------------------------- */
  function fillSheet2(xml, child, plan) {
    const parts = splitRows(xml);
    if (!parts) return xml;
    const out = parts.rows.map(function (row) {
      const r = rowNum(row);
      let x = row;
      if (r === 4) {
        x = setCell(x, 'B4', child.name || '', 'center');
        x = setCell(x, 'R4', jpDate(plan.createdDate) || '　　　年　　月　　日', 'center');
      }
      if (r === 16) {
        x = setCell(x, 'B16', plan.careNote || '', 'top');
        x = setRowHeight(x, neededHeight([[plan.careNote, 90]], 37.5));
      }
      if (r === 18) {
        x = setCell(x, 'N18', jpDate(plan.agreeDate) || '　　　年　　月　　日', 'center');
        x = setCell(x, 'S18', plan.signer || '', 'center');
      }
      return x;
    });
    return parts.head + out.join('') + parts.tail;
  }

  /* ---- 図形(テキストボックス)の差し込み --------------------------------- */
  function fillDrawing(xml, child, plan, delta) {
    let out = xml
      .replace(/<a:t>作成年月日：[\s\S]*?<\/a:t>/,
        '<a:t>' + esc('作成年月日：' + (jpDate(plan.createdDate) || '　　年　　月　　日')) + '</a:t>')
      .replace(/<a:t>利用児氏名：[\s\S]*?<\/a:t>/,
        '<a:t>' + esc('利用児氏名：' + (child.name || '')) + '</a:t>');

    // 「押印廃止」の吹き出しは同意欄の高さにあるので、行を足したぶんだけ下げる
    if (delta) {
      out = out.replace(/<xdr:(twoCellAnchor|oneCellAnchor)[\s\S]*?<\/xdr:\1>/g, function (seg) {
        if (seg.indexOf('押印廃止') < 0) return seg;
        return seg.replace(/<xdr:row>(\d+)<\/xdr:row>/g, function (m, num) {
          return '<xdr:row>' + (Number(num) + delta) + '</xdr:row>';
        });
      });
    }
    return out;
  }

  /* ---- 個別支援計画を xlsx として書き出す -------------------------------- */
  function exportPlan(child, plan) {
    if (!window.XLSX_TEMPLATE) throw new Error('様式データが読み込まれていません');

    // 記入のある領域だけを行にする(すべて空なら1行だけ空欄で出す)
    const goals = [];
    DATA.domains.forEach(function (d) {
      const g = (plan.goals && plan.goals[d.id]) || {};
      if (!g.goal && !g.support && !g.period && !g.staff && !g.note) return;
      goals.push({
        domainName: d.name, goal: g.goal || '', support: g.support || '',
        period: g.period || '', staff: g.staff || '', note: g.note || '',
        priority: g.priority || ''
      });
    });
    if (!goals.length) {
      goals.push({ domainName: '', goal: '', support: '', period: '', staff: '', note: '', priority: '' });
    }

    const T = window.XLSX_TEMPLATE;
    const files = T.order.map(function (name) {
      const bytes = b64ToBytes(T.parts[name]);
      return { name: name, bytes: bytes };
    });

    // シート1 → シート2 → 図形 の順に差し替える
    let delta = 0;
    files.forEach(function (f) {
      if (f.name === 'xl/worksheets/sheet1.xml') {
        const r = fillSheet1(bytesToText(f.bytes), child, plan, goals);
        delta = r.delta;
        f.bytes = textToBytes(r.xml);
      }
    });
    files.forEach(function (f) {
      if (f.name === 'xl/worksheets/sheet2.xml') {
        f.bytes = textToBytes(fillSheet2(bytesToText(f.bytes), child, plan));
      } else if (f.name === 'xl/drawings/drawing1.xml') {
        f.bytes = textToBytes(fillDrawing(bytesToText(f.bytes), child, plan, delta));
      }
    });

    const bytes = zip(files);
    const stamp = (plan.createdDate || UI.today()).replace(/-/g, '');
    const safeName = String(child.name || '児童').replace(/[\\/:*?"<>|]/g, '_');
    saveBlob(new Blob([bytes], {
      type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
    }), '個別支援計画_' + safeName + '_' + stamp + '.xlsx');
  }

  function saveBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 0);
  }

  return { exportPlan: exportPlan, zip: zip, crc32: crc32 };
})();

</script>
<script>
/* ---- js/view-children.js ---- */
/* =========================================================================
 * view-children.js — 児童の登録・一覧・児童カルテのホーム
 * ========================================================================= */
window.ViewChildren = (function () {
  'use strict';
  const h = UI.h;

  const CHILD_FIELDS = [
    { key: 'name',        label: '氏名', required: true },
    { key: 'kana',        label: 'ふりがな' },
    { key: 'birthday',    label: '生年月日', type: 'date', required: true },
    { key: 'gender',      label: '性別', options: ['', '男', '女', 'その他・回答しない'] },
    { key: 'recipientNo', label: '受給者証番号' },
    { key: 'serviceType', label: 'サービス種別', options: DATA.SERVICE_TYPES },
    { key: 'startDate',   label: '利用開始日', type: 'date' },
    { key: 'guardian',    label: '保護者氏名' },
    { key: 'relation',    label: '続柄', options: ['', '父', '母', '祖父', '祖母', 'その他'] },
    { key: 'belongTo',    label: '所属(園・学校・学年)' },
    { key: 'consultOffice', label: '相談支援事業所' },
    { key: 'consultant',  label: '相談支援専門員' },
    { key: 'manager',     label: '担当児童発達支援管理責任者' },
    { key: 'diagnosis',   label: '診断名・医療的ケア', wide: true },
    { key: 'handbook',    label: '手帳の種類・等級' },
    { key: 'care',        label: 'アレルギー・服薬・配慮事項', wide: true, textarea: true },
    { key: 'memo',        label: '備考', wide: true, textarea: true }
  ];

  /* ---- 一覧 ------------------------------------------------------------- */
  function renderList(root) {
    const children = Store.list('children').slice().sort(function (a, b) {
      return String(a.kana || a.name).localeCompare(String(b.kana || b.name), 'ja');
    });

    root.appendChild(h('div', { class: 'page-head' }, [
      h('div', {}, [
        h('h1', {}, '児童一覧'),
        h('p', { class: 'muted' }, '登録児童 ' + children.length + '名。名前を選ぶと、その児童の計画・アセスメント・記録が開きます。')
      ]),
      h('button', { class: 'btn primary', onclick: function () { openEditor(null); } }, '＋ 児童を登録')
    ]));

    if (!children.length) {
      root.appendChild(h('div', { class: 'empty' }, [
        h('p', {}, 'まだ児童が登録されていません。'),
        h('p', { class: 'muted' }, '「＋ 児童を登録」から始めてください。入力したデータはこの端末のブラウザ内だけに保存されます。')
      ]));
      return;
    }

    const grid = h('div', { class: 'card-grid' });
    children.forEach(function (c) {
      const months = UI.ageInMonths(c.birthday, UI.today());
      const plans = Store.byChild('plans', c.id);
      const assess = Assess.history(c.id);
      const last = assess.length ? assess[assess.length - 1] : null;
      const due = last ? UI.addMonths(last.date, 6) : null;
      const overdue = due && due < UI.today();

      grid.appendChild(h('div', {
        class: 'child-card', tabindex: '0', role: 'button',
        onclick: function () { App.openChild(c.id, 'home'); },
        onkeydown: function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); App.openChild(c.id, 'home'); } }
      }, [
        h('div', { class: 'child-card-name' }, c.name || '(氏名未入力)'),
        h('div', { class: 'child-card-kana' }, c.kana || ''),
        h('div', { class: 'child-card-meta' }, [
          h('span', {}, UI.ageText(months)),
          c.serviceType ? h('span', { class: 'tag' }, c.serviceType) : null
        ]),
        h('div', { class: 'child-card-stats' }, [
          h('span', {}, '計画 ' + plans.length + '件'),
          h('span', {}, 'アセスメント ' + assess.length + '回')
        ]),
        due ? h('div', { class: 'child-card-due' + (overdue ? ' overdue' : '') },
          (overdue ? '⚠ 次回アセスメント時期を過ぎています(' : '次回アセスメント目安 ') +
          UI.fmtDate(due) + (overdue ? ')' : '')) : null
      ]));
    });
    root.appendChild(grid);
  }

  /* ---- 登録・編集フォーム ------------------------------------------------ */
  function openEditor(childId) {
    const child = childId ? Store.get('children', childId) : {};
    const form = h('form', { class: 'form-grid' });

    CHILD_FIELDS.forEach(function (f) {
      let ctl;
      if (f.options) ctl = UI.select(f.key, f.options, child[f.key]);
      else if (f.textarea) ctl = UI.textarea(f.key, child[f.key], 2);
      else ctl = UI.input(f.key, child[f.key], { type: f.type || 'text', required: f.required || null });
      const wrap = UI.field(f.label + (f.required ? ' *' : ''), ctl);
      if (f.wide) wrap.classList.add('wide');
      form.appendChild(wrap);
    });

    App.modal(childId ? '児童情報の編集' : '児童の登録', form, [
      childId ? h('button', {
        class: 'btn danger ghost', type: 'button', onclick: function () {
          if (!UI.confirmDanger('「' + (child.name || '') + '」を削除します。\n' +
            'この児童の計画・アセスメント・記録もすべて削除され、元に戻せません。よろしいですか?')) return;
          Store.removeChild(childId);
          App.closeModal();
          App.go('children');
          UI.toast('削除しました');
        }
      }, '削除') : null,
      h('button', { class: 'btn', type: 'button', onclick: App.closeModal }, 'キャンセル'),
      h('button', {
        class: 'btn primary', type: 'button', onclick: function () {
          const data = UI.readForm(form);
          if (!data.name || !data.name.trim()) { UI.toast('氏名を入力してください', 'warn'); return; }
          if (!data.birthday) { UI.toast('生年月日を入力してください', 'warn'); return; }
          const obj = Object.assign({}, child, data);
          Store.put('children', obj);
          App.closeModal();
          UI.toast('保存しました');
          if (childId) App.render(); else App.openChild(obj.id, 'home');
        }
      }, '保存')
    ]);
  }

  /* ---- 児童カルテ ホーム -------------------------------------------------- */
  function renderHome(root, child) {
    const months = UI.ageInMonths(child.birthday, UI.today());
    const hist = Assess.history(child.id);
    const last = hist.length ? hist[hist.length - 1] : null;
    const plans = Store.byChild('plans', child.id).slice().sort(function (a, b) {
      return String(b.createdDate).localeCompare(String(a.createdDate));
    });
    const splans = Store.byChild('splans', child.id);
    const records = Store.byChild('records', child.id);

    /* 基本情報 */
    const info = h('div', { class: 'panel' }, [
      h('div', { class: 'panel-head' }, [
        h('h2', {}, '基本情報'),
        h('button', { class: 'btn small', onclick: function () { openEditor(child.id); } }, '編集')
      ]),
      h('dl', { class: 'kv' }, CHILD_FIELDS.filter(function (f) {
        return child[f.key];
      }).map(function (f) {
        return h('div', { class: 'kv-row' + (f.wide ? ' wide' : '') }, [
          h('dt', {}, f.label),
          h('dd', {}, f.type === 'date' ? UI.fmtDate(child[f.key]) : child[f.key])
        ]);
      }).concat([
        h('div', { class: 'kv-row' }, [h('dt', {}, '現在の年齢'), h('dd', {}, UI.ageText(months))])
      ]))
    ]);

    /* 次にやること */
    const todo = [];
    if (!last) {
      todo.push({ text: '発達アセスメントがまだ行われていません。最初の記録をとりましょう。', view: 'assess', cta: 'アセスメントを行う' });
    } else {
      const due = UI.addMonths(last.date, 6);
      if (due < UI.today()) {
        todo.push({ text: '前回のアセスメントから6か月以上たっています(前回 ' + UI.fmtDate(last.date) + ')。モニタリングの時期です。', view: 'assess', cta: 'アセスメントを行う', warn: true });
      } else {
        todo.push({ text: '次回のアセスメント目安は ' + UI.fmtDate(due) + ' です(前回 ' + UI.fmtDate(last.date) + ')。', view: 'assess', cta: '前回の結果を見る' });
      }
    }
    if (!plans.length) {
      todo.push({ text: '個別支援計画がまだ作成されていません。', view: 'plan', cta: '計画を作成する' });
    } else if (plans[0].endDate && plans[0].endDate < UI.today()) {
      todo.push({ text: '個別支援計画の支援期間が終了しています(' + UI.fmtDate(plans[0].endDate) + ')。見直しの時期です。', view: 'plan', cta: '計画を見直す', warn: true });
    }

    const todoPanel = h('div', { class: 'panel' }, [
      h('div', { class: 'panel-head' }, h('h2', {}, '次にやること')),
      todo.length
        ? h('ul', { class: 'todo' }, todo.map(function (t) {
            return h('li', { class: t.warn ? 'warn' : '' }, [
              h('span', {}, t.text),
              h('button', { class: 'btn small', onclick: function () { App.openChild(child.id, t.view); } }, t.cta)
            ]);
          }))
        : h('p', { class: 'muted' }, '当面の対応事項はありません。')
    ]);

    /* 発達の推移 */
    let trend;
    if (last) {
      const sum = Assess.summarize(last, child);
      const prev = Assess.previousOf(last);
      const series = [];
      if (prev) {
        const ps = Assess.summarize(prev, child);
        series.push({
          name: '前回(' + UI.fmtDate(prev.date) + ')', color: '#94a3b8', dashed: true, fillOpacity: 0.1,
          values: ps.perDomain.map(function (d) { return d.months; })
        });
      }
      series.push({
        name: '今回(' + UI.fmtDate(last.date) + ')', color: '#2f7d64',
        values: sum.perDomain.map(function (d) { return d.months; })
      });
      trend = h('div', { class: 'panel' }, [
        h('div', { class: 'panel-head' }, [
          h('h2', {}, '発達の目安(最新)'),
          h('button', { class: 'btn small', onclick: function () { App.openChild(child.id, 'assess'); } }, '詳しく見る')
        ]),
        h('div', { class: 'radar-wrap' }, [
          Assess.radar(series, { chronoMonths: sum.chronoMonths, size: 300 }),
          Assess.legend(series, sum.chronoMonths)
        ])
      ]);
    } else {
      trend = h('div', { class: 'panel' }, [
        h('div', { class: 'panel-head' }, h('h2', {}, '発達の目安')),
        h('p', { class: 'muted' }, 'アセスメントを1回記録すると、5領域のグラフが表示されます。')
      ]);
    }

    /* 書類・記録のショートカット */
    const links = h('div', { class: 'panel' }, [
      h('div', { class: 'panel-head' }, h('h2', {}, '書類と記録')),
      h('div', { class: 'shortcut-grid' }, [
        shortcut('個別支援計画', plans.length + '件', 'plan', child),
        shortcut('専門的支援実施計画', splans.length + '件', 'splan', child),
