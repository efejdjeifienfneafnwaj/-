        shortcut('発達アセスメント', hist.length + '回', 'assess', child),
        shortcut('記録・文字起こし', records.length + '件', 'records', child)
      ])
    ]);

    root.appendChild(h('div', { class: 'two-col' }, [
      h('div', {}, [todoPanel, info]),
      h('div', {}, [trend, links])
    ]));
  }

  function shortcut(title, count, view, child) {
    return h('button', {
      class: 'shortcut', onclick: function () { App.openChild(child.id, view); }
    }, [h('span', { class: 'shortcut-title' }, title), h('span', { class: 'shortcut-count' }, count)]);
  }

  return { renderList: renderList, renderHome: renderHome, openEditor: openEditor, FIELDS: CHILD_FIELDS };
})();

</script>
<script>
/* ---- js/view-assess.js ---- */
/* =========================================================================
 * view-assess.js — 発達アセスメント(半年ごとのモニタリング用)
 *   ・5領域70項目のチェック
 *   ・前回との比較(できるようになったこと / 芽生えていること)
 *   ・保護者にお渡しするレポートの印刷
 * ========================================================================= */
window.ViewAssess = (function () {
  'use strict';
  const h = UI.h;

  let editing = null;   // 編集中のアセスメント
  let openDomain = null; // 開いている領域

  function render(root, child) {
    const hist = Assess.history(child.id);

    root.appendChild(h('div', { class: 'page-head' }, [
      h('div', {}, [
        h('h1', {}, '発達アセスメント'),
        h('p', { class: 'muted' }, '5領域70項目のチェックです。半年ごと(モニタリングの時期)に記録すると、前回からの変化が自動でまとまります。')
      ]),
      h('button', {
        class: 'btn primary', onclick: function () { startNew(child); }
      }, '＋ 新しいアセスメント')
    ]));

    if (editing) { renderEditor(root, child); return; }

    if (!hist.length) {
      root.appendChild(h('div', { class: 'empty' }, [
        h('p', {}, 'まだアセスメントの記録がありません。'),
        h('p', { class: 'muted' }, '「＋ 新しいアセスメント」から、いまのお子さんの様子をチェックしてください。')
      ]));
      return;
    }

    root.appendChild(renderTrend(child, hist));
    root.appendChild(renderHistoryList(child, hist));
  }

  /* ---- 推移表 ------------------------------------------------------------ */
  function renderTrend(child, hist) {
    const cols = hist.slice(-6); // 直近6回
    const table = h('table', { class: 'table trend' });
    const head = h('tr', {}, [h('th', {}, '領域')].concat(cols.map(function (a) {
      return h('th', {}, UI.fmtDate(a.date));
    })));
    table.appendChild(h('thead', {}, head));

    const tb = h('tbody', {});
    DATA.domains.forEach(function (d) {
      const cells = cols.map(function (a, i) {
        const m = Assess.domainMonths(d, a.scores || {});
        let delta = null;
        if (i > 0) {
          const prevM = Assess.domainMonths(d, cols[i - 1].scores || {});
          delta = Math.round((m - prevM) * 10) / 10;
        }
        return h('td', {}, [
          h('span', { class: 'trend-val' }, UI.ageText(m)),
          delta !== null ? h('span', { class: 'trend-delta' + (delta > 0 ? ' up' : delta < 0 ? ' down' : '') },
            (delta > 0 ? '+' : '') + delta + 'か月') : null
        ]);
      });
      tb.appendChild(h('tr', {}, [
        h('th', { scope: 'row' }, [
          h('span', { class: 'dot', style: 'background:' + d.color }), d.name
        ])
      ].concat(cells)));
    });

    // 生活年齢の行
    tb.appendChild(h('tr', { class: 'trend-chrono' }, [h('th', { scope: 'row' }, '生活年齢')]
      .concat(cols.map(function (a) {
        return h('td', {}, UI.ageText(UI.ageInMonths(child.birthday, a.date)));
      }))));
    table.appendChild(tb);

    const latest = hist[hist.length - 1];
    const sum = Assess.summarize(latest, child);
    const prev = Assess.previousOf(latest);
    const series = [];
    if (prev) {
      series.push({
        name: '前回(' + UI.fmtDate(prev.date) + ')', color: '#94a3b8', dashed: true, fillOpacity: 0.1,
        values: Assess.summarize(prev, child).perDomain.map(function (x) { return x.months; })
      });
    }
    series.push({
      name: '今回(' + UI.fmtDate(latest.date) + ')', color: '#2f7d64',
      values: sum.perDomain.map(function (x) { return x.months; })
    });

    return h('div', { class: 'panel' }, [
      h('div', { class: 'panel-head' }, h('h2', {}, '発達の推移')),
      h('div', { class: 'trend-layout' }, [
        h('div', { class: 'radar-wrap' }, [
          Assess.radar(series, { chronoMonths: sum.chronoMonths, size: 320 }),
          Assess.legend(series, sum.chronoMonths)
        ]),
        h('div', { class: 'table-scroll' }, table)
      ]),
      h('p', { class: 'note' }, '※ 表の数値は、チェック結果から算出した「発達の目安月齢」です。標準化された発達検査の結果ではありません。支援の見立てと、変化を共有するための参考値としてお使いください。')
    ]);
  }

  /* ---- 履歴一覧 ---------------------------------------------------------- */
  function renderHistoryList(child, hist) {
    const list = h('div', { class: 'record-list' });
    hist.slice().reverse().forEach(function (a) {
      const sum = Assess.summarize(a, child);
      list.appendChild(h('div', { class: 'record-item' }, [
        h('div', { class: 'record-main' }, [
          h('div', { class: 'record-title' }, UI.fmtDate(a.date) + ' 実施'),
          h('div', { class: 'record-meta' }, [
            h('span', {}, '記入者: ' + (a.assessor || '—')),
            h('span', {}, '生活年齢 ' + UI.ageText(sum.chronoMonths)),
            h('span', {}, '5領域平均 ' + UI.ageText(sum.averageMonths)),
            sum.unrated ? h('span', { class: 'tag warn' }, '未評価 ' + sum.unrated + '項目') : null
          ]),
          a.comment ? h('p', { class: 'record-body' }, a.comment) : null
        ]),
        h('div', { class: 'record-actions' }, [
          h('button', { class: 'btn small', onclick: function () { editing = a; openDomain = null; App.render(); } }, '開く'),
          h('button', { class: 'btn small', onclick: function () { Print.assessmentReport(child, a); } }, '保護者用を印刷'),
          h('button', {
            class: 'btn small danger ghost', onclick: function () {
              if (!UI.confirmDanger(UI.fmtDate(a.date) + ' のアセスメントを削除します。元に戻せません。')) return;
              Store.remove('assessments', a.id);
              UI.toast('削除しました'); App.render();
            }
          }, '削除')
        ])
      ]));
    });
    return h('div', { class: 'panel' }, [
      h('div', { class: 'panel-head' }, h('h2', {}, '実施履歴')),
      list
    ]);
  }

  /* ---- 新規作成 ---------------------------------------------------------- */
  function startNew(child) {
    const hist = Assess.history(child.id);
    const last = hist.length ? hist[hist.length - 1] : null;
    editing = {
      childId: child.id,
      date: UI.today(),
      assessor: Store.settings().manager || '',
      setting: '',
      comment: '',
      homeAdvice: '',
      // 前回の結果を初期値として引き継ぐ(「変わったところだけ直す」使い方ができる)
      scores: last ? Object.assign({}, last.scores) : {}
    };
    openDomain = DATA.domains[0].id;
    if (last) UI.toast('前回(' + UI.fmtDate(last.date) + ')の結果を引き継ぎました。変化したところを直してください。');
    App.render();
  }

  /* ---- 入力画面 ---------------------------------------------------------- */
  function renderEditor(root, child) {
    const chrono = UI.ageInMonths(child.birthday, editing.date);

    /* 見出し部分 */
    const head = h('form', { class: 'form-grid compact' }, [
      UI.field('実施日', UI.input('date', editing.date, {
        type: 'date', onchange: function (e) { editing.date = e.target.value; App.render(); }
      })),
      UI.field('記入者', UI.input('assessor', editing.assessor, {
        onchange: function (e) { editing.assessor = e.target.value; }
      })),
      UI.field('実施場面', UI.input('setting', editing.setting, {
        placeholder: '例: 事業所での活動観察、保護者面談',
        onchange: function (e) { editing.setting = e.target.value; }
      })),
      UI.field('生活年齢', h('div', { class: 'static-value' }, UI.ageText(chrono)))
    ]);

    /* 領域ごとのチェック */
    const sections = h('div', { class: 'assess-sections' });
    DATA.domains.forEach(function (d) {
      const done = d.items.filter(function (it) {
        const s = editing.scores[it.id]; return s !== undefined && s !== null && s !== '';
      }).length;
      const opened = openDomain === d.id;

      const header = h('button', {
        class: 'assess-head' + (opened ? ' open' : ''), type: 'button',
        onclick: function () { openDomain = opened ? null : d.id; App.render(); }
      }, [
        h('span', { class: 'dot', style: 'background:' + d.color }),
        h('span', { class: 'assess-head-name' }, d.name),
        h('span', { class: 'assess-head-count' }, done + '/' + d.items.length),
        h('span', { class: 'assess-head-months' }, UI.ageText(Assess.domainMonths(d, editing.scores))),
        h('span', { class: 'chev' }, opened ? '▲' : '▼')
      ]);

      const body = h('div', { class: 'assess-body' + (opened ? '' : ' hidden') });
      body.appendChild(h('p', { class: 'assess-desc' }, d.desc));
      d.items.forEach(function (it) {
        // 生活月齢の前後1年程度の項目は、いま注目したいところとして印をつける
        const focus = chrono !== null && it.month > chrono - 12 && it.month <= chrono + 6;
        const row = h('div', { class: 'assess-row' + (focus ? ' focus' : '') }, [
          h('div', { class: 'assess-item' }, [
            h('span', { class: 'assess-month' }, it.month + 'か月'),
            h('span', { class: 'assess-text' }, it.text)
          ]),
          h('div', { class: 'seg' }, DATA.SCORES.map(function (sc) {
            const on = String(editing.scores[it.id]) === String(sc.value);
            return h('button', {
              type: 'button', class: 'seg-btn s' + sc.value + (on ? ' on' : ''),
              title: sc.desc,
              onclick: function () {
                if (on) delete editing.scores[it.id];
                else editing.scores[it.id] = sc.value;
                App.render();
              }
            }, sc.label);
          }))
        ]);
        body.appendChild(row);
      });

      // 領域内の一括操作
      body.appendChild(h('div', { class: 'assess-bulk' }, [
        h('span', { class: 'muted' }, 'この領域をまとめて: '),
        h('button', { class: 'btn tiny', type: 'button', onclick: function () {
          d.items.forEach(function (it) { if (editing.scores[it.id] === undefined) editing.scores[it.id] = 0; });
          App.render();
        } }, '未評価を「これから」にする'),
        h('button', { class: 'btn tiny ghost', type: 'button', onclick: function () {
          d.items.forEach(function (it) { delete editing.scores[it.id]; });
          App.render();
        } }, 'クリア')
      ]));

      sections.appendChild(h('div', { class: 'assess-section' }, [header, body]));
    });

    /* 結果プレビュー */
    const sum = Assess.summarize(editing, child);
    const prevA = Assess.previousOf(editing);
    const series = [];
    if (prevA) {
      series.push({
        name: '前回(' + UI.fmtDate(prevA.date) + ')', color: '#94a3b8', dashed: true, fillOpacity: 0.1,
        values: Assess.summarize(prevA, child).perDomain.map(function (x) { return x.months; })
      });
    }
    series.push({
      name: '今回', color: '#2f7d64',
      values: sum.perDomain.map(function (x) { return x.months; })
    });

    const preview = h('div', { class: 'panel sticky' }, [
      h('div', { class: 'panel-head' }, h('h2', {}, '入力中の結果')),
      h('div', { class: 'radar-wrap' }, [
        Assess.radar(series, { chronoMonths: sum.chronoMonths, size: 300 }),
        Assess.legend(series, sum.chronoMonths)
      ]),
      h('ul', { class: 'domain-scores' }, sum.perDomain.map(function (x) {
        return h('li', {}, [
          h('span', { class: 'dot', style: 'background:' + x.color }),
          h('span', { class: 'ds-name' }, x.name),
          h('span', { class: 'ds-val' }, UI.ageText(x.months))
        ]);
      })),
      sum.unrated ? h('p', { class: 'note warn' }, '未評価が ' + sum.unrated + '項目あります。未評価は「これから」と同じ扱いで計算されるため、実際より低く出ることがあります。') : null,
      h('div', { class: 'form-grid' }, [
        (function () { const f = UI.field('支援者からのコメント(保護者用レポートに載ります)',
            UI.textarea('comment', editing.comment, 4, '例: 友達との関わりが増え、順番を待てる場面が出てきました。'));
          f.classList.add('wide'); f.querySelector('textarea').addEventListener('change', function (e) { editing.comment = e.target.value; });
          return f; })(),
        (function () { const f = UI.field('ご家庭でできる関わりの提案',
            UI.textarea('homeAdvice', editing.homeAdvice, 4, '例: 順番を待つ場面を、ご家庭のカード遊びでも作ってみてください。'));
          f.classList.add('wide'); f.querySelector('textarea').addEventListener('change', function (e) { editing.homeAdvice = e.target.value; });
          return f; })()
      ]),
      h('div', { class: 'panel-actions' }, [
        h('button', { class: 'btn', onclick: function () { editing = null; App.render(); } }, 'キャンセル'),
        h('button', {
          class: 'btn primary', onclick: function () {
            const saved = Store.put('assessments', editing);
            editing = null;
            UI.toast('アセスメントを保存しました');
            App.render();
            void saved;
          }
        }, '保存する')
      ])
    ]);

    root.appendChild(h('div', { class: 'assess-layout' }, [
      h('div', {}, [h('div', { class: 'panel' }, [head]), sections]),
      preview
    ]));
  }

  function reset() { editing = null; openDomain = null; }

  return { render: render, reset: reset };
})();

</script>
<script>
/* ---- js/view-plan.js ---- */
/* =========================================================================
 * view-plan.js — 個別支援計画
 *   5領域(健康・生活/運動・感覚/認知・行動/言語・コミュニケーション/
 *   人間関係・社会性)ごとに目標と支援内容を書く様式。
 *   最新のアセスメント結果から目標のたたき台を差し込める。
 * ========================================================================= */
window.ViewPlan = (function () {
  'use strict';
  const h = UI.h;

  let editing = null;

  const HEAD_FIELDS = [
    { key: 'createdDate', label: '計画作成日', type: 'date' },
    { key: 'planNo',      label: '計画の回次', placeholder: '例: 第3期' },
    { key: 'author',      label: '計画作成者(児童発達支援管理責任者)' },
    { key: 'prevDate',    label: '前回作成日', type: 'date' },
    { key: 'startDate',   label: '支援期間(開始)', type: 'date' },
    { key: 'endDate',     label: '支援期間(終了)', type: 'date' },
    { key: 'frequency',   label: '利用予定(頻度・時間)', placeholder: '例: 週2回(火・金)14:30〜17:00' },
    { key: 'monitorDate', label: '次回モニタリング予定日', type: 'date' }
  ];

  const TEXT_BLOCKS = [
    { key: 'wishSelf',   label: '本人の希望・意向', rows: 3,
      hint: '本人が言葉で表しにくい場合は、表情・行動から読み取った様子を書きます。' },
    { key: 'wishFamily', label: 'ご家族の希望・意向', rows: 3 },
    { key: 'assessmentSummary', label: 'アセスメントのまとめ(現在の状況・強み・課題)', rows: 5 },
    { key: 'policy',     label: '総合的な支援の方針', rows: 4 }
  ];

  const GOAL_ROWS = [
    { key: 'goal',     label: '支援目標', rows: 3 },
    { key: 'support',  label: '具体的な支援内容・方法', rows: 4 },
    { key: 'period',   label: '達成時期' },
    { key: 'staff',    label: '担当者・提供機関' },
    { key: 'note',     label: '留意事項・本人の強みの活かし方', rows: 2 }
  ];

  const TAIL_BLOCKS = [
    { key: 'longGoal',    label: '長期目標(おおむね1年)', rows: 3 },
    { key: 'shortGoal',   label: '短期目標(おおむね6か月)', rows: 3 },
    { key: 'familySupport',    label: '家族支援(相談・助言、ペアレントプログラム等)', rows: 3 },
    { key: 'transitionSupport', label: '移行支援(就園・就学・進級に向けた支援)', rows: 3 },
    { key: 'cooperation', label: '関係機関との連携(園・学校・医療・相談支援)', rows: 3 },
    { key: 'careNote',    label: '支援の提供にあたっての留意事項(健康・安全面)', rows: 3 }
  ];

  /* ---- 一覧 -------------------------------------------------------------- */
  function render(root, child) {
    if (editing) { renderEditor(root, child); return; }

    const plans = Store.byChild('plans', child.id).slice().sort(function (a, b) {
      return String(b.createdDate || '').localeCompare(String(a.createdDate || ''));
    });

    root.appendChild(h('div', { class: 'page-head' }, [
      h('div', {}, [
        h('h1', {}, '個別支援計画'),
        h('p', { class: 'muted' }, '5領域ごとに目標と支援内容を整理する様式です。作成後は印刷して、説明・同意にお使いください。')
      ]),
      h('button', { class: 'btn primary', onclick: function () { startNew(child); } }, '＋ 新しい計画を作成')
    ]));

    if (!plans.length) {
      root.appendChild(h('div', { class: 'empty' }, [
        h('p', {}, 'まだ個別支援計画がありません。'),
        h('p', { class: 'muted' }, 'アセスメントを先に記録しておくと、目標のたたき台を自動で差し込めます。')
      ]));
      return;
    }

    const list = h('div', { class: 'record-list' });
    plans.forEach(function (p) {
      list.appendChild(h('div', { class: 'record-item' }, [
        h('div', { class: 'record-main' }, [
          h('div', { class: 'record-title' }, [
            (p.planNo ? p.planNo + '　' : '') + UI.fmtDate(p.createdDate) + ' 作成',
            p.agreeDate ? h('span', { class: 'tag ok' }, '同意済 ' + UI.fmtDate(p.agreeDate))
                        : h('span', { class: 'tag' }, '未同意')
          ]),
          h('div', { class: 'record-meta' }, [
            h('span', {}, '作成者: ' + (p.author || '—')),
            h('span', {}, '支援期間: ' + (p.startDate ? UI.fmtDate(p.startDate) : '—') + ' 〜 ' +
              (p.endDate ? UI.fmtDate(p.endDate) : '—')),
            p.monitorDate ? h('span', {}, '次回モニタリング: ' + UI.fmtDate(p.monitorDate)) : null
          ]),
          p.policy ? h('p', { class: 'record-body' }, p.policy) : null
        ]),
        h('div', { class: 'record-actions' }, [
          h('button', { class: 'btn small', onclick: function () { editing = JSON.parse(JSON.stringify(p)); App.render(); } }, '開く'),
          h('button', { class: 'btn small', onclick: function () { Print.plan(child, p); } }, '印刷'),
          h('button', { class: 'btn small', onclick: function () { toExcel(child, p); } }, 'Excel出力'),
          h('button', { class: 'btn small', onclick: function () {
            const copy = JSON.parse(JSON.stringify(p));
            delete copy.id; delete copy.createdAt; delete copy.updatedAt;
            copy.prevDate = p.createdDate;
            copy.createdDate = UI.today();
            copy.explainDate = ''; copy.agreeDate = ''; copy.signer = '';
            editing = copy; App.render();
            UI.toast('前回の内容を引き継いで新しい計画を作ります');
          } }, '引き継いで新規'),
          h('button', { class: 'btn small danger ghost', onclick: function () {
            if (!UI.confirmDanger('この計画を削除します。元に戻せません。')) return;
            Store.remove('plans', p.id); UI.toast('削除しました'); App.render();
          } }, '削除')
        ])
      ]));
    });
    root.appendChild(h('div', { class: 'panel' }, list));
  }

  /* ---- 新規 -------------------------------------------------------------- */
  function startNew(child) {
    const prev = Store.byChild('plans', child.id).slice().sort(function (a, b) {
      return String(b.createdDate || '').localeCompare(String(a.createdDate || ''));
    })[0];
    const start = UI.today();
    editing = {
      childId: child.id,
      createdDate: start,
      planNo: prev ? nextPlanNo(prev.planNo) : '第1期',
      author: Store.settings().manager || child.manager || '',
      prevDate: prev ? prev.createdDate : '',
      startDate: start,
      endDate: UI.addMonths(start, 6),
      monitorDate: UI.addMonths(start, 6),
      frequency: '',
      goals: {}
    };
    DATA.domains.forEach(function (d) { editing.goals[d.id] = {}; });
    App.render();
  }

  function nextPlanNo(prevNo) {
    const m = String(prevNo || '').match(/(\d+)/);
    return m ? '第' + (Number(m[1]) + 1) + '期' : '';
  }

  /* ---- 編集 -------------------------------------------------------------- */
  function renderEditor(root, child) {
    const form = h('form', { onsubmit: function (e) { e.preventDefault(); } });

    root.appendChild(h('div', { class: 'page-head' }, [
      h('div', {}, [
        h('h1', {}, '個別支援計画の作成'),
        h('p', { class: 'muted' }, child.name + '　(' + UI.ageText(UI.ageInMonths(child.birthday, UI.today())) + ')')
      ]),
      h('div', { class: 'btn-row' }, [
        h('button', { class: 'btn', type: 'button', onclick: function () { editing = null; App.render(); } }, 'キャンセル'),
        h('button', { class: 'btn', type: 'button', onclick: function () { saveThen(form, child, toExcel); } }, '保存してExcel出力'),
        h('button', { class: 'btn primary', type: 'button', onclick: function () { save(form, child); } }, '保存する')
      ])
    ]));

    /* 基本情報 */
    const headGrid = h('div', { class: 'form-grid' });
    HEAD_FIELDS.forEach(function (f) {
      headGrid.appendChild(UI.field(f.label, UI.input(f.key, editing[f.key], {
        type: f.type || 'text', placeholder: f.placeholder || ''
      })));
    });
    form.appendChild(h('div', { class: 'panel' }, [
      h('div', { class: 'panel-head' }, h('h2', {}, '基本事項')), headGrid
    ]));

    /* 意向・方針 */
    const wishGrid = h('div', { class: 'form-grid' });
    TEXT_BLOCKS.forEach(function (f) {
      const fld = UI.field(f.label, UI.textarea(f.key, editing[f.key], f.rows), f.hint);
      fld.classList.add('wide');
      wishGrid.appendChild(fld);
    });
    form.appendChild(h('div', { class: 'panel' }, [
      h('div', { class: 'panel-head' }, [
        h('h2', {}, '意向とアセスメント'),
        h('button', { class: 'btn small', type: 'button', onclick: function () { fillFromAssessment(form, child); } },
          'アセスメントから下書きを入れる')
      ]),
      wishGrid
    ]));

    /* 5領域の目標 */
    const goalsPanel = h('div', { class: 'panel' }, [
      h('div', { class: 'panel-head' }, [
        h('h2', {}, '5領域ごとの支援目標'),
        h('span', { class: 'muted small' }, '書くことがない領域は空欄のままで構いません')
      ])
    ]);
    DATA.domains.forEach(function (d) {
      const g = editing.goals[d.id] || {};
      const grid = h('div', { class: 'form-grid' });
      GOAL_ROWS.forEach(function (r) {
        const name = 'goals.' + d.id + '.' + r.key;
        const ctl = r.rows ? UI.textarea(name, g[r.key], r.rows) : UI.input(name, g[r.key]);
        const fld = UI.field(r.label, ctl);
        if (r.rows) fld.classList.add('wide');
        grid.appendChild(fld);
      });
      grid.appendChild(UI.field('優先順位',
        UI.select('goals.' + d.id + '.priority', ['', '1', '2', '3', '4', '5'], g.priority)));
      goalsPanel.appendChild(h('div', { class: 'goal-block' }, [
        h('h3', { class: 'goal-head', style: 'border-left-color:' + d.color }, [
          d.name, h('span', { class: 'goal-desc' }, d.desc)
        ]),
        grid
      ]));
    });
    form.appendChild(goalsPanel);

    /* その他の欄 */
    const tailGrid = h('div', { class: 'form-grid' });
    TAIL_BLOCKS.forEach(function (f) {
      const fld = UI.field(f.label, UI.textarea(f.key, editing[f.key], f.rows));
      fld.classList.add('wide');
      tailGrid.appendChild(fld);
    });
    form.appendChild(h('div', { class: 'panel' }, [
      h('div', { class: 'panel-head' }, h('h2', {}, '目標・家族支援・連携')), tailGrid
    ]));

    /* 説明と同意 */
    const agreeGrid = h('div', { class: 'form-grid' }, [
      UI.field('保護者へ説明した日', UI.input('explainDate', editing.explainDate, { type: 'date' })),
      UI.field('同意を得た日', UI.input('agreeDate', editing.agreeDate, { type: 'date' })),
      UI.field('説明者', UI.input('explainer', editing.explainer)),
      UI.field('同意者(保護者氏名)', UI.input('signer', editing.signer))
    ]);
    form.appendChild(h('div', { class: 'panel' }, [
      h('div', { class: 'panel-head' }, h('h2', {}, '説明と同意')), agreeGrid,
      h('p', { class: 'note' }, '※ 印刷した計画書には署名・押印欄が入ります。同意を得た計画書の写しは保護者へお渡しください。')
    ]));

    form.appendChild(h('div', { class: 'btn-row end' }, [
      h('button', { class: 'btn', type: 'button', onclick: function () { editing = null; App.render(); } }, 'キャンセル'),
      h('button', { class: 'btn primary', type: 'button', onclick: function () { save(form, child); } }, '保存する')
    ]));

    root.appendChild(form);
  }

  /* ---- アセスメント結果から下書き ---------------------------------------- */
  function fillFromAssessment(form, child) {
    const hist = Assess.history(child.id);
    if (!hist.length) { UI.toast('先に発達アセスメントを記録してください', 'warn'); return; }
    const latest = hist[hist.length - 1];
    const sum = Assess.summarize(latest, child);
    const prev = Assess.previousOf(latest);
    const d = Assess.diff(latest, prev);

    /* アセスメントのまとめ */
    const lines = [];
    lines.push(UI.fmtDate(latest.date) + '実施の発達アセスメント(生活年齢 ' + UI.ageText(sum.chronoMonths) + ')より。');
    lines.push('【領域ごとの発達の目安】');
    sum.perDomain.forEach(function (x) { lines.push('・' + x.name + ': ' + UI.ageText(x.months)); });
    if (d.gained.length) {
      lines.push('【前回からできるようになったこと】');
      d.gained.slice(0, 8).forEach(function (g) { lines.push('・' + g.item.text + '(' + g.domain.name + ')'); });
    }
    if (d.emerging.length) {
      lines.push('【芽生えており、支援で伸びが期待できること】');
      d.emerging.slice(0, 8).forEach(function (g) { lines.push('・' + g.item.text + '(' + g.domain.name + ')'); });
    }
    if (latest.comment) { lines.push('【観察所見】'); lines.push(latest.comment); }
    setIfEmpty(form, 'assessmentSummary', lines.join('\n'));

    /* 5領域の目標のたたき台 */
    d.next.forEach(function (n) {
      setIfEmpty(form, 'goals.' + n.domain.id + '.goal',
        n.item.text.replace(/。$/, '') + 'ことを目指す。' +
        (n.score === 1 ? '(現在「芽生え」の段階)' : ''));
      setIfEmpty(form, 'goals.' + n.domain.id + '.period', editing.endDate ? UI.fmtDate(editing.endDate) : '');
    });

    UI.toast('空欄にアセスメントからの下書きを入れました。内容を確認して書き直してください。');
  }

  function setIfEmpty(form, name, value) {
    const el = form.querySelector('[name="' + name.replace(/"/g, '\\"') + '"]');
    if (el && !String(el.value).trim()) el.value = value;
  }

  /* ---- 保存 -------------------------------------------------------------- */
  function save(form, child) {
    saveThen(form, child, null);
  }

  /** 保存したうえで、続けて after(child, 保存した計画) を呼ぶ */
  function saveThen(form, child, after) {
    const flat = UI.readForm(form);
    const obj = Object.assign({}, editing, { childId: child.id, goals: editing.goals || {} });
    Object.keys(flat).forEach(function (k) {
      if (k.indexOf('goals.') === 0) {
        const parts = k.split('.');
        if (!obj.goals[parts[1]]) obj.goals[parts[1]] = {};
        obj.goals[parts[1]][parts[2]] = flat[k];
      } else {
        obj[k] = flat[k];
      }
    });
    const saved = Store.put('plans', obj);
    editing = null;
    UI.toast('個別支援計画を保存しました');
    App.render();
    if (after) after(child, saved);
  }

  /* ---- 厚生労働省の参考様式(xlsx)へ書き出す ------------------------------ */
  function toExcel(child, plan) {
    try {
      Xlsx.exportPlan(child, plan);
      UI.toast('Excelファイルを書き出しました');
    } catch (e) {
      console.error(e);
      UI.toast('Excelの書き出しに失敗しました: ' + e.message, 'warn');
    }
  }

  function reset() { editing = null; }

  return { render: render, reset: reset, HEAD_FIELDS: HEAD_FIELDS, TEXT_BLOCKS: TEXT_BLOCKS,
           GOAL_ROWS: GOAL_ROWS, TAIL_BLOCKS: TAIL_BLOCKS };
})();

</script>
<script>
/* ---- js/view-splan.js ---- */
/* =========================================================================
 * view-splan.js — 専門的支援実施計画
 *   専門職(PT/OT/ST/心理担当職員等)が行う支援の計画と、その実施記録。
 *   個別支援計画とひもづけて管理する。
 * ========================================================================= */
window.ViewSplan = (function () {
  'use strict';
  const h = UI.h;

  let editing = null;

  const HEAD_FIELDS = [
    { key: 'createdDate', label: '作成日', type: 'date' },
    { key: 'staffName',   label: '担当専門職 氏名' },
    { key: 'qualification', label: '資格・経験年数', placeholder: '例: 作業療法士 / 実務8年' },
    { key: 'startDate',   label: '実施期間(開始)', type: 'date' },
    { key: 'endDate',     label: '実施期間(終了)', type: 'date' },
    { key: 'form',        label: '実施形態', options: DATA.GROUP_FORMS },
    { key: 'frequency',   label: '実施頻度', placeholder: '例: 月2回' },
    { key: 'minutes',     label: '1回あたりの時間(分)', type: 'number', placeholder: '例: 40' },
    { key: 'place',       label: '実施場所', placeholder: '例: 個別支援室' },
    { key: 'evalDate',    label: '評価(振り返り)予定日', type: 'date' }
  ];

  const TEXT_BLOCKS = [
    { key: 'reason',   label: '専門的支援を必要とする理由(アセスメント結果)', rows: 5,
      hint: '発達アセスメントや日々の観察から、専門職の関わりが必要と判断した根拠を書きます。' },
    { key: 'goal',     label: '専門的支援の目標', rows: 4 },
    { key: 'content',  label: '支援内容・具体的な方法(用いるプログラム・教材・環境設定)', rows: 6 },
    { key: 'linkPlan', label: '個別支援計画との関連(どの領域・目標に対応するか)', rows: 3 },
    { key: 'share',    label: '他職員への引き継ぎ・日常場面への般化の方法', rows: 4,
      hint: '専門職以外の職員が普段の活動の中でどう関わるかを書いておくと、支援が続きます。' },
    { key: 'evalMethod', label: '評価方法・評価の視点', rows: 3 }
  ];

  /* ---- 一覧 -------------------------------------------------------------- */
  function render(root, child) {
    if (editing) { renderEditor(root, child); return; }

    const splans = Store.byChild('splans', child.id).slice().sort(function (a, b) {
      return String(b.createdDate || '').localeCompare(String(a.createdDate || ''));
    });

    root.appendChild(h('div', { class: 'page-head' }, [
      h('div', {}, [
        h('h1', {}, '専門的支援実施計画'),
        h('p', { class: 'muted' }, '理学療法士・作業療法士・言語聴覚士・心理担当職員などが行う支援の計画と実施記録です。')
      ]),
      h('button', { class: 'btn primary', onclick: function () { startNew(child); } }, '＋ 新しい計画を作成')
    ]));

    if (!splans.length) {
      root.appendChild(h('div', { class: 'empty' }, [
        h('p', {}, 'まだ専門的支援実施計画がありません。'),
        h('p', { class: 'muted' }, '個別支援計画のうち、専門職が重点的に担う部分を切り出して計画にします。')
      ]));
      return;
    }

    const list = h('div', { class: 'record-list' });
    splans.forEach(function (p) {
      const sessions = p.sessions || [];
      list.appendChild(h('div', { class: 'record-item' }, [
        h('div', { class: 'record-main' }, [
          h('div', { class: 'record-title' }, [
            UI.fmtDate(p.createdDate) + ' 作成',
            (p.professions || []).length ? h('span', { class: 'tag' }, (p.professions || []).join('・')) : null
          ]),
          h('div', { class: 'record-meta' }, [
            h('span', {}, '担当: ' + (p.staffName || '—')),
            h('span', {}, (p.form || '') + ' ' + (p.frequency || '') + (p.minutes ? ' / ' + p.minutes + '分' : '')),
            h('span', {}, '実施記録 ' + sessions.length + '回')
          ]),
          p.goal ? h('p', { class: 'record-body' }, p.goal) : null
        ]),
        h('div', { class: 'record-actions' }, [
          h('button', { class: 'btn small', onclick: function () { editing = JSON.parse(JSON.stringify(p)); App.render(); } }, '開く'),
          h('button', { class: 'btn small', onclick: function () { Print.splan(child, p); } }, '印刷'),
          h('button', { class: 'btn small danger ghost', onclick: function () {
            if (!UI.confirmDanger('この専門的支援実施計画を削除します。実施記録もいっしょに消えます。')) return;
            Store.remove('splans', p.id); UI.toast('削除しました'); App.render();
          } }, '削除')
        ])
      ]));
    });
    root.appendChild(h('div', { class: 'panel' }, list));
  }

  /* ---- 新規 -------------------------------------------------------------- */
  function startNew(child) {
    const start = UI.today();
    editing = {
      childId: child.id, createdDate: start,
      startDate: start, endDate: UI.addMonths(start, 6), evalDate: UI.addMonths(start, 6),
      form: '個別', professions: [], domains: [], sessions: []
    };
    App.render();
  }

  /* ---- 編集 -------------------------------------------------------------- */
  function renderEditor(root, child) {
    const form = h('form', { onsubmit: function (e) { e.preventDefault(); } });

    root.appendChild(h('div', { class: 'page-head' }, [
      h('div', {}, [
        h('h1', {}, '専門的支援実施計画'),
        h('p', { class: 'muted' }, child.name + '　(' + UI.ageText(UI.ageInMonths(child.birthday, UI.today())) + ')')
      ]),
      h('div', { class: 'btn-row' }, [
        h('button', { class: 'btn', type: 'button', onclick: function () { editing = null; App.render(); } }, 'キャンセル'),
        h('button', { class: 'btn primary', type: 'button', onclick: function () { save(form, child); } }, '保存する')
      ])
    ]));

    /* 専門職種・対象領域(複数選択) */
    const profBox = h('div', { class: 'check-grid' }, DATA.PROFESSIONS.map(function (p) {
      return h('label', { class: 'check' }, [
        h('input', { type: 'checkbox', name: 'professions', value: p,
          checked: (editing.professions || []).indexOf(p) >= 0 }),
        h('span', {}, p)
      ]);
    }));
    const domBox = h('div', { class: 'check-grid' }, DATA.domains.map(function (d) {
      return h('label', { class: 'check' }, [
        h('input', { type: 'checkbox', name: 'domains', value: d.id,
          checked: (editing.domains || []).indexOf(d.id) >= 0 }),
        h('span', {}, [h('span', { class: 'dot', style: 'background:' + d.color }), d.name])
      ]);
    }));

    const headGrid = h('div', { class: 'form-grid' });
    HEAD_FIELDS.forEach(function (f) {
      const ctl = f.options ? UI.select(f.key, f.options, editing[f.key])
                            : UI.input(f.key, editing[f.key], { type: f.type || 'text', placeholder: f.placeholder || '' });
      headGrid.appendChild(UI.field(f.label, ctl));
    });

    form.appendChild(h('div', { class: 'panel' }, [
      h('div', { class: 'panel-head' }, h('h2', {}, '基本事項')),
      headGrid,
      UI.field('関わる専門職種(複数選択可)', profBox),
      UI.field('重点的に支援する領域(複数選択可)', domBox)
    ]));

    /* 本文 */
    const grid = h('div', { class: 'form-grid' });
    TEXT_BLOCKS.forEach(function (f) {
      const fld = UI.field(f.label, UI.textarea(f.key, editing[f.key], f.rows), f.hint);
      fld.classList.add('wide');
      grid.appendChild(fld);
    });
    form.appendChild(h('div', { class: 'panel' }, [
      h('div', { class: 'panel-head' }, [
        h('h2', {}, '計画の内容'),
        h('button', { class: 'btn small', type: 'button', onclick: function () { fillFromAssessment(form, child); } },
          'アセスメントから理由の下書きを入れる')
      ]),
      grid
    ]));

    /* 説明と同意 */
    form.appendChild(h('div', { class: 'panel' }, [
      h('div', { class: 'panel-head' }, h('h2', {}, '説明と同意')),
      h('div', { class: 'form-grid' }, [
        UI.field('保護者へ説明した日', UI.input('explainDate', editing.explainDate, { type: 'date' })),
        UI.field('同意を得た日', UI.input('agreeDate', editing.agreeDate, { type: 'date' })),
        UI.field('説明者', UI.input('explainer', editing.explainer)),
        UI.field('同意者(保護者氏名)', UI.input('signer', editing.signer))
      ])
    ]));

    /* 実施記録 */
    form.appendChild(renderSessions(child));

    form.appendChild(h('div', { class: 'btn-row end' }, [
      h('button', { class: 'btn', type: 'button', onclick: function () { editing = null; App.render(); } }, 'キャンセル'),
      h('button', { class: 'btn primary', type: 'button', onclick: function () { save(form, child); } }, '保存する')
    ]));

    root.appendChild(form);
  }

  /* ---- 実施記録 ---------------------------------------------------------- */
  function renderSessions(child) {
    const panel = h('div', { class: 'panel' }, [
      h('div', { class: 'panel-head' }, [
        h('h2', {}, '実施記録'),
        h('button', { class: 'btn small', type: 'button', onclick: function () {
          (editing.sessions = editing.sessions || []).push({
            date: UI.today(), staff: editing.staffName || '', minutes: editing.minutes || '',
            content: '', response: '', next: ''
          });
          App.render();
        } }, '＋ 実施を1件追加')
      ])
    ]);

    const sessions = editing.sessions || [];
    if (!sessions.length) {
      panel.appendChild(h('p', { class: 'muted' }, 'まだ実施記録がありません。支援を行うたびに1件ずつ追加してください。'));
      return panel;
    }

    sessions.forEach(function (s, i) {
      const grid = h('div', { class: 'form-grid' }, [
        UI.field('実施日', UI.input('s.' + i + '.date', s.date, { type: 'date' })),
        UI.field('実施者', UI.input('s.' + i + '.staff', s.staff)),
        UI.field('時間(分)', UI.input('s.' + i + '.minutes', s.minutes, { type: 'number' })),
        (function () { const f = UI.field('実施した内容', UI.textarea('s.' + i + '.content', s.content, 3)); f.classList.add('wide'); return f; })(),
        (function () { const f = UI.field('本人の様子・反応', UI.textarea('s.' + i + '.response', s.response, 3)); f.classList.add('wide'); return f; })(),
        (function () { const f = UI.field('次回に向けて', UI.textarea('s.' + i + '.next', s.next, 2)); f.classList.add('wide'); return f; })()
      ]);
      panel.appendChild(h('div', { class: 'session-block' }, [
        h('div', { class: 'session-head' }, [
          h('h3', {}, '第' + (i + 1) + '回'),
          h('button', { class: 'btn tiny danger ghost', type: 'button', onclick: function () {
            if (!UI.confirmDanger('この実施記録を削除しますか?')) return;
            editing.sessions.splice(i, 1); App.render();
          } }, '削除')
        ]),
        grid
      ]));
    });
    return panel;
  }

  /* ---- アセスメントから下書き -------------------------------------------- */
  function fillFromAssessment(form, child) {
    const hist = Assess.history(child.id);
    if (!hist.length) { UI.toast('先に発達アセスメントを記録してください', 'warn'); return; }
    const latest = hist[hist.length - 1];
    const sum = Assess.summarize(latest, child);
    // 生活年齢との差が大きい領域を優先して挙げる
    const gaps = sum.perDomain.map(function (x) {
      return { name: x.name, months: x.months, gap: (sum.chronoMonths || 0) - x.months };
    }).sort(function (a, b) { return b.gap - a.gap; });

    const lines = [UI.fmtDate(latest.date) + '実施の発達アセスメント(生活年齢 ' + UI.ageText(sum.chronoMonths) + ')より。'];
    gaps.slice(0, 3).forEach(function (g) {
      lines.push('・' + g.name + ' は発達の目安 ' + UI.ageText(g.months) +
        (g.gap > 0 ? '(生活年齢との差 約' + Math.round(g.gap) + 'か月)' : '') + '。');
    });
    if (latest.comment) lines.push('観察所見: ' + latest.comment);
    lines.push('以上から、専門職による重点的な関わりが必要と判断した。');

    const el = form.querySelector('[name="reason"]');
    if (el && !el.value.trim()) el.value = lines.join('\n');
    UI.toast('空欄に下書きを入れました。内容を確認して書き直してください。');
  }

  /* ---- 保存 -------------------------------------------------------------- */
  function save(form, child) {
    const flat = UI.readForm(form);
    const obj = Object.assign({}, editing, { childId: child.id });
    obj.sessions = (editing.sessions || []).map(function (s, i) {
      return {
        date: flat['s.' + i + '.date'] || '', staff: flat['s.' + i + '.staff'] || '',
        minutes: flat['s.' + i + '.minutes'] || '', content: flat['s.' + i + '.content'] || '',
        response: flat['s.' + i + '.response'] || '', next: flat['s.' + i + '.next'] || ''
      };
    });
    Object.keys(flat).forEach(function (k) {
      if (k.indexOf('s.') === 0) return;
      obj[k] = flat[k];
    });
    obj.professions = flat.professions || [];
    obj.domains = flat.domains || [];
    Store.put('splans', obj);
    editing = null;
    UI.toast('専門的支援実施計画を保存しました');
    App.render();
  }

  function reset() { editing = null; }

  return { render: render, reset: reset, HEAD_FIELDS: HEAD_FIELDS, TEXT_BLOCKS: TEXT_BLOCKS };
})();

</script>
<script>
/* ---- js/view-records.js ---- */
/* =========================================================================
 * view-records.js — 記録・文字起こし
 *   面談や観察の記録を児童ごとに蓄積する。
 *   ブラウザの音声入力(対応環境のみ)で口述をそのまま本文に流し込める。
 * ========================================================================= */
window.ViewRecords = (function () {
  'use strict';
  const h = UI.h;

  let editing = null;
  let keyword = '';
  let recog = null;      // 音声認識オブジェクト
  let recogTarget = null;

  function render(root, child) {
    if (editing) { renderEditor(root, child); return; }

    const all = Store.byChild('records', child.id).slice().sort(function (a, b) {
      return String(b.date).localeCompare(String(a.date));
    });
    const kw = keyword.trim();
    const records = kw ? all.filter(function (r) {
      return (r.title + ' ' + r.body + ' ' + (r.kind || '') + ' ' + (r.attendees || ''))
        .toLowerCase().indexOf(kw.toLowerCase()) >= 0;
    }) : all;

    root.appendChild(h('div', { class: 'page-head' }, [
      h('div', {}, [
        h('h1', {}, '記録・文字起こし'),
        h('p', { class: 'muted' }, '面談や観察の記録を、児童ごとに残しておく場所です。アセスメントや計画を書くときの材料になります。')
      ]),
      h('button', { class: 'btn primary', onclick: function () { startNew(child); } }, '＋ 記録を追加')
    ]));

    root.appendChild(h('div', { class: 'panel' }, [
      h('div', { class: 'search-row' }, [
        UI.input('kw', keyword, {
          placeholder: '本文・タイトル・種別からさがす', class: 'search',
          oninput: function (e) { keyword = e.target.value; renderListOnly(root, child); }
        }),
        h('span', { class: 'muted' }, all.length + '件中 ' + records.length + '件')
      ]),
      buildList(records, child)
    ]));
  }

  function renderListOnly(root, child) {
    // 検索のたびに全画面を作り直すと入力欄のカーソルが飛ぶので、一覧だけ差し替える
    const all = Store.byChild('records', child.id).slice().sort(function (a, b) {
      return String(b.date).localeCompare(String(a.date));
    });
    const kw = keyword.trim();
    const records = kw ? all.filter(function (r) {
      return (r.title + ' ' + r.body + ' ' + (r.kind || '') + ' ' + (r.attendees || ''))
        .toLowerCase().indexOf(kw.toLowerCase()) >= 0;
    }) : all;
    const old = UI.$('.record-list', root);
    if (old) old.replaceWith(buildList(records, child));
    const counter = UI.$('.search-row .muted', root);
    if (counter) counter.textContent = all.length + '件中 ' + records.length + '件';
  }

  function buildList(records, child) {
    const list = h('div', { class: 'record-list' });
    if (!records.length) {
      list.appendChild(h('p', { class: 'muted pad' }, '該当する記録がありません。'));
      return list;
    }
    records.forEach(function (r) {
      const preview = String(r.body || '').slice(0, 160);
      list.appendChild(h('div', { class: 'record-item' }, [
        h('div', { class: 'record-main' }, [
          h('div', { class: 'record-title' }, [
            UI.fmtDate(r.date) + '　' + (r.title || '(表題なし)'),
            r.kind ? h('span', { class: 'tag' }, r.kind) : null
          ]),
          r.attendees ? h('div', { class: 'record-meta' }, h('span', {}, '出席・話者: ' + r.attendees)) : null,
          h('p', { class: 'record-body' }, preview + (String(r.body || '').length > 160 ? '…' : ''))
        ]),
        h('div', { class: 'record-actions' }, [
          h('button', { class: 'btn small', onclick: function () { editing = JSON.parse(JSON.stringify(r)); App.render(); } }, '開く'),
          h('button', { class: 'btn small', onclick: function () { Print.record(child, r); } }, '印刷'),
          h('button', { class: 'btn small danger ghost', onclick: function () {
            if (!UI.confirmDanger('この記録を削除します。元に戻せません。')) return;
            Store.remove('records', r.id); UI.toast('削除しました'); App.render();
          } }, '削除')
        ])
      ]));
    });
    return list;
  }

  function startNew(child) {
    editing = {
      childId: child.id, date: UI.today(), kind: DATA.RECORD_KINDS[0],
      title: '', attendees: '', body: '', summary: ''
    };
    App.render();
  }

  /* ---- 編集 -------------------------------------------------------------- */
  function renderEditor(root, child) {
    const form = h('form', { onsubmit: function (e) { e.preventDefault(); } });

    root.appendChild(h('div', { class: 'page-head' }, [
      h('div', {}, [
        h('h1', {}, editing.id ? '記録の編集' : '記録の追加'),
        h('p', { class: 'muted' }, child.name)
      ]),
      h('div', { class: 'btn-row' }, [
        h('button', { class: 'btn', type: 'button', onclick: function () { stopRecog(); editing = null; App.render(); } }, 'キャンセル'),
        h('button', { class: 'btn primary', type: 'button', onclick: function () { save(form, child); } }, '保存する')
      ])
    ]));

    const body = UI.textarea('body', editing.body, 20,
      '面談や観察の内容をそのまま書き起こします。\n\n例:\n母:　最近、家でも「かして」が言えるようになってきました。\n支援者:　事業所でも、おもちゃの貸し借りの場面で増えています。');
    body.classList.add('transcript');

    form.appendChild(h('div', { class: 'panel' }, [
      h('div', { class: 'form-grid' }, [
        UI.field('日付', UI.input('date', editing.date, { type: 'date' })),
        UI.field('種別', UI.select('kind', DATA.RECORD_KINDS, editing.kind)),
        UI.field('表題', UI.input('title', editing.title, { placeholder: '例: 半年モニタリング面談' })),
        UI.field('出席者・話者', UI.input('attendees', editing.attendees, { placeholder: '例: 母、児発管(山田)' }))
      ])
    ]));

    form.appendChild(h('div', { class: 'panel' }, [
      h('div', { class: 'panel-head' }, [
        h('h2', {}, '本文(文字起こし)'),
        h('div', { class: 'btn-row' }, [
          speechButton(body),
          h('button', { class: 'btn small', type: 'button', onclick: function () { insertSpeaker(body); } }, '話者行を挿入'),
          h('button', { class: 'btn small ghost', type: 'button', onclick: function () { insertStamp(body); } }, '時刻を挿入')
        ])
      ]),
      body,
      h('p', { class: 'note' }, '長い面談は、話者ごとに行を分けておくと後から読み返しやすくなります。'),
      (function () {
        const f = UI.field('要点(計画やアセスメントに引用したい部分)',
          UI.textarea('summary', editing.summary, 4, '例: 家庭でも要求を言葉で伝える場面が増えている / 就学に向けた不安が強い'));
        f.classList.add('wide');
        return f;
      })()
    ]));

    form.appendChild(h('div', { class: 'btn-row end' }, [
      h('button', { class: 'btn', type: 'button', onclick: function () { stopRecog(); editing = null; App.render(); } }, 'キャンセル'),
      h('button', { class: 'btn primary', type: 'button', onclick: function () { save(form, child); } }, '保存する')
    ]));

    root.appendChild(form);
  }

  /* ---- 補助ボタン -------------------------------------------------------- */
  function insertSpeaker(ta) {
    const name = window.prompt('話者名を入れてください(例: 母、本人、支援者)', '母');
    if (name === null) return;
    insertAtCursor(ta, (ta.value && !/\n$/.test(ta.value) ? '\n' : '') + name + ': ');
  }

  function insertStamp(ta) {
    const d = new Date();
    const t = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    insertAtCursor(ta, (ta.value && !/\n$/.test(ta.value) ? '\n' : '') + '[' + t + '] ');
  }

  function insertAtCursor(ta, text) {
    const s = ta.selectionStart, e = ta.selectionEnd;
    ta.value = ta.value.slice(0, s) + text + ta.value.slice(e);
    ta.selectionStart = ta.selectionEnd = s + text.length;
    ta.focus();
  }

  /* ---- 音声入力 ----------------------------------------------------------
   * ブラウザ標準の音声認識を使う。環境によっては音声がブラウザ提供元の
   * サーバーへ送られて処理されるため、使う前に必ず確認を出す。
   * ---------------------------------------------------------------------- */
  function speechButton(ta) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      return h('button', {
        class: 'btn small ghost', type: 'button', disabled: true,
        title: 'このブラウザは音声入力に対応していません(Google Chrome などでお試しください)'
      }, '🎤 音声入力(非対応)');
    }
    const btn = h('button', { class: 'btn small', type: 'button' }, '🎤 音声入力を開始');
    btn.addEventListener('click', function () {
      if (recog) { stopRecog(); btn.textContent = '🎤 音声入力を開始'; btn.classList.remove('rec'); return; }
      if (!sessionStorage.getItem('sps.speechOk')) {
        const ok = window.confirm(
          '【音声入力についての確認】\n\n' +
          'ブラウザの音声認識を使います。お使いのブラウザによっては、マイクの音声が\n' +
          'ブラウザ提供元のサーバーへ送られて文字に変換されます。\n\n' +
          'お子さんやご家庭の個人情報を含む会話を扱う場合は、事業所の個人情報の\n' +
          '取り扱い方針を確認したうえでご利用ください。\n\n' +
          '同意して音声入力を開始しますか?');
        if (!ok) return;
        sessionStorage.setItem('sps.speechOk', '1');
      }
      try {
        recog = new SR();
        recog.lang = 'ja-JP';
        recog.continuous = true;
        recog.interimResults = false;
        recogTarget = ta;
        recog.onresult = function (ev) {
          let text = '';
          for (let i = ev.resultIndex; i < ev.results.length; i++) {
            if (ev.results[i].isFinal) text += ev.results[i][0].transcript;
          }
          if (text) insertAtCursor(recogTarget, text + '\n');
        };
        recog.onerror = function (ev) {
          UI.toast('音声入力でエラーが発生しました(' + ev.error + ')', 'warn');
          stopRecog(); btn.textContent = '🎤 音声入力を開始'; btn.classList.remove('rec');
        };
        recog.onend = function () {
          if (recog) { try { recog.start(); } catch (e) { /* 連続認識の再開に失敗しても無視 */ } }
        };
        recog.start();
        btn.textContent = '■ 音声入力を停止';
        btn.classList.add('rec');
        UI.toast('音声入力を開始しました');
      } catch (e) {
        UI.toast('音声入力を開始できませんでした', 'warn');
        recog = null;
      }
    });
    return btn;
  }

  function stopRecog() {
    if (!recog) return;
    const r = recog;
    recog = null;
    try { r.onend = null; r.stop(); } catch (e) { /* 既に停止している場合は無視 */ }
  }

  /* ---- 保存 -------------------------------------------------------------- */
  function save(form, child) {
    stopRecog();
    const data = UI.readForm(form);
    const obj = Object.assign({}, editing, data, { childId: child.id });
    if (!obj.title.trim() && !obj.body.trim()) {
      UI.toast('表題か本文を入力してください', 'warn');
      return;
    }
    Store.put('records', obj);
    editing = null;
    UI.toast('記録を保存しました');
    App.render();
  }

  function reset() { stopRecog(); editing = null; keyword = ''; }

  return { render: render, reset: reset };
})();

</script>
<script>
/* ---- js/app.js ---- */
/* =========================================================================
 * app.js — 画面の切り替えと全体の枠組み
 * ========================================================================= */
window.App = (function () {
  'use strict';
  const h = UI.h;

  const CHILD_TABS = [
    { id: 'home',    label: 'ホーム' },
    { id: 'plan',    label: '個別支援計画' },
    { id: 'splan',   label: '専門的支援実施計画' },
    { id: 'assess',  label: '発達アセスメント' },
    { id: 'records', label: '記録・文字起こし' }
  ];

  let state = { view: 'children', childId: null };

  /* ---- 画面遷移 ---------------------------------------------------------- */
  function go(view) {
    resetViews();
    state.view = view;
    if (view === 'children' || view === 'settings') state.childId = null;
    render();
  }

  function openChild(childId, view) {
    if (state.childId !== childId) resetViews();
    state.childId = childId;
    state.view = view || 'home';
    render();
  }

  /** 別の画面へ移るとき、各画面の編集中の状態を捨てる */
  function resetViews() {
    [ViewAssess, ViewPlan, ViewSplan, ViewRecords].forEach(function (v) {
      if (v && v.reset) v.reset();
    });
  }

  /* ---- 描画 -------------------------------------------------------------- */
  function render() {
    const app = UI.$('#app');
    UI.clear(app);
    app.appendChild(renderHeader());

    const main = h('main', { class: 'main' });
    app.appendChild(main);

    if (state.view === 'settings') { renderSettings(main); return; }

    if (!state.childId) { ViewChildren.renderList(main); return; }

    const child = Store.get('children', state.childId);
    if (!child) { state.childId = null; ViewChildren.renderList(main); return; }

    main.appendChild(renderChildBar(child));
    const body = h('div', { class: 'child-body' });
    main.appendChild(body);

    switch (state.view) {
      case 'plan':    ViewPlan.render(body, child); break;
      case 'splan':   ViewSplan.render(body, child); break;
      case 'assess':  ViewAssess.render(body, child); break;
      case 'records': ViewRecords.render(body, child); break;
      default:        ViewChildren.renderHome(body, child);
    }
  }

  function renderHeader() {
    const s = Store.settings();
    return h('header', { class: 'topbar' }, [
      h('button', {
        class: 'brand', title: '児童一覧へ戻る',
        onclick: function () { go('children'); }
      }, [
        h('span', { class: 'brand-mark' }, '計'),
        h('span', {}, [
          h('span', { class: 'brand-name' }, '個別支援計画 作成支援'),
          h('span', { class: 'brand-sub' }, s.officeName || '事業所名は「設定」から登録できます')
        ])
      ]),
      h('nav', { class: 'topnav' }, [
        h('button', {
          class: 'navlink' + (!state.childId && state.view !== 'settings' ? ' on' : ''),
          onclick: function () { go('children'); }
        }, '児童一覧'),
        h('button', {
          class: 'navlink' + (state.view === 'settings' ? ' on' : ''),
          onclick: function () { go('settings'); }
        }, '設定・データ')
      ])
    ]);
  }

  function renderChildBar(child) {
    const months = UI.ageInMonths(child.birthday, UI.today());
    return h('div', { class: 'childbar' }, [
      h('div', { class: 'childbar-id' }, [
        h('button', { class: 'back', onclick: function () { go('children'); } }, '← 一覧'),
        h('div', {}, [
          h('div', { class: 'childbar-name' }, child.name || '(氏名未入力)'),
          h('div', { class: 'childbar-meta' },
            [UI.ageText(months), child.serviceType, child.belongTo].filter(Boolean).join('　/　'))
        ])
      ]),
      h('div', { class: 'tabs' }, CHILD_TABS.map(function (t) {
        return h('button', {
          class: 'tab' + (state.view === t.id ? ' on' : ''),
          onclick: function () { openChild(child.id, t.id); }
        }, t.label);
      }))
    ]);
  }

  /* ---- 設定・データ管理 --------------------------------------------------- */
  function renderSettings(root) {
    const s = Store.settings();

    root.appendChild(h('div', { class: 'page-head' }, h('div', {}, [
      h('h1', {}, '設定・データ管理'),
      h('p', { class: 'muted' }, '事業所の情報と、データの持ち出し・取り込みを行います。')
    ])));

    /* 事業所情報 */
    const form = h('form', { class: 'form-grid', onsubmit: function (e) { e.preventDefault(); } }, [
      UI.field('事業所名', UI.input('officeName', s.officeName)),
      UI.field('サービス種別', UI.select('serviceType', DATA.SERVICE_TYPES, s.serviceType)),
      UI.field('児童発達支援管理責任者(既定値)', UI.input('manager', s.manager),
        '計画やアセスメントを新しく作るとき、作成者の欄に自動で入ります。'),
      UI.field('電話番号', UI.input('tel', s.tel)),
      (function () { const f = UI.field('所在地', UI.input('address', s.address)); f.classList.add('wide'); return f; })()
    ]);
    root.appendChild(h('div', { class: 'panel' }, [
      h('div', { class: 'panel-head' }, h('h2', {}, '事業所情報')),
      form,
      h('div', { class: 'panel-actions' }, h('button', {
        class: 'btn primary', onclick: function () {
          Store.settings(UI.readForm(form));
          UI.toast('保存しました');
          render();
        }
      }, '保存する'))
    ]));

    /* データ */
    const db = Store.load();
    const kb = Math.round(Store.usedBytes() / 1024);
    root.appendChild(h('div', { class: 'panel' }, [
      h('div', { class: 'panel-head' }, h('h2', {}, 'データの保管状況')),
      h('dl', { class: 'kv' }, [
        ['登録児童', db.children.length + '名'],
        ['個別支援計画', db.plans.length + '件'],
        ['専門的支援実施計画', db.splans.length + '件'],
        ['発達アセスメント', db.assessments.length + '件'],
        ['記録・文字起こし', db.records.length + '件'],
        ['使用容量の目安', kb + ' KB']
      ].map(function (r) {
        return h('div', { class: 'kv-row' }, [h('dt', {}, r[0]), h('dd', {}, r[1])]);
      })),
      h('div', { class: 'notice' }, [
        h('strong', {}, 'データはこの端末のブラウザの中だけに保存されます。'),
        h('p', {}, 'インターネットへ送信されることはありません。そのぶん、ブラウザの閲覧履歴の削除' +
          '(「Cookieとサイトデータ」の消去)や、別の端末・別のブラウザからの利用では、データは引き継がれません。'),
        h('p', {}, '大切な記録ですので、定期的にバックアップを保存し、事業所で定めた場所に保管してください。')
      ])
    ]));

    root.appendChild(h('div', { class: 'panel' }, [
      h('div', { class: 'panel-head' }, h('h2', {}, 'バックアップ')),
      h('div', { class: 'btn-row' }, [
        h('button', {
          class: 'btn primary', onclick: function () {
            UI.download('個別支援計画バックアップ_' + UI.today() + '.json', Store.exportJson());
            UI.toast('バックアップを保存しました');
          }
        }, 'バックアップを書き出す'),
        h('label', { class: 'btn' }, [
          '取り込む(追加)',
          h('input', { type: 'file', accept: '.json,application/json', hidden: true,
            onchange: function (e) { importFile(e.target.files[0], 'merge'); } })
        ]),
        h('label', { class: 'btn danger ghost' }, [
          '取り込む(全部入れ替え)',
          h('input', { type: 'file', accept: '.json,application/json', hidden: true,
            onchange: function (e) { importFile(e.target.files[0], 'replace'); } })
        ])
      ]),
      h('p', { class: 'note' }, '「追加」は、いまのデータを残したまま、ファイルにしかないものを足します。' +
        '「全部入れ替え」は、いまのデータを捨ててファイルの内容に置き換えます。')
    ]));

    root.appendChild(h('div', { class: 'panel danger-zone' }, [
      h('div', { class: 'panel-head' }, h('h2', {}, 'すべて消去')),
      h('p', { class: 'muted' }, 'この端末に保存されている児童・計画・記録をすべて削除します。元に戻せません。'),
      h('button', {
        class: 'btn danger', onclick: function () {
          if (!UI.confirmDanger('保存されているデータをすべて削除します。\n元に戻せません。本当によろしいですか?')) return;
          if (!UI.confirmDanger('最終確認です。バックアップは保存しましたか?\n\nこのまま削除する場合は「OK」を押してください。')) return;
          Store.clearAll();
          UI.toast('すべて削除しました');
          go('children');
        }
      }, 'すべて削除する')
    ]));
  }

  function importFile(file, mode) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () {
      try {
        if (mode === 'replace' &&
            !UI.confirmDanger('いまのデータをすべて捨てて、ファイルの内容に置き換えます。よろしいですか?')) return;
        Store.importJson(String(reader.result), mode);
        UI.toast('取り込みました');
        render();
      } catch (e) {
        alert('取り込めませんでした。\n' + e.message);
      }
    };
    reader.readAsText(file);
  }

  /* ---- 共通ダイアログ ---------------------------------------------------- */
  function modal(title, content, buttons) {
    closeModal();
    const box = h('div', { class: 'modal-box', role: 'dialog', 'aria-modal': 'true' }, [
      h('div', { class: 'modal-head' }, [
        h('h2', {}, title),
        h('button', { class: 'modal-close', 'aria-label': '閉じる', onclick: closeModal }, '×')
      ]),
      h('div', { class: 'modal-body' }, content),
      h('div', { class: 'modal-foot' }, (buttons || []).filter(Boolean))
    ]);
    const overlay = h('div', {
      class: 'modal-overlay', id: 'modal',
      onclick: function (e) { if (e.target === overlay) closeModal(); }
    }, box);
    document.body.appendChild(overlay);
    document.addEventListener('keydown', onEsc);
    const first = box.querySelector('input,select,textarea');
    if (first) first.focus();
  }

  function onEsc(e) { if (e.key === 'Escape') closeModal(); }

  function closeModal() {
    const m = UI.$('#modal');
    if (m) m.remove();
    document.removeEventListener('keydown', onEsc);
  }

  /* ---- 起動 -------------------------------------------------------------- */
  function init() {
    Store.load();
    render();
  }

  return { init: init, render: render, go: go, openChild: openChild, modal: modal, closeModal: closeModal };
})();

document.addEventListener('DOMContentLoaded', function () { App.init(); });

</script>
</body>
</html>
